/* ---------- Shared movement/revenue helpers (Dead Stock, Sales vs Inventory Cross-Check) ----------
   Per-product Opening (starting count) / Received (invoiced in window) / Sold (Opening+Received-Closing)
   / on-hand math, shared so every report that needs "how much moved" agrees with every other one.
   Products are matched by normalized name+unit (like Price History) rather than snapshotProductKey's
   exact category match, since an invoice line's category casing can differ from the master Product List's. */
function inventoryPeriodMovement(fromKey, toKey){
  const pb = periodBounds(fromKey, toKey);
  if(!pb.fromProducts) return {rows:[], fromLabel:pb.fromLabel, toLabel:pb.toLabel, fromDate:pb.fromDate, toDate:pb.toDate,
    error:"Pick a starting count (the beginning of the period) above to compare against — e.g. your July count."};
  const fromByKey = new Map();
  pb.fromProducts.forEach(p=>fromByKey.set(normName(p.name)+"||"+normUnit(p.unit), p));
  const receivedByKey = new Map();
  DATA.invoiceEntries.forEach(e=>{
    const d = (e.date||"").slice(0,10);
    if(!d) return;
    if(pb.fromDate && d < pb.fromDate) return;
    if(pb.toDate && d > pb.toDate) return;
    const key = normName(e.name)+"||"+normUnit(e.unit);
    receivedByKey.set(key, (receivedByKey.get(key)||0) + num(e.qty));
  });
  const rows = pb.toProducts.map(p=>{
    const key = normName(p.name)+"||"+normUnit(p.unit);
    const fromP = fromByKey.get(key);
    const opening = fromP ? num(fromP.closing) : 0;
    const received = receivedByKey.get(key) || 0;
    const closing = num(p.closing);
    const sold = opening + received - closing;
    // buydown-adjusted for tobacco/cigarettes so this matches the Buydowns tab -- see effectiveCost()
    const cost = effectiveCost(p);
    const retail = num(p.retail);
    const margin = retail>0 ? (retail-cost)/retail : 0;
    return {name:p.name, category:p.category||"Uncategorized", unit:p.unit||"", opening, received, sold, closing,
      cost, retail, closingValue: closing*cost, soldCost: sold*cost, soldRetail: sold*retail, margin};
  });
  return {rows, fromLabel:pb.fromLabel, toLabel:pb.toLabel, fromDate:pb.fromDate, toDate:pb.toDate};
}
/* Total register revenue (Sales & Margins daily "store" figures) actually recorded within a raw
   [fromDate, toDate] window -- same inclusive-of-toDate / exclusive-below-fromDate boundary
   convention used everywhere else a period is bounded by a count date (see periodBounds callers,
   e.g. distributorPeriodAnalysis / officeReportAnalysis). Powers Sales vs Inventory Cross-Check. */
function registerRevenueInRange(fromDate, toDate){
  let store = 0, days = 0;
  Object.keys(DATA.overlooks).forEach(y=>{
    const yNum = parseInt(y);
    if(!yNum || !DATA.overlooks[y]) return;
    MONTHS.forEach((mo,mIdx)=>{
      const md = DATA.overlooks[y][mo];
      if(!md || !md.daily) return;
      md.daily.forEach(d=>{
        if(typeof d.store !== "number") return;
        const dateStr = yNum + "-" + String(mIdx+1).padStart(2,'0') + "-" + String(d.day).padStart(2,'0');
        if(fromDate && dateStr < fromDate) return;
        if(toDate && dateStr > toDate) return;
        store += d.store - num(d.gas); days++;
      });
    });
  });
  return {store, days};
}

let categoryTrendState = {category:""};
function categoryTrendSeries(category){
  const keys = inventoryReportKeysSorted();
  const points = keys.map(k=>{
    const r = DATA.inventoryReports[k];
    const cats = inventoryByCategoryCompute(r.products, p=>num(p.received_qty));
    const c = cats[category];
    return {label: `${r.month} ${r.year}`, key:k,
      closingValue: c?c.closingValue:0, revenue: c?c.revenue:0, profit: c?c.profit:0,
      margin: c?c.margin:0, sellThrough: c?c.sellThrough:0, present: !!c};
  });
  const liveCats = inventoryByCategory();
  const lc = liveCats[category];
  points.push({label:"Live", key:"live",
    closingValue: lc?lc.closingValue:0, revenue: lc?lc.revenue:0, profit: lc?lc.profit:0,
    margin: lc?lc.margin:0, sellThrough: lc?lc.sellThrough:0, present: !!lc});
  return points;
}
function categoryTrendChartSvg(points){
  const pts = points.filter(p=>p.present);
  if(pts.length<2) return `<div class="sub">Not enough saved counts with this category yet to chart a trend — need at least 2.</div>`;
  const vals = pts.map(p=>p.margin*100);
  const w=760, h=220, pad=38;
  let minV = Math.min(...vals,0), maxV = Math.max(...vals);
  if(minV===maxV){ minV-=5; maxV+=5; }
  const range = maxV-minV || 1;
  const stepX = (w-pad*2)/(pts.length-1);
  const xAt = i => pad+i*stepX;
  const yAt = v => h-pad-((v-minV)/range)*(h-pad*2);
  const ptsStr = pts.map((p,i)=>`${xAt(i)},${yAt(p.margin*100)}`).join(" ");
  const marks = pts.map((p,i)=>{
    const x=xAt(i), y=yAt(p.margin*100);
    return `<circle cx="${x}" cy="${y}" r="4" fill="#fff" stroke="var(--navy)" stroke-width="2"></circle>
      <text x="${x}" y="${Math.max(14,y-10)}" font-size="11" font-weight="700" text-anchor="middle" fill="#1A1A1A">${(p.margin*100).toFixed(1)}%</text>
      <text x="${x}" y="${h-10}" font-size="10" text-anchor="middle" fill="#767676">${p.label}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" class="chart" style="height:220px;width:100%;">
    <line x1="${pad}" y1="10" x2="${pad}" y2="${h-pad}" stroke="var(--border)" stroke-width="1"></line>
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad+10}" y2="${h-pad}" stroke="var(--border)" stroke-width="1"></line>
    <polyline points="${ptsStr}" fill="none" stroke="var(--navy)" stroke-width="2"></polyline>
    ${marks}
  </svg>`;
}

/* ---------- Distributor Spending Summary (live view) ---------- */
let distSpendingState = {fromDate:"", toDate:""};
function initDistSpendingStateDefaults(){
  if(distSpendingState.fromDate || distSpendingState.toDate) return;
  const dates = DATA.invoiceEntries.map(e=>(e.date||"").slice(0,10)).filter(Boolean).sort();
  if(dates.length){ distSpendingState.fromDate = dates[0]; distSpendingState.toDate = dates[dates.length-1]; }
}
function distributorSpendingRows(fromDate, toDate){
  const entries = DATA.invoiceEntries.filter(e=>{
    const d = (e.date||"").slice(0,10);
    if(!d) return false;
    if(fromDate && d < fromDate) return false;
    if(toDate && d > toDate) return false;
    return true;
  });
  const byDist = new Map();
  entries.forEach(e=>{
    const name = (e.distributor||"").trim() || "(No distributor listed)";
    if(!byDist.has(name)) byDist.set(name, {distributor:name, total:0, invoices:new Set(), lines:0});
    const g = byDist.get(name);
    g.total += num(e.total);
    g.lines++;
    if(e.invoice) g.invoices.add(e.invoice);
  });
  const grandTotal = entries.reduce((s,e)=>s+num(e.total),0);
  const rows = [...byDist.values()].map(g=>{
    const invoiceCount = g.invoices.size||1;
    return {distributor:g.distributor, total:g.total, invoiceCount, lines:g.lines,
      avgInvoice: g.total/invoiceCount, pctOfTotal: grandTotal>0 ? g.total/grandTotal : 0};
  }).sort((a,b)=>b.total-a.total);
  return {rows, grandTotal};
}
function renderDistSpending(el){
  initDistSpendingStateDefaults();
  const {rows, grandTotal} = distributorSpendingRows(distSpendingState.fromDate, distSpendingState.toDate);
  el.innerHTML = `

      <div class="kpi"><div class="lbl">Distributors</div><div class="val">${rows.length}</div></div>

let salesVsInvState = {fromKey:"", toKey:"live"};
function initSalesVsInvStateDefaults(reportKeys){

function renderSalesVsInventory(el){

  const noteHtml = `<div class="note">Compares what the register recorded (Sales &amp; Margins daily totals) against what inventory movement says should have sold (Opening + Received − Closing, priced at retail) for the same window — a mismatch can mean unrecorded sales, theft, waste, or a miscount. Register total only reflects days with a store total actually entered in Sales &amp; Margins.</div>`;

      <div class="form-grid" style="grid-template-columns:1fr 1fr;">

/* ---------- Invoice Entry → Sales & Margins auto-sync ----------
   Whenever an invoice's line items change in Invoice Entry / Invoice Log,
   push a matching "Vendor Invoice" (company/invoice#/amount/date) into the
   correct year+month of DATA.overlooks so Sales & Margins always reflects
   it without anyone re-typing the total by hand. Entries created this way
   are tagged with sourceInvoice so they can be found and replaced/removed
   again on the next edit, and so the Sales & Margins UI can tell them apart
   from invoices someone typed in there directly. */
function ensureOverlookYear(year){
  if(!DATA.overlooks[year]){
    DATA.overlooks[year] = {};
    MONTHS.forEach(mo=>{ DATA.overlooks[year][mo] = {daily:[], invoices:[], rebates:[], prior_year_profit:null}; });
  }
}
function yearMonthFromDateStr(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+"T00:00:00");
  if(isNaN(d.getTime())) return null;
  return {year:String(d.getFullYear()), month:MONTHS[d.getMonth()]};
}
function removeAutoSyncedInvoice(invoiceNum){
  if(!invoiceNum) return;
  Object.keys(DATA.overlooks).forEach(y=>{
    MONTHS.forEach(mo=>{
      const md = DATA.overlooks[y] && DATA.overlooks[y][mo];
      if(md && md.invoices && md.invoices.length){
        md.invoices = md.invoices.filter(inv=>inv.sourceInvoice !== invoiceNum);
      }
    });
  });
}
function syncInvoiceEntryToSalesMargins(invoiceNum, oldInvoiceNum){
  if(oldInvoiceNum && oldInvoiceNum !== invoiceNum) removeAutoSyncedInvoice(oldInvoiceNum);
  if(!invoiceNum) return;
  removeAutoSyncedInvoice(invoiceNum);
  const lines = DATA.invoiceEntries.filter(e=>e.invoice===invoiceNum);
  if(!lines.length) return; // nothing left on file for this invoice -- leave it removed
  const withDist = lines.find(l=>l.distributor);
  const distributor = withDist ? withDist.distributor : (lines[0].distributor || "");
  const withDate = lines.find(l=>l.date);
  const date = withDate ? withDate.date : new Date().toISOString().slice(0,10);
  const total = +lines.reduce((s,l)=>s+num(l.total),0).toFixed(2);
  const ym = yearMonthFromDateStr(date);
  if(!ym) return;
  ensureOverlookYear(ym.year);
  const md = DATA.overlooks[ym.year][ym.month];
  md.invoices.push({company:distributor, invoice:invoiceNum, amount:total, date, sourceInvoice:invoiceNum});
}

/* ---------- Unknown vendor check (Invoice Entry + Invoice Log) ----------
   When a distributor typed on an invoice isn't on the vendor list (by name or alias), ask whether it's
   a new vendor or a typo before saving, so misspellings don't quietly create duplicate vendors. */
function vendorTypoDistance(a, b){
  a = vendorKey(a); b = vendorKey(b);
  if(a===b) return 0;
  const m = a.length, n = b.length; if(!m || !n) return Math.max(m, n);
  let prev = Array.from({length:n+1}, (_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur = [i];
    for(let j=1;j<=n;j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev = cur;
  }
  return prev[n];
}
function vendorSuggestions(name, limit){
  const k = vendorKey(name);
  if(!k) return [];
  return DATA.vendors.map(v=>{
    const keys = [v.name, ...(v.aliases||[])].map(vendorKey).filter(Boolean);
    let best = Infinity;
    keys.forEach(vk=>{
      let d = vendorTypoDistance(k, vk);
      if(vk.length>=3 && k.length>=3 && (vk.includes(k) || k.includes(vk))) d = Math.min(d, 1);
      best = Math.min(best, d);
    });
    return {name:v.name, d:best};
  }).filter(x=>x.d <= Math.max(2, Math.ceil(k.length*0.4)))
    .sort((a,b)=>a.d-b.d || a.name.localeCompare(b.name)).slice(0, limit||4).map(x=>x.name);
}
/* Calls onResolve(finalName) once the name is settled -- right away if it's already a known vendor.
   onFix() runs when the person wants to go back and retype it themselves. */
function checkVendorOrAsk(rawName, onResolve, onFix){
  const name = String(rawName||"").replace(/\s+/g,' ').trim();
  if(!name || findVendor(name)){ onResolve(vendorCanon(name)); return; }
  const sugs = vendorSuggestions(name);
  const backdrop = document.createElement('div');
  backdrop.className = "modal-backdrop";
  const close = ()=>backdrop.remove();
  backdrop.innerHTML = `
    <div class="modal-card" style="max-width:460px;">

      <div class="sub">\u201c${vEsc(name)}\u201d isn't on your vendor list. Is this a new vendor, or a typo?</div>

/* ---------- Shipper (flat-rate display) entry ----------
   A shipper arrives billed as ONE flat amount covering several products. allocateShipper() splits that
   amount across the products inside it: in proportion to each product's normal cost x qty when every
   product has a cost on file (so a mixed shipper is split fairly), otherwise evenly per unit. Shares are
   rounded to the cent and the last line absorbs the rounding so the lines always add up to the shipper
   total exactly. */
function allocateShipper(total, rows){
  const totalQty = rows.reduce((s,r)=>s+r.qty,0);
  if(!(total>0) || !(totalQty>0)) return rows.map(()=>({share:0, unitCost:0}));
  const byCost = rows.every(r=>num(r.normalCost)>0);
  const weights = rows.map(r=>byCost ? num(r.normalCost)*r.qty : r.qty);
  const wSum = weights.reduce((s,w)=>s+w,0);
  let used = 0;
  return rows.map((r,i)=>{
    const share = i===rows.length-1 ? +(total-used).toFixed(2) : +(total*weights[i]/wSum).toFixed(2);
    used = +(used+share).toFixed(2);
    return {share, unitCost: r.qty>0 ? share/r.qty : 0};
  });
}
function openShipperModal(el){
  const backdrop = document.createElement('div');
  backdrop.className = "modal-backdrop";
  const closeModal = ()=>backdrop.remove();
  const esc = v=>String(v??"").replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  let total = "";
  let rows = [{name:"", unit:"", qty:""}, {name:"", unit:"", qty:""}, {name:"", unit:"", qty:""}];

  // Resolve each filled-in row against the Product List.
  function resolved(){
    return rows.map(r=>{
      const name = (r.name||"").trim(), qty = parseFloat(r.qty)||0;
      if(!name) return null;
      const sameName = DATA.inventory.filter(x=>normName(x.name)===normName(name));
      const match = findProduct(name, r.unit) || (sameName.length===1 && !(r.unit||"").trim() ? sameName[0] : null);
      return {row:r, name, qty, match, sameName, normalCost: match ? num(match.cost) : 0};
    });
  }
  function preview(){
    const res = resolved();
    const good = res.filter(x=>x && x.match && x.qty>0);
    const alloc = allocateShipper(parseFloat(total)||0, good);
    res.forEach((x,i)=>{
      const cell = backdrop.querySelector(`[data-sh-out="${i}"]`);
      if(!cell) return;
      if(!x){ cell.textContent = ""; return; }
      if(!x.match){ cell.innerHTML = `<span style="color:var(--red,#c0392b);">${x.sameName.length ? "pick a size" : "not in Product List"}</span>`; return; }
      const a = alloc[good.indexOf(x)];
      cell.textContent = a && a.share ? `${fmtUSD(a.unitCost)} ea — ${fmtUSD(a.share)}` : "";
    });
    const units = good.reduce((s,x)=>s+x.qty,0);
    backdrop.querySelector('#shSummary').textContent = units ? `${units} units across ${good.length} product${good.length===1?"":"s"}` + ((parseFloat(total)||0)>0 ? ` — averages ${fmtUSD((parseFloat(total)||0)/units)} per unit` : "") : "";
  }
  function draw(){
    backdrop.innerHTML = `
      <div class="modal-card" style="max-width:680px;max-height:90vh;overflow:auto;">
        <h2>📦 Add Shipper</h2>
        <div class="sub">Enter the shipper's flat total, then every product inside it with the quantity received (in the same unit you count it in — e.g. bottles, not boxes). The total is split across the products and added to this invoice; quantities flow into Inventory like any other line. The products' normal costs are left alone.</div>
        <div class="form-grid" style="grid-template-columns:1fr 2fr;align-items:end;">
          <div><label>Shipper Total</label><div class="dollar-wrap"><input id="shTotal" type="number" step="0.01" value="${esc(total)}" placeholder="0.00"></div></div>
          <div id="shSummary" style="font-size:12.5px;color:var(--text-dim);padding-bottom:8px;"></div>
        </div>
        <div class="tablewrap" style="margin-top:8px;"><table>
          <thead><tr><th>Product</th><th>Unit / Size</th><th>Qty</th><th>Cost in this shipper</th><th></th></tr></thead>
          <tbody>${rows.map((r,i)=>`<tr>
            <td><input class="editable-cell" list="ieProductList" data-sh="name" data-i="${i}" value="${esc(r.name)}" style="width:100%;min-width:170px;"></td>
            <td><input class="editable-cell" data-sh="unit" data-i="${i}" value="${esc(r.unit)}" style="width:80px;"></td>
            <td><input class="editable-cell" type="number" data-sh="qty" data-i="${i}" value="${esc(r.qty)}" style="width:64px;"></td>
            <td data-sh-out="${i}" style="font-size:12.5px;white-space:nowrap;"></td>
            <td><button class="btn small" data-sh-del="${i}">✕</button></td></tr>`).join("")}
          </tbody>
        </table></div>
        <div class="btnrow" style="margin-top:8px;"><button class="btn small" id="shAddRow">+ Add Product</button></div>
        <div class="modal-actions">
          <button class="btn small" id="shCancel">Cancel</button>
          <button class="btn small primary" id="shApply">Add to Invoice</button>
        </div>
      </div>`;
    backdrop.querySelector('#shTotal').oninput = e=>{ total = e.target.value; preview(); };
    backdrop.querySelectorAll('[data-sh]').forEach(inp=>{
      inp.oninput = ()=>{ rows[+inp.dataset.i][inp.dataset.sh] = inp.value; preview(); };
      if(inp.dataset.sh==="name") inp.onchange = ()=>{
        // auto-fill the size when the product only comes in one
        const r = rows[+inp.dataset.i];
        const sameName = DATA.inventory.filter(x=>normName(x.name)===normName(r.name));
        if(sameName.length===1){
          r.unit = sameName[0].unit||"";
          backdrop.querySelector(`[data-sh="unit"][data-i="${inp.dataset.i}"]`).value = r.unit;
        }
        preview();
      };
    });
    backdrop.querySelectorAll('[data-sh-del]').forEach(b=>b.onclick=()=>{
      rows.splice(+b.dataset.shDel,1);
      if(!rows.length) rows.push({name:"", unit:"", qty:""});
      draw();
    });
    backdrop.querySelector('#shAddRow').onclick = ()=>{ rows.push({name:"", unit:"", qty:""}); draw();
      const ins = backdrop.querySelectorAll('[data-sh="name"]'); ins[ins.length-1].focus(); };
    backdrop.querySelector('#shCancel').onclick = closeModal;
    backdrop.querySelector('#shApply').onclick = ()=>{
      const amt = parseFloat(total)||0;
      const res = resolved().filter(Boolean);
      if(!(amt>0)){ toast("Enter the shipper's total amount", true); return; }
      if(!res.length){ toast("Add at least one product from the shipper", true); return; }
      const missing = res.find(x=>!x.match);
      if(missing){ toast(missing.sameName.length ? `"${missing.name}" comes in more than one size — enter its Unit / Size` : `"${missing.name}" isn't in the Product List — add it there (or with a normal line) first`, true); return; }
      const noQty = res.find(x=>!(x.qty>0));
      if(noQty){ toast(`Enter a quantity for "${noQty.name}"`, true); return; }
      const alloc = allocateShipper(amt, res);
      res.forEach((x,i)=>{
        invoiceDraft.lines.push({name:x.match.name, category:x.match.category, unit:x.match.unit||"",
          cost:+alloc[i].unitCost.toFixed(2), qty:x.qty, discount:0, total:alloc[i].share, shipper:true});
      });
      closeModal();
      toast(`Shipper added — ${fmtUSD(amt)} split across ${res.length} product${res.length===1?"":"s"}`);
      renderInvoiceEntry(el);
    };
    preview();
  }
  document.body.appendChild(backdrop);
  draw();
  backdrop.querySelector('#shTotal').focus();
}

function renderInvoiceEntry(el){
  const catNames = [...new Set(DATA.inventory.map(p=>p.category))].sort();

  const draftTotal = invoiceDraft.lines.reduce((s,l)=>s+num(l.total),0);

  el.innerHTML = `
    <div class="note">Enter the invoice header once, add every line item on it, then submit the whole invoice in one go. Unit Cost auto-fills from Received Log when you pick a known product. Qty Received flows into Inventory Count and Received Log automatically. If this delivery got a one-time discount on a product, enter it in Discount — it's subtracted from that line's total only and never changes the product's normal cost in Inventory. Typing an Invoice # that's already on file will offer to reopen it for editing.</div>
    <div class="card">
      <h2>${invoiceDraft.reopenedInvoice ? `Editing Invoice ${invoiceDraft.reopenedInvoice}` : "New Invoice"}</h2>
      ${invoiceDraft.reopenedInvoice ? `<div class="note" style="margin-top:0;">Reopened for editing — fix, add, or remove line items below, then Submit to save your changes over the original invoice.</div>` : ""}
      <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr;">
        <div><label>Distributor</label><input id="ieDist" list="ieVendorList" value="${invoiceDraft.distributor}"><datalist id="ieVendorList">${vendorNames().map(n=>`<option value="${vEsc(n)}">`).join("")}</datalist></div>
        <div><label>Invoice #</label><input id="ieInvoice" value="${invoiceDraft.invoice}"></div>
        <div><label>Date</label><input id="ieDate" type="date" value="${invoiceDraft.date}"></div>
      </div>
      <h2 style="margin-top:6px;">Add Line Item</h2>
      <div class="form-grid" style="grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr auto;">
        <div><label>Product Name</label><input id="ieName" list="ieProductList"></div>
        <div><label>Category</label><input id="ieCategory" list="ieCatList"></div>
        <div><label>Unit / Size</label><input id="ieUnit" list="ieUnitList" placeholder="12pk, 24oz..."></div>
        <div><label>Unit Cost</label><div class="dollar-wrap"><input id="ieCost" type="number" step="0.01"></div></div>
        <div><label>Qty Received</label><input id="ieQty" type="number"></div>
        <div><label>One-Time Discount</label><div class="dollar-wrap"><input id="ieDiscount" type="number" step="0.01" placeholder="0.00"></div></div>
        <div class="btnrow"><button class="btn" id="ieAddLineBtn">+ Add Line</button><button class="btn" id="ieShipperBtn" title="A display/shipper billed at one flat price">\ud83d\udce6 Shipper</button></div>
      </div>
      <datalist id="ieCatList">${catNames.map(c=>`<option value="${c}">`).join("")}</datalist>
      <datalist id="ieProductList">${[...new Set(DATA.inventory.map(p=>p.name))].map(n=>`<option value="${n}">`).join("")}</datalist>
      <datalist id="ieUnitList"></datalist>

      <div class="tablewrap" style="max-height:280px;margin-top:10px;"><table>
        <thead><tr><th>Product</th><th>Category</th><th>Unit</th><th>Cost</th><th>Qty</th><th>Discount</th><th>Line Total</th><th></th></tr></thead>
        <tbody id="ieDraftBody">${invoiceDraft.lines.length ? invoiceDraft.lines.map((l,i)=>({l,i})).reverse().map(({l,i})=>`<tr>
          <td>${l.name}${l.shipper ? ' <span class="pill" style="font-size:10px;">Shipper</span>' : ''}${l.reconciled ? ' <span class="pill ok" style="font-size:10px;">Reconciled</span>' : ''}</td><td>${l.category}</td><td>${l.unit||""}</td><td>${fmtUSD(l.cost)}</td><td>${l.qty}</td>
          <td>${num(l.discount) ? `<span style="color:var(--green);font-weight:700;">-${fmtUSD(l.discount)}</span>` : "—"}</td>
          <td><div class="dollar-wrap"><input class="editable-cell" type="number" step="0.01" value="${num(l.total).toFixed(2)}" data-total-line="${i}"></div></td>
          <td><button class="btn small" data-line="${i}">Remove</button></td></tr>`).join("") :
          `<tr><td colspan="8" style="color:var(--text-dim);text-align:center;">No lines added yet</td></tr>`}
        </tbody>
      </table></div>
      <div class="flex" style="justify-content:space-between;margin-top:12px;">
        <div style="font-weight:700;font-size:14px;">Invoice Total: ${fmtUSD(draftTotal)} \u2014 ${invoiceDraft.lines.length} line item${invoiceDraft.lines.length===1?"":"s"}</div>
        <div class="btnrow">
          <button class="btn danger" id="ieClearBtn">${invoiceDraft.reopenedInvoice ? "Cancel Edit" : "Clear"}</button>
          <button class="btn primary" id="ieSubmitBtn">${invoiceDraft.reopenedInvoice ? "Save Changes" : "Submit Invoice"}</button>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>Delivery Log (${DATA.invoiceEntries.length.toLocaleString()} lines)</h2>
      <div class="form-grid" style="grid-template-columns:2fr auto;align-items:end;">
        <div class="searchbox"><input id="ieSearch" placeholder="Search product, distributor, or invoice #..."></div>
        <div><label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" id="ieShowReconciled" style="width:auto;"> Show reconciled invoices</label></div>
      </div>
      <div class="tablewrap"><table>
        <thead><tr><th>Product</th><th>Category</th><th>Unit Cost</th><th>Qty</th><th>Discount</th><th>Line Total</th><th>Distributor</th><th>Invoice #</th><th>Date</th><th>Status</th><th></th></tr></thead>
        <tbody id="ieBody"></tbody>
      </table></div>
    </div>
  `;

  function fillFromNameAndUnit(e){
    const name = document.getElementById('ieName').value.trim();
    const unit = document.getElementById('ieUnit').value.trim();
    const matches = DATA.inventory.filter(x=>normName(x.name)===normName(name));
    if(!matches.length) return;
    document.getElementById('ieUnitList').innerHTML = matches.map(m=>`<option value="${m.unit||""}">`).join("");
    const unitTyped = e && e.target && e.target.id==="ieUnit";
    if(unitTyped && unit && !matches.some(m=>normUnit(m.unit)===normUnit(unit))){
      // a size that isn't in the Product List yet -- keep what they typed; Add Line will offer to add it
      document.getElementById('ieCategory').value = matches[0].category || "";
      return;
    }
    if(matches.length===1){
      const p = matches[0];
      document.getElementById('ieCategory').value = p.category || "";
      document.getElementById('ieUnit').value = p.unit || "";
      document.getElementById('ieCost').value = num(p.cost).toFixed(2);
      return;
    }
    // Multiple sizes exist for this product name -- try to match the chosen unit exactly.
    const exact = matches.find(m=>normUnit(m.unit)===normUnit(unit));
    if(exact){
      document.getElementById('ieCategory').value = exact.category || "";
      document.getElementById('ieCost').value = num(exact.cost).toFixed(2);
    } else {
      document.getElementById('ieCategory').value = matches[0].category || "";
      toast(`${matches.length} sizes found for "${name}" \u2014 pick the size from the Unit / Size list`, true);
    }
  }
  document.getElementById('ieName').onchange = fillFromNameAndUnit;
  document.getElementById('ieUnit').onchange = fillFromNameAndUnit;

  document.getElementById('ieInvoice').onchange = ()=>{
    const val = document.getElementById('ieInvoice').value.trim();
    if(!val) return;
    if(invoiceDraft.reopenedInvoice === val) return; // already reopened this one
    const matches = DATA.invoiceEntries.filter(e=>e.invoice===val);
    if(!matches.length) return;
    const matchTotal = matches.reduce((s,e)=>s+num(e.total),0);
    const reconciledCount = matches.filter(e=>e.reconciled).length;
    let msg = `Invoice ${val} is already on file — ${matches.length} line item${matches.length===1?"":"s"} from ${matches[0].distributor||"unknown distributor"}, totaling ${fmtUSD(matchTotal)}.\n\nReopen it for editing? Its line items will load into the form below so you can fix or finish it, then Submit to save your changes.`;
    if(invoiceDraft.lines.length) msg += `\n\nNote: this will replace the unsaved line item(s) currently in the form.`;
    if(reconciledCount) msg += `\n\nNote: ${reconciledCount} of its line item(s) are already marked Reconciled (counted in a prior inventory count) — their reconciled status will be kept as-is.`;
    if(!confirm(msg)){ return; }
    invoiceDraft = {
      distributor: matches[0].distributor || "",
      invoice: val,
      date: matches[0].date ? matches[0].date.slice(0,10) : "",
      lines: matches.map(m=>({name:m.name, category:m.category, unit:m.unit||"", cost:num(m.cost), qty:num(m.qty),
        discount:num(m.discount), total:num(m.total), reconciled:!!m.reconciled, shipper:!!m.shipper})),
      reopenedInvoice: val
    };
    toast(`Invoice ${val} reopened — ${matches.length} line item${matches.length===1?"":"s"} loaded for editing`);
    renderInvoiceEntry(el);
  };

  document.getElementById('ieAddLineBtn').onclick = ()=>{
    invoiceDraft.distributor = document.getElementById('ieDist').value.trim();
    invoiceDraft.invoice = document.getElementById('ieInvoice').value.trim();
    invoiceDraft.date = document.getElementById('ieDate').value;
    const name = document.getElementById('ieName').value.trim();
    const category = document.getElementById('ieCategory').value.trim();
    const unit = document.getElementById('ieUnit').value.trim();
    const cost = parseFloat(document.getElementById('ieCost').value)||0;
    const qty = parseFloat(document.getElementById('ieQty').value)||0;
    const discount = Math.abs(parseFloat(document.getElementById('ieDiscount').value)||0);
    if(!name || !qty){ toast("Enter a product name and quantity", true); return; }
    // Match on name AND size -- a known name in a size that isn't in the Product List yet is a new product
    // too (otherwise its received qty never shows up anywhere in Inventory Count).
    const match = findProduct(name, unit, category);
    if(!match){
      const otherSizes = DATA.inventory.filter(p=>normName(p.name)===normName(name));
      openUnknownProductModal({name, category: category || (otherSizes[0] ? otherSizes[0].category : ""), unit, cost, qty, discount, otherSizes}, el);
      return;
    }
    // Store the line with the Product List's own spelling/category/size so it always matches that product.
    invoiceDraft.lines.push({name:match.name, category:match.category, unit:match.unit||"", cost, qty, discount, total:+(cost*qty-discount).toFixed(2)});
    renderInvoiceEntry(el);
  };
  document.getElementById('ieShipperBtn').onclick = ()=>{
    invoiceDraft.distributor = document.getElementById('ieDist').value.trim();
    invoiceDraft.invoice = document.getElementById('ieInvoice').value.trim();
    invoiceDraft.date = document.getElementById('ieDate').value;
    openShipperModal(el);
  };
  document.getElementById('ieDraftBody').querySelectorAll('[data-line]').forEach(b=>{
    b.onclick = ()=>{
      invoiceDraft.distributor = document.getElementById('ieDist').value.trim();
      invoiceDraft.invoice = document.getElementById('ieInvoice').value.trim();
      invoiceDraft.date = document.getElementById('ieDate').value;
      invoiceDraft.lines.splice(parseInt(b.dataset.line),1);
      renderInvoiceEntry(el);
    };
  });
  document.getElementById('ieDraftBody').querySelectorAll('[data-total-line]').forEach(inp=>{
    inp.onchange = ()=>{
      const idx = parseInt(inp.dataset.totalLine);
      invoiceDraft.lines[idx].total = parseFloat(inp.value)||0;
      renderInvoiceEntry(el);
    };
  });
  document.getElementById('ieClearBtn').onclick = ()=>{
    const wasReopened = invoiceDraft.reopenedInvoice;
    invoiceDraft = {distributor:"", invoice:"", date:"", lines:[]};
    if(wasReopened) toast(`Edit cancelled — invoice ${wasReopened} is unchanged on file`);
    renderInvoiceEntry(el);
  };
  document.getElementById('ieSubmitBtn').onclick = ()=>{
    const distEl = document.getElementById('ieDist');
    if(!invoiceDraft.lines.length){ toast("Add at least one line item first", true); return; }
    if(!distEl.value.trim() || !document.getElementById('ieInvoice').value.trim()){ toast("Enter a distributor and invoice #", true); return; }
    checkVendorOrAsk(distEl.value, name=>{ distEl.value = name; invoiceDraft.distributor = name; submitInvoice(); },
      ()=>{ distEl.focus(); distEl.select(); toast("Fix the distributor name, then Submit again"); });
  };
  function submitInvoice(){
    const distributor = vendorCanon(document.getElementById('ieDist').value.trim());
    const invoice = document.getElementById('ieInvoice').value.trim();
    const date = document.getElementById('ieDate').value || null;
    let priceAlertCount = 0;
    if(!invoiceDraft.lines.length){ toast("Add at least one line item first", true); return; }
    if(!distributor || !invoice){ toast("Enter a distributor and invoice #", true); return; }
    const reopenedFrom = invoiceDraft.reopenedInvoice;
    if(reopenedFrom){
      // Replacing a reopened invoice -- drop its original lines first so edits don't duplicate them.
      DATA.invoiceEntries = DATA.invoiceEntries.filter(e=>e.invoice!==reopenedFrom);
    }
    invoiceDraft.lines.forEach(l=>{
      const p = ensureProduct(l.name, l.category, l.unit, l.cost, 0);
      DATA.invoiceEntries.unshift({name:p.name, category:p.category, unit:p.unit||"", cost:l.cost, qty:l.qty,
        discount:num(l.discount), total:num(l.total), distributor, invoice, date, notes:"", reconciled:!!l.reconciled, ...(l.shipper?{shipper:true}:{})});
      // Vendor tagging + price alert (compares the invoice cost to the cost on file before it's overwritten)
      if(vendorOnInvoiceLine(p, l, distributor, invoice, date, num(p.cost))) priceAlertCount++;
      // Shipper lines carry a flat-rate deal cost -- they only set the product's cost if it has none yet.
      if(l.cost && (!l.shipper || !num(p.cost))) p.cost = l.cost;
      // Discount is a one-time reduction for this delivery only -- product's normal cost is never touched by it.
    });
    syncInvoiceEntryToSalesMargins(invoice, reopenedFrom);
    persist();
    toast((reopenedFrom ? `Invoice ${invoice} updated \u2014 ${invoiceDraft.lines.length} line items saved \u2014 also synced to Sales & Margins` : `Invoice ${invoice} submitted \u2014 ${invoiceDraft.lines.length} line items logged \u2014 also synced to Sales & Margins`)
      + (priceAlertCount ? ` \u2014 \u26a0 ${priceAlertCount} cost change${priceAlertCount===1?"":"s"} flagged in Inventory \u2192 Vendors \u2192 Price Alerts` : ""));
    drawVendorTabs();
    invoiceDraft = {distributor:"", invoice:"", date:"", lines:[]};
    renderInvoiceEntry(el);
  }

  let ieSearch = "", ieShowReconciled = false;
  const body = document.getElementById('ieBody');
  function draw(){
    body.innerHTML = "";
    DATA.invoiceEntries.filter(e=>{
      if(!ieShowReconciled && e.reconciled) return false;
      if(!ieSearch) return true;
      return e.name.toLowerCase().includes(ieSearch) || (e.distributor||"").toLowerCase().includes(ieSearch) || (e.invoice||"").toLowerCase().includes(ieSearch);
    }).forEach((e,idx)=>{
      const realIdx = DATA.invoiceEntries.indexOf(e);
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${e.name}</td><td>${e.category}</td><td>${fmtUSD(e.cost)}</td><td>${e.qty}</td>
        <td>${num(e.discount) ? `<span style="color:var(--green);font-weight:700;">-${fmtUSD(e.discount)}</span>` : "—"}</td>
        <td><div class="dollar-wrap"><input class="editable-cell" type="number" step="0.01" value="${num(e.total).toFixed(2)}" data-total-idx="${realIdx}"></div></td>
        <td>${e.distributor}</td><td>${e.invoice}</td><td>${e.date?e.date.slice(0,10):""}</td>
        <td>${e.reconciled ? '<span class="pill ok">Reconciled</span>' : '<span class="pill warn">Pending</span>'}</td>
        <td><button class="btn small" data-idx="${realIdx}">Remove</button></td>`;
      body.appendChild(tr);
    });
    body.querySelectorAll('[data-idx]').forEach(b=>b.onclick=()=>{
      const idx = parseInt(b.dataset.idx);
      const line = DATA.invoiceEntries[idx];
      if(!confirm(`Remove this delivery log line for ${line?line.name:""} (${fmtUSD(line?line.total:0)})? It moves to the Trash until midnight. If you just want it to stop counting toward Received Qty, use "Mark Reconciled" in Invoice Log instead \u2014 it keeps the record.`)) return;
      const invNum = line ? line.invoice : null;
      if(line) trashPut("deliveryLine", `${line.name} (${fmtUSD(line.total)}) \u2014 invoice ${line.invoice||"?"}`, line);
      DATA.invoiceEntries.splice(idx,1);
      syncInvoiceEntryToSalesMargins(invNum);
      persist(); draw();
    });
    body.querySelectorAll('[data-total-idx]').forEach(inp=>{
      inp.onchange = ()=>{
        const idx = parseInt(inp.dataset.totalIdx);
        DATA.invoiceEntries[idx].total = parseFloat(inp.value)||0;
        syncInvoiceEntryToSalesMargins(DATA.invoiceEntries[idx].invoice);
        persist(); draw();
      };
    });
  }
  document.getElementById('ieSearch').oninput = e=>{ ieSearch=e.target.value.toLowerCase(); draw(); };
  document.getElementById('ieShowReconciled').onchange = e=>{ ieShowReconciled = e.target.checked; draw(); };
  draw();
}

/* ---------- Invoice Log (grouped from Invoice Entry, by invoice #) ---------- */
let ilExpanded = null; // invoice # currently expanded for editing
let ilShowReconciled = false;
let ilCompanySearch = ""; // Invoice Log company-name filter (kept while you work)
function renderInvoiceLog(el){
  const groups = {};
  DATA.invoiceEntries.forEach(e=>{
    if(!e.invoice) return;
    if(!groups[e.invoice]) groups[e.invoice] = {invoice:e.invoice, distributor:e.distributor, date:e.date, lines:0, total:0, discount:0, reconciledLines:0};
    groups[e.invoice].lines++;
    groups[e.invoice].total += num(e.total);
    groups[e.invoice].discount += num(e.discount);
    if(e.reconciled) groups[e.invoice].reconciledLines++;
  });
  const allRows = Object.values(groups).map(g=>({...g, fullyReconciled: g.reconciledLines===g.lines})).sort((a,b)=> (b.date||"").localeCompare(a.date||""));

  const companyRows = companyTerm ? allRows.filter(r=>String(r.distributor||"").toLowerCase().includes(companyTerm)) : allRows;

  const hiddenCount = companyRows.length - rows.length;
  const companyNames = [...new Set(allRows.map(r=>String(r.distributor||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const ilAttr = v=>String(v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
  const catNames = [...new Set(DATA.inventory.map(p=>p.category))].sort();
  const nameList = [...new Set(DATA.inventory.map(p=>p.name))];
  el.innerHTML = `
    <div class="note">Automatically grouped from Invoice Entry lines by Invoice #. ${allRows.length.toLocaleString()} invoices on file, totaling ${fmtUSD(allRows.reduce((s,r)=>s+r.total,0))}. Click Edit to change the company, invoice #, date, or individual line items.</div>
    <div class="card">
      <h2>Reconcile a Count Period</h2>
      <div class="note" style="margin-top:0;">After you roll a count (Closing \u2192 Opening), mark the invoices that were part of that count as reconciled so they stop counting toward Received Qty next period. This keeps the invoices on file for reference \u2014 nothing is deleted. Pick your count date below and everything dated on or before it gets marked.</div>
      <div class="note" style="margin-top:0;">Counting one category at a time? Pick that category so only its lines get marked — other categories' lines on the same invoices stay pending until they're counted. (Saving a category count in Inventory Count can do this for you.)</div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr auto;align-items:end;">
        <div><label>Category</label><select id="ilBulkCat"><option value="ALL">All categories (full count)</option>${catNames.map(c=>`<option value="${c}">${c}</option>`).join("")}</select></div>
        <div><label>Mark invoice lines reconciled dated on or before</label><input id="ilBulkDate" type="date"></div>
        <div><button class="btn primary" id="ilBulkReconcileBtn">Mark Reconciled Through This Date</button></div>
      </div>
    </div>
    <div class="card">
      <div class="form-grid" style="grid-template-columns:2fr auto auto;align-items:end;">
        <div><label>Search by company</label><input type="search" id="ilCompanySearch" list="ilCompanyList" value="${ilAttr(ilCompanySearch)}" placeholder="Type a company name (e.g. St. Joe, Coke)..." autocomplete="off"></div>
        <div>${ilCompanySearch ? `<button class="btn small" id="ilCompanyClear">Clear</button>` : ""}</div>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-bottom:8px;"><input type="checkbox" id="ilShowReconciledCk" ${ilShowReconciled?"checked":""} style="width:auto;"> Show reconciled invoices ${hiddenCount?`(${hiddenCount} hidden)`:""}</label>
      </div>
      <datalist id="ilCompanyList">${companyNames.map(n=>`<option value="${ilAttr(n)}">`).join("")}</datalist>
      ${companyTerm ? `<div class="sub" style="margin:-4px 0 10px;">${rows.length.toLocaleString()} invoice${rows.length===1?"":"s"} shown for “${ilAttr(ilCompanySearch.trim())}”, totaling ${fmtUSD(rows.reduce((t,r)=>t+r.total,0))}${hiddenCount?` (${hiddenCount} reconciled hidden)`:""}.</div>` : ""}
      <div class="tablewrap"><table>
        <thead><tr><th>Invoice #</th><th>Company</th><th>Date</th><th># Line Items</th><th>Discount</th><th>Invoice Total</th><th>Status</th><th></th></tr></thead>
        <tbody id="ilBody">
        ${rows.length ? rows.map(r=>{
          const expanded = ilExpanded === r.invoice;
          const statusPill = r.fullyReconciled ? '<span class="pill ok">Reconciled</span>' : (r.reconciledLines>0 ? '<span class="pill warn">Partial</span>' : '<span class="pill warn">Pending</span>');
          const rowHtml = `<tr><td>${r.invoice}</td><td>${r.distributor}</td><td>${r.date?r.date.slice(0,10):""}</td>
            <td>${r.lines}</td><td>${r.discount ? `<span style="color:var(--green);font-weight:700;">-${fmtUSD(r.discount)}</span>` : "\u2014"}</td><td>${fmtUSD(r.total)}</td><td>${statusPill}</td>
            <td class="btnrow"><button class="btn small" data-edit="${r.invoice.replace(/"/g,'&quot;')}">${expanded?"Close":"Edit"}</button><button class="btn small" data-toggle-reconciled="${r.invoice.replace(/"/g,'&quot;')}">${r.fullyReconciled?"Un-reconcile":"Mark Reconciled"}</button><button class="btn small danger" data-invoice="${r.invoice.replace(/"/g,'&quot;')}">Delete</button></td></tr>`;
          if(!expanded) return rowHtml;
          const lines = DATA.invoiceEntries.map((e,idx)=>({e,idx})).filter(({e})=>e.invoice===r.invoice);
          const editHtml = `<tr><td colspan="8" style="padding:0;">
            <div class="card" style="margin:8px 0;background:#F8FAFD;">
              <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr;">
                <div><label>Company</label><input class="editable-cell" id="ilEditDist" list="ilCompanyList" value="${ilAttr(r.distributor||"")}"></div>
                <div><label>Invoice #</label><input class="editable-cell" id="ilEditInvoice" value="${r.invoice||""}"></div>
                <div><label>Date</label><input class="editable-cell" type="date" id="ilEditDate" value="${r.date?r.date.slice(0,10):""}"></div>
              </div>
              <div class="tablewrap" style="margin-top:10px;"><table>
                <thead><tr><th>Product</th><th>Category</th><th>Unit</th><th>Cost</th><th>Qty</th><th>Discount</th><th>Line Total</th><th>Reconciled</th><th></th></tr></thead>
                <tbody>
                ${lines.map(({e,idx})=>`<tr>
                  <td><input class="editable-cell" value="${e.name||""}" data-line-idx="${idx}" data-line-field="name" list="ilNameList_${idx}"><datalist id="ilNameList_${idx}">${nameList.map(n=>`<option value="${n}">`).join("")}</datalist></td>
                  <td><input class="editable-cell" value="${e.category||""}" data-line-idx="${idx}" data-line-field="category" list="ilCatList"></td>
                  <td><input class="editable-cell" value="${e.unit||""}" data-line-idx="${idx}" data-line-field="unit"></td>
                  <td><div class="dollar-wrap"><input class="editable-cell" type="number" step="0.01" value="${num(e.cost).toFixed(2)}" data-line-idx="${idx}" data-line-field="cost"></div></td>
                  <td><input class="editable-cell" type="number" step="1" value="${num(e.qty)}" data-line-idx="${idx}" data-line-field="qty"></td>
                  <td><div class="dollar-wrap"><input class="editable-cell" type="number" step="0.01" value="${num(e.discount).toFixed(2)}" data-line-idx="${idx}" data-line-field="discount"></div></td>
                  <td><div class="dollar-wrap"><input class="editable-cell" type="number" step="0.01" value="${num(e.total).toFixed(2)}" data-line-idx="${idx}" data-line-field="total"></div></td>
                  <td style="text-align:center;"><input type="checkbox" data-line-reconciled="${idx}" ${e.reconciled?"checked":""}></td>
                  <td><button class="btn small danger" data-remove-line="${idx}">Remove</button></td>
                </tr>`).join("")}

              </table></div>
              <div class="btnrow" style="margin-top:10px;"><button class="btn" id="ilAddLine" data-add-for="${r.invoice.replace(/"/g,'&quot;')}">+ Add Line Item</button></div>
            </div>
          </td></tr>`;
          return rowHtml + editHtml;
        }).join("") : `<tr><td colspan="8" style="color:var(--text-dim);text-align:center;">${companyTerm ? (hiddenCount ? `No pending invoices for this company \u2014 check \u201cShow reconciled invoices\u201d to see ${hiddenCount} more.` : "No invoices match that company name.") : ilShowReconciled ? "No invoices yet." : "No pending invoices \u2014 check \u201cShow reconciled invoices\u201d to see everything."}</td></tr>`}
        </tbody>
      </table></div>
      <datalist id="ilCatList">${catNames.map(c=>`<option value="${c}">`).join("")}</datalist>
    </div>
    <div class="card" id="ilVendorCard">
      <h2>Vendor List</h2>
      <div class="sub">The companies you buy from. When an invoice's distributor isn't on this list, you'll be asked whether it's a new vendor or a typo. This is the same list as Inventory \u2192 Vendors (contact info lives there).</div>
      <div class="form-grid" style="grid-template-columns:2fr auto 1fr;align-items:end;">
        <div><label>Add a vendor</label><input id="ilVendorNew" placeholder="Vendor name"></div>
        <div><button class="btn primary" id="ilVendorAddBtn">Add Vendor</button></div>
        <div><label>Search vendors</label><input type="search" id="ilVendorSearch" placeholder="Filter list..."></div>
      </div>
      <div id="ilVendorUnlisted"></div>
      <div class="tablewrap" style="max-height:320px;"><table>
        <thead><tr><th>Vendor</th><th>Other Spellings</th><th># Invoices</th><th>Last Invoice</th><th></th></tr></thead>
        <tbody id="ilVendorBody"></tbody>
      </table></div>
    </div>
  `;
  document.getElementById('ilShowReconciledCk').onchange = e=>{ ilShowReconciled = e.target.checked; renderInvoiceLog(el); };
  (function vendorListWindow(){
    let vq = "";
    const vbody = document.getElementById('ilVendorBody');
    const unlistedBox = document.getElementById('ilVendorUnlisted');
    function stats(){
      const m = new Map();
      allRows.forEach(r=>{
        const v = findVendor(r.distributor); const k = v ? v.name : null;
        if(!k) return;
        const cur = m.get(k) || {n:0, last:""};
        cur.n++; if((r.date||"") > cur.last) cur.last = r.date||"";
        m.set(k, cur);
      });
      return m;
    }
    function drawV(){
      const st = stats();
      const list = DATA.vendors.slice().sort((a,b)=>a.name.localeCompare(b.name))
        .filter(v=>!vq || v.name.toLowerCase().includes(vq) || (v.aliases||[]).some(a=>String(a).toLowerCase().includes(vq)));
      vbody.innerHTML = list.length ? list.map(v=>{
        const s2 = st.get(v.name) || {n:0, last:""};
        const prodCount = DATA.inventory.filter(p=>p.vendor===v.name).length;
        return `<tr><td><b>${vEsc(v.name)}</b></td><td>${(v.aliases||[]).length ? (v.aliases||[]).map(a=>`<span class="pill" style="margin:1px 3px 1px 0;">${vEsc(a)} <a href="#" data-unalias="${vEsc(v.uid)}" data-alias="${vEsc(a)}" title="Forget this spelling" style="text-decoration:none;color:var(--text-dim);">\u00d7</a></span>`).join("") : '<span class="sub" style="margin:0;">\u2014</span>'}</td>
          <td>${s2.n}</td><td>${s2.last ? s2.last.slice(0,10) : "\u2014"}</td>
          <td style="white-space:nowrap;text-align:right;">${s2.n || prodCount ? `<span class="sub" style="margin:0;" title="Vendors with invoices or products can't be removed here">in use</span>` : `<button class="btn small danger" data-vremove="${vEsc(v.uid)}">Remove</button>`}</td></tr>`;
      }).join("") : `<tr><td colspan="5" style="text-align:center;color:var(--text-dim);padding:16px;">${DATA.vendors.length ? "No vendors match." : "No vendors yet \u2014 add one above."}</td></tr>`;
      // companies already on invoices that aren't on the list
      const unlisted = [...new Set(allRows.map(r=>String(r.distributor||"").trim()).filter(n=>n && !findVendor(n)))].sort();
      unlistedBox.innerHTML = unlisted.length ? `<div class="note" style="margin:0 0 10px;">\u26a0\ufe0f ${unlisted.length} compan${unlisted.length===1?"y":"ies"} on past invoices ${unlisted.length===1?"isn't":"aren't"} on your vendor list: ${unlisted.map(n=>`<button class="btn small" data-vcheck="${vEsc(n)}" style="margin:2px;">${vEsc(n)}</button>`).join("")} <span class="sub" style="margin:0;">Click one to add it or mark it as a typo.</span></div>` : "";
      vbody.querySelectorAll('[data-vremove]').forEach(b=>b.onclick = ()=>{
        const v = DATA.vendors.find(x=>x.uid===b.dataset.vremove); if(!v) return;
        if(!confirm(`Remove ${v.name} from the vendor list? It moves to the Trash until midnight.`)) return;
        trashPut("vendor", v.name, v);
        DATA.vendors = DATA.vendors.filter(x=>x!==v); persist(); drawV();
      });
      vbody.querySelectorAll('[data-unalias]').forEach(a=>a.onclick = e=>{
        e.preventDefault();
        const v = DATA.vendors.find(x=>x.uid===a.dataset.unalias); if(!v) return;
        v.aliases = (v.aliases||[]).filter(x=>x!==a.dataset.alias); persist(); drawV();
      });
      unlistedBox.querySelectorAll('[data-vcheck]').forEach(b=>b.onclick = ()=>{
        const old = b.dataset.vcheck;
        checkVendorOrAsk(old, name=>{
          if(name!==old){
            const affected = new Set();
            DATA.invoiceEntries.forEach(e=>{ if(String(e.distributor||"").trim()===old){ e.distributor = name; affected.add(e.invoice); } });
            affected.forEach(inv=>syncInvoiceEntryToSalesMargins(inv));
            persist(); toast(`${affected.size} invoice${affected.size===1?"":"s"} changed from \u201c${old}\u201d to ${name}`);
          }
          renderInvoiceLog(el);
        });
      });
    }
    const addInp = document.getElementById('ilVendorNew');
    const add = ()=>{
      const name = addInp.value.replace(/\s+/g,' ').trim();
      if(!name){ addInp.focus(); return; }
      const exists = findVendor(name);
      if(exists){ toast(`${exists.name} is already on the list`, true); return; }
      const near = vendorSuggestions(name, 3);
      if(near.length && !confirm(`\u201c${name}\u201d looks similar to ${near.join(", ")}. Add it as a separate vendor anyway?`)) return;
      ensureVendor(name); persist(); toast(`${name} added to your vendor list`);
      addInp.value = ""; drawV();
    };
    document.getElementById('ilVendorAddBtn').onclick = add;
    addInp.onkeydown = e=>{ if(e.key==="Enter") add(); };
    document.getElementById('ilVendorSearch').oninput = e=>{ vq = e.target.value.trim().toLowerCase(); drawV(); };
    drawV();
  })();
  const ilCoEl = document.getElementById('ilCompanySearch');
  ilCoEl.oninput = ()=>{
    const pos = ilCoEl.selectionStart;
    ilCompanySearch = ilCoEl.value; ilExpanded = null;
    renderInvoiceLog(el);
    const again = document.getElementById('ilCompanySearch');
    if(again){ again.focus(); try{ again.setSelectionRange(pos, pos); }catch(_){} }
  };
  const ilCoClear = document.getElementById('ilCompanyClear');
  if(ilCoClear) ilCoClear.onclick = ()=>{ ilCompanySearch = ""; renderInvoiceLog(el); };
  document.getElementById('ilBody').querySelectorAll('[data-edit]').forEach(btn=>{
    btn.onclick = ()=>{
      ilExpanded = ilExpanded===btn.dataset.edit ? null : btn.dataset.edit;
      renderInvoiceLog(el);
    };
  });
  document.getElementById('ilBody').querySelectorAll('[data-toggle-reconciled]').forEach(btn=>{
    btn.onclick = ()=>{
      const invoiceNum = btn.dataset.toggleReconciled;
      const g = allRows.find(r=>r.invoice===invoiceNum);
      const makeReconciled = !(g && g.fullyReconciled);
      DATA.invoiceEntries.forEach(e=>{ if(e.invoice===invoiceNum) e.reconciled = makeReconciled; });
      persist();
      toast(makeReconciled ? `Invoice ${invoiceNum} marked reconciled` : `Invoice ${invoiceNum} marked pending again`);
      renderInvoiceLog(el);
    };
  });
  document.getElementById('ilBody').querySelectorAll('[data-invoice]').forEach(btn=>{
    btn.onclick = ()=>{
      const invoiceNum = btn.dataset.invoice;
      const g = groups[invoiceNum];
      const lineWord = g && g.lines===1 ? "line item" : "line items";

      // Find products whose ENTIRE received-qty history lives on this invoice alone --
      // deleting it would drop their Received Qty to 0 in Inventory Count.
      const linesForInvoice = DATA.invoiceEntries.filter(e=>e.invoice===invoiceNum);
      const productKeys = [...new Set(linesForInvoice.map(e=>e.name+"|"+e.category))];
      const affectedProducts = [];
      productKeys.forEach(key=>{
        const sep = key.lastIndexOf("|");
        const name = key.slice(0, sep), category = key.slice(sep+1);
        const hasOtherInvoice = DATA.invoiceEntries.some(e=>e.invoice!==invoiceNum && e.name===name && e.category===category && !e.reconciled);
        if(!hasOtherInvoice) affectedProducts.push(name);
      });

      let msg = `Delete invoice ${invoiceNum} (${g?g.lines:0} ${lineWord}, ${fmtUSD(g?g.total:0)})? This removes it from Invoice Entry's Delivery Log too and moves to the Trash until midnight. If you just want it to stop counting toward Received Qty, use "Mark Reconciled" instead \u2014 it keeps the record.`;
      if(affectedProducts.length){
        const shown = affectedProducts.slice(0, 15);
        msg += `\n\nThese ${affectedProducts.length} product(s) have no other pending delivery on file \u2014 their Received Qty in Inventory Count will drop to 0:\n\u2022 ` + shown.join("\n\u2022 ");
        if(affectedProducts.length > shown.length) msg += `\n\u2022 ...and ${affectedProducts.length - shown.length} more`;
      }
      if(!confirm(msg)) return;
      trashPut("invoice", `Invoice ${invoiceNum}${linesForInvoice[0]&&linesForInvoice[0].distributor?" from "+linesForInvoice[0].distributor:""} (${linesForInvoice.length} ${lineWord}, ${fmtUSD(g?g.total:0)})`, linesForInvoice);
      DATA.invoiceEntries = DATA.invoiceEntries.filter(e=>e.invoice!==invoiceNum);
      if(ilExpanded===invoiceNum) ilExpanded = null;
      syncInvoiceEntryToSalesMargins(invoiceNum);
      persist();
      toast(`Invoice ${invoiceNum} deleted`);
      renderInvoiceLog(el);
    };
  });

  document.getElementById('ilBulkReconcileBtn').onclick = ()=>{
    const cutoff = document.getElementById('ilBulkDate').value;
    if(!cutoff){ toast("Pick a cutoff date first", true); return; }
    const bulkCat = document.getElementById('ilBulkCat').value;
    const toMark = pendingCategoryLines(bulkCat, cutoff);
    if(!toMark.length){ toast(`No pending ${bulkCat==="ALL"?"":bulkCat+" "}invoice lines found on or before that date`, true); return; }
    const invoiceNums = [...new Set(toMark.map(e=>e.invoice))];
    const total = toMark.reduce((s,e)=>s+num(e.total),0);
    const cycleWarn = bulkCat==="ALL" && Object.keys(DATA.categoryCounts||{}).length ? `\n\n⚠️ This marks EVERY category. If you only counted some categories, cancel and pick the category instead.` : ``;
    if(!confirm(`Mark ${toMark.length} ${bulkCat==="ALL"?"":bulkCat+" "}line item(s) across ${invoiceNums.length} invoice(s) dated on or before ${cutoff} (${fmtUSD(total)} total) as reconciled? They'll stop counting toward Received Qty but stay on file \u2014 you can undo this per invoice later.${cycleWarn}`)) return;
    toMark.forEach(e=>{ e.reconciled = true; });
    persist();
    toast(`Marked ${toMark.length} line item(s) across ${invoiceNums.length} invoice(s) as reconciled`);
    renderInvoiceLog(el);
  };

  if(!ilExpanded) return;

  // Header fields (distributor / invoice # / date) apply to every line in this invoice
  const distInp = document.getElementById('ilEditDist');
  const invInp = document.getElementById('ilEditInvoice');
  const dateInp = document.getElementById('ilEditDate');
  if(distInp) distInp.onchange = ()=>{
    const oldInvoice = ilExpanded;
    const raw = distInp.value.trim();
    if(!raw){ toast("Company can't be blank", true); renderInvoiceLog(el); return; }
    checkVendorOrAsk(raw, val=>{
      DATA.invoiceEntries.forEach(e=>{ if(e.invoice===oldInvoice) e.distributor = val; });
      syncInvoiceEntryToSalesMargins(oldInvoice);
      persist(); toast("Company updated"); renderInvoiceLog(el);
    }, ()=>{ const again = document.getElementById('ilEditDist'); if(again){ again.focus(); again.select(); } });
  };
  if(invInp) invInp.onchange = ()=>{
    const oldInvoice = ilExpanded;
    const val = invInp.value.trim();
    if(!val){ toast("Invoice # can't be blank", true); renderInvoiceLog(el); return; }
    DATA.invoiceEntries.forEach(e=>{ if(e.invoice===oldInvoice) e.invoice = val; });
    ilExpanded = val;
    syncInvoiceEntryToSalesMargins(val, oldInvoice);
    persist(); toast("Invoice # updated"); renderInvoiceLog(el);
  };
  if(dateInp) dateInp.onchange = ()=>{
    const oldInvoice = ilExpanded;
    const val = dateInp.value || null;
    DATA.invoiceEntries.forEach(e=>{ if(e.invoice===oldInvoice) e.date = val; });
    syncInvoiceEntryToSalesMargins(oldInvoice);
    persist(); toast("Date updated"); renderInvoiceLog(el);
  };

  // Line item fields
  document.getElementById('ilBody').querySelectorAll('[data-line-idx]').forEach(inp=>{
    inp.onchange = ()=>{
      const idx = parseInt(inp.dataset.lineIdx);
      const field = inp.dataset.lineField;
      const line = DATA.invoiceEntries[idx];
      if(!line) return;
      if(field==="name" || field==="category" || field==="unit"){
        line[field] = inp.value;
        const p = ensureProduct(line.name, line.category, line.unit, line.cost, 0);
        line.category = p.category;
      } else {
        line[field] = field==="discount" ? Math.abs(parseFloat(inp.value)||0) : (parseFloat(inp.value)||0);
        if(field==="cost" || field==="qty" || field==="discount") line.total = +(num(line.cost)*num(line.qty)-num(line.discount)).toFixed(2);
      }
      syncInvoiceEntryToSalesMargins(line.invoice);
      persist(); renderInvoiceLog(el);
    };
  });
  document.getElementById('ilBody').querySelectorAll('[data-line-reconciled]').forEach(ck=>{
    ck.onchange = ()=>{
      const idx = parseInt(ck.dataset.lineReconciled);
      const line = DATA.invoiceEntries[idx];
      if(!line) return;
      line.reconciled = ck.checked;
      persist();
      toast(ck.checked ? "Line marked reconciled" : "Line marked pending");
      renderInvoiceLog(el);
    };
  });
  document.getElementById('ilBody').querySelectorAll('[data-remove-line]').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = parseInt(btn.dataset.removeLine);
      const line = DATA.invoiceEntries[idx];
      if(!confirm(`Remove this line item (${line?line.name:""}, ${fmtUSD(line?line.total:0)}) from invoice ${ilExpanded}? It moves to the Trash until midnight.`)) return;
      if(line) trashPut("invoiceLine", `${line.name} (${fmtUSD(line.total)}) \u2014 invoice ${line.invoice||ilExpanded}`, line);
      DATA.invoiceEntries.splice(idx,1);
      syncInvoiceEntryToSalesMargins(ilExpanded);
      persist(); toast("Line item removed"); renderInvoiceLog(el);
    };
  });
  const addBtn = document.getElementById('ilAddLine');
  if(addBtn) addBtn.onclick = ()=>{
    const invoiceNum = addBtn.dataset.addFor;
    const g = groups[invoiceNum];
    DATA.invoiceEntries.unshift({name:"", category:"", unit:"", cost:0, qty:1, discount:0, total:0,
      distributor: g?g.distributor:"", invoice: invoiceNum, date: g?g.date:null, notes:""});
    syncInvoiceEntryToSalesMargins(invoiceNum);
    persist(); toast("Line item added \u2014 fill in the product details"); renderInvoiceLog(el);
  };
}

/* ---------- Product List ---------- */
function renderProductList(el){
  const catNames = [...new Set(DATA.inventory.map(p=>p.category))].sort();
  el.innerHTML = `
    <div class="form-grid" style="grid-template-columns:2fr 1fr 1fr 1fr 1fr;">
      <div><label>Search product name</label><input id="plSearch" value="${invState.search}"></div>
      <div><label>Category</label><select id="plCatFilter"><option value="ALL">All Categories</option>${catNames.map(c=>`<option value="${c}" ${invState.category===c?"selected":""}>${c}</option>`).join("")}</select></div>
      <div><label>Vendor</label><select id="plVendorFilter">${vendorFilterOptionsHtml(invState.vendor||"ALL")}</select></div>
      <div><label>Status</label><select id="plStatusFilter">
        <option value="ALL">All</option><option value="LOW">Low Stock</option><option value="OUT">Out of Stock</option><option value="OK">OK</option>
      </select></div>
      <div><label>Pricing (Margin Conditions)</label><select id="plTargetFilter">
        <option value="ALL">All</option><option value="below">Below target</option><option value="above">Above target</option><option value="ok">In range</option>
        <option value="markup">Judged by markup</option><option value="margin">Judged by margin</option><option value="none">No condition</option>
      </select></div>
    </div>
    <div class="sub" style="margin:0 0 8px;font-size:12px;">The <b>bold</b> percentage is the one each product is judged by in Margin Conditions. <b>Margin %</b> = profit ÷ retail, <b>Markup %</b> = profit ÷ cost (cigarettes &amp; tobacco use cost after buydown). Products without a condition show both, unbolded.</div>
    <div class="card">
      <div class="tablewrap"><table>
        <thead><tr><th>#</th><th>Product</th><th>Category</th><th>Vendor</th><th>Unit</th><th>Par</th><th>Closing</th><th>Cost</th><th>Retail</th><th>Margin $</th><th>Margin %</th><th>Markup %</th><th>Target</th><th>Value</th><th>Status</th></tr></thead>
        <tbody id="plBody"></tbody>
      </table></div>
    </div>
  `;
  document.getElementById('plSearch').oninput = e=>{ invState.search=e.target.value; drawPL(); };
  document.getElementById('plCatFilter').onchange = e=>{ invState.category=e.target.value; drawPL(); };
  document.getElementById('plStatusFilter').onchange = e=>{ invState.statusFilter=e.target.value; drawPL(); };
  document.getElementById('plStatusFilter').value = invState.statusFilter;
  document.getElementById('plVendorFilter').onchange = e=>{ invState.vendor=e.target.value; drawPL(); };
  document.getElementById('plTargetFilter').value = invState.targetFilter || "ALL";
  document.getElementById('plTargetFilter').onchange = e=>{ invState.targetFilter=e.target.value; drawPL(); };
  function drawPL(){
    const body = document.getElementById('plBody');
    const search = invState.search.toLowerCase();
    let list = DATA.inventory.filter(p=>{
      if(search && !p.name.toLowerCase().includes(search)) return false;
      if(invState.category!=="ALL" && p.category!==invState.category) return false;
      if(!vendorFilterMatch(p, invState.vendor||"ALL")) return false;
      const st = inventoryStatus(p.par,p.closing);
      if(invState.statusFilter!=="ALL" && st!==invState.statusFilter) return false;
      const tf = invState.targetFilter || "ALL";
      if(tf!=="ALL"){
        const cs = conditionStatus(p);
        if(tf==="none" ? cs.cond : tf==="markup" || tf==="margin" ? !cs.cond || (cs.cond.basis==="markup" ? "markup" : "margin")!==tf : cs.status!==tf) return false;
      }
      return true;
    });
    body.innerHTML = "";
    list.forEach(p=>{
      const st = inventoryStatus(p.par,p.closing);
      const pill = st==="OK" ? '<span class="pill ok">OK</span>' : st==="LOW" ? '<span class="pill warn">Low</span>' : '<span class="pill bad">Out</span>';
      const cost = num(p.cost), retail = num(p.retail);
      const marginDollar = retail - effectiveCost(p); // buydown-adjusted for tobacco/cigarettes -- see effectiveCost()
      const marginPct = retail ? marginDollar/retail : 0;
      // markup = profit / cost (same buydown-adjusted cost); which of the two counts comes from the product's Margin Condition
      const ec = effectiveCost(p), markupPct = ec>0 ? marginDollar/ec : null;
      const cs = conditionStatus(p), basis = cs.cond ? (cs.cond.basis==="markup" ? "markup" : "margin") : null;
      const pctCell = (v, kind)=>{
        if(v==null) return '<td style="color:var(--text-dim);">\u2014</td>';
        const judged = basis===kind, off = judged && (cs.status==="below" || cs.status==="above");
        const color = v<0 || (judged && cs.status==="below") ? 'var(--red)' : judged && cs.status==="above" ? 'var(--gold, #b7791f)' : 'inherit';
        return `<td style="color:${color};font-weight:${judged?700:400};${basis && !judged?'opacity:.55;':''}" title="${judged ? "Judged by "+kind+": "+vEsc(condTargetText(cs.cond)) : basis ? "Not used for this product (judged by "+basis+")" : ""}">${fmtPct(v)}</td>`;
      };
      const targetCell = cs.cond
        ? `<td style="white-space:nowrap;" title="${vEsc(condScopeText(cs.cond))}"><span style="font-size:12px;">${vEsc(condTargetText(cs.cond))}</span> ${condStatusPill(cs.status)}</td>`
        : '<td style="color:var(--text-dim);font-size:12px;">No condition</td>';
      const tr = document.createElement('tr');
      if(st!=="OK") tr.classList.add('lowstock-row');
      const vend = p.vendor ? `<a href="#" class="pl-vendor" data-vendor="${vEsc(p.vendor)}">${vEsc(p.vendor)}</a>${p.vendorSource==="guess"?' <span class="pill warn" style="font-size:10px;" title="Guessed from category/brand">?</span>':""}` : '<span style="color:var(--text-dim);">\u2014</span>';
      tr.innerHTML = `<td>${p.num}</td><td>${p.name}${newBadge(p)}</td><td>${p.category}</td><td>${vend}</td><td>${p.unit||""}</td><td>${p.par}</td>
        <td>${p.closing}</td><td>${fmtUSD(cost)}</td><td>${fmtUSD(retail)}</td>
        <td style="color:${marginDollar<0?'var(--red)':'inherit'}">${fmtUSD(marginDollar)}</td>
        ${pctCell(retail ? marginPct : null, "margin")}${pctCell(markupPct, "markup")}${targetCell}
        <td>${fmtUSD(p.closing_value)}</td><td>${pill}</td>`;
      body.appendChild(tr);
    });
    body.querySelectorAll('.pl-vendor').forEach(a=>a.onclick = e=>{ e.preventDefault(); const v = findVendor(a.dataset.vendor); if(v) openVendor(v.uid); });
  }
  drawPL();
}

/* ---------- Bulk Price Update (change many products' cost/retail at once) ---------- */
function bulkProductKey(p){ return p.num + "|" + p.category; }

function renderBulkPriceUpdate(el){
  const catNames = [...new Set(DATA.inventory.map(p=>p.category))].sort();
  el.innerHTML = `
    <div class="note">Search for a brand or group of products (e.g. "Marlboro", "Camel", "candy"), select the ones you want, then apply a price change to all of them at once. Great for cigarette/tobacco price increases every couple of months.</div>
    <div class="card">
      <div class="form-grid" style="grid-template-columns:2fr 1fr 1fr;">
        <div><label>Search product name</label><input id="bpSearch" value="${bulkPriceState.search}" placeholder="e.g. Marlboro"></div>
        <div><label>Category</label><select id="bpCatFilter"><option value="ALL">All Categories</option>${catNames.map(c=>`<option value="${c}" ${bulkPriceState.category===c?"selected":""}>${c}</option>`).join("")}</select></div>
        <div><label>Vendor</label><select id="bpVendorFilter">${vendorFilterOptionsHtml(bulkPriceState.vendor||"ALL")}</select></div>
      </div>
      <div class="tablewrap" style="max-height:360px;"><table>
        <thead><tr><th><input type="checkbox" id="bpSelectAll"></th><th>Product</th><th>Category</th><th>Vendor</th><th>Unit</th><th>Current Cost</th><th>Current Retail</th></tr></thead>
        <tbody id="bpBody"></tbody>
      </table></div>
      <div class="sub" id="bpMatchCount" style="margin-top:6px;"></div>
    </div>
    <div class="card">
      <h2>Apply Price Change</h2>
      <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr 1fr auto;">
        <div><label>Apply to</label><select id="bpTarget">
          <option value="retail">Retail Price</option>
          <option value="cost">Unit Cost</option>
          <option value="both">Both Cost &amp; Retail</option>
        </select></div>
        <div><label>Method</label><select id="bpMethod">
          <option value="set">Set to exact amount</option>
          <option value="increaseAmt">Increase by $</option>
          <option value="decreaseAmt">Decrease by $</option>
          <option value="increasePct">Increase by %</option>
          <option value="decreasePct">Decrease by %</option>
        </select></div>
        <div><label>Amount</label><input id="bpAmount" type="number" step="0.01" placeholder="0.00"></div>
        <div><label>&nbsp;</label><div class="sub" id="bpSelectedCount">0 selected</div></div>
        <div><label>&nbsp;</label><button class="btn primary" id="bpApplyBtn">Apply to Selected</button></div>
      </div>
    </div>
  `;

  function matches(){
    const search = bulkPriceState.search.toLowerCase();
    return DATA.inventory.filter(p=>{
      if(search && !p.name.toLowerCase().includes(search)) return false;
      if(bulkPriceState.category!=="ALL" && p.category!==bulkPriceState.category) return false;
      if(!vendorFilterMatch(p, bulkPriceState.vendor||"ALL")) return false;
      return true;
    });
  }

  function draw(){
    const list = matches();
    const body = document.getElementById('bpBody');
    body.innerHTML = "";
    list.forEach(p=>{
      const key = bulkProductKey(p);
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><input type="checkbox" class="bp-check" data-key="${key}" ${bulkPriceState.selected.has(key)?"checked":""}></td>
        <td>${p.name}</td><td>${p.category}</td><td>${vEsc(p.vendor||"\u2014")}</td><td>${p.unit||""}</td>
        <td>${fmtUSD(num(p.cost))}</td><td>${fmtUSD(num(p.retail))}</td>`;
      body.appendChild(tr);
    });
    document.getElementById('bpMatchCount').textContent = list.length > 300
      ? `Showing first 300 of ${list.length.toLocaleString()} matches \u2014 narrow your search to see the rest.`
      : `${list.length.toLocaleString()} product${list.length===1?"":"s"} match this search.`;
    document.getElementById('bpSelectedCount').textContent = `${bulkPriceState.selected.size} selected`;
    body.querySelectorAll('.bp-check').forEach(cb=>{
      cb.onchange = ()=>{
        if(cb.checked) bulkPriceState.selected.add(cb.dataset.key);
        else bulkPriceState.selected.delete(cb.dataset.key);
        document.getElementById('bpSelectedCount').textContent = `${bulkPriceState.selected.size} selected`;
      };
    });
    const allChecked = list.length>0 && list.every(p=>bulkPriceState.selected.has(bulkProductKey(p)));
    document.getElementById('bpSelectAll').checked = allChecked;
  }

  document.getElementById('bpSearch').oninput = e=>{ bulkPriceState.search = e.target.value; draw(); };
  document.getElementById('bpCatFilter').onchange = e=>{ bulkPriceState.category = e.target.value; draw(); };
  document.getElementById('bpVendorFilter').onchange = e=>{ bulkPriceState.vendor = e.target.value; draw(); };
  document.getElementById('bpSelectAll').onchange = e=>{
    const list = matches();
    if(e.target.checked) list.forEach(p=>bulkPriceState.selected.add(bulkProductKey(p)));
    else list.forEach(p=>bulkPriceState.selected.delete(bulkProductKey(p)));
    draw();
  };

  document.getElementById('bpApplyBtn').onclick = ()=>{
    if(bulkPriceState.selected.size===0){ toast("Select at least one product first", true); return; }
    const amount = parseFloat(document.getElementById('bpAmount').value);
    if(isNaN(amount)){ toast("Enter an amount", true); return; }
    const target = document.getElementById('bpTarget').value; // retail, cost, both
    const method = document.getElementById('bpMethod').value;
    const fields = target==="both" ? ["cost","retail"] : [target];
    const selectedProducts = DATA.inventory.filter(p=>bulkPriceState.selected.has(bulkProductKey(p)));
    const sampleNames = selectedProducts.slice(0,5).map(p=>p.name).join(", ");
    const more = selectedProducts.length>5 ? ` and ${selectedProducts.length-5} more` : "";
    if(!confirm(`Update ${fields.join(" & ")} for ${selectedProducts.length} product(s)?\n\n${sampleNames}${more}\n\nThis can't be undone automatically.`)) return;
    selectedProducts.forEach(p=>{
      const oldC = num(p.cost), oldR = num(p.retail);
      fields.forEach(field=>{
        const current = num(p[field]);
        let next = current;
        if(method==="set") next = amount;
        else if(method==="increaseAmt") next = current + amount;
        else if(method==="decreaseAmt") next = current - amount;
        else if(method==="increasePct") next = current * (1 + amount/100);
        else if(method==="decreasePct") next = current * (1 - amount/100);
        p[field] = Math.max(0, +next.toFixed(2));
      });
      p.closing_value = +(num(p.closing)*num(p.cost)).toFixed(2);
      p.sales_value = +(num(p.closing)*num(p.retail)).toFixed(2);
      logPriceChange(p, oldC, num(p.cost), oldR, num(p.retail), "bulk price update");
    });
    persist();
    toast(`Updated ${selectedProducts.length} product(s)`);
    draw();
  };

  draw();
}

/* ---------- Inventory Count (opening/received/closing/sold) ---------- */

      <div><label>&nbsp;</label><button class="btn danger" id="icClearClosingBtn" title="Blank out the Closing field for every product shown \u2014 use this before starting a fresh count">\u2716 Clear Closing (all shown)</button></div>
      <div><label>&nbsp;</label><button class="btn" id="icRollAllBtn" title="Copy every Closing Count shown below into Opening \u2014 use this to start a new count period">\u21bb Roll Closing \u2192 Opening (all shown)</button></div>
    </div>
    <div id="icCatCountBar"></div>
    <div class="card">
      <div class="tablewrap"><table>
        <thead><tr><th>Product</th><th>Unit</th><th>Par</th><th>Opening</th><th></th><th>Received</th><th>Total Avail.</th><th>Closing</th><th>Units Sold</th><th>Notes</th></tr></thead>
        <tbody id="icBody"></tbody>
      </table></div>
    </div>
