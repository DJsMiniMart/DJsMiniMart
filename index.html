<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4B9CD3">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DJ's Mini Mart">

<title>DJ's Mini Mart</title>
<style>
  :root{
    --navy:#4B9CD3; --navy-light:#7BAFD4; --navy-lighter:#B9D9EF;
    --gold:#4B9CD3; --gold-bg:#EAF4FB;
    --green:#1c7c3f; --green-bg:#E3F5E9;
    --red:#b3261e; --red-bg:#FCE8E6;
    --unc-hi:#4B9CD3; --unc-lo:#13294B;
    --bg:#F4F7FA; --panel:#FFFFFF; --border:#E1E1E1;
    --text:#1A1A1A; --text-dim:#767676;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);}
  .app{display:flex;min-height:100vh;}
  .sidebar{width:220px;flex-shrink:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .brand{padding:22px 18px 14px;font-weight:700;font-size:17px;letter-spacing:.2px;border-bottom:1px solid rgba(255,255,255,.12);}
  .brand small{display:block;font-weight:400;font-size:11px;opacity:.65;margin-top:2px;}
  .nav{flex:1;padding:10px 0;overflow-y:auto;}
  .nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:#dbe3f5;padding:11px 18px;font-size:13.5px;cursor:pointer;border-left:3px solid transparent;}
  .nav button:hover{background:rgba(255,255,255,.06);}
  .nav button.active{background:rgba(255,255,255,.12);border-left-color:var(--gold);color:#fff;font-weight:600;}
  .nav .icon{font-size:15px;width:18px;text-align:center;}
  .sidebar-foot{padding:12px 18px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;opacity:.7;}
  .main{flex:1;min-width:0;padding:24px 30px 60px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:16px;flex-wrap:wrap;}
  .topbar h1{margin:0;font-size:22px;}
  .topbar p{margin:4px 0 0;color:var(--text-dim);font-size:13px;}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;}
  button.btn{font:inherit;font-size:13px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);cursor:pointer;}
  button.btn:hover{border-color:var(--navy-light);}
  button.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  button.btn.primary:hover{background:var(--navy-light);}
  button.btn.small{padding:5px 10px;font-size:12px;}
  button.btn.danger{color:var(--red);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
  .card h2{margin:0 0 4px;font-size:15px;}
  .card .sub{color:var(--text-dim);font-size:12.5px;margin-bottom:14px;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px;}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-dim);font-weight:600;margin-bottom:6px;}
  .kpi .val{font-size:22px;font-weight:700;color:var(--navy);}
  .kpi .sub{font-size:11.5px;color:var(--text-dim);margin-top:3px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;font-weight:600;position:sticky;top:0;}
  td{padding:7px 10px;border-bottom:1px solid var(--border);}
  tr:nth-child(even) td{background:#F8FAFD;}
  tr.total td{background:var(--gold-bg);font-weight:700;border-top:2px solid var(--gold);}
  .tablewrap th{z-index:2;}
  .tablewrap{overflow-x:auto;max-height:520px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .pill.ok{background:var(--green-bg);color:var(--green);}
  .pill.warn{background:#FFF3CD;color:#8a6d00;}
  .pill.bad{background:var(--red-bg);color:var(--red);}
  input, select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;width:100%;}
  input:focus, select:focus{outline:2px solid var(--navy-light);border-color:var(--navy-light);}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;margin-bottom:14px;}
  .form-grid label{font-size:11.5px;color:var(--text-dim);display:block;margin-bottom:4px;font-weight:600;}
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .tabs button{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:#fff;cursor:pointer;}
  .tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .yearpicker{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .yearpicker button{font:inherit;font-size:12.5px;padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;}
  .yearpicker button.active{background:var(--gold);border-color:var(--gold);color:#ffffff;font-weight:700;}
  .note{font-size:12px;color:var(--text-dim);background:#F8FAFD;border:1px dashed var(--border);border-radius:8px;padding:10px 12px;margin-bottom:14px;}
  .chart{width:100%;height:220px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:900px){.grid2{grid-template-columns:1fr;}}
  .searchbox{margin-bottom:12px;}
  .lowstock-row td{background:var(--red-bg)!important;}
  td.hl-hi{background:var(--unc-hi)!important;color:#fff;font-weight:700;}
  td.hl-lo{background:var(--unc-lo)!important;color:#fff;font-weight:700;}
  .hl-legend{font-size:11.5px;color:var(--text-dim);margin:-6px 0 12px;}
  .hl-legend span.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle;}
  .flex{display:flex;gap:8px;align-items:center;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:999;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;}
  .modal-card{background:#fff;border-radius:10px;padding:22px 24px;max-width:420px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,.3);}
  .modal-card h2{margin:0 0 4px;font-size:16px;}
  .modal-card .sub{color:var(--text-dim);font-size:12.5px;margin-bottom:14px;}
  .modal-check-row{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
  .modal-check-row:last-of-type{border-bottom:none;}
  .modal-check-row input{margin-top:3px;}
  .modal-check-row label{font-size:13px;cursor:pointer;}
  .modal-check-row .modal-check-sub{display:block;font-size:11.5px;color:var(--text-dim);margin-top:1px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .toast.show{opacity:1;transform:translateY(0);}
  .status-banner{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:14px;}
  .status-banner.ok{background:var(--green-bg);color:var(--green);}
  .status-banner.bad{background:var(--red-bg);color:var(--red);}
  .rowbtns{display:flex;gap:4px;}
  a.linklike{color:var(--navy-light);cursor:pointer;text-decoration:underline;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#c6cedd;border-radius:6px;}
  .subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:10px;}
  .subtabs button{font:inherit;font-size:12.5px;padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;}
  .subtabs button.active{background:var(--gold);border-color:var(--gold);color:#ffffff;font-weight:700;}
  .dollar-wrap{position:relative;}
  .dollar-wrap::before{content:"$";position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:12.5px;pointer-events:none;}
  .dollar-wrap input{padding-left:18px !important;}
  .printhead{display:none;}
  input.editable-cell{border:none;background:transparent;padding:3px 4px;width:100%;}
  input.editable-cell:hover{background:#eef2fb;}
  input.editable-cell:focus{background:#fff;border:1px solid var(--navy-light);}
  @media print{
    .sidebar, .topbar .btnrow, .subtabs, .no-print, .form-grid, .toast, input.editable-cell{display:none !important;}
    input.editable-cell{display:inline !important;}
    .main{padding:0;}
    .card{border:none;box-shadow:none;padding:0;margin-bottom:10px;}
    body{background:#fff;}
    .printhead{display:block;margin-bottom:14px;}
    .printhead h1{margin:0 0 2px;font-size:18px;}
    .printhead p{margin:0;font-size:11px;color:#555;}
    table{font-size:11px;}
    th{background:#eee !important;color:#000 !important;}
    .tablewrap{max-height:none;overflow:visible;border:none;}
    .blank-count-page{page-break-before:always;}
    .count-cat-page{page-break-before:always;break-before:page;}
    .count-cat-page:first-of-type{page-break-before:auto;break-before:auto;}
    .count-cat-page .printhead{display:block;}
    .count-cat-page thead{display:table-header-group;}
    .count-cat-page tr{page-break-inside:avoid;break-inside:avoid;}
  }
  .blank-count-page{margin-top:24px;}
  .blank-count-page .sub{color:var(--text-dim);font-size:12px;margin-bottom:10px;}

.mobileMenuBtn{display:none;position:fixed;top:10px;left:12px;z-index:1001;width:40px;height:40px;border-radius:8px;border:none;background:var(--navy);color:#fff;font-size:19px;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;}
.sidebar-backdrop.show{display:block;}
@media(max-width:768px){
  .mobileMenuBtn{display:flex;}
  .app{display:block;}
  .sidebar{position:fixed;top:0;left:0;height:100vh;width:240px;transform:translateX(-100%);transition:transform .25s ease;z-index:1000;box-shadow:2px 0 16px rgba(0,0,0,.3);}
  .sidebar.open{transform:translateX(0);}
  .main{padding:64px 14px 40px;width:100%;min-width:0;}
  .topbar{flex-direction:column;align-items:flex-start;gap:10px;}
  .topbar h1{font-size:19px;}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;}
  .card{padding:14px 14px;}
  table{font-size:12.5px;}
  button.btn{padding:9px 12px;}
}
.phase{border-left:4px solid var(--navy);padding:2px 0 4px 16px;margin-bottom:20px;}
.phase:last-child{margin-bottom:4px;}
.phase-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.phase-num{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.phase-title{font-weight:700;font-size:14.5px;}
.phase ol{margin:0 0 0 20px;padding:0;line-height:1.75;font-size:13.5px;}
.phase li{margin-bottom:6px;}
.subblock{background:#F8FAFD;border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:8px 0 10px;}
.subblock-title{font-weight:600;font-size:12.5px;color:var(--navy);margin-bottom:6px;}
.warn-box{background:#FFF3CD;border:1px solid #F0DFA0;border-radius:8px;padding:8px 12px;font-size:12.5px;color:#8a6d00;margin:8px 0;}
.jumplist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.jumplist a{font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:#fff;color:var(--navy);text-decoration:none;font-weight:600;}

  /* ---------- Vendors ---------- */
  .vendor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
  .vendor-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:box-shadow .15s,border-color .15s;}
  .vendor-card:hover,.vendor-card:focus{border-color:var(--navy);box-shadow:0 4px 14px rgba(19,41,75,.10);outline:none;}
  .vc-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .vc-name{font-weight:700;font-size:16px;margin-right:auto;}
  .vc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border);}
  .vc-stats b{display:block;font-size:15px;font-variant-numeric:tabular-nums;}
  .vc-stats span{font-size:11px;color:var(--text-dim);}
  .vc-line{font-size:12.5px;margin-top:5px;}
  .vc-line.dim{color:var(--text-dim);}
  .vd-label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:4px;}
  .daypicker{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 14px;}
  .daypicker button{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:#fff;cursor:pointer;}
  .daypicker button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600;}
  .vchip{font:inherit;font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--navy-light);background:var(--gold-bg);color:var(--unc-lo);cursor:pointer;margin:2px 5px 2px 0;white-space:nowrap;}
  .vchip:hover{background:var(--navy);border-color:var(--navy);color:#fff;}
  .navbadge{margin-left:auto;background:#e74c3c;color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;line-height:1.5;}
  .sd-toggle{cursor:pointer;}
  .sd-toggle:hover b{text-decoration:underline;}
  .sd-caret{display:inline-block;width:12px;color:var(--text-dim);font-size:10px;}
  tr.sd-row > td{background:#F4F7FC !important;padding:12px 14px;border-bottom:2px solid var(--border);}
  .sd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;}
  .sd-box{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
  .sd-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin-bottom:4px;}
  .sd-big{font-size:18px;font-weight:700;color:var(--navy);}
  .sd-small{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .sd-table{width:auto;font-size:12px;margin-top:4px;}
  .sd-table th{position:static;background:transparent;color:var(--text-dim);padding:3px 12px 3px 0;font-size:10.5px;}
  .sd-table td{padding:3px 12px 3px 0;background:transparent !important;border:none;}
  .bulkbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 10px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;}
  .price-up{color:var(--red);font-weight:600;white-space:nowrap;}
  .price-down{color:var(--green);font-weight:600;white-space:nowrap;}
  .cond-pick{margin-top:12px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--bg);}
  .cond-pick-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:13px;}
  .cond-pick-head a{font-size:12px;}
  .cond-boxes{display:flex;flex-wrap:wrap;gap:6px;max-height:170px;overflow-y:auto;}
  .cond-check{display:inline-flex !important;align-items:center;gap:5px;font-size:12.5px !important;font-weight:500 !important;color:var(--text) !important;background:#fff;border:1px solid var(--border);border-radius:999px;padding:4px 10px;cursor:pointer;margin:0 !important;}
  .cond-check input{width:auto !important;margin:0;}
  .cond-check:has(input:checked){background:var(--gold-bg);border-color:var(--navy);}
  .cond-n{font-size:10.5px;color:var(--text-dim);}
  .cond-tag{display:inline-block;font-size:11.5px;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:1px 8px;margin:1px 3px 1px 0;}
  .sweep-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px;}
  .sweep-card{font:inherit;text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;}
  .sweep-card.static{cursor:default;background:var(--bg);}
  .sweep-card span{font-size:12px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;}
  .sweep-card b{font-size:26px;font-variant-numeric:tabular-nums;}
  .sweep-card em{font-style:normal;font-size:11.5px;color:var(--text-dim);}
  .sweep-card.on{border-color:var(--unc-lo);box-shadow:inset 0 0 0 1px var(--unc-lo);}
  .sweep-kind{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:4px;padding:1px 6px;margin-bottom:3px;}
  .sk-names{background:#EAF4FB;color:#1C6EA4;} .sk-prices{background:var(--red-bg);color:var(--red);} .sk-missing{background:#FFF4DB;color:#8a5a00;}
  .cl-del{color:var(--red);text-decoration:line-through;text-decoration-thickness:2px;}
  .cl-to{width:100%;min-width:200px;}
  .vr-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .vr-chips button{font:inherit;font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;cursor:pointer;}
  .vr-chips button.on{background:var(--unc-lo);border-color:var(--unc-lo);color:#fff;font-weight:600;}
  .vr-bar{flex:1;min-width:60px;height:8px;background:var(--bg);border-radius:4px;overflow:hidden;}
  .vr-bar span{display:block;height:100%;border-radius:4px;}
  .rep-sheet{font-size:12.5px;}
  .rep-head{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid var(--unc-lo);padding-bottom:10px;margin-bottom:12px;}
  .rep-title{font-size:20px;font-weight:800;color:var(--unc-lo);}
  .rep-sub{color:var(--text-dim);font-size:12px;margin-top:2px;}
  .rep-contact{text-align:right;font-size:12px;line-height:1.5;}
  .rep-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px;}
  .rep-kpis>div{border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
  .rep-kpis span{display:block;font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;}
  .rep-kpis b{display:block;font-size:17px;margin:2px 0;font-variant-numeric:tabular-nums;}
  .rep-kpis em{font-style:normal;font-size:11px;color:var(--text-dim);}
  .rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;}
  .rep-sheet h3{font-size:13px;margin:0 0 6px;color:var(--unc-lo);border-bottom:1px solid var(--border);padding-bottom:3px;}
  .rep-table{width:100%;border-collapse:collapse;font-size:11.5px;}
  .rep-table th{background:none !important;color:var(--text-dim) !important;font-weight:600;text-align:left;padding:3px 4px;border-bottom:1px solid var(--border);text-transform:none;font-size:11px;}
  .rep-table td{padding:3px 4px;border-bottom:1px solid #f0f0f0;}
  .rep-dim{color:var(--text-dim);font-size:10.5px;}
  .rep-notes{margin-top:14px;}
  .rep-line{border-bottom:1px solid #bbb;height:24px;}
  @media(max-width:900px){.rep-kpis{grid-template-columns:repeat(3,1fr);}.rep-grid{grid-template-columns:1fr;}.rep-head{flex-direction:column;}.rep-contact{text-align:left;}}
  @media print{
    body.print-rep .topbar, body.print-rep .vr-chips, body.print-rep .no-print, body.print-rep #syncBar{display:none !important;}
    body.print-rep .rep-sheet{font-size:11px;}
    body.print-rep .rep-kpis{grid-template-columns:repeat(6,1fr);}
    body.print-rep .rep-grid{grid-template-columns:1fr 1fr;}
    body.print-rep .rep-table{font-size:10px;}
    body.print-rep .rep-grid>div{break-inside:avoid;page-break-inside:avoid;}
    body.print-rep .toast, body.print-rep .mobileMenuBtn, body.print-rep .sidebar-backdrop{display:none !important;}
    body.print-rep, body.print-rep .app, body.print-rep .main{min-height:0 !important;height:auto !important;}
    body.print-rep .main{padding:0 !important;}
    body.print-rep .rep-sheet{margin:0 !important;}
    @page{margin:0.45in;}
  }
</style>

function vendorKey(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,''); }
function blankVendor(name){
  return {uid:"v-"+(vendorKey(name)||Date.now().toString(36)), name:String(name||"").trim(), number:"", accountNum:"", aliases:[],
    repName:"", repPhone:"", repEmail:"", officePhone:"", website:"", orderMethod:"", orderCutoff:"",
    orderDays:[], deliveryDays:[], notes:"", createdAt:new Date().toISOString()};
}
function findVendorIn(list, name){
  const k = vendorKey(name);
  if(!k || !Array.isArray(list)) return null;
  return list.find(v=>vendorKey(v.name)===k) || list.find(v=>(v.aliases||[]).some(a=>vendorKey(a)===k)) || null;
}
function findVendor(name){ return findVendorIn(DATA.vendors, name); }
/* The vendor's official name for whatever was typed ("Kohfeld" -> "Kohlfeld"); unknown names pass through. */
function vendorCanon(name){
  const v = findVendor(name);
  return v ? v.name : String(name||"").replace(/\s+/g,' ').trim();
}
function ensureVendor(name){
  const clean = String(name||"").replace(/\s+/g,' ').trim();
  if(!clean) return null;
  let v = findVendor(clean);
  if(!v){ v = blankVendor(clean); DATA.vendors.push(v); }
  return v;
}

function productVendorKey(p){ return normName(p.name)+"|"+normUnit(p.unit); }

function migrateVendors(stored){
  let changed = false;
  if(!Array.isArray(stored.vendors)){
    stored.vendors = DEFAULT_VENDORS.map(d=>Object.assign(blankVendor(d.name), JSON.parse(JSON.stringify(d))));
    changed = true;
  }
  if(!Array.isArray(stored.priceAlerts)){ stored.priceAlerts = []; changed = true; }
  if(!Array.isArray(stored.priceChangeLog)){ stored.priceChangeLog = []; changed = true; }
  if(!Array.isArray(stored.marginConditions)){ stored.marginConditions = []; changed = true; }
  if(!stored.cleanupDecisions || typeof stored.cleanupDecisions!=="object" || Array.isArray(stored.cleanupDecisions)){ stored.cleanupDecisions = {}; changed = true; }
  if(!stored.vendorSeedApplied && Array.isArray(stored.inventory)){
    // newest invoice line for each product name+size tells us who delivers it
    const latest = new Map();
    (stored.invoiceEntries||[]).forEach(e=>{
      if(!e || !e.distributor) return;
      const k = normName(e.name)+"|"+normUnit(e.unit), d = String(e.date||"");
      const cur = latest.get(k);
      if(!cur || d>=cur.date) latest.set(k, {date:d, dist:e.distributor});
    });
    stored.inventory.forEach(p=>{
      if(p.vendor) return;
      const k = normName(p.name)+"|"+normUnit(p.unit);
      const inv = latest.get(k), seed = VENDOR_SEED[k];
      if(inv){
        const v = findVendorIn(stored.vendors, inv.dist);
        p.vendor = v ? v.name : String(inv.dist).trim(); p.vendorSource = "invoice";
      } else if(seed){
        const v = findVendorIn(stored.vendors, seed[0]);
        p.vendor = v ? v.name : seed[0]; p.vendorSource = seed[1]==="i" ? "invoice" : "guess";
      } else { p.vendor = ""; p.vendorSource = ""; }
    });
    // any vendor name that came from an invoice but isn't on the vendor list yet gets a record
    stored.inventory.forEach(p=>{
      if(p.vendor && !findVendorIn(stored.vendors, p.vendor)) stored.vendors.push(blankVendor(p.vendor));
    });
    stored.vendorSeedApplied = new Date().toISOString();
    changed = true;
  }
  return changed;
}

/* ---------- price math shared by Price Alerts and Price Changes ---------- */
// Retail that keeps this product's current margin % at a new cost, rounded up to the next .x9
function suggestedRetail(p, newCost){
  const retail = num(p.retail);
  if(!retail || !(newCost>0)) return null;
  const buydown = isBuydownCategory(p.category) ? num(p.buydown) : 0;
  const m = (retail - (num(p.cost) - buydown)) / retail;
  if(!(m < 0.95)) return null;
  const raw = (newCost - buydown) / (1 - m);
  if(!(raw > 0)) return null;
  return +(Math.ceil((raw + 0.01) * 10) / 10 - 0.01).toFixed(2);
}
function marginPctAt(p, cost, retail){
  const buydown = isBuydownCategory(p.category) ? num(p.buydown) : 0;
  return retail ? (retail - (cost - buydown)) / retail : 0;
}
function logPriceChange(p, oldCost, newCost, oldRetail, newRetail, source, extra){
  if(Math.abs(oldCost-newCost)<0.005 && Math.abs(oldRetail-newRetail)<0.005) return;
  DATA.priceChangeLog.unshift(Object.assign({uid:"pc"+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    at:new Date().toISOString(), vendor:p.vendor||"", productUid:p.uid, name:p.name, unit:p.unit||"", category:p.category,
    oldCost, newCost, oldRetail, newRetail, source}, extra||{}));
}
function refreshProductValues(p){
  p.closing_value = +(num(p.closing)*num(p.cost)).toFixed(2);
  p.sales_value = +(num(p.closing)*num(p.retail)).toFixed(2);
}
function openPriceAlerts(){ return (DATA.priceAlerts||[]).filter(a=>a.status==="open"); }

/* Called for every line when an invoice is submitted, right before the product's cost is updated from
   the invoice. Fills in the vendor if the product doesn't have a confirmed one, and flags a cost change. */
function vendorOnInvoiceLine(p, line, distributor, invoice, date, oldCost){
  const v = ensureVendor(distributor);
  if(v && (!p.vendor || p.vendorSource==="guess")){ p.vendor = v.name; p.vendorSource = "invoice"; }
  const newCost = num(line.cost);
  if(line.shipper || !(oldCost>0) || !(newCost>0) || Math.abs(newCost-oldCost)<0.005) return false;
  // a product with a margin condition only gets flagged if the new cost pushes it outside its range
  if(conditionFor(p) && conditionStatus(p, newCost, num(p.retail)).status==="ok"){
    logPriceChange(p, oldCost, newCost, num(p.retail), num(p.retail), "invoice", {invoice, inRange:true});
    return false;
  }
  // re-submitting the same invoice replaces its earlier alert for this product instead of stacking a second one
  DATA.priceAlerts = DATA.priceAlerts.filter(a=>!(a.status==="open" && a.productUid===p.uid && a.invoice===invoice));
  DATA.priceAlerts.unshift({uid:"a"+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    productUid:p.uid, name:p.name, unit:p.unit||"", category:p.category, vendor:v ? v.name : (p.vendor||""),
    oldCost, newCost, retailAtAlert:num(p.retail), invoice, date:date||"", createdAt:new Date().toISOString(), status:"open"});
  logPriceChange(p, oldCost, newCost, num(p.retail), num(p.retail), "invoice", {invoice});
  return true;
}

/* ===================== MARGIN / MARKUP CONDITIONS =====================
   A condition says what a product SHOULD earn: e.g. "BEER + 12pk -> 15%+ markup" or "CANDY + king ->
   37-40% margin" or "Southern Glazer -> 25-30% margin". It can match on Vendor, Category and Unit/Size
   (any mix, several of each); when several match a product, the most specific wins (Unit counts most, then Category,
   then Vendor -- so "BEER 12pk" beats "BEER", and "BEER" beats "Grey Eagle"). Margin = profit / retail,
   markup = profit / cost, both using cost after buydowns for cigarettes/tobacco (same as effectiveCost).
   A range (min-max) means small week-to-week cost swings that stay inside it don't call for a new price. */
/* A condition can list several categories and several sizes (any one of them matches). Older conditions
   saved a single c.category / c.unit string -- condCats/condUnits read either shape. */
function condCats(c){ return Array.isArray(c.categories) ? c.categories.filter(Boolean) : (c.category ? [c.category] : []); }
function condVendors(c){ return Array.isArray(c.vendors) ? c.vendors.filter(Boolean) : (c.vendor ? [c.vendor] : []); }
function condUnits(c){ return Array.isArray(c.units) ? c.units.filter(Boolean) : (c.unit ? [c.unit] : []); }
/* Higher = more specific. Having sizes counts most, then categories, then vendor; between two conditions
   of the same kind, the one listing FEWER categories/sizes is narrower and wins. */
function condSpecificity(c){
  const u = condUnits(c).length, k = condCats(c).length, v = condVendors(c).length;
  return (u?40000:0) + (k?20000:0) + (v?10000:0) - Math.min(u,99)*100 - Math.min(k,9)*10 - Math.min(v,9);
}
function condMatches(c, p){
  if(!c || c.disabled) return false;
  const cats = condCats(c), units = condUnits(c), vends = condVendors(c);
  if(!(vends.length || cats.length || units.length)) return false;
  if(vends.length && !vends.includes(p.vendor||"")) return false;
  if(cats.length && !cats.some(x=>normName(x)===normName(p.category))) return false;
  if(units.length && !units.some(x=>normUnit(x)===normUnit(p.unit))) return false;
  return true;
}
function conditionFor(p){
  let best = null, bs = -1;
  (DATA.marginConditions||[]).forEach(c=>{ if(condMatches(c, p)){ const s = condSpecificity(c); if(s > bs){ bs = s; best = c; } } });
  return best;
}
function condCost(p, rawCost){ return isBuydownCategory(p.category) ? rawCost - num(p.buydown) : rawCost; }
function pctFor(basis, effCost, retail){
  if(basis==="markup") return effCost>0 ? (retail-effCost)/effCost : null;
  return retail>0 ? (retail-effCost)/retail : null;
}
function retailForPct(basis, effCost, pct){
  if(basis==="markup") return effCost*(1+pct);
  return pct < 1 ? effCost/(1-pct) : null;
}
function roundUp9(x){ return +(Math.ceil((x + 0.01) * 10) / 10 - 0.01).toFixed(2); }
function roundDown9(x){ return +(Math.floor((x + 0.01) * 10) / 10 - 0.01).toFixed(2); }
function condHasMax(c){ return c.max!=null && c.max!=="" && !isNaN(parseFloat(c.max)); }
function condTargetText(c){
  if(!c) return "";
  const kind = c.basis==="markup" ? "markup" : "margin";
  return condHasMax(c) ? `${+c.min}\u2013${+c.max}% ${kind}` : `at least ${+c.min}% ${kind}`;
}
function condScopeText(c){
  if(!c) return "";
  return [condVendors(c).join(" / "), condCats(c).join(" / "), condUnits(c).join(" / ")].filter(Boolean).join(" \u00b7 ");
}
/* status of a product against its condition at a given cost/retail (defaults: what's on file now) */
function conditionStatus(p, rawCost, retail){
  const c = conditionFor(p);
  if(!c) return {cond:null, status:"none", value:null};
  rawCost = rawCost==null ? num(p.cost) : rawCost;
  retail = retail==null ? num(p.retail) : retail;
  const v = pctFor(c.basis, condCost(p, rawCost), retail);
  if(v==null) return {cond:c, status:"unknown", value:null};
  const lo = num(+c.min)/100, hi = condHasMax(c) ? parseFloat(c.max)/100 : null;
  const status = v < lo - 0.0005 ? "below" : (hi!=null && v > hi + 0.0005 ? "above" : "ok");
  return {cond:c, status, value:v};
}
/* the .x9 shelf price that brings a product back inside its range (null if no condition / already in range) */
function conditionSuggestedRetail(p, rawCost, retail){
  const st = conditionStatus(p, rawCost, retail);
  if(!st.cond || st.status==="ok") return null;
  const c = st.cond, ec = condCost(p, rawCost==null ? num(p.cost) : rawCost);
  if(!(ec > 0)) return null;
  const lo = retailForPct(c.basis, ec, num(+c.min)/100);
  const hi = condHasMax(c) ? retailForPct(c.basis, ec, parseFloat(c.max)/100) : null;
  if(lo==null) return null;
  if(st.status==="above" && hi!=null){
    const r = roundDown9(hi);
    return r >= lo ? r : +hi.toFixed(2);
  }
  const r = roundUp9(lo);
  return (hi!=null && r > hi) ? +lo.toFixed(2) : r;
}
/* Suggested shelf price for a new cost: products with a condition stay put if they're still in range,
   otherwise move to the edge of the range; products without one keep their current margin. */
function smartSuggestedRetail(p, newCost){
  if(conditionFor(p)){
    const st = conditionStatus(p, newCost, num(p.retail));
    if(st.status==="ok") return num(p.retail);
    const r = conditionSuggestedRetail(p, newCost, num(p.retail));
    return r!=null ? r : suggestedRetail(p, newCost);
  }
  return suggestedRetail(p, newCost);
}

function isObjPlain(v){ return !!v && typeof v==="object" && !Array.isArray(v); }
function migrate(stored){
  let changed = false;
  Object.keys(SEED).forEach(k=>{
    if(!(k in stored)){ stored[k] = JSON.parse(JSON.stringify(SEED[k])); changed = true; }
  });
  if(Array.isArray(stored.inventory)){
    const seedIndex = {};
    SEED.inventory.forEach(p=>{ seedIndex[p.num+"|"+p.category] = p; });
    const newFields = ["opening","received_qty","notes","buydown","multipack_qty","multipack_deal_price"];
    stored.inventory.forEach(p=>{
      const s = seedIndex[p.num+"|"+p.category];
      newFields.forEach(f=>{
        if(!(f in p)){
          p[f] = s ? s[f] : (f==="notes" ? "" : (f==="opening"||f==="received_qty"||f==="buydown" ? 0 : null));
          changed = true;
        }
      });
    });
    // Fold stray category spellings ("Grocery", "soda ") into the existing UPPERCASE category so products
    // added that way show up with the rest of their category in Product List / Count / Count Sheet.
    stored.inventory.forEach(p=>{
      const c = String(p.category||"").replace(/\s+/g,' ').trim().toUpperCase();
      if(c && p.category!==c){ p.category = c; changed = true; }
    });
    // Stable id per product so two people editing different products at the same time can be merged
    // safely by the cloud sync (num alone isn't unique if two people add a product at the same moment).
    const seen = new Set();
    stored.inventory.forEach(p=>{
      if(!p.uid || seen.has(p.uid)){
        let id = "n" + p.num, n = 1;
        while(seen.has(id)) id = "n" + p.num + "#" + (++n);
        p.uid = id; changed = true;
      }
      seen.add(p.uid);
    });
  }
  if(!isObjPlain(stored.categoryCounts)){ stored.categoryCounts = {}; changed = true; }
  if(!isObjPlain(stored.countSchedule)){ stored.countSchedule = {}; changed = true; }
  if(!Array.isArray(stored.logins) && ((stored.inventory||[]).length || Object.keys(stored.overlooks||{}).length)){ stored.logins = defaultLogins(); changed = true; }
  if(migrateVendors(stored)) changed = true;
  return changed;
}

/* ===================== LOCAL STORAGE (this device) =====================
   The whole data set (with every monthly snapshot) is several MB and keeps growing, which is more than
   browser localStorage reliably holds (~5MB). So this device's copy now lives in IndexedDB (hundreds of
   MB available); localStorage is only read once to pick up data saved by the previous version. */
let LOCAL_IS_FRESH = false;
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const stored = JSON.parse(raw); migrate(stored); return stored; }
  }catch(e){ console.warn("localStorage read failed", e); }
  const fresh = JSON.parse(JSON.stringify(SEED));
  migrate(fresh);
  LOCAL_IS_FRESH = true; // nothing saved on this device yet -- just take the shared copy
  return fresh;
}
const IDB = (function(){
  let dbp = null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((resolve, reject)=>{
      try{
        const req = indexedDB.open("djsMiniMart", 1);
        req.onupgradeneeded = ()=>{ req.result.createObjectStore("kv"); };
        req.onsuccess = ()=>resolve(req.result);
        req.onerror = ()=>reject(req.error);
      }catch(e){ reject(e); }
    });
    return dbp;
  }
  async function get(key){
    const db = await open();
    return new Promise((resolve, reject)=>{
      const r = db.transaction("kv","readonly").objectStore("kv").get(key);
      r.onsuccess = ()=>resolve(r.result); r.onerror = ()=>reject(r.error);
    });
  }
  async function set(key, val){
    const db = await open();
    return new Promise((resolve, reject)=>{
      const tx = db.transaction("kv","readwrite");
      tx.objectStore("kv").put(val, key);
      tx.oncomplete = ()=>resolve(); tx.onerror = ()=>reject(tx.error); tx.onabort = ()=>reject(tx.error);
    });
  }
  return {get, set};
})();
let localSaveTimer = null, localSaveWarned = false;
function saveLocalSoon(){ clearTimeout(localSaveTimer); localSaveTimer = setTimeout(saveLocalNow, 300); }
async function saveLocalNow(){
  clearTimeout(localSaveTimer);
  try{
    await IDB.set("state", {data: DATA, base: syncBase, savedAt: new Date().toISOString()});
  }catch(e){
    console.warn("IndexedDB write failed, falling back to localStorage", e);
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }
    catch(e2){ if(!localSaveWarned){ localSaveWarned = true; toast("Could not save on this device — storage may be full or blocked", true); } }
  }
}
function saveData(d){ saveLocalSoon(); } // kept for any older callers
let DATA = loadData();

function persist(){ DATA_VERSION++; saveLocalSoon(); scheduleCloudSave(); toast("Saved"); }

/* ===================== TRASH CAN =====================
   Anything deleted one at a time (products, vendors, invoices and their lines, sales entries, rebates,
   reports, margin conditions, a whole year) goes here first and can be put back until midnight on the
   day it was deleted. After midnight (this device's local time) it is cleared for good. Each item is its
   own synced section, so everyone sees the same trash. */
function localDay(d){ const x = new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function trashItems(){ return Object.values(DATA.trash||{}).sort((a,b)=>String(b.deletedAt).localeCompare(String(a.deletedAt))); }
function trashPut(type, label, data, where){
  if(!DATA.trash || typeof DATA.trash!=="object" || Array.isArray(DATA.trash)) DATA.trash = {};
  const uid = "t" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  DATA.trash[uid] = {uid, type, label, deletedAt: new Date().toISOString(), data: JSON.parse(JSON.stringify(data)), where: where||{}};
}
function purgeTrash(){ // drop anything deleted before today
  if(!DATA || !DATA.trash) return false;
  const today = localDay(Date.now());
  let gone = false;
  Object.keys(DATA.trash).forEach(k=>{ const t = DATA.trash[k]; if(!t || !t.deletedAt || localDay(t.deletedAt) < today){ delete DATA.trash[k]; gone = true; } });
  return gone;
}
function saveQuiet(){ DATA_VERSION++; saveLocalSoon(); scheduleCloudSave(); }
const TRASH_TYPES = {
  product:"Product", vendor:"Vendor", condition:"Margin condition", invoice:"Invoice", invoiceLine:"Invoice line",
  deliveryLine:"Delivery log line", salesDay:"Daily sales entry", salesInvoice:"Sales & Margins invoice", rebate:"Rebate",
  year:"Year of sales data", inventoryReport:"Monthly inventory report", distributorReport:"Distributor report",
  officeReport:"Office report", cigReport:"Reconciliation report", categoryCount:"Category count"
};
const TRASH_REPORT_KEY = {inventoryReport:"inventoryReports", distributorReport:"distributorReports", officeReport:"officeReports", cigReport:"cigReconciliationReports", categoryCount:"categoryCounts"};
function restoreTrash(uid){
  const t = DATA.trash && DATA.trash[uid]; if(!t) return "That item is no longer in the trash";
  const d = t.data, w = t.where||{};
  if(t.type==="product"){
    if(DATA.inventory.some(p=>p.uid && p.uid===d.uid)) return "That product is already back on the list";
    DATA.inventory.push(d);
  } else if(t.type==="vendor"){
    if(!Array.isArray(DATA.vendors)) DATA.vendors = [];
    if(DATA.vendors.some(v=>v.uid===d.uid)) return "That vendor is already back on the list";
    DATA.vendors.push(d);
  } else if(t.type==="condition"){
    if(!Array.isArray(DATA.marginConditions)) DATA.marginConditions = [];
    if(DATA.marginConditions.some(c=>c.uid===d.uid)) return "That condition is already back";
    DATA.marginConditions.push(d);
  } else if(t.type==="invoice" || t.type==="invoiceLine" || t.type==="deliveryLine"){
    const lines = Array.isArray(d) ? d : [d];
    lines.forEach(l=>DATA.invoiceEntries.push(l));
    [...new Set(lines.map(l=>l.invoice))].forEach(n=>syncInvoiceEntryToSalesMargins(n));
  } else if(t.type==="salesDay" || t.type==="salesInvoice" || t.type==="rebate"){
    ensureOverlookYear(w.year);
    const md = DATA.overlooks[w.year][w.month];
    if(t.type==="salesDay"){
      if(md.daily.some(x=>x.day===d.day)) return `${w.month} ${d.day} already has a sales entry`;
      md.daily.push(d); md.daily.sort((a,b)=>a.day-b.day);
    } else {
      const arr = t.type==="salesInvoice" ? md.invoices : md.rebates;
      arr.splice(Math.min(num(w.index), arr.length), 0, d);
    }
  } else if(t.type==="year"){
    if(DATA.overlooks[w.year]) return `${w.year} already exists — delete it first to restore the old copy`;
    DATA.overlooks[w.year] = d;
  } else if(TRASH_REPORT_KEY[t.type]){
    const k = TRASH_REPORT_KEY[t.type];
    if(!DATA[k]) DATA[k] = {};
    if(DATA[k][w.id]) return "A report with the same name already exists";
    DATA[k][w.id] = d;
  } else return "Unknown item";
  delete DATA.trash[uid];
  return null;
}

  main.innerHTML = `
    <div class="topbar"><div><h1>Trash</h1><p>Things deleted today wait here until midnight, then they're cleared for good. Restore anything deleted by mistake.</p></div></div>
    <div class="card">
      ${items.length ? `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
        <div class="sub" style="margin:0;">${items.length} item${items.length===1?"":"s"} · clears at midnight tonight</div>
        <button class="btn danger" id="trEmpty">Empty Trash Now</button>
      </div>
      <div style="overflow-x:auto;"><table>
        <thead><tr><th>Deleted</th><th>Type</th><th>Item</th><th></th></tr></thead>
        <tbody>${items.map(t=>`<tr>
          <td style="white-space:nowrap;">${when(t.deletedAt)}</td>
          <td style="white-space:nowrap;">${h(TRASH_TYPES[t.type]||t.type)}</td>
          <td>${h(t.label)}</td>
          <td style="white-space:nowrap;text-align:right;">
            <button class="btn primary" data-trrestore="${h(t.uid)}">Restore</button>
            <button class="btn danger" data-trkill="${h(t.uid)}">Delete Forever</button>
          </td></tr>`).join("")}</tbody>
      </table></div>` : `<div class="sub" style="margin:0;">The trash is empty. When you delete something, it shows up here until midnight.</div>`}
    </div>`;
  main.querySelectorAll('[data-trrestore]').forEach(b=>b.onclick = ()=>{
    const t = DATA.trash[b.dataset.trrestore]; const label = t ? t.label : "";
    const err = restoreTrash(b.dataset.trrestore);
    if(err){ toast(err, true); return; }
    persist(); toast(`Restored: ${label}`); render();
  });
  main.querySelectorAll('[data-trkill]').forEach(b=>b.onclick = ()=>{
    const t = DATA.trash[b.dataset.trkill]; if(!t) return;
    if(!confirm(`Delete "${t.label}" forever? This can't be undone.`)) return;
    delete DATA.trash[b.dataset.trkill]; persist(); render();
  });
  const emp = document.getElementById('trEmpty');
  if(emp) emp.onclick = ()=>{
    if(!confirm(`Permanently delete all ${items.length} item${items.length===1?"":"s"} in the trash? This can't be undone.`)) return;
    DATA.trash = {}; persist(); render();
  };
}
setInterval(()=>{ if(purgeTrash()){ saveQuiet(); render(); } }, 60000);

/* ===================== CLOUD SYNC (Firestore) =====================
   HOW IT WORKS (and why it changed):
   The old sync uploaded the ENTIRE data set as one blob on every save, and whoever saved last won. So if
   a coworker's copy was out of date (laptop asleep, flaky wifi, an old tab left open) and they changed
   anything at all, their old copy replaced everyone's -- including a just-finished count. And if this
   device couldn't reach the cloud, the only sign was small text in the sidebar footer.

   Now the data is split into sections ("units": the product list, each monthly snapshot, each year of
   Sales & Margins, invoices, ...). Each device remembers the last cloud version of every section it has
   seen (its "base"). A save only uploads sections THIS device actually changed, and if someone else
   changed the same section in the meantime, the two versions are merged (per product / per field /
   per invoice line) instead of one overwriting the other. Section contents are stored in documents
   named after a hash of their content, and a small "meta" document lists the current version of every
   section, so readers never see half-written data. When this device can't reach the cloud, a red bar
   says so on every page, edits are kept here, and they're merged and uploaded automatically once it
   reconnects. */
const SYNC_COL = "stationManagerSyncV2";
const LEGACY_COL = "stationManagerSync";
const CHUNK_SIZE = 250000; // chars per Firestore doc -- even at 3 bytes/char this stays under the 1 MiB doc limit
const SPLIT_KEYS = ["inventoryReports","distributorReports","officeReports","cigReconciliationReports","overlooks","trash","categoryCounts"];
const CLIENT_ID = (function(){
  try{
    let id = sessionStorage.getItem("stationManagerTabId");
    if(!id){ id = "c" + Date.now() + "_" + Math.random().toString(36).slice(2); sessionStorage.setItem("stationManagerTabId", id); }
    return id;
  }catch(e){ return "c" + Date.now() + "_" + Math.random().toString(36).slice(2); }
})();
let syncState = { status: "connecting", lastSyncedAt: null, error: "", legacyWriter: false, retryTimer: null, retryDelay: 15000 };
let syncBase = { json: {}, hashes: {} }; // last cloud version of each section this device has seen
let syncReady = false;      // true once this device has reconciled with the cloud at least once this session
let forceNextSave = false;  // Restore/Reset: upload this device's copy as-is, no merging

function hashStr(str){ // cyrb53 -- fast 53-bit string hash
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i=0; i<str.length; i++){ const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return (h2>>>0).toString(36) + (h1>>>0).toString(36) + "_" + str.length.toString(36);
}
function unitsOf(d){
  const u = {};
  Object.keys(d).forEach(k=>{
    const v = d[k];
    if(SPLIT_KEYS.includes(k) && v && typeof v==="object" && !Array.isArray(v)){
      u[k+"/"] = '"__map__"';
      Object.keys(v).forEach(sub=>{ u[k+"/"+sub] = JSON.stringify(v[sub]); });
    } else {
      u[k] = JSON.stringify(v===undefined ? null : v);
    }
  });
  return u;
}
function setUnit(d, name, json){
  const slash = name.indexOf("/");
  if(slash<0){ if(json==null) delete d[name]; else d[name] = JSON.parse(json); return; }
  const k = name.slice(0, slash), sub = name.slice(slash+1);
  if(sub===""){ if(json==null) delete d[k]; else if(!d[k] || typeof d[k]!=="object" || Array.isArray(d[k])) d[k] = {}; return; }
  if(json==null){ if(d[k]) delete d[k][sub]; return; }
  if(!d[k] || typeof d[k]!=="object" || Array.isArray(d[k])) d[k] = {};
  d[k][sub] = JSON.parse(json);
}
function dataFromUnits(units){
  const d = {};
  Object.keys(units).filter(n=>n.endsWith("/")).forEach(n=>setUnit(d, n, units[n]));
  Object.keys(units).filter(n=>!n.endsWith("/")).forEach(n=>setUnit(d, n, units[n]));
  return d;
}
function hashesOf(units){ const h = {}; Object.keys(units).forEach(n=>h[n] = hashStr(units[n])); return h; }

/* ---------- three-way merge: base (last version both sides had), mine (this device), theirs (cloud) ---------- */
const jeq = (a,b)=> a===b || JSON.stringify(a)===JSON.stringify(b);
const isObj = v => v && typeof v==="object" && !Array.isArray(v);
function merge3(base, mine, theirs){
  if(jeq(mine, theirs)) return mine;
  if(base!==undefined && jeq(base, mine)) return theirs;
  if(base!==undefined && jeq(base, theirs)) return mine;
  if(isObj(mine) && isObj(theirs)){
    const b = isObj(base) ? base : {};
    const out = {};
    const keys = [...new Set([...Object.keys(theirs), ...Object.keys(mine)])];
    keys.forEach(k=>{
      const inM = k in mine, inT = k in theirs, inB = isObj(base) && (k in b);
      if(inM && inT) out[k] = merge3(inB ? b[k] : undefined, mine[k], theirs[k]);
      else if(inM){ if(!(inB && jeq(b[k], mine[k]))) out[k] = mine[k]; }       // they deleted it & I didn't touch it -> stays deleted
      else if(inT){ if(!(inB && jeq(b[k], theirs[k]))) out[k] = theirs[k]; }   // I deleted it & they didn't touch it -> stays deleted
    });
    return out;
  }
  if(Array.isArray(mine) && Array.isArray(theirs)) return mergeArray(Array.isArray(base) ? base : undefined, mine, theirs);
  return mine; // same field changed on both sides -> the edit made on this device wins
}
function mergeArray(base, mine, theirs){
  const hasUid = arr => arr.length>0 && arr.every(x=>isObj(x) && x.uid);
  if((mine.length===0 || hasUid(mine)) && (theirs.length===0 || hasUid(theirs)) && (hasUid(mine) || hasUid(theirs))){
    // keyed by uid (products): per-product, per-field merge; keeps additions from both sides
    const bMap = new Map((base||[]).filter(isObj).map(x=>[x.uid, x]));
    const mMap = new Map(mine.map(x=>[x.uid, x]));
    const tMap = new Map(theirs.map(x=>[x.uid, x]));
    const out = [];
    theirs.forEach(t=>{
      const m = mMap.get(t.uid), b = bMap.get(t.uid);
      if(m) out.push(merge3(b, m, t));
      else if(!(b && jeq(b, t))) out.push(t); // I deleted it but they edited it -> keep theirs
    });
    mine.forEach((m, i)=>{
      if(tMap.has(m.uid)) return;
      const b = bMap.get(m.uid);
      if(b && jeq(b, m)) return; // they deleted it, I didn't edit it -> stays deleted
      // insert right after the item that precedes it on this device
      let pos = out.length;
      for(let j=i-1; j>=0; j--){ const idx = out.findIndex(x=>x.uid===mine[j].uid); if(idx>=0){ pos = idx+1; break; } }
      out.splice(pos, 0, m);
    });
    return out;
  }
  // plain list (invoice lines, daily sales...): keep theirs, drop what I removed, add what I added
  const key = x=>JSON.stringify(x);
  const count = arr=>{ const m = new Map(); arr.forEach(x=>{ const k = key(x); m.set(k, (m.get(k)||0)+1); }); return m; };
  const ref = base!==undefined ? base : theirs; // no common base: treat theirs as the reference (union, no duplicates)
  const bC = count(ref), mC = count(mine);
  const removed = new Map(); bC.forEach((n,k)=>{ const d = n-(mC.get(k)||0); if(d>0) removed.set(k, d); });
  const addedFront = [], addedBack = [];
  const seenB = new Map(bC);
  mine.forEach((x,i)=>{
    const k = key(x); const left = seenB.get(k)||0;
    if(left>0){ seenB.set(k, left-1); return; }
    (i < mine.length/2 ? addedFront : addedBack).push(x);
  });
  const out = [];
  theirs.forEach(x=>{
    const k = key(x); const r = removed.get(k)||0;
    if(base!==undefined && r>0){ removed.set(k, r-1); return; }
    out.push(x);
  });
  return [...addedFront, ...out, ...addedBack];
}
function mergeUnitJson(name, baseJson, mineJson, theirsJson){
  if(mineJson===theirsJson) return mineJson;
  if(theirsJson==null && mineJson!=null && baseJson!=null && mineJson!==baseJson) return mineJson; // they deleted, I edited
  if(theirsJson==null) return baseJson===mineJson ? null : mineJson;
  if(mineJson==null) return (baseJson!=null && baseJson===theirsJson) ? null : theirsJson;
  const parse = j => j==null ? undefined : JSON.parse(j);
  let merged = merge3(parse(baseJson), parse(mineJson), parse(theirsJson));
  if(name==="inventory" && Array.isArray(merged)){
    // two people adding a product at the same moment can pick the same #; renumber the later one
    const seen = new Set(); let max = Math.max(0, ...merged.map(p=>p.num||0));
    merged.forEach(p=>{ if(seen.has(p.num)) p.num = ++max; seen.add(p.num); });
  }
  return JSON.stringify(merged);
}

/* ---------- cloud reads/writes ---------- */
const syncCol = ()=>db.collection(SYNC_COL);
// each upload gets its own doc ids (content hash + random tag), so cleaning up an old version can never
// delete docs that a newer save is using
const chunkId = (entry, i)=>"c_" + entry.h + (entry.t ? "_" + entry.t : "") + "_" + i;
function withTimeout(p, ms, what){
  return Promise.race([p, new Promise((_, rej)=>setTimeout(()=>rej(new Error((what||"Request") + " timed out")), ms))]);
}
async function readUnit(entry){
  const gets = [];
  for(let i=0; i<entry.n; i++) gets.push(syncCol().doc(chunkId(entry, i)).get());
  const snaps = await Promise.all(gets);
  const parts = snaps.map(s=>{ const d = s.data(); if(!d) throw new Error("stale"); return d.data; });
  const json = parts.join("");
  if(hashStr(json)!==entry.h) throw new Error("stale");
  return json;
}
async function writeUnitChunks(jsonByName, entries){
  // content-addressed docs: safe to write before the meta update (an unreferenced doc is harmless)
  let batch = db.batch(), ops = 0, bytes = 0;
  const flush = async()=>{ if(ops){ await batch.commit(); batch = db.batch(); ops = 0; bytes = 0; } };
  for(const name of Object.keys(jsonByName)){
    const json = jsonByName[name];
    if(json==null) continue;
    const parts = chunkString(json, CHUNK_SIZE);
    for(let i=0; i<parts.length; i++){
      if(ops>=400 || bytes + parts[i].length*3 > 8000000) await flush();
      batch.set(syncCol().doc(chunkId(entries[name], i)), {data: parts[i]});
      ops++; bytes += parts[i].length*3;
    }
  }
  await flush();
}
function chunkString(str, size){
  // never cut an emoji (surrogate pair) in half -- the halves can't be stored and come back as �
  const out = [];
  let i = 0;
  while(i < str.length){
    let end = Math.min(i + size, str.length);
    if(end < str.length){ const c = str.charCodeAt(end-1); if(c>=0xD800 && c<=0xDBFF) end--; }
    out.push(str.slice(i, end)); i = end;
  }
  return out.length ? out : [""];
}
async function deleteOrphanChunks(oldEntries){
  try{
    const s = await syncCol().doc("meta").get();
    const live = new Set(Object.values((s.exists && s.data().units) || {}).map(e=>chunkId(e, 0)));
    const batch = db.batch(); let ops = 0;
    oldEntries.forEach(e=>{ if(e && !live.has(chunkId(e, 0))) for(let i=0; i<e.n; i++){ batch.delete(syncCol().doc(chunkId(e, i))); ops++; } });
    if(ops) await batch.commit();
  }catch(e){ console.warn("chunk cleanup skipped", e); }
}

/* ---------- saving ---------- */
let cloudSaveTimer = null, saveQueued = false;
/* Saves and incoming teammate updates run one at a time, in order, so they can't trip over each other. */
let syncQueue = Promise.resolve();
function enqueueSync(fn){
  const p = syncQueue.then(fn);
  syncQueue = p.catch(e=>{ console.warn("sync step failed", e); });
  return p;
}
function scheduleCloudSave(delay){
  if(!window.db) return;
  if(!syncReady) { updateSyncBadge(); return; } // not reconciled yet -- connect() will push pending edits
  syncState.status = "syncing"; updateSyncBadge();
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(cloudSaveNow, delay==null ? 1500 : delay);
}
function cloudSaveNow(){
  if(!window.db || !syncReady) return Promise.resolve();
  clearTimeout(cloudSaveTimer);
  if(saveQueued) return syncQueue;
  saveQueued = true;
  return enqueueSync(async()=>{ saveQueued = false; await cloudSaveInner(); });
}
async function cloudSaveInner(){
  try{
    for(let attempt=0; attempt<5; attempt++){
      const sent = unitsOf(DATA);
      const sentH = hashesOf(sent);
      const touched = [...new Set([...Object.keys(sent), ...Object.keys(syncBase.hashes)])].filter(n=>sentH[n]!==syncBase.hashes[n]);
      if(!touched.length){ markSynced(); return; }
      const force = forceNextSave;
      // 1) look at the cloud's current version of the sections we touched
      const metaSnap = await withTimeout(syncCol().doc("meta").get(), 20000, "Cloud check");
      const meta = metaSnap.exists ? metaSnap.data() : {rev:0, units:{}};
      const cloudUnits = meta.units || {};
      const finalJson = {}, merged = [];
      for(const n of touched){
        const cloudH = cloudUnits[n] ? cloudUnits[n].h : undefined;
        if(cloudH===sentH[n]){ // cloud already has exactly this
          if(sent[n]==null){ delete syncBase.json[n]; delete syncBase.hashes[n]; } else { syncBase.json[n] = sent[n]; syncBase.hashes[n] = cloudH; }
          continue;
        }
        if(force || cloudH===syncBase.hashes[n]){ finalJson[n] = sent[n]==null ? null : sent[n]; continue; }
        // someone else changed this same section since we last synced -> merge instead of overwrite
        const theirs = cloudH ? await withTimeout(readUnit(cloudUnits[n]), 30000, "Cloud read") : null;
        finalJson[n] = mergeUnitJson(n, syncBase.json[n]==null ? null : syncBase.json[n], sent[n]==null ? null : sent[n], theirs);
        merged.push(n);
      }
      if(!Object.keys(finalJson).length){ saveLocalSoon(); markSynced(); return; }
      const newUnits = Object.assign({}, cloudUnits);
      const oldEntries = [];
      const tag = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      Object.keys(finalJson).forEach(n=>{
        if(cloudUnits[n]) oldEntries.push(cloudUnits[n]);
        if(finalJson[n]==null) delete newUnits[n];
        else newUnits[n] = {h: hashStr(finalJson[n]), n: chunkString(finalJson[n], CHUNK_SIZE).length, t: tag};
      });
      // 2) upload the section contents
      await withTimeout(writeUnitChunks(finalJson, newUnits), 120000, "Upload");
      // 3) atomically point meta at them -- only if nobody changed those sections in the meantime
      let conflict = false, newRev = 0;
      await withTimeout(db.runTransaction(async tx=>{
        const s = await tx.get(syncCol().doc("meta"));
        const m = s.exists ? s.data() : {rev:0, units:{}};
        const cu = m.units || {};
        conflict = Object.keys(finalJson).some(n=>((cu[n]||{}).h) !== ((cloudUnits[n]||{}).h));
        if(conflict) return;
        // sections we didn't touch may have changed too -- keep the cloud's latest for those
        const out = Object.assign({}, cu);
        Object.keys(finalJson).forEach(n=>{ if(newUnits[n]) out[n] = newUnits[n]; else delete out[n]; });
        newRev = (m.rev||0) + 1;
        tx.set(syncCol().doc("meta"), {rev:newRev, schema:2, updatedBy:CLIENT_ID, updatedAt:firebase.firestore.FieldValue.serverTimestamp(), units:out});
      }), 30000, "Cloud save");
      if(conflict) continue; // someone saved the same section a moment ago -- go round again and merge with theirs
      // 4) success: remember what the cloud now has for these sections
      Object.keys(finalJson).forEach(n=>{
        if(finalJson[n]==null){ delete syncBase.json[n]; delete syncBase.hashes[n]; }
        else { syncBase.json[n] = finalJson[n]; syncBase.hashes[n] = newUnits[n].h; }
      });
      if(merged.length || Object.keys(finalJson).some(n=>finalJson[n]!==sent[n])){
        // fold merged results back into what's on screen, keeping anything typed while we were saving
        const now = unitsOf(DATA);
        let changed = false;
        Object.keys(finalJson).forEach(n=>{
          const cur = now[n]==null ? null : now[n];
          const res = cur===(sent[n]==null?null:sent[n]) ? finalJson[n] : mergeUnitJson(n, sent[n]==null?null:sent[n], cur, finalJson[n]);
          if(res!==cur){ setUnit(DATA, n, res); changed = true; }
        });
        if(changed){ DATA_VERSION++; renderSoon(); toast("Merged your changes with a teammate's"); }
      }
      forceNextSave = false;
      // clean up replaced section docs a bit later, so anyone mid-download of the previous version can finish
      setTimeout(()=>deleteOrphanChunks(oldEntries), 90000);
      saveLocalSoon();
      markSynced();
      // if anything else changed while we were saving, go again
      const again = hashesOf(unitsOf(DATA));
      if(Object.keys(again).some(n=>again[n]!==syncBase.hashes[n]) || Object.keys(syncBase.hashes).some(n=>!(n in again))) continue;
      return;
    }
    scheduleCloudSave(3000);
  }catch(e){
    console.warn("Cloud save failed", e);
    setOffline(e);
  }
}
function markSynced(){
  syncState.status = "synced"; syncState.lastSyncedAt = new Date(); syncState.error = ""; syncState.retryDelay = 15000;
  updateSyncBadge();
}
function hasUnsyncedChanges(){
  const h = hashesOf(unitsOf(DATA));
  return Object.keys(h).some(n=>h[n]!==syncBase.hashes[n]) || Object.keys(syncBase.hashes).some(n=>!(n in h));
}
function setOffline(e){
  if(!syncReady && LOCAL_IS_FRESH && authUser) showAuthGate("msg", "Couldn't load your store data yet" + (e && (e.code||e.message) ? ` (${e.code||e.message})` : "") + ". Retrying automatically…");
  syncState.status = "error";
  syncState.error = (e && (e.code || e.message)) ? String(e.code || e.message) : "unknown";
  updateSyncBadge();
  clearTimeout(syncState.retryTimer);
  syncState.retryTimer = setTimeout(()=>{ syncReady ? cloudSaveNow() : connectCloud(); }, syncState.retryDelay);
  syncState.retryDelay = Math.min(syncState.retryDelay*2, 120000);
}

/* ---------- receiving teammates' changes ---------- */
function applyRemoteMeta(meta){
  return enqueueSync(async()=>{
    for(let attempt=0; ; attempt++){
      try{ return await applyRemoteMetaNow(meta); }
      catch(e){
        // a teammate saved again while we were downloading -- grab the newest version list and retry
        if(String(e && e.message)!=="stale" || attempt>=4) throw e;
        await new Promise(r=>setTimeout(r, 400*(attempt+1)));
        const s = await withTimeout(syncCol().doc("meta").get(), 20000, "Cloud check");
        if(!s.exists) return false;
        meta = s.data();
      }
    }
  });
}
async function applyRemoteMetaNow(meta){
  const cloudUnits = meta.units || {};
  const names = [...new Set([...Object.keys(cloudUnits), ...Object.keys(syncBase.hashes)])]
    .filter(n=>((cloudUnits[n]||{}).h) !== syncBase.hashes[n]);
  if(!names.length) return false;
  const theirs = {};
  for(const n of names){
    theirs[n] = cloudUnits[n] ? await withTimeout(readUnit(cloudUnits[n]), 30000, "Cloud read") : null;
  }
  const mine = unitsOf(DATA);
  let changedScreen = false, needPush = false;
  names.forEach(n=>{
    const m = mine[n]==null ? null : mine[n];
    const b = syncBase.json[n]==null ? null : syncBase.json[n];
    let result;
    if(m===b) result = theirs[n];                       // no local edits here -> take theirs
    else if(m===theirs[n]) result = m;                  // same either way
    else { result = mergeUnitJson(n, b, m, theirs[n]); needPush = true; } // both edited -> merge
    if(result!==m){ setUnit(DATA, n, result); changedScreen = true; }
    if(theirs[n]==null){ delete syncBase.json[n]; delete syncBase.hashes[n]; }
    else { syncBase.json[n] = theirs[n]; syncBase.hashes[n] = cloudUnits[n].h; }
  });
  if(changedScreen){
    if(migrate(DATA)) needPush = true;
    DATA_VERSION++;
    renderSoon();
  }
  saveLocalSoon();
  if(needPush || hasUnsyncedChanges()) scheduleCloudSave(800);
  return changedScreen;
}
/* Don't redraw the page out from under someone who's typing (e.g. mid-count) -- wait until they pause. */
let renderPending = false, renderIdleTimer = null;
function isTyping(){
  const a = document.activeElement;
  return a && a!==document.body && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && document.getElementById('main') && document.getElementById('main').contains(a);
}
function renderSoon(){
  renderPending = true;
  clearTimeout(renderIdleTimer);
  if(!isTyping() && !document.querySelector('.modal-backdrop')){ renderPending = false; render(); return; }
  renderIdleTimer = setTimeout(renderSoon, 2500);
}

let metaUnsub = null, legacyUnsub = null;
function startCloudListener(){
  if(!window.db || metaUnsub) return;
  metaUnsub = syncCol().doc("meta").onSnapshot(snap=>{
    if(!snap.exists || snap.metadata.hasPendingWrites) return;
    applyRemoteMeta(snap.data()).then(changed=>{
      if(changed) toast("Updated with a teammate's changes");
      if(syncState.status!=="syncing" && !hasUnsyncedChanges()) markSynced();
    }).catch(e=>{ console.warn("Applying cloud update failed", e); });
  }, err=>{ console.warn("Cloud listener error", err); metaUnsub = null; setOffline(err); syncReady = false; });
  // Watch the OLD sync location too: if a device still running the old version saves there, its changes
  // won't reach anyone -- say so, so they know to refresh.
  if(legacyUnsub) return;
  try{
    let first = true, firstRev = null;
    legacyUnsub = db.collection(LEGACY_COL).doc('meta').onSnapshot(snap=>{
      const d = snap.exists ? snap.data() : null;
      if(first){ first = false; firstRev = d ? d.rev : null; return; }
      if(d && d.rev!==firstRev){ syncState.legacyWriter = true; updateSyncBadge(); }
    }, ()=>{});
  }catch(e){}
}

/* ---------- connecting / first run on this version ---------- */
async function loadLegacyCloud(){
  try{
    const metaSnap = await withTimeout(db.collection(LEGACY_COL).doc('meta').get(), 20000, "Old cloud check");
    if(!metaSnap.exists) return null;
    const meta = metaSnap.data();
    const gets = [];
    for(let i=0; i<meta.chunkCount; i++) gets.push(db.collection(LEGACY_COL).doc('chunk_'+i).get());
    const snaps = await withTimeout(Promise.all(gets), 60000, "Old cloud read");
    const parsed = JSON.parse(snaps.map(s=>{ const d = s.data(); return d ? d.data : ""; }).join(''));
    migrate(parsed);
    return parsed;
  }catch(e){ console.warn("Legacy cloud read failed", e); return null; }
}
async function loadAllUnits(meta){
  const out = {};
  const names = Object.keys(meta.units||{});
  const jsons = await withTimeout(Promise.all(names.map(n=>readUnit(meta.units[n]))), 90000, "Cloud download");
  names.forEach((n,i)=>out[n] = jsons[i]);
  return out;
}
function sameUnits(a, b){
  const ka = Object.keys(a), kb = Object.keys(b);
  return ka.length===kb.length && ka.every(k=>a[k]===b[k]);
}
let connecting = false;
async function connectCloud(){
  if(!window.db){ syncState.status = "nocloud"; updateSyncBadge(); return false; }
  if(connecting) return false;
  connecting = true;
  syncState.status = syncState.status==="error" ? "error" : "connecting"; updateSyncBadge();
  try{
    let metaSnap = await withTimeout(syncCol().doc("meta").get(), 20000, "Cloud check");
    const haveBase = Object.keys(syncBase.hashes).length > 0;
    if(metaSnap.exists && haveBase){
      // normal start: pull teammates' changes (merging with anything edited here while offline), then push ours
      syncReady = true;
      await applyRemoteMeta(metaSnap.data());
      if(hasUnsyncedChanges()) await cloudSaveNow(); else markSynced();
    } else if(metaSnap.exists){
      // first time this device runs the new version
      const cloudJson = await loadAllUnits(metaSnap.data());
      const localJson = unitsOf(DATA);
      let choice = "cloud";
      if(!sameUnits(localJson, cloudJson)){
        const legacy = await loadLegacyCloud();
        const localWasInSync = LOCAL_IS_FRESH || (legacy && sameUnits(localJson, unitsOf(legacy)));
        if(!localWasInSync) choice = await askWhichCopy(DATA, dataFromUnits(cloudJson), true);
        if(choice==="merge"){
          const baseUnits = legacy ? unitsOf(legacy) : {};
          const names = [...new Set([...Object.keys(localJson), ...Object.keys(cloudJson)])];
          const mergedUnits = {};
          names.forEach(n=>{ const r = mergeUnitJson(n, baseUnits[n]==null?null:baseUnits[n], localJson[n]==null?null:localJson[n], cloudJson[n]==null?null:cloudJson[n]); if(r!=null) mergedUnits[n] = r; });
          DATA = dataFromUnits(mergedUnits);
        } else if(choice==="cloud"){
          DATA = dataFromUnits(cloudJson);
        }
      } else { DATA = dataFromUnits(cloudJson); }
      migrate(DATA);
      syncBase = {json: Object.assign({}, cloudJson), hashes: hashesOf(cloudJson)};
      syncReady = true;
      DATA_VERSION++; render(); saveLocalSoon();
      if(hasUnsyncedChanges()) await cloudSaveNow(); else markSynced();
    } else {
      // very first device on the new version: carry the shared data over from the old sync
      const legacy = await loadLegacyCloud();
      if(legacy && !LOCAL_IS_FRESH && !sameUnits(unitsOf(DATA), unitsOf(legacy))){
        const choice = await askWhichCopy(DATA, legacy, false);
        if(choice==="cloud") DATA = legacy;
        else if(choice==="merge"){
          const l = unitsOf(DATA), c = unitsOf(legacy), mergedUnits = {};
          [...new Set([...Object.keys(l), ...Object.keys(c)])].forEach(n=>{ const r = mergeUnitJson(n, null, l[n]==null?null:l[n], c[n]==null?null:c[n]); if(r!=null) mergedUnits[n] = r; });
          DATA = dataFromUnits(mergedUnits);
        }
      } else if(legacy){ DATA = legacy; }
      if(!(DATA.inventory||[]).length && !Object.keys(DATA.overlooks||{}).length) throw new Error("No shared data found in the cloud, and this device has none to upload");
      migrate(DATA);
      syncBase = {json:{}, hashes:{}};
      syncReady = true; forceNextSave = true;
      DATA_VERSION++; render(); saveLocalSoon();
      await cloudSaveNow();
    }
    startCloudListener();
    connecting = false;
    if(document.getElementById('authGate') && document.getElementById('authGate').style.display!=="none" && authUser) showAuthGate("hidden");
    return true;
  }catch(e){
    console.warn("Cloud connect failed", e);
    connecting = false;
    setOffline(e);
    return false;
  }
}

/* One-time question when this device's saved copy differs from the shared copy and we can't tell which
   is right (e.g. a count that never made it to the cloud vs. a device that's just out of date). */
function copySummary(d){
  const reports = Object.keys(d.inventoryReports||{});
  const latestReport = reports.map(k=>d.inventoryReports[k]).sort((a,b)=>(a.generatedAt||"").localeCompare(b.generatedAt||"")).pop();
  const inv = d.inventory||[];
  const lastInvoice = (d.invoiceEntries||[]).map(e=>(e.date||"").slice(0,10)).filter(Boolean).sort().pop();
  const value = inv.reduce((s,p)=>s+num(p.closing)*num(p.cost),0);
  return {
    products: inv.length,
    counted: inv.filter(p=>num(p.closing)>0).length,
    value,
    snapshots: reports.length,
    latestSnapshot: latestReport ? `${latestReport.month} ${latestReport.year} (made ${latestReport.generatedAt ? new Date(latestReport.generatedAt).toLocaleDateString() : "?"})` : "none",
    invoiceLines: (d.invoiceEntries||[]).length,
    lastInvoice: lastInvoice || "none"
  };
}
function askWhichCopy(localData, cloudData, cloudIsShared){
  return new Promise(resolve=>{
    const L = copySummary(localData), C = copySummary(cloudData);
    const row = (label, a, b)=>`<tr><td>${label}</td><td style="${a!==b?'font-weight:700;':''}">${a}</td><td style="${a!==b?'font-weight:700;':''}">${b}</td></tr>`;
    const backdrop = document.createElement('div');
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
      <div class="modal-card" style="max-width:640px;">
        <h2>⚠️ This computer's data doesn't match the shared copy</h2>
        <div class="sub">The site's syncing was upgraded so everyone always sees the same data. Before switching over, pick which copy to keep. Differences are in <b>bold</b>. If you did a count or entered invoices on <b>this</b> computer that coworkers couldn't see, keep or combine this computer's copy.</div>
        <div class="tablewrap" style="max-height:none;margin-bottom:12px;"><table>
          <thead><tr><th></th><th>This computer</th><th>Shared copy (everyone)</th></tr></thead>
          <tbody>
            ${row("Products", L.products.toLocaleString(), C.products.toLocaleString())}
            ${row("Products with a count", L.counted.toLocaleString(), C.counted.toLocaleString())}
            ${row("Inventory value (counts × cost)", fmtUSD(L.value), fmtUSD(C.value))}
            ${row("Saved snapshots", L.snapshots, C.snapshots)}
            ${row("Newest snapshot", L.latestSnapshot, C.latestSnapshot)}
            ${row("Invoice lines", L.invoiceLines.toLocaleString(), C.invoiceLines.toLocaleString())}
            ${row("Latest invoice date", L.lastInvoice, C.lastInvoice)}
          </tbody></table></div>
        <div class="btnrow" style="flex-direction:column;align-items:stretch;gap:8px;">
          <button class="btn" id="wcBackup">⬇ First, download a backup of this computer's copy (recommended)</button>
          <button class="btn primary" id="wcCloud">Use the shared copy <span style="font-weight:400;">— this computer was just out of date</span></button>
          <button class="btn" id="wcMerge">Combine both <span style="font-weight:400;">— add this computer's changes into the shared copy</span></button>
          <button class="btn" id="wcLocal">Use this computer's copy <span style="font-weight:400;">— replaces the shared copy for everyone</span></button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);
    const done = c=>{ backdrop.remove(); resolve(c); };
    document.getElementById('wcBackup').onclick = ()=>{
      downloadTextFile(`station-manager-backup-this-computer-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(localData), "application/json");
      toast("Backup downloaded");
    };
    document.getElementById('wcCloud').onclick = ()=>done("cloud");
    document.getElementById('wcMerge').onclick = ()=>done("merge");
    document.getElementById('wcLocal').onclick = ()=>{
      if(!confirm("Replace the shared copy for everyone with this computer's copy?")) return;
      done("local");
    };
  });
}

/* ---------- status display ---------- */
function updateSyncBadge(){
  const el = document.getElementById('sidebarFoot');
  const t = syncState.lastSyncedAt ? syncState.lastSyncedAt.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}) : "";
  const labels = {
    connecting: "Connecting to shared data...",
    syncing: "↻ Syncing...",
    synced: "● Synced — everyone sees your changes" + (t ? ` (${t})` : ""),
    error: "⚠ NOT SYNCED — see red bar",
    nocloud: "Local data · saved in this browser"
  };
  if(el) el.textContent = labels[syncState.status] || labels.nocloud;
  let bar = document.getElementById('syncBar');
  const showErr = syncState.status==="error" || syncState.status==="nocloud";
  const err = (syncState.error||"").toLowerCase();
  const why = /permission|insufficient/.test(err) ? " The shared database is refusing access — its security rules may have expired (Firebase console → Firestore → Rules)."
    : /exhausted|quota/.test(err) ? " The shared database hit its free daily limit; it resets overnight."
    : syncState.status==="nocloud" ? " The sync service didn't load \u2014 no internet when the page opened, or a browser ad/privacy blocker is blocking gstatic.com / firestore.googleapis.com."
    : "";
  const msg = showErr
    ? `⚠ Not connected to the shared data — you're seeing this device's copy${t ? ` (last synced ${t})` : ""}.${why} Changes you make are saved here and will upload automatically when the connection is back. <button class="btn small" id="syncRetryBtn" style="margin-left:8px;">Retry now</button>`
    : (syncState.legacyWriter ? `⚠ Someone is using an old copy of this site — their changes aren't being shared. Have everyone close the site and reopen it (or refresh).` : "");
  if(!msg){ if(bar) bar.remove(); document.body.style.paddingTop = ""; return; }
  if(!bar){
    bar = document.createElement('div'); bar.id = "syncBar";
    bar.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:1002;background:var(--red);color:#fff;padding:9px 16px;font-size:13px;font-weight:600;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.25);";
    document.body.appendChild(bar);
  }
  bar.innerHTML = msg;
  document.body.style.paddingTop = bar.offsetHeight + "px";
  const rb = document.getElementById('syncRetryBtn');
  if(rb) rb.onclick = ()=>{ if(!window.db){ saveLocalNow().then(()=>location.reload()); return; } syncState.retryDelay = 15000; clearTimeout(syncState.retryTimer); syncReady ? cloudSaveNow() : connectCloud(); };
}
