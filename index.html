/* ===================== GENERIC "EMAIL THIS VIEW" HELPERS =====================
   Used by every plain "Email This View" button (Inventory sub-tabs, Station Operations).
   Monthly Reports has its own emailMonthlyReports() since it builds the text straight
   from report data instead of reading the live screen. */
function viewToPlainText(){
  const main = document.getElementById('main');
  if(!main) return "";
  const clone = main.cloneNode(true);
  const liveFields = Array.from(main.querySelectorAll('input, select, textarea'));
  const cloneFields = Array.from(clone.querySelectorAll('input, select, textarea'));
  liveFields.forEach((liveEl, i)=>{
    const cloneEl = cloneFields[i];
    if(!cloneEl) return;
    let text;
    if(liveEl.tagName === 'SELECT'){
      text = liveEl.options[liveEl.selectedIndex] ? liveEl.options[liveEl.selectedIndex].text : liveEl.value;
    } else if(liveEl.type === 'checkbox' || liveEl.type === 'radio'){
      text = liveEl.checked ? '\u2713' : '';
    } else {
      text = liveEl.value;
    }
    const span = document.createElement('span');
    span.textContent = text;
    cloneEl.replaceWith(span);
  });
  clone.querySelectorAll('.no-print, button, .toast').forEach(el=>el.remove());
  clone.style.cssText = 'position:absolute;left:-99999px;top:0;';
  document.body.appendChild(clone);
  const text = (clone.innerText || clone.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
  clone.remove();
  return text;
}
function emailCurrentView(){
  const heading = document.querySelector('#main h1');
  const subject = "DJ's Mini Mart \u2014 " + (heading ? heading.textContent.trim() : "Report");
  let body = viewToPlainText();
  const MAX_BODY = 6000;
  if(body.length > MAX_BODY){
    body = body.slice(0, MAX_BODY) + "\n\n...(truncated for email \u2014 use Print This View for the full copy)";
  }
  if(!body){ toast("Nothing here to email yet", true); return; }
  window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

/* ===================== COMPUTE: SALES ===================== */
function monthTotals(year, month){
  const md = DATA.overlooks[year][month];
  let store=0, gas=0, profit=0, daysWithData=0;
  md.daily.forEach(d=>{
    if(typeof d.store === "number"){ store += d.store; daysWithData++; }
    if(typeof d.gas === "number"){ gas += d.gas; }
  });
  // profit per day only when store present
  profit = 0;
  md.daily.forEach(d=>{ if(typeof d.store === "number") profit += d.store - num(d.gas); });
  const invoices = md.invoices.reduce((s,i)=>s+num(i.amount),0);
  const rebates = md.rebates.reduce((s,r)=>s+num(r.amount),0);
  const netProfit = profit + rebates - invoices;
  const goal = 0.30;
  const grossMargin = (profit+rebates) !== 0 ? netProfit/(profit+rebates) : 0;
  const markup = invoices !== 0 ? netProfit/invoices : 0;
  const maxPurchases = (profit+rebates)/(1+goal);
  const remaining = maxPurchases - invoices;
  const status = markup >= goal ? "On Track" : "Below Goal";
  const avgDaily = daysWithData ? store/daysWithData : 0;
  let avgProfit = 0;
  if(daysWithData){
    let sum=0; md.daily.forEach(d=>{ if(typeof d.store==="number") sum += d.store-num(d.gas); });
    avgProfit = sum/daysWithData;
  }
  return {store,gas,combined:store+gas,profit,invoices,rebates,netProfit,grossMargin,markup,goal,
          maxPurchases,remaining,status,daysWithData,avgDaily,avgProfit,
          priorYearProfit: md.prior_year_profit};
}

function yearTotals(year){
  let acc = {store:0,gas:0,combined:0,profit:0,invoices:0,rebates:0,netProfit:0};
  let monthsWithData = 0;
  MONTHS.forEach(m=>{
    const t = monthTotals(year, m);
    if(t.daysWithData>0){ monthsWithData++; }
    acc.store+=t.store; acc.gas+=t.gas; acc.combined+=t.combined; acc.profit+=t.profit;
    acc.invoices+=t.invoices; acc.rebates+=t.rebates; acc.netProfit+=t.netProfit;
  });
  const goal=0.30;
  acc.grossMargin = (acc.profit+acc.rebates)!==0 ? acc.netProfit/(acc.profit+acc.rebates) : 0;
  acc.markup = acc.invoices!==0 ? acc.netProfit/acc.invoices : 0;
  acc.monthsWithData = monthsWithData;
  return acc;
}

/* ===================== COMPUTE: FORECASTER ===================== */
function avgDailyProfitTable(){
  // returns {year: {month: avgProfit-or-null}}
  const out = {};
  Object.keys(DATA.overlooks).forEach(y=>{
    out[y] = {};
    MONTHS.forEach(m=>{
      const t = monthTotals(y,m);
      out[y][m] = t.daysWithData ? t.avgProfit : null;
    });
  });
  return out;
}

function getForecastYears(){
  const allYears = Object.keys(DATA.overlooks).sort();
  const thisYear = String(new Date().getFullYear());
  // a year is "complete" only if it's a past calendar year with data in most months --
  // the year in progress is never folded into the average, however many months it has
  const complete = allYears.filter(y=> y < thisYear && MONTHS.filter(m=>monthTotals(y,m).daysWithData>0).length>=10);
  const chosen = complete.slice(-5);
  return chosen.length ? chosen : allYears.filter(y=>y<thisYear).slice(-5);
}

function recommendedAction(month, alert){
  if(!alert) return "";
  return `Start reducing standing orders 2\u20133 weeks before ${month} to avoid excess overhead.`;
}

function getTrackerYear(years5){
  // the tracker follows the calendar: this year whenever it has any sales entered
  const thisYear = String(new Date().getFullYear());
  const hasData = y => DATA.overlooks[y] && MONTHS.some(m=>monthTotals(y,m).daysWithData>0);
  if(hasData(thisYear)) return thisYear;
  const partial = Object.keys(DATA.overlooks).sort().filter(y=> hasData(y) && !years5.includes(y));
  return partial.length ? partial[partial.length-1] : null;
}

function forecastAnalysis(){
  const table = avgDailyProfitTable();
  const years5 = getForecastYears();
  const rows = MONTHS.map((m,i)=>{
    const vals = years5.map(y=>table[y][m]).filter(v=>v!==null && v!==undefined);
    const avg5 = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
    return {month:m, idx:i, avg5};
  });
  rows.forEach((r,i)=>{
    const prev = i===0 ? rows[11].avg5 : rows[i-1].avg5;
    r.momDollar = (r.avg5!==null && prev!==null) ? r.avg5-prev : null;
    r.momPct = (r.momDollar!==null && prev) ? r.momDollar/prev : null;
  });
  // decline consistency per month across years5 (Jan compares to prior *year's* Dec)
  rows.forEach((r,i)=>{
    let declines=0, valid=0;
    years5.forEach(y=>{
      let cur = table[y][r.month];
      let prior;
      if(i===0){
        const py = String(parseInt(y)-1);
        prior = table[py] ? table[py]["December"] : null;
      } else {
        prior = table[y][MONTHS[i-1]];
      }
      if(cur!==null && cur!==undefined && prior!==null && prior!==undefined){
        valid++; if(cur<prior) declines++;
      }
    });
    r.consistency = valid ? declines/valid : null;
    r.declines = declines;
    r.validYears = valid;
    r.alert = r.consistency!==null && r.consistency>=0.6;
    r.action = recommendedAction(r.month, r.alert);
  });
  return rows;
}

/* ===================== COMPUTE: INVENTORY ===================== */
function inventoryStatus(par, closing){
  if(closing<=0) return "OUT";
  if(closing<par) return "LOW";
  return "OK";
}
/* Cigarette/tobacco margins run through a manufacturer buydown (a per-pack rebate from the
   distributor contract, entered in the Cig & Tobacco Buydowns tab) that isn't reflected in the
   product's own Cost field -- so any margin math that uses raw Cost for these categories looks
   artificially thin or even negative, even though the buydown makes the true margin healthy.
   Every margin/profit calculation in the app should go through this instead of num(p.cost)
   directly, so a tobacco product's margin always matches what the Buydowns tab shows. The Cost
   field itself, and "Cost Value" (closing qty priced at cost), intentionally stay at raw cost --
   only the margin/profit math is buydown-adjusted. */
function isBuydownCategory(category){
  const c = (category||"").toUpperCase();
  return c==="TOBACCO" || c==="CIGARETTES";
}
function effectiveCost(p){
  const cost = num(p.cost);
  return isBuydownCategory(p.category) ? cost - num(p.buydown) : cost;
}
function inventoryByCategoryCompute(products, receivedFn){
  const cats = {};
  products.forEach(p=>{
    const c = p.category || "Uncategorized";
    if(!cats[c]) cats[c] = {closingValue:0,salesValue:0,units:0,revenue:0,cogs:0,profit:0,count:0,sold:0,totalAvailable:0};
    const cost = effectiveCost(p);
    cats[c].closingValue += num(p.closing_value);
    cats[c].salesValue += num(p.sales_value);
    cats[c].units += num(p.closing);
    cats[c].revenue += num(p.retail)*num(p.sold);
    cats[c].cogs += cost*num(p.sold);
    cats[c].profit += (num(p.retail)-cost)*num(p.sold);
    cats[c].sold += num(p.sold);
    cats[c].totalAvailable += num(p.opening) + receivedFn(p);
    cats[c].count += 1;
  });
  Object.values(cats).forEach(c=>{
    c.margin = c.revenue!==0 ? c.profit/c.revenue : 0;
    c.sellThrough = c.totalAvailable!==0 ? c.sold/c.totalAvailable : 0;
  });
  return cats;
}
function inventoryTotalsCompute(cats){
  const t = {closingValue:0,salesValue:0,units:0,revenue:0,cogs:0,profit:0,sold:0,totalAvailable:0};
  Object.values(cats).forEach(c=>{
    t.closingValue+=c.closingValue; t.salesValue+=c.salesValue; t.units+=c.units;
    t.revenue+=c.revenue; t.cogs+=c.cogs; t.profit+=c.profit; t.sold+=c.sold; t.totalAvailable+=c.totalAvailable;
  });
  t.margin = t.revenue!==0 ? t.profit/t.revenue : 0;
  t.sellThrough = t.totalAvailable!==0 ? t.sold/t.totalAvailable : 0;
  return t;
}
function inventoryByCategory(){
  return inventoryByCategoryCompute(DATA.inventory, productReceived);
}
function inventoryTotals(){
  return inventoryTotalsCompute(inventoryByCategory());
}

function render(){
  if(purgeTrash()) saveQuiet();
  renderNav();
  const main = document.getElementById('main');
  main.innerHTML = "";
  if(currentRoute==="dashboard") renderDashboard(main);
  else if(currentRoute==="sales") renderSales(main);
  else if(currentRoute==="yoy") renderYoY(main);
  else if(currentRoute==="forecast") renderForecast(main);
  else if(currentRoute==="inventory") renderInventory(main);
  else if(currentRoute==="operations") renderStationOperations(main);
  else if(currentRoute==="sweep") renderSiteSweep(main);
  else if(currentRoute==="trash") renderTrash(main);
  else if(currentRoute==="data") renderDataMgmt(main);
}

function drawDashForecastChart(container, rows){
  const vals = rows.map(r=>r.avg5||0);
  const maxV = Math.max(1,...vals);
  const w=380,h=140,pad=20;
  const stepX = (w-pad*2)/(rows.length-1);
  let pts = rows.map((r,i)=>`${pad+i*stepX},${h-pad-((r.avg5||0)/maxV)*(h-pad*2)}`).join(" ");
  container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" class="chart" style="height:140px">
    <polyline points="${pts}" fill="none" stroke="var(--navy)" stroke-width="2"></polyline>
    ${rows.map((r,i)=>`<circle cx="${pad+i*stepX}" cy="${h-pad-((r.avg5||0)/maxV)*(h-pad*2)}" r="2.5" fill="${r.alert?'var(--red)':'var(--navy-light)'}"></circle>`).join("")}
  </svg>`;
}

function drawDashYoyChart(container, years){
  const totals = years.map(y=>({year:y, combined:yearTotals(y).combined}));
  const maxV = Math.max(1, ...totals.map(t=>t.combined));
  const w=380,h=140,pad=20,bw=(w-pad*2)/totals.length;
  let bars="";
  totals.forEach((t,i)=>{
    const x = pad+i*bw;
    const hgt = (t.combined/maxV)*(h-pad*2);
    bars += `<rect x="${x+2}" y="${h-pad-hgt}" width="${bw*0.7}" height="${hgt}" fill="${t.year===dashState.year?'var(--navy)':'var(--navy-lighter)'}"></rect>`;
  });
  container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" class="chart" style="height:140px">${bars}</svg>`;
}

function drawMonthlyBarChart(container, year){
  const data = MONTHS.map(m=>monthTotals(year,m));
  const maxV = Math.max(1, ...data.map(d=>Math.max(d.combined, d.netProfit)));
  const w=560,h=220,pad=28, bw = (w-pad*2)/12;
  let bars = "";
  data.forEach((d,i)=>{
    const x = pad + i*bw;
    const hCombined = (d.combined/maxV)*(h-pad*2);
    const hProfit = (d.netProfit/maxV)*(h-pad*2);
    bars += `<rect x="${x+2}" y="${h-pad-hCombined}" width="${bw*0.4}" height="${hCombined}" fill="#7BAFD4"></rect>`;
    bars += `<rect x="${x+2+bw*0.42}" y="${h-pad-Math.max(hProfit,0)}" width="${bw*0.4}" height="${Math.max(hProfit,0)}" fill="#4B9CD3"></rect>`;
    bars += `<text x="${x+bw/2}" y="${h-8}" font-size="9" text-anchor="middle" fill="#767676">${MONTHS[i].slice(0,3)}</text>`;
  });
  container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" class="chart">${bars}
    <text x="${pad}" y="14" font-size="10" fill="#7BAFD4">\u25a0 Combined Sales</text>
    <text x="${pad+120}" y="14" font-size="10" fill="#4B9CD3">\u25a0 Net Profit</text>
  </svg>`;
}

function buildYearPicker(yp, y, years){
  years.forEach(yr=>{
    const b = document.createElement('button');
    b.textContent = yr; b.className = yr===y?"active":"";
    b.onclick = ()=>{ salesState.year=yr; render(); };
    yp.appendChild(b);
  });
  const addYearBtn = document.createElement('button');
  addYearBtn.textContent = "+ Add Year";
  addYearBtn.style.borderStyle = "dashed";
  addYearBtn.onclick = ()=>{
    const nextYear = String(Math.max(...years.map(Number)) + 1);
    DATA.overlooks[nextYear] = {};
    MONTHS.forEach(mo=>{ DATA.overlooks[nextYear][mo] = {daily:[], invoices:[], rebates:[], prior_year_profit:null}; });
    persist(); toast(`${nextYear} added`); salesState.year = nextYear; salesState.month = "January"; render();
  };
  yp.appendChild(addYearBtn);
  const delYearBtn = document.createElement('button');
  delYearBtn.textContent = "\u2212 Delete Year";
  delYearBtn.className = "btn danger";
  delYearBtn.style.borderStyle = "dashed";
  delYearBtn.onclick = ()=>{
    if(years.length<=1){ toast("Can't delete the only year of data", true); return; }
    const monthsWithData = MONTHS.filter(mo=>{
      const md2 = DATA.overlooks[y][mo];
      return (md2.daily&&md2.daily.length) || (md2.invoices&&md2.invoices.length) || (md2.rebates&&md2.rebates.length);
    }).length;
    const warning = monthsWithData
      ? `${y} has data entered in ${monthsWithData} month${monthsWithData===1?"":"s"} (daily sales, invoices, and/or rebates). `
      : "";
    if(!confirm(`Delete all data for ${y}? ${warning}It will sit in the Trash until midnight tonight, then be gone for good. Press OK to confirm you intend to delete this year.`)) return;
    trashPut("year", `All sales data for ${y}`, DATA.overlooks[y], {year:y});
    delete DATA.overlooks[y];
    const remaining = Object.keys(DATA.overlooks).sort();
    salesState.year = remaining[remaining.length-1];
    salesState.month = "January";
    persist(); toast(`${y} deleted`); render();
  };
  yp.appendChild(delYearBtn);
}

/* Distinct, high-contrast colors so lines are easy to tell apart at a glance (was previously all shades of blue). */
const BLUE_PALETTE = ["#1C6EA4","#E67E22","#27AE60","#C0392B","#8E44AD","#D4AC0D","#16A085","#D35400","#2C3E50","#E84393"];

const METRIC_ACTIONS = {

  avgProfit: "This smooths out day-to-day noise \u2014 a weak year usually means fewer high-traffic days rather than one bad stretch. Compare staffing and hours during the weak year's slow months against the strong year's.",

function yoyGrid(){
  const years = Object.keys(DATA.overlooks).sort();
  const grid = {};
  MONTHS.forEach(m=>{
    grid[m] = {};
    years.forEach(y=>{ grid[m][y] = monthTotals(y,m); });
  });
  return {years, grid};
}

function yearlyMetricValue(year, key){
  if(key==="avgProfit"){
    const vals = MONTHS.map(m=>monthTotals(year,m)).filter(t=>t.daysWithData>0).map(t=>t.avgProfit);
    return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  }
  const t = yearTotals(year);
  if(t.monthsWithData===0 && key!=="invoices" && key!=="rebates") return null;
  return t[key];
}

function metricInsight(metric, years){
  const entries = years.map(y=>[y, yearlyMetricValue(y, metric.key)]).filter(([y,v])=>v!==null && v!==undefined);
  if(entries.length<2){
    return `Not enough complete years on file yet to compare ${metric.label.toLowerCase()} year over year.`;
  }
  const best = entries.reduce((a,b)=> b[1]>a[1]?b:a);
  const worst = entries.reduce((a,b)=> b[1]<a[1]?b:a);
  const first = entries[0], last = entries[entries.length-1];
  const trendPct = first[1] ? (last[1]-first[1])/Math.abs(first[1]) : null;
  const trendDir = trendPct===null ? "holding flat" : trendPct>0.03 ? "trending up" : trendPct<-0.03 ? "trending down" : "holding roughly steady";
  const diffPct = worst[1] ? Math.abs((best[1]-worst[1])/worst[1]) : null;
  const swing = diffPct!==null ? ` \u2014 a ${fmtPct(diffPct)} swing` : "";
  const partialNote = year=>{ const mo = yearTotals(year).monthsWithData; return mo<12 ? ` (only ${mo} of 12 months on file \u2014 not a full year, so treat this comparison with caution)` : ""; };
  return `What this shows: ${metric.label} for every complete year on file. Your strongest year was ${best[0]} at ${metric.fmt(best[1])}${partialNote(best[0])}, versus ${worst[0]} at ${metric.fmt(worst[1])}${partialNote(worst[0])}${swing}. Across the full history, the trend is ${trendDir}. ${METRIC_ACTIONS[metric.key]||""}`;
}

function multiMetricInsight(keys, years, intro){
  const parts = keys.map(k=>{
    const metric = YOY_METRICS.find(m=>m.key===k);
    const entries = years.map(y=>[y, yearlyMetricValue(y, k)]).filter(([y,v])=>v!==null && v!==undefined);
    if(entries.length<2) return `${metric.label} doesn't have enough complete years yet to compare`;
    const best = entries.reduce((a,b)=> b[1]>a[1]?b:a);
    const worst = entries.reduce((a,b)=> b[1]<a[1]?b:a);
    return `${metric.label} peaked in ${best[0]} at ${metric.fmt(best[1])} and was lowest in ${worst[0]} at ${metric.fmt(worst[1])}`;
  });
  return `${intro} ${parts.join("; ")}. Highlighted cells in the table mark each metric's own best year (Carolina blue) and worst year (navy).`;
}

/* ---------- Key Insights & Action Plan: phase classification ---------- */
function classifyPhase(r, bottomMonth){
  if(r.month===bottomMonth.month) return "Bottom of the cycle";
  if(r.idx===0 && r.alert) return "Post-holiday dip";
  if(!r.alert) return "Building season";
  return r.consistency>=0.75 ? "Confirmed slowdown" : "Continued decline";
}
const PHASE_TEXT = {
  "Post-holiday dip": r=>`Consistently down from December (${fmtPct(r.consistency)} of years). A short, sharp drop \u2014 not part of the main seasonal slowdown.`,
  "Building season": ()=>`Steady climb in most years. Grow orders in step with rising daily averages.`,
  "Confirmed slowdown": r=>`Averages ${fmtPct(r.consistency)} of years declining. This is where the seasonal pullback becomes unambiguous.`,
  "Continued decline": r=>`Averages ${fmtPct(r.consistency)} of years declining. Keep orders conservative through this stretch.`,
  "Bottom of the cycle": r=>`${fmtPct(r.consistency)} of years declining \u2014 the most predictable month in the whole dataset. Order light.`,
};
function seasonalCycleRows(rows){
  const validConsist = rows.filter(r=>r.consistency!==null && r.idx!==0); // exclude January from "bottom" candidacy — it's its own post-holiday dip, not the cycle's true bottom
  if(!validConsist.length) return [];
  const bottomMonth = validConsist.reduce((a,b)=> b.consistency>a.consistency ? b : a);
  const turnIdx = rows.findIndex((r,i)=> i>0 && r.alert);
  const withPhase = rows.map(r=>({...r, phase: classifyPhase(r, bottomMonth)}));
  // group consecutive months (calendar order, no year-wrap) sharing the same phase label
  const groups = [];
  withPhase.forEach(r=>{
    const last = groups[groups.length-1];
    if(last && last.phase===r.phase){ last.months.push(r); }
    else groups.push({phase:r.phase, months:[r]});
  });
  return groups.map(g=>{
    const period = g.months.length===1 ? g.months[0].month : `${g.months[0].month} \u2013 ${g.months[g.months.length-1].month}`;
    const repRow = g.months.reduce((a,b)=> (b.consistency||0)>(a.consistency||0) ? b : a, g.months[0]);
    return {period, phase:g.phase, text: PHASE_TEXT[g.phase] ? PHASE_TEXT[g.phase](repRow) : ""};
  });
}
function bottomLineText(rows, years5, peak, firstDecline){
  if(!peak || !firstDecline) return "Not enough complete years on file yet to identify a reliable seasonal pattern.";
  return `Plan to start scaling back orders by ${firstDecline.month} \u2014 in ${fmtPct(firstDecline.consistency)} of the last ${years5.length} years, daily sales were already trending down by then. Reorder more conservatively from that point through the winter low, then ramp back up heading into spring.`;
}

/* ---------- reusable multi-line chart with per-series high/low markers ---------- */
function drawLineChartMulti(container, {categories, series, height=260, yFmt}){
  const w = 800, h = height, padL=50, padR=16, padT=22, padB=28;
  const allVals = series.flatMap(s=>s.values.filter(v=>v!==null && v!==undefined));
  const fmt = yFmt || (v => Math.round(v).toLocaleString());
  // Auto-scale to the data's own range (instead of always forcing 0 into view) so
  // lines that live in a narrow band still use the full height of the chart, with
  // a little headroom top and bottom so points near the edge aren't clipped.
  let rawMax = allVals.length ? Math.max(...allVals) : 1;
  let rawMin = allVals.length ? Math.min(...allVals) : 0;
  if(rawMax===rawMin){ rawMax += 1; rawMin -= 1; }
  const rawRange = rawMax-rawMin;
  const cushion = rawRange*0.12;
  const maxV = rawMax+cushion;
  // Don't let the padding push the axis below 0 when every value in the chart
  // is already non-negative (dollar figures, percentages) - a negative gridline
  // there would be confusing, not helpful.
  const minV = (rawMin>=0 && rawMin-cushion<0) ? 0 : rawMin-cushion;
  const range = (maxV-minV)||1;
  const stepX = categories.length>1 ? (w-padL-padR)/(categories.length-1) : 0;
  const xFor = i => padL + i*stepX;
  const yFor = v => h-padB - ((v-minV)/range)*(h-padT-padB);

  // Gridlines + y-axis labels so the scale is readable, not just relative line position.
  let svg = "";
  const GRID_LINES = 4;
  for(let g=0; g<=GRID_LINES; g++){
    const v = minV + (range*g/GRID_LINES);
    const y = yFor(v);
    svg += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#E1E1E1" stroke-width="1"></line>`;
    svg += `<text x="${padL-6}" y="${y+3}" font-size="9" text-anchor="end" fill="#767676">${fmt(v)}</text>`;
  }

  series.forEach((s,si)=>{
    const color = s.color || BLUE_PALETTE[si % BLUE_PALETTE.length];
    const strokeWidth = s.width || 2.6;
    const dashAttr = s.dash ? ` stroke-dasharray="${s.dash}"` : "";
    const ptsArr = s.values.map((v,i)=> (v===null||v===undefined) ? null : [xFor(i), yFor(v)]);
    const pts = ptsArr.filter(Boolean).map(p=>p.join(",")).join(" ");
    svg += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="${strokeWidth}"${dashAttr}></polyline>`;
    ptsArr.forEach(p=>{ if(p) svg += `<circle cx="${p[0]}" cy="${p[1]}" r="2.8" fill="${color}"></circle>`; });
    let maxI=-1,minI=-1,maxVal=-Infinity,minVal=Infinity;
    s.values.forEach((v,i)=>{ if(v===null||v===undefined) return; if(v>maxVal){maxVal=v;maxI=i;} if(v<minVal){minVal=v;minI=i;} });
    if(maxI>=0) svg += `<circle cx="${xFor(maxI)}" cy="${yFor(maxVal)}" r="6" fill="none" stroke="var(--green)" stroke-width="2"></circle>`;
    if(minI>=0 && minI!==maxI) svg += `<circle cx="${xFor(minI)}" cy="${yFor(minVal)}" r="6" fill="none" stroke="var(--red)" stroke-width="2"></circle>`;
  });
  categories.forEach((c,i)=>{
    svg += `<text x="${xFor(i)}" y="${h-8}" font-size="9" text-anchor="middle" fill="#767676">${c}</text>`;
  });
  const legend = series.map((s,si)=>`<span style="display:inline-flex;align-items:center;gap:4px;margin-right:14px;font-size:11.5px;color:#767676;">
    <span style="width:10px;height:10px;background:${s.color||BLUE_PALETTE[si%BLUE_PALETTE.length]};display:inline-block;border-radius:2px;"></span>${s.label}</span>`).join("")
    + `<span style="font-size:11.5px;color:#767676;"><span style="color:var(--green);font-weight:700;">\u25cb</span> year high &nbsp; <span style="color:var(--red);font-weight:700;">\u25cb</span> year low</span>`;
  container.innerHTML = `<div style="margin-bottom:8px;">${legend}</div><svg viewBox="0 0 ${w} ${h}" class="chart" style="height:${h}px">${svg}</svg>`;
}

/* ---------- UNC-color high/low cell highlighting ---------- */
function hiLoClass(v, arr){
  if(v===null || v===undefined) return "";
  const nums = arr.filter(x=>x!==null && x!==undefined);
  if(nums.length<2) return "";
  const max = Math.max(...nums), min = Math.min(...nums);
  if(max===min) return "";
  if(v===max) return "hl-hi";
  if(v===min) return "hl-lo";
  return "";
}
const HL_LEGEND = `<div class="hl-legend"><span class="sw" style="background:var(--unc-hi);"></span>high &nbsp;&nbsp; <span class="sw" style="background:var(--unc-lo);"></span>low</div>`;

/* ---------- Records & Insights: best/worst value + which year/month + charts ---------- */
function renderYoyRecords(el){
  const {years, grid} = yoyGrid();

    let best=null, bestLoc=null, worst=null, worstLoc=null;

      const t = grid[m][y];
      if(t.daysWithData<=0) return;
      const v = t[metric.key];
      if(best===null || v>best){ best=v; bestLoc=`${m} ${y}`; }
      if(worst===null || v<worst){ worst=v; worstLoc=`${m} ${y}`; }
    }));
    return {metric, best, bestLoc, worst, worstLoc};

  el.innerHTML = `
    <div class="note">Best and worst single month on file for every metric, with exactly which month and year \u2014 and how each year stacks up.</div>

/* ---------- Monthly Seasonality: avg Net Store Revenue by calendar month, across all years ---------- */
function renderYoySeasonality(el){
  const {years, grid} = yoyGrid();
  const rows = MONTHS.map(m=>{
    const vals = years.map(y=>grid[m][y]).filter(t=>t.daysWithData>0).map(t=>t.profit);
    const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
    return {month:m, avg};
  });
  const peak = rows.reduce((a,b)=> (b.avg!==null && (a===null||b.avg>a.avg)) ? b : a, null);
  const trough = rows.reduce((a,b)=> (b.avg!==null && (a===null||b.avg<a.avg)) ? b : a, null);
  el.innerHTML = `
    <div class="note">Average Net Store Revenue for each calendar month, across every year on file.</div>
    <div class="card">
      <h2>Average Net Store Revenue by Month</h2>
      <div id="seasonChart"></div>
      <div id="seasonLineChart" style="margin-top:14px;"></div>
    </div>
    ${insightCard(`What this shows: the typical shape of your year, averaged across every year on file. ${peak?`${peak.month} is your strongest month on average (${fmtUSD(peak.avg)}/mo)`:""}${trough?`, and ${trough.month} is your weakest (${fmtUSD(trough.avg)}/mo)`:""}. Use this as your seasonal baseline \u2014 staff up and order more ahead of ${peak?peak.month:"your peak"}, and plan leaner ordering and labor going into ${trough?trough.month:"your slow season"}. See the Forecaster tab for exactly which months show a reliable month-over-month decline.`)}
    <div class="card">
      ${HL_LEGEND}
      <div class="tablewrap"><table>
        <thead><tr><th>Month</th><th>Average Net Store Revenue</th></tr></thead>
        <tbody>${rows.map(r=>{
          const cls = hiLoClass(r.avg, rows.map(x=>x.avg));
          return `<tr><td>${r.month}</td><td class="${cls}">${r.avg!==null?fmtUSD(r.avg):"\u2014"}</td></tr>`;
        }).join("")}</tbody>
      </table></div>
    </div>
  `;
  const container = document.getElementById('seasonChart');
  const maxV = Math.max(1, ...rows.map(r=>r.avg||0));
  const w=760,h=220,pad=30,bw=(w-pad*2)/12;
  let bars="";
  rows.forEach((r,i)=>{
    const x = pad+i*bw;
    const hgt = ((r.avg||0)/maxV)*(h-pad*2);
    const isPeak = peak && r.month===peak.month, isTrough = trough && r.month===trough.month;
    bars += `<rect x="${x+3}" y="${h-pad-hgt}" width="${bw*0.7}" height="${hgt}" fill="${isPeak?'var(--green)':isTrough?'var(--red)':'var(--gold)'}"></rect>`;
    bars += `<text x="${x+bw/2}" y="${h-8}" font-size="9" text-anchor="middle" fill="#767676">${r.month.slice(0,3)}</text>`;
  });
  container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" class="chart">${bars}</svg>`;
  drawLineChartMulti(document.getElementById('seasonLineChart'), {
    categories: MONTHS.map(m=>m.slice(0,3)),
    series: [{label:"Avg Net Store Revenue", color:"#1C6EA4", values: rows.map(r=>r.avg)}],
    height: 200,
    yFmt: fmtUSD0
  });
}

function monthEndKey(year, month){ return year + "-" + month; }
function generateMonthlyReport(year, month, periodType){
  const key = monthEndKey(year, month);
  DATA.inventoryReports[key] = {
    year, month,
    periodType: periodType || "monthly",
    generatedAt: new Date().toISOString(),
    products: JSON.parse(JSON.stringify(DATA.inventory))
  };
  persist();
  return DATA.inventoryReports[key];
}

/* Fiscal year runs November 1 - October 31 (FY label = calendar year it ends in). */
const FISCAL_QUARTERS = [
  {q:1, endMonth:"January", months:["November","December","January"]},
  {q:2, endMonth:"April", months:["February","March","April"]},
  {q:3, endMonth:"July", months:["May","June","July"]},
  {q:4, endMonth:"October", months:["August","September","October"], yearEnd:true}
];
function currentFiscalYear(d){
  const m = d.getMonth(); // 0=Jan ... 10=Nov, 11=Dec
  return (m>=10) ? d.getFullYear()+1 : d.getFullYear();
}
function currentFiscalQuarter(d){
  const m = d.getMonth();
  if(m===10||m===11||m===0) return 1;
  if(m>=1&&m<=3) return 2;
  if(m>=4&&m<=6) return 3;
  return 4;
}

/* Category names in the Product List are UPPERCASE (GROCERY, SODA...), but invoices and the add forms
   let people type "Grocery" or "soda ". Without this, a product typed as "Grocery" became its own
   separate category -- it showed up on a different Count Sheet page / filter than everything else, so
   it looked like it never got added. Always resolve a typed category to the existing one. */
function canonCategory(c){
  const t = String(c||"").replace(/\s+/g,' ').trim();
  if(!t) return "Uncategorized";
  const existing = DATA.inventory.find(p=>normName(p.category)===normName(t));
  return existing ? existing.category : t.toUpperCase();
}
function findProduct(name, unit, category){
  const n = normName(name), u = normUnit(unit);
  const sameNameUnit = DATA.inventory.filter(x=>normName(x.name)===n && normUnit(x.unit)===u);
  if(sameNameUnit.length<=1 || !category) return sameNameUnit[0] || null;
  const c = normName(category);
  return sameNameUnit.find(x=>normName(x.category)===c) || sameNameUnit[0];
}
function newProductUid(){ return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
/* Adds a product to the master list (which feeds Product List, Received Log, Inventory Count and the
   Count Sheet). It's inserted right after the last product in the same category instead of at the very
   end of the list, so it shows up with its category everywhere. */
function addProductRecord(fields){
  const category = canonCategory(fields.category);
  const nextNum = Math.max(0, ...DATA.inventory.map(pp=>pp.num||0)) + 1;
  const p = {num:nextNum, uid:newProductUid(), name:String(fields.name||"").trim(), category, unit:String(fields.unit||"").trim(),
    par:num(fields.par), closing:0, sold:0, cost:num(fields.cost), retail:num(fields.retail), closing_value:0, sales_value:0,
    status:"\ud83d\udd34 OUT OF STOCK", opening:0, received_qty:0, notes:"", buydown:0, multipack_qty:null, multipack_deal_price:null,
    addedAt:new Date().toISOString()};
  let lastIdx = -1;
  DATA.inventory.forEach((x,i)=>{ if(x.category===category) lastIdx = i; });
  if(lastIdx>=0) DATA.inventory.splice(lastIdx+1, 0, p); else DATA.inventory.push(p);
  return p;
}
function isNewProduct(p){
  if(!p || !p.addedAt) return false;
  return (Date.now() - new Date(p.addedAt).getTime()) < 45*24*3600*1000;
}
function newBadge(p){ return isNewProduct(p) ? ' <span class="pill ok" style="font-size:10px;" title="Added '+new Date(p.addedAt).toLocaleDateString()+'">NEW</span>' : ''; }
function ensureProduct(name, category, unit, cost, retail){
  // Match on name + unit (ignoring capitalization/extra spaces) so products that share a name but come
  // in different sizes (e.g. Milwaukee's Best Light 4pk / 15pk / 24pk) stay as separate records, and
  // "Pepsi 20oz" typed as "pepsi 20oz" doesn't create a duplicate.
  const p = findProduct(name, unit, category);
  if(p) return p;
  return addProductRecord({name, category, unit, cost, retail});
}

/* Invoice lines are matched to products ignoring capitalization/extra spaces -- invoices are typed with
   "Grocery"/"Soda" while the Product List uses GROCERY/SODA, and an exact match missed those lines. The
   lookup index is rebuilt whenever data changes (DATA_VERSION bumps on every save / teammate update). */
let DATA_VERSION = 0;
let _receivedIndex = null, _receivedIndexSig = null;
function receivedIndex(){
  const sig = DATA_VERSION + "|" + DATA.invoiceEntries.length;
  if(_receivedIndex && _receivedIndexSig===sig && _receivedIndex.src===DATA.invoiceEntries) return _receivedIndex.map;
  const map = new Map();
  DATA.invoiceEntries.forEach(e=>{
    if(e.reconciled) return;
    const k = normName(e.name);
    if(!map.has(k)) map.set(k, []);
    map.get(k).push(e);
  });
  _receivedIndex = {map, src:DATA.invoiceEntries};
  _receivedIndexSig = sig;
  return map;
}
function productReceived(p){
  const list = receivedIndex().get(normName(p.name)) || [];
  const pc = normName(p.category), pu = normUnit(p.unit);
  const live = list.filter(e=>(!e.category || normName(e.category)===pc) && (!e.unit || normUnit(e.unit)===pu))
    .reduce((s,e)=>s+num(e.qty),0);
  return live > 0 ? live : num(p.received_qty);
}
function productTotalAvailable(p){ return num(p.opening) + productReceived(p); }
function productUnitsSold(p){ return productTotalAvailable(p) - num(p.closing); }

/* ---------- Distributor Variance (Invoiced $ vs Sold $, by distributor) ---------- */
let distVarState = {threshold:10, dateFrom:"", dateTo:""};
function distributorVarianceRows(threshold, dateFrom, dateTo){
  const inRange = e=>{
    if(!dateFrom && !dateTo) return true;
    const d = (e.date||"").slice(0,10);
    if(!d) return false;
    if(dateFrom && d < dateFrom) return false;
    if(dateTo && d > dateTo) return false;
    return true;
  };
  const byDist = {};
  DATA.invoiceEntries.filter(e=>!e.reconciled).filter(inRange).forEach(e=>{
    const d = (e.distributor||"").trim() || "(No distributor listed)";
    if(!byDist[d]) byDist[d] = {distributor:d, invoiced:0, products:new Map()};
    byDist[d].invoiced += num(e.total);
    const key = e.name+"\u0001"+(e.category||"")+"\u0001"+(e.unit||"");
    if(!byDist[d].products.has(key)) byDist[d].products.set(key, {name:e.name, category:e.category||"", unit:e.unit||""});
  });
  const rows = Object.values(byDist).map(g=>{
    let sold = 0, units = 0, matched = 0;
    g.products.forEach(ref=>{
      const p = DATA.inventory.find(x=>x.name===ref.name && (x.category||"")===ref.category && (x.unit||"")===ref.unit);
      if(p){
        const u = productUnitsSold(p);
        sold += u*num(p.retail);
        units += u;
        matched++;
      }
    });
    const gap = g.invoiced - sold;
    const gapPct = sold>0 ? (gap/sold)*100 : (g.invoiced>0 ? 100 : 0);
    return {distributor:g.distributor, invoiced:g.invoiced, sold, gap, gapPct,
      productCount:g.products.size, matched, units, flagged: gapPct > threshold};
  }).sort((a,b)=> b.gapPct - a.gapPct);
  return rows;
}

  const flaggedCount = rows.filter(r=>r.flagged).length;

    <div class="note" style="margin-top:-6px;">Reconciled invoices are excluded automatically. Use the date filters below only if you want to look at a specific window instead of the current pending period.</div>

        <div><label>To date (optional)</label><input id="dvTo" type="date" value="${distVarState.dateTo||""}"></div>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="lbl">Total Invoiced</div><div class="val">${fmtUSD0(totalInvoiced)}</div></div>
      <div class="kpi"><div class="lbl">Total Sold (matched products)</div><div class="val">${fmtUSD0(totalSold)}</div></div>

  document.getElementById('drFrom').onchange = e=>{ distReportState.fromKey = e.target.value; renderDistributorVariance(el); };

    btn.onclick = ()=>{ distReportState.expanded = distReportState.expanded===btn.dataset.dist ? null : btn.dataset.dist; renderDistributorVariance(el); };
  });
  const drGenBtn = document.getElementById('drGenerateBtn');
  if(drGenBtn) drGenBtn.onclick = ()=>{
    const rep = generateDistributorReport(distReportState.distributorFilter, distReportState.fromKey, distReportState.toKey, num(distReportState.threshold));
    if(rep.error){ toast(rep.error, true); return; }
    toast(`Distributor report generated \u2014 saved under Inventory \u2192 Monthly Reports \u2192 Distributor Report`);
    invSubTab = "monthlyReports";
    monthlyReportsState.reportType = "distributor";

/* ---------- Distributor Period Reports (movement + invoice justification between two counts) ----------
   Shared by the Distributor Variance tab (generate inline) and Inventory > Monthly Reports > Distributor
   Report (pick a report type, generate/populate from there, and browse saved reports) -- same underlying
   functions power both entry points, and this is the pattern any future report type should follow: a
   pure "analysis" function, a "generate & save" function that freezes the analysis into DATA, and a
   shared results renderer used by the live view, the saved-report detail view, and printing. */
let distReportState = {fromKey:"", toKey:"live", distributorFilter:"ALL", threshold:40, expanded:null};
/* Picks a sensible starting/ending count automatically -- but only fills in fromKey while it's
   still blank, so it re-defaults the first time saved counts become available (e.g. you opened this
   tab before generating July/August/September, then came back after generating them) without ever
   clobbering a count you already picked yourself. */
function initDistReportStateDefaults(reportKeys){
  if(distReportState.fromKey) return;
  if(reportKeys.length>=2){
    distReportState.fromKey = reportKeys[reportKeys.length-2];
    distReportState.toKey = reportKeys[reportKeys.length-1];
  } else if(reportKeys.length===1){
    distReportState.fromKey = reportKeys[0];
    if(!distReportState.toKey) distReportState.toKey = "live";
  }
}
/* The date a report's period actually ENDS on -- the last day of its labeled month/year -- as
   opposed to generatedAt, which is just whenever the Generate Report button happened to get
   clicked. Those two are only the same if you generate a report the instant a count finishes;
   generate July/August/September back-to-back in one sitting (normal, especially catching up on
   record-keeping) and every report's generatedAt collapses to nearly the same moment, which broke
   period-window matching entirely. The label (month + year) is what the person actually meant the
   report to represent, so that's the trustworthy anchor -- generatedAt is kept only as an FYI in
   the label text. */
function inventoryReportAsOfDate(key){
  const r = DATA.inventoryReports[key];
  if(!r) return "";
  const mIdx = MONTHS.indexOf(r.month);
  const y = parseInt(r.year);
  if(mIdx<0 || !y) return (r.generatedAt||"").slice(0,10); // fallback if month/year are missing somehow
  const lastDay = new Date(y, mIdx+1, 0); // day 0 of next month = last day of this month
  return lastDay.getFullYear() + "-" + String(lastDay.getMonth()+1).padStart(2,'0') + "-" + String(lastDay.getDate()).padStart(2,'0');
}
function inventoryReportKeysSorted(){
  return Object.keys(DATA.inventoryReports).sort((a,b)=> inventoryReportAsOfDate(a).localeCompare(inventoryReportAsOfDate(b)));
}
function inventoryReportLabel(key){
  const r = DATA.inventoryReports[key];
  if(!r) return key;
  const type = r.periodType || "monthly";
  const typeTag = type==="year-end" ? " (Year-End)" : type==="quarterly" ? " (Quarterly)" : "";
  const asOf = inventoryReportAsOfDate(key);
  const asOfLabel = asOf ? new Date(asOf+"T00:00:00").toLocaleDateString() : "";
  const genDt = r.generatedAt ? new Date(r.generatedAt).toLocaleDateString() : "";
  return `${r.month} ${r.year}${typeTag}${asOfLabel ? ` \u2014 as of ${asOfLabel}` : ""}${genDt && genDt!==asOfLabel ? ` (generated ${genDt})` : ""}`;
}
function snapshotProductKey(p){ return p.name+"\u0001"+(p.category||"")+"\u0001"+(p.unit||""); }
function snapshotProductMap(products){
  const m = new Map();
  (products||[]).forEach(p=>m.set(snapshotProductKey(p), p));
  return m;
}
function distributorNamesKnown(){
  return [...new Set(DATA.invoiceEntries.map(e=>(e.distributor||"").trim()).filter(Boolean))].sort();
}
function localTodayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0'); }
function periodBounds(fromKey, toKey){
  const fromReport = fromKey && DATA.inventoryReports[fromKey] ? DATA.inventoryReports[fromKey] : null;
  const toIsLive = !toKey || toKey==="live";
  const toReport = !toIsLive && DATA.inventoryReports[toKey] ? DATA.inventoryReports[toKey] : null;
  const fromDate = fromReport ? inventoryReportAsOfDate(fromKey) : "";
  const toDate = toReport ? inventoryReportAsOfDate(toKey) : localTodayStr();
  return {
    fromDate, toDate,
    fromProducts: fromReport ? fromReport.products : null,
    toProducts: toReport ? toReport.products : DATA.inventory,
    fromLabel: fromReport ? inventoryReportLabel(fromKey) : "",
    toLabel: toReport ? inventoryReportLabel(toKey) : "Most Recent Count \u2014 current counts (" + new Date().toLocaleDateString() + ")"
  };
}
/* ---- Pricing consistency check: flags products whose price/margin looks out of line with peers ----
   Two independent checks, either of which can flag a product:
   1) "Same item, different price": another product with the same normalized name AND the same
      size/unit has a different retail price (e.g. Pepsi 20oz at $2.79 in one listing, $2.59 in
      another). This is the literal duplicate-listing case -- could be an intentional promo price,
      but it's always worth a second look, so it's flagged either way.
   2) "Margin outlier": the product's own margin is well outside the typical margin for its category
      (needs at least 4 products in that category to make "typical" meaningful). Catches a price
      that's simply stale or mistyped even when there's no duplicate listing to compare against. */
function normName(s){ return (s||"").toLowerCase().replace(/\s+/g,' ').trim(); }
function normUnit(s){ return (s||"").toLowerCase().replace(/\s+/g,' ').trim(); }
const MARGIN_OUTLIER_THRESHOLD = 0.15; // 15 percentage points off the category's median margin
function computePricingFlags(products){
  const flags = new Map(); // snapshotProductKey -> {detail}
  const addDetail = (p, text)=>{
    const key = snapshotProductKey(p);
    const existing = flags.get(key);
    flags.set(key, {detail: existing ? existing.detail + " Also: " + text : text});
  };
  const byNameUnit = new Map();
  products.forEach(p=>{
    const k = normName(p.name)+"\u0001"+normUnit(p.unit);
    if(!byNameUnit.has(k)) byNameUnit.set(k, []);
    byNameUnit.get(k).push(p);
  });
  byNameUnit.forEach(group=>{
    if(group.length<2) return;
    const prices = group.map(p=>num(p.retail));
    let maxP = prices[0], minP = prices[0];
    prices.forEach(p=>{ if(p>maxP) maxP=p; if(p<minP) minP=p; }); // manual loop -- avoids a stack overflow via spread on a large group
    if(maxP - minP > 0.01){
      group.forEach(p=>{
        addDetail(p, `Priced at ${fmtUSD(p.retail)}, but ${group.length-1} other listing(s) of "${p.name}"${p.unit?` (${p.unit})`:""} range ${fmtUSD(minP)}\u2013${fmtUSD(maxP)}.`);
      });
    }
  });
  const byCat = new Map();
  products.forEach(p=>{
    const retail = num(p.retail);
    if(retail<=0) return;
    const margin = (retail-effectiveCost(p))/retail; // buydown-adjusted for tobacco/cigarettes -- see effectiveCost()
    const c = p.category || "Uncategorized";
    if(!byCat.has(c)) byCat.set(c, []);
    byCat.get(c).push({p, margin});
  });
  byCat.forEach(list=>{
    if(list.length<4) return;
    const margins = list.map(x=>x.margin).sort((a,b)=>a-b);
    const median = margins[Math.floor(margins.length/2)];
    list.forEach(({p,margin})=>{
      if(Math.abs(margin-median) > MARGIN_OUTLIER_THRESHOLD){
        addDetail(p, `Margin ${fmtPct(margin)} vs. the ${p.category} category's typical ${fmtPct(median)} (retail ${fmtUSD(p.retail)}, cost ${fmtUSD(p.cost)}).`);
      }
    });
  });
  return flags;
}
/* Groups a distributor's invoice line items back into whole invoices (by invoice #) and returns
   them oldest-first, so amounts can be read as a timeline instead of one lump sum. */
function invoiceTrend(invoices){
  if(invoices.length<2){
    return {label: invoices.length===1 ? "Only one invoice in this window \u2014 not enough yet to show a trend." : "No invoices in this window.", direction:"flat"};
  }
  const mid = Math.ceil(invoices.length/2);
  const firstHalf = invoices.slice(0, mid);
  const secondHalf = invoices.slice(mid);
  const avg = arr => arr.reduce((s,x)=>s+x.total,0)/arr.length;
  const a1 = avg(firstHalf);
  const a2 = secondHalf.length ? avg(secondHalf) : a1;
  const changePct = a1>0 ? ((a2-a1)/a1)*100 : (a2>0?100:0);
  const direction = changePct>10 ? "up" : changePct<-10 ? "down" : "flat";
  const arrow = direction==="up" ? "\u2191" : direction==="down" ? "\u2193" : "\u2192";
  const word = direction==="up" ? "Trending up" : direction==="down" ? "Trending down" : "Holding roughly flat";
  return {
    label: `${arrow} ${word} \u2014 early invoices averaged ${fmtUSD(a1)}, later ones averaged ${fmtUSD(a2)} (${changePct>=0?"+":""}${changePct.toFixed(0)}%).`,
    direction, changePct
  };
}
/* For each distributor with invoice activity in the window between two counts: every invoice they
   sent (so you can see the $ trend), full detail on what moved and what didn't (priced at cost so
   it's comparable to invoiced $), total retail sales and profit those products generated, and any
   products priced out of line with a peer -- see computePricingFlags() above. */
function distributorPeriodAnalysis(distributorFilter, fromKey, toKey, threshold){
  const pb = periodBounds(fromKey, toKey);
  if(!pb.fromProducts) return {rows:[], fromLabel:pb.fromLabel, toLabel:pb.toLabel, error:"Pick a starting count (the beginning of the period) above to compare against \u2014 e.g. your July count."};
  const fromMap = snapshotProductMap(pb.fromProducts);
  const toMap = snapshotProductMap(pb.toProducts);
  const pricingFlags = computePricingFlags(pb.toProducts);
  const entries = DATA.invoiceEntries.filter(e=>{
    const d = (e.date||"").slice(0,10);
    if(!d) return false;
    if(pb.fromDate && d < pb.fromDate) return false;
    if(pb.toDate && d > pb.toDate) return false;
    if(distributorFilter && distributorFilter!=="ALL" && (e.distributor||"").trim()!==distributorFilter) return false;
    return true;
  });
  const byDist = {};
  entries.forEach(e=>{
    const d = (e.distributor||"").trim() || "(No distributor listed)";
    if(!byDist[d]) byDist[d] = {distributor:d, invoiced:0, products:new Map(), invoices:new Map()};
    byDist[d].invoiced += num(e.total);
    const key = snapshotProductKey(e);
    if(!byDist[d].products.has(key)) byDist[d].products.set(key, {name:e.name, category:e.category||"", unit:e.unit||"", received:0});
    byDist[d].products.get(key).received += num(e.qty);
    const invKey = e.invoice || ("(no invoice #) "+(e.date||""));
    if(!byDist[d].invoices.has(invKey)) byDist[d].invoices.set(invKey, {invoice: e.invoice || "(no invoice #)", date: e.date||"", total:0});
    const inv = byDist[d].invoices.get(invKey);
    inv.total += num(e.total);
    if(e.date && (!inv.date || e.date < inv.date)) inv.date = e.date;
  });
  const rows = Object.values(byDist).map(g=>{
    const productRows = [];
    g.products.forEach((ref, key)=>{
      const toP = toMap.get(key);
      if(!toP) return; // can't tell what's on hand at period end without a matching product there
      const fromP = fromMap.get(key);
      const fromClosing = fromP ? num(fromP.closing) : 0;
      const toClosing = num(toP.closing);
      const sold = fromClosing + ref.received - toClosing;
      // buydown-adjusted for tobacco/cigarettes so COGS and margin here match the Buydowns tab -- see effectiveCost()
      const cost = effectiveCost({cost: toP.cost || (fromP&&fromP.cost) || 0, category: toP.category || ref.category, buydown: toP.buydown ?? (fromP&&fromP.buydown) ?? 0});
      const retail = num(toP.retail || (fromP&&fromP.retail) || 0);
      const margin = retail>0 ? (retail-cost)/retail : 0;
      productRows.push({name:ref.name, category:ref.category, unit:ref.unit, received:ref.received, sold, onHand:toClosing,
        cost, retail, margin, soldCost:sold*cost, soldRetail:sold*retail, flag: pricingFlags.get(key)||null});
    });
    productRows.sort((a,b)=>b.sold-a.sold);
    const cogsSold = productRows.reduce((s,p)=>s+p.soldCost,0);
    const revenue = productRows.reduce((s,p)=>s+p.soldRetail,0);
    const unitsSold = productRows.reduce((s,p)=>s+p.sold,0);
    const profit = revenue - cogsSold;
    const marginPct = revenue>0 ? profit/revenue : 0;
    const fastest = productRows.filter(p=>p.sold>0);
    const notMoving = productRows.filter(p=>p.sold<=0).sort((a,b)=>a.sold-b.sold);
    const flaggedProducts = productRows.filter(p=>p.flag);
    const invoices = Array.from(g.invoices.values()).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    const trend = invoiceTrend(invoices);
    const excess = g.invoiced - cogsSold;
    const excessPct = cogsSold>0 ? (excess/cogsSold)*100 : (g.invoiced>0 ? 100 : 0);
    return {
      distributor:g.distributor, invoiced:g.invoiced, cogsSold, revenue, profit, marginPct, unitsSold,
      excess, excessPct, flagged: excessPct>threshold,
      productCount:g.products.size, matched:productRows.length,
      fastest, notMoving, allProducts:productRows, flaggedProducts,
      invoices, invoiceCount: invoices.length, trend
    };
  }).sort((a,b)=>b.excessPct-a.excessPct);
  return {rows, fromLabel:pb.fromLabel, toLabel:pb.toLabel};
}
/* Freezes the current analysis into DATA.distributorReports, same idea as generateMonthlyReport()
   freezing an inventory snapshot -- once generated, a report stays put even if counts/invoices change later. */
function generateDistributorReport(distributorFilter, fromKey, toKey, threshold){
  const analysis = distributorPeriodAnalysis(distributorFilter, fromKey, toKey, threshold);
  if(analysis.error) return {error: analysis.error};
  const id = "dr_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  DATA.distributorReports[id] = {
    id,
    generatedAt: new Date().toISOString(),
    fromKey, toKey,
    fromLabel: analysis.fromLabel, toLabel: analysis.toLabel,
    distributorFilter: distributorFilter||"ALL",
    threshold: num(threshold),
    rows: analysis.rows
  };
  persist();
  return DATA.distributorReports[id];
}

/* ---------- Office Report (book-to-physical reconciliation by category) ----------
   Beginning Book (starting count's cost value) + Purchases (invoiced during the window) = Ending
   Book, compared against Physical Count (ending count's cost value). Variance = Physical Count -
   Ending Book -- negative means less on the shelf than the books say (shrink), positive means more
   than expected. Uses the same fromKey/toKey/"live" period picking as Distributor Reports
   (periodBounds), so "most current count" always means whatever was picked in the To dropdown. */
let officeReportState = {fromKey:"", toKey:"live", expanded:null, mode:"compare", snapKey:"live", cmpCat:"ALL", cmpChangedOnly:false, cmpSearch:""};
function initOfficeReportStateDefaults(reportKeys){
  if(officeReportState.fromKey && (DATA.inventoryReports[officeReportState.fromKey])) return;
  const d = latestCountDefaults(reportKeys);
  officeReportState.fromKey = d.fromKey;
  officeReportState.toKey = d.toKey;
}
/* "Most recent count" = the live counts in Inventory Count, unless they're exactly what the newest saved
   snapshot already captured -- then that snapshot IS the most recent count. The starting point defaults to
   the saved count just before it (e.g. July when the most recent is September). */
function snapshotMatchesLive(key){
  const r = DATA.inventoryReports[key];
  if(!r || !Array.isArray(r.products)) return false;
  const m = new Map(r.products.map(p=>[normName(p.name)+"||"+normUnit(p.unit), num(p.closing)]));
  let diffs = 0;
  DATA.inventory.forEach(p=>{
    const k = normName(p.name)+"||"+normUnit(p.unit);
    if(!m.has(k) ? num(p.closing)!==0 : m.get(k)!==num(p.closing)) diffs++;
  });
  return diffs===0;
}
function latestCountDefaults(reportKeys){
  if(!reportKeys.length) return {fromKey:"", toKey:"live"};
  const newest = reportKeys[reportKeys.length-1];
  if(snapshotMatchesLive(newest)){
    return {fromKey: reportKeys.length>=2 ? reportKeys[reportKeys.length-2] : "", toKey: newest};
  }
  return {fromKey: newest, toKey: "live"};
}
/* Resolves an invoice line's category against the master Product List when possible, so purchases
   group into the same category buckets as Beginning Book / Physical Count even if an invoice's own
   category field is cased differently (e.g. "Grocery" vs "GROCERY"). */
function categoryForInvoiceEntry(e){
  const n = normName(e.name);
  const master = DATA.inventory.find(p=>normName(p.name)===n);
  if(master && master.category) return master.category;
  return (e.category||"Uncategorized").toUpperCase();
}
/* Inside-store register sales between two counts: Total Collected minus Gas for every day AFTER
   fromDate up to and including toDate (the starting count already reflects its own day's sales). */
function insideSalesInRange(fromDate, toDate){
  let collected = 0, gas = 0, days = 0;
  Object.keys(DATA.overlooks).forEach(y=>{
    const yNum = parseInt(y);
    if(!yNum || !DATA.overlooks[y]) return;
    MONTHS.forEach((mo,mIdx)=>{
      const md = DATA.overlooks[y][mo];
      if(!md || !md.daily) return;
      md.daily.forEach(d=>{
        if(typeof d.store !== "number") return;
        const dateStr = yNum + "-" + String(mIdx+1).padStart(2,'0') + "-" + String(d.day).padStart(2,'0');
        if(fromDate && dateStr <= fromDate) return;
        if(toDate && dateStr > toDate) return;
        collected += d.store; gas += num(d.gas); days++;
      });
    });
  });
  let windowDays = 0;
  if(fromDate && toDate) windowDays = Math.max(0, Math.round((new Date(toDate+"T00:00:00") - new Date(fromDate+"T00:00:00"))/86400000));
  return {inside: collected-gas, collected, gas, days, windowDays};
}
const OFFICE_SHRINK_WARN = 0.03; // unaccounted product above 3% of inside sales is worth a look
/* Shrink Check (v2). Per category: Beginning inventory + Purchases - Actual count = cost of product
   that left the shelf. The same movement priced at retail is what the register SHOULD have rung up;
   comparing that to the inside sales actually entered in Sales & Margins (Total Collected - Gas)
   gives one store-wide unaccounted figure. The register figures are store-wide, so the gap can't be
   split by category -- the category table shows where product is moving and at what margin. */
function officeReportAnalysis(fromKey, toKey){
  const pb = periodBounds(fromKey, toKey);
  if(!pb.fromProducts) return {rows:[], totals:null, fromLabel:pb.fromLabel, toLabel:pb.toLabel, error:"Pick a starting count (the beginning of the period) above — e.g. your July count."};
  const cmp = countComparisonAnalysis(fromKey, toKey);
  const up = c=>String(c||"Uncategorized").toUpperCase();
  const keyOf = p=>normName(p.name)+"||"+normUnit(p.unit);
  const known = new Set([...pb.fromProducts.map(keyOf), ...pb.toProducts.map(keyOf)]);
  const purchasesByCat = {};
  let unmatchedPurchases = 0, unmatchedLines = 0;
  DATA.invoiceEntries.forEach(e=>{
    const d = (e.date||"").slice(0,10);
    if(!d) return;
    if(pb.fromDate && d <= pb.fromDate) return;
    if(pb.toDate && d > pb.toDate) return;
    const c = up(categoryForInvoiceEntry(e));
    if(!purchasesByCat[c]) purchasesByCat[c] = {purchases:0, units:0};
    purchasesByCat[c].purchases += num(e.total);
    purchasesByCat[c].units += num(e.qty);
    if(!known.has(keyOf(e))){ unmatchedPurchases += num(e.total); unmatchedLines++; }
  });
  const cmpCats = {}; cmp.catRows.forEach(c=>cmpCats[c.category]=c);
  const catNames = new Set([...Object.keys(cmpCats), ...Object.keys(purchasesByCat)]);
  const rows = [...catNames].sort().map(c=>{
    const beginning = cmpCats[c] ? cmpCats[c].prevValue : 0;
    const actual = cmpCats[c] ? cmpCats[c].curValue : 0;
    const purchases = purchasesByCat[c] ? purchasesByCat[c].purchases : 0;
    const unitsPurchased = purchasesByCat[c] ? purchasesByCat[c].units : 0;
    const leftCost = beginning + purchases - actual;
    const leftRetail = cmpCats[c] ? cmpCats[c].soldRetail : 0;
    const margin = leftRetail>0 ? 1 - leftCost/leftRetail : null;
    return {category:c, beginning, purchases, unitsPurchased, actual, leftCost, leftRetail, margin};
  });
  const totals = rows.reduce((t,r)=>{
    ["beginning","purchases","unitsPurchased","actual","leftCost","leftRetail"].forEach(f=>t[f]+=r[f]);
    return t;
  }, {beginning:0, purchases:0, unitsPurchased:0, actual:0, leftCost:0, leftRetail:0});
  totals.margin = totals.leftRetail>0 ? 1 - totals.leftCost/totals.leftRetail : null;
  rows.forEach(r=>{ r.share = totals.leftRetail>0 ? r.leftRetail/totals.leftRetail : 0; });
  const register = insideSalesInRange(pb.fromDate, pb.toDate);
  totals.registerInside = register.inside;
  totals.registerDays = register.days;
  totals.windowDays = register.windowDays;
  totals.shrinkRetail = totals.leftRetail - register.inside;
  totals.shrinkPct = register.inside>0 ? totals.shrinkRetail/register.inside : null;
  totals.shrinkCost = totals.leftRetail>0 ? totals.shrinkRetail * (totals.leftCost/totals.leftRetail) : 0;
  totals.unmatchedPurchases = unmatchedPurchases;
  totals.unmatchedLines = unmatchedLines;
  totals.variance = -totals.shrinkRetail; // keeps the Saved Office Reports list working (negative = loss)
  return {v:2, rows, totals, fromLabel:pb.fromLabel, toLabel:pb.toLabel, fromDate:pb.fromDate, toDate:pb.toDate};
}
/* Freezes the current analysis into DATA.officeReports, same idea as generateDistributorReport(). */
function generateOfficeReport(fromKey, toKey){
  const analysis = officeReportAnalysis(fromKey, toKey);
  if(analysis.error) return {error: analysis.error};
  const id = "or_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  DATA.officeReports[id] = {
    id, v:2, generatedAt: new Date().toISOString(),
    fromKey, toKey, fromLabel: analysis.fromLabel, toLabel: analysis.toLabel,
    fromDate: analysis.fromDate, toDate: analysis.toDate,
    rows: analysis.rows, totals: analysis.totals
  };
  persist();
  return DATA.officeReports[id];
}
/* Plain-text pieces of a report, shared by screen warnings, Print, CSV and Email. Handles both the
   new Shrink Check reports (v:2) and older saved Book-vs-Physical reports. */
function officeReportWarnings(t){
  const w = [];
  if(t.windowDays && t.registerDays < t.windowDays) w.push(`Only ${t.registerDays} of ${t.windowDays} days in this window have a daily total entered in Sales & Margins — missing days make the unaccounted figure look bigger than it is.`);
  if(!t.registerDays) w.push(`No daily totals are entered for this window, so there is nothing to compare against yet.`);
  if(t.unmatchedLines) w.push(`${t.unmatchedLines} invoice line(s) totalling ${fmtUSD(t.unmatchedPurchases)} don't match any product in either count (name + unit) — their cost is included but their retail value isn't, which understates what should have been rung up.`);
  if(t.registerDays && t.shrinkRetail < 0) w.push(`The register rang up more than the product that left the shelf. Usually a missing invoice, an ending count that's too high, or daily totals that include things not in inventory (sales tax, lottery, money orders).`);
  return w;
}
function officeReportPlain(report){
  const t = report.totals;
  const sg = (v,f)=>(v>=0?"+":"")+f(v);
  if(report.v!==2){
    return {
      summary: [["Beginning Book",fmtUSD(t.beginningBook)],["Purchases",fmtUSD(t.purchases)],["Ending Book",fmtUSD(t.endingBook)],["Physical Count",fmtUSD(t.physicalCount)],["Variance",sg(t.variance,fmtUSD)],["Variance %",(t.variancePct*100).toFixed(1)+"%"]],
      headers: ["Category","Beginning Book","Purchases","Units Purchased","Average Cost","Ending Book","Physical Count","Variance","Variance %"],
      body: report.rows.map(r=>[r.category,fmtUSD(r.beginningBook),fmtUSD(r.purchases),r.unitsPurchased,r.unitsPurchased?fmtUSD(r.avgCost):"—",fmtUSD(r.endingBook),fmtUSD(r.physicalCount),sg(r.variance,fmtUSD),(r.variancePct*100).toFixed(1)+"%"]),
      total: ["GRAND TOTAL",fmtUSD(t.beginningBook),fmtUSD(t.purchases),t.unitsPurchased,t.unitsPurchased?fmtUSD(t.avgCost):"—",fmtUSD(t.endingBook),fmtUSD(t.physicalCount),sg(t.variance,fmtUSD),(t.variancePct*100).toFixed(1)+"%"],
      warnings: ["Older report: generated before sales were included, so Variance here is mostly product that was sold, not shrink. Generate a new report for this window."]
    };
  }
  const pct = v=>v===null||v===undefined ? "—" : (v*100).toFixed(1)+"%";
  return {
    summary: [["Product that left the shelf (at retail)",fmtUSD(t.leftRetail)],["Register inside sales (Total Collected − Gas)",`${fmtUSD(t.registerInside)} — ${t.registerDays} of ${t.windowDays} days entered`],["Unaccounted (at retail)",`${fmtUSD(t.shrinkRetail)} (${pct(t.shrinkPct)} of inside sales)`],["Unaccounted (approx. at cost)",fmtUSD(t.shrinkCost)],["Beginning inventory",fmtUSD(t.beginning)],["Purchases",fmtUSD(t.purchases)],["Actual count",fmtUSD(t.actual)],["Margin on what left the shelf",pct(t.margin)]],
    headers: ["Category","Beginning Inventory","Purchases","Actual Count","Left the Shelf (cost)","Left the Shelf (retail)","Margin","Share of Sales"],
    body: report.rows.map(r=>[r.category,fmtUSD(r.beginning),fmtUSD(r.purchases),fmtUSD(r.actual),fmtUSD(r.leftCost),fmtUSD(r.leftRetail),pct(r.margin),pct(r.share)]),
    total: ["GRAND TOTAL",fmtUSD(t.beginning),fmtUSD(t.purchases),fmtUSD(t.actual),fmtUSD(t.leftCost),fmtUSD(t.leftRetail),pct(t.margin),"100.0%"],
    warnings: officeReportWarnings(t)
  };
}
function renderOfficeShrinkResults(analysis, opts){
  const showGenerate = !opts || opts.showGenerate!==false;

      <div class="kpi"><div class="lbl">Unaccounted</div><div class="val" style="color:${shrinkColor}">${fmtUSD0(t.shrinkRetail)}</div><div class="sub">${pct(t.shrinkPct)} of inside sales · about ${fmtUSD0(t.shrinkCost)} at cost</div></div>
      <div class="kpi"><div class="lbl">Margin on What Left</div><div class="val">${pct(t.margin)}</div></div>
    </div>

function getInventoryReport(key){
  if(key==="live"){
    const products = DATA.inventory.map(p=>{
      const c = JSON.parse(JSON.stringify(p));
      c.received_qty = productReceived(p);
      c.sold = num(c.opening) + num(c.received_qty) - num(c.closing);
      c.closing_value = +(num(c.closing)*num(c.cost)).toFixed(2);

/* ---- Count Comparison: product-by-product, one count vs another ---- */
function countComparisonAnalysis(fromKey, toKey){
  const pb = periodBounds(fromKey, toKey);
  if(!pb.fromProducts) return {error:"Pick the earlier count to compare against (e.g. your July count).", fromLabel:pb.fromLabel, toLabel:pb.toLabel};
  const keyOf = p=>normName(p.name)+"||"+normUnit(p.unit);
  const fromMap = new Map(); pb.fromProducts.forEach(p=>fromMap.set(keyOf(p), p));
  const toMap = new Map(); pb.toProducts.forEach(p=>toMap.set(keyOf(p), p));
  const received = new Map();
  DATA.invoiceEntries.forEach(e=>{
    const d = (e.date||"").slice(0,10);
    if(!d) return;
    if(pb.fromDate && d <= pb.fromDate) return; // received AFTER the earlier count...
    if(pb.toDate && d > pb.toDate) return;      // ...up to and including the later count
    const k = normName(e.name)+"||"+normUnit(e.unit);
    received.set(k, (received.get(k)||0) + num(e.qty));
  });
  const rows = [];
  const pushRow = (k, fp, tp)=>{
    const base = tp || fp;
    const prev = fp ? num(fp.closing) : 0;
    const cur = tp ? num(tp.closing) : 0;
    const rec = received.get(k) || 0;
    const prevCost = fp ? num(fp.cost) : num(base.cost);
    const curCost = tp ? num(tp.cost) : prevCost;
    const sold = prev + rec - cur;
    rows.push({name:base.name, category:String(base.category||"Uncategorized").toUpperCase(), unit:base.unit||"",
      prev, received:rec, expected:prev+rec, cur, change:cur-prev, sold,
      prevValue:+(prev*prevCost).toFixed(2), curValue:+(cur*curCost).toFixed(2), valueChange:+(cur*curCost - prev*prevCost).toFixed(2),
      soldRetail:+(sold*num(base.retail)).toFixed(2),
      flag: !fp ? "new" : (!tp ? "gone" : (sold<0 ? "neg" : ""))});
  };
  pb.toProducts.forEach(tp=>pushRow(keyOf(tp), fromMap.get(keyOf(tp)), tp));
  pb.fromProducts.forEach(fp=>{ if(!toMap.has(keyOf(fp))) pushRow(keyOf(fp), fp, null); });
  const cats = {};
  rows.forEach(r=>{
    const c = cats[r.category] || (cats[r.category] = {category:r.category, prevUnits:0, curUnits:0, received:0, sold:0, prevValue:0, curValue:0, soldRetail:0, changed:0});
    c.prevUnits += r.prev; c.curUnits += r.cur; c.received += r.received; c.sold += r.sold;
    c.prevValue += r.prevValue; c.curValue += r.curValue; c.soldRetail += r.soldRetail;
    if(r.change!==0) c.changed++;
  });
  const catRows = Object.values(cats).sort((a,b)=>a.category.localeCompare(b.category));
  const totals = catRows.reduce((t,c)=>{ ["prevUnits","curUnits","received","sold","prevValue","curValue","soldRetail","changed"].forEach(f=>t[f]+=c[f]); return t; },
    {prevUnits:0, curUnits:0, received:0, sold:0, prevValue:0, curValue:0, soldRetail:0, changed:0});
  return {rows, catRows, totals, fromLabel:pb.fromLabel, toLabel:pb.toLabel, fromDate:pb.fromDate, toDate:pb.toDate, fromKey, toKey};
}

    <tbody>${a.catRows.map(c=>{
      const vc = c.curValue - c.prevValue; const pct = c.prevValue ? vc/c.prevValue : 0;
      return `<tr><td>${c.category}</td><td>${c.prevUnits.toLocaleString()}</td><td>${c.received.toLocaleString()}</td><td>${c.curUnits.toLocaleString()}</td>

        <td>${fmtUSD(c.prevValue)}</td><td>${fmtUSD(c.curValue)}</td><td style="color:${chgColor(vc)}">${signed(vc, fmtUSD)}</td><td>${c.prevValue?signed(+(pct*100).toFixed(1))+"%":"—"}</td></tr>`;

        <button class="btn small primary" id="ccpPrint">🖶 Print</button>
      </div>
    </div>`;

  const close = ()=>backdrop.remove();
  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) close(); });

    const includeSummary = document.getElementById('ccpSummary').checked;

    if(!includeSummary && !includeProducts){ toast("Pick at least one section to print", true); return; }
    close();
    let rows = countComparisonFilteredRows(a);
    if(changedOnly) rows = rows.filter(r=>r.change!==0 || r.flag);
    const main = document.getElementById('main');
    main.innerHTML = `
      <div class="printhead"><h1>⇄ Count Comparison — ${a.fromLabel} → ${a.toLabel}</h1>
        <p>Printed ${new Date().toLocaleString()} — Earlier value ${fmtUSD(a.totals.prevValue)}, latest value ${fmtUSD(a.totals.curValue)}, change ${signed(a.totals.curValue-a.totals.prevValue, fmtUSD)}</p></div>
      ${includeSummary ? `<div style="margin-bottom:18px;">${countComparisonCatTableHtml(a)}</div>` : ``}
      ${includeProducts ? countComparisonProductTableHtml(rows) : ``}
      <p style="font-size:11px;">*Units Sold = Earlier Count + Received − Latest Count.</p>`;
    const restore = ()=>{ window.removeEventListener('afterprint', restore); render(); };
    window.addEventListener('afterprint', restore);
    setTimeout(()=>window.print(), 50);
  };
}
function downloadCountComparisonCSV(a){
  const out = [];
  out.push([`Count Comparison - ${a.fromLabel} to ${a.toLabel}`]);
  out.push([`Generated ${new Date().toLocaleString()}`]);
  out.push([]);
  out.push(["Category","Earlier Units","Received","Latest Units","Unit Change","Units Sold","Earlier Value","Latest Value","Value Change"]);
  a.catRows.forEach(c=>out.push([c.category, c.prevUnits, c.received, c.curUnits, c.curUnits-c.prevUnits, c.sold, c.prevValue.toFixed(2), c.curValue.toFixed(2), (c.curValue-c.prevValue).toFixed(2)]));
  out.push(["GRAND TOTAL", a.totals.prevUnits, a.totals.received, a.totals.curUnits, a.totals.curUnits-a.totals.prevUnits, a.totals.sold, a.totals.prevValue.toFixed(2), a.totals.curValue.toFixed(2), (a.totals.curValue-a.totals.prevValue).toFixed(2)]);
  out.push([]);
  out.push(["Product","Category","Unit","Earlier Count","Received","Latest Count","Change","Units Sold","Earlier Value","Latest Value","Value Change","Note"]);
  countComparisonFilteredRows(a).forEach(r=>out.push([r.name, r.category, r.unit, r.prev, r.received, r.cur, r.change, r.sold, r.prevValue.toFixed(2), r.curValue.toFixed(2), r.valueChange.toFixed(2),
    r.flag==="new"?"new since earlier count":r.flag==="gone"?"not in latest count":r.flag==="neg"?"check count / missing invoice":""]));
  const name = `DJs_Mini_Mart_Count_Comparison_${(a.fromLabel||"").split(" —")[0]}_to_${(a.toLabel||"").split(" —")[0]}.csv`.replace(/[^\w.]+/g,"_");
  downloadTextFile(name, out.map(r=>r.map(csvEscape).join(",")).join("\n"), "text/csv");
  toast("Comparison downloaded");
}

/* ---------- Cigarette/Tobacco Unit Reconciliation (units, not dollars, Cigarettes/Tobacco only) ----------
   Same book-to-physical idea as Office Report, but per product and in units: Beginning Units (starting
   count) + Purchased Units (invoiced during the window) = Ending Book Units, compared against Physical
   Units (the new count). Reuses inventoryPeriodMovement() for the same opening/received/closing math as
   Dead Stock and Sales vs Inventory Cross-Check, filtered to Cigarettes/Tobacco only. */
function cigReconciliationAnalysis(fromKey, toKey){
  const movement = inventoryPeriodMovement(fromKey, toKey);
  if(movement.error) return {rows:[], totals:null, fromLabel:movement.fromLabel, toLabel:movement.toLabel, error:movement.error};
  const rows = movement.rows.filter(r=>isBuydownCategory(r.category)).map(r=>{
    const beginningUnits = r.opening;
    const purchasedUnits = r.received;
    const endingBookUnits = beginningUnits + purchasedUnits;
    const physicalUnits = r.closing;
    const variance = physicalUnits - endingBookUnits;
    const variancePct = endingBookUnits>0 ? variance/endingBookUnits : (physicalUnits>0 ? 1 : 0);
    return {name:r.name, category:r.category, unit:r.unit, beginningUnits, purchasedUnits, endingBookUnits, physicalUnits, variance, variancePct};
  }).sort((a,b)=>a.category.localeCompare(b.category) || a.name.localeCompare(b.name));
  const totals = rows.reduce((t,r)=>{
    t.beginningUnits+=r.beginningUnits; t.purchasedUnits+=r.purchasedUnits; t.endingBookUnits+=r.endingBookUnits;
    t.physicalUnits+=r.physicalUnits; t.variance+=r.variance;
    return t;
  }, {beginningUnits:0, purchasedUnits:0, endingBookUnits:0, physicalUnits:0, variance:0});
  totals.variancePct = totals.endingBookUnits>0 ? totals.variance/totals.endingBookUnits : 0;
  return {rows, totals, fromLabel:movement.fromLabel, toLabel:movement.toLabel, fromDate:movement.fromDate, toDate:movement.toDate};
}
/* Freezes the current analysis into DATA.cigReconciliationReports, same idea as generateOfficeReport(). */
function generateCigReconciliationReport(fromKey, toKey){
  const analysis = cigReconciliationAnalysis(fromKey, toKey);
  if(analysis.error) return {error: analysis.error};
  const id = "cr_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  DATA.cigReconciliationReports[id] = {
    id, generatedAt: new Date().toISOString(),
    fromKey, toKey, fromLabel: analysis.fromLabel, toLabel: analysis.toLabel,
    fromDate: analysis.fromDate, toDate: analysis.toDate,
    rows: analysis.rows, totals: analysis.totals
  };
  persist();
  return DATA.cigReconciliationReports[id];
}

let cigReconState = {fromKey:"", toKey:"live"};
function initCigReconStateDefaults(reportKeys){
  if(cigReconState.fromKey) return;
  if(reportKeys.length>=2){
    cigReconState.fromKey = reportKeys[reportKeys.length-2];
    cigReconState.toKey = reportKeys[reportKeys.length-1];
  } else if(reportKeys.length===1){
    cigReconState.fromKey = reportKeys[0];
    if(!cigReconState.toKey) cigReconState.toKey = "live";
  }
}

function cigReconciliationReportsToCSV(ids){

/* ---------- Price History (per-distributor price-change log, drill into one product) ----------
   Pick a distributor and a date range and see every product they invoiced whose cost changed --
   grouped by normalized product+unit (same normName/normUnit matching Distributor Reports uses, so
   it isn't thrown off by capitalization/spacing differences), flagged with the same
   MARGIN_OUTLIER_THRESHOLD used everywhere else. Selecting a product drills into a full breakdown:
   every invoice line, a cost-over-time chart, and both a qty-weighted and simple average cost. */
let priceHistoryState = {distributor:"ALL", fromDate:"", toDate:"", onlyChanged:true, selected:null};
/* Defaults the date range to the full span of invoice history on file -- but only while both dates
   are still blank, so it won't clobber a range you already picked (same pattern as
   initDistReportStateDefaults). */
function initPriceHistoryStateDefaults(){
  if(priceHistoryState.fromDate || priceHistoryState.toDate) return;
  const dates = DATA.invoiceEntries.map(e=>(e.date||"").slice(0,10)).filter(Boolean).sort();
  if(dates.length){
    priceHistoryState.fromDate = dates[0];
    priceHistoryState.toDate = dates[dates.length-1];
  }
}
/* Prefer the exact spelling/casing from the master Product List when there's a match -- invoice
   entries can vary in capitalization even after normalizing for matching. */
function priceHistoryDisplayName(name){
  const n = normName(name);
  const master = DATA.inventory.find(p=>normName(p.name)===n);
  return master ? master.name : name;
}
function priceHistoryGroups(distributorFilter, fromDate, toDate){
  const entries = DATA.invoiceEntries.filter(e=>{
    const d = (e.date||"").slice(0,10);
    if(!d) return false;
    if(fromDate && d < fromDate) return false;
    if(toDate && d > toDate) return false;
    if(distributorFilter && distributorFilter!=="ALL" && (e.distributor||"").trim()!==distributorFilter) return false;
    return true;
  });
  const groups = new Map();
  entries.forEach(e=>{
    const key = normName(e.name)+"||"+normUnit(e.unit);
    if(!groups.has(key)) groups.set(key, {key, name:priceHistoryDisplayName(e.name), unit:e.unit||"", category:e.category||"", distributors:new Set(), lines:[]});
    const g = groups.get(key);
    if((e.distributor||"").trim()) g.distributors.add(e.distributor.trim());
    g.lines.push(e);
  });
  const rows = [];
  groups.forEach(g=>{
    g.lines.sort((a,b)=>(a.date||"").localeCompare(b.date||"") || (a.invoice||"").localeCompare(b.invoice||""));
    const costs = g.lines.map(l=>num(l.cost));
    const firstCost = costs[0], lastCost = costs[costs.length-1];
    let minCost = costs[0], maxCost = costs[0];
    costs.forEach(c=>{ if(c>maxCost) maxCost=c; if(c<minCost) minCost=c; }); // manual loop -- avoids a stack overflow via spread on a large group
    let maxJumpPct = 0;
    for(let i=1;i<costs.length;i++){
      const prev = costs[i-1];
      if(prev>0){
        const jump = Math.abs((costs[i]-prev)/prev);
        if(jump>maxJumpPct) maxJumpPct = jump;
      }
    }
    const netChange = lastCost - firstCost;
    const netChangePct = firstCost>0 ? netChange/firstCost : (lastCost>0 ? 1 : 0);
    const totalQty = g.lines.reduce((s,l)=>s+num(l.qty),0);
    const totalSpent = g.lines.reduce((s,l)=>s+num(l.total),0);
    const weightedAvg = totalQty>0 ? totalSpent/totalQty : 0;
    const simpleAvg = costs.length ? costs.reduce((s,c)=>s+c,0)/costs.length : 0;
    const changed = maxCost - minCost > 0.001;
    const master = DATA.inventory.find(p=>normName(p.name)===normName(g.name) && normUnit(p.unit)===normUnit(g.unit));
    rows.push({
      key:g.key, name:g.name, unit:g.unit, category:g.category,
      distributor: [...g.distributors].sort().join(", ") || "—",
      lines:g.lines, invoiceCount:g.lines.length,
      firstCost, lastCost, minCost, maxCost, netChange, netChangePct, maxJumpPct,
      totalQty, totalSpent, weightedAvg, simpleAvg, changed,
      currentCost: master ? num(master.cost) : null,
      flagged: changed && (Math.abs(netChangePct) >= MARGIN_OUTLIER_THRESHOLD || maxJumpPct >= MARGIN_OUTLIER_THRESHOLD)
    });
  });
  return rows.sort((a,b)=> (b.flagged-a.flagged) || (b.maxJumpPct-a.maxJumpPct) || a.name.localeCompare(b.name));
}
/* Simple SVG cost-over-time line chart -- same lightweight inline-SVG approach as the Dashboard's
   charts (drawDashForecastChart etc.), just built as a string here since every value is known
   synchronously at render time. Points spaced evenly by invoice order, not by calendar date. */
function priceHistoryChartSvg(lines){
  const costs = lines.map(l=>num(l.cost));
  const w=760, h=220, pad=38;
  let minC = Math.min(...costs), maxC = Math.max(...costs);
  if(minC===maxC){ const pad2 = Math.max(0.5, minC*0.1); minC -= pad2; maxC += pad2; }
  const range = maxC - minC;
  const stepX = lines.length>1 ? (w-pad*2)/(lines.length-1) : 0;
  const xAt = i => lines.length>1 ? pad+i*stepX : w/2;
  const yAt = c => h-pad-((c-minC)/range)*(h-pad*2);
  const pts = lines.map((l,i)=>`${xAt(i)},${yAt(costs[i])}`).join(" ");
  const marks = lines.map((l,i)=>{
    const x=xAt(i), y=yAt(costs[i]);
    const isJump = i>0 && costs[i-1]>0 && Math.abs((costs[i]-costs[i-1])/costs[i-1]) >= MARGIN_OUTLIER_THRESHOLD;
    return `<circle cx="${x}" cy="${y}" r="4" fill="#fff" stroke="${isJump?'var(--red)':'var(--navy)'}" stroke-width="2"></circle>
      <text x="${x}" y="${Math.max(14,y-10)}" font-size="11" font-weight="700" text-anchor="middle" fill="${isJump?'var(--red)':'#1A1A1A'}">${fmtUSD(costs[i])}</text>
      <text x="${x}" y="${h-10}" font-size="10" text-anchor="middle" fill="#767676">${l.date?l.date.slice(5,10):""}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" class="chart" style="height:220px;width:100%;">
    <line x1="${pad}" y1="10" x2="${pad}" y2="${h-pad}" stroke="var(--border)" stroke-width="1"></line>
