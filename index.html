        <div><span>Margin (period)</span><b>${m.error||!sales?"—":fmtPct(gp/sales)}</b><em>${below.length} below target</em></div>
        <div><span>Cost changes</span><b>${ups.length}↑ ${downs.length}↓</b><em>${ups.length?"avg +"+(avgUp*100).toFixed(1)+"%":"since "+vDate(st.repSince)}</em></div>
        <div><span>On hand (cost)</span><b>${m.error?"—":fmtUSD0(onHand)}</b><em>${dead.length?fmtUSD0(dead.reduce((t,r)=>t+r.closingValue,0))+" not moving":"all moving"}</em></div>
      </div>
      <div class="rep-grid">
        <div><h3>Cost changes since ${vDate(st.repSince)}</h3>${tbl(["Product","Date","Old","New","Change"], changeRows.map(c=>`<tr><td>${vEsc(c.name)} <span class="rep-dim">${vEsc(c.unit)}</span></td><td>${vDate(c.date).replace(/, \d{4}$/,"")}</td><td>${fmtUSD(c.oldCost)}</td><td>${fmtUSD(c.newCost)}</td><td class="${c.pct>0?"price-up":"price-down"}">${c.pct>0?"+":""}${(c.pct*100).toFixed(1)}%</td></tr>`), "No cost changes in this window")}${latestChange.size>lim?`<div class="rep-dim">+${latestChange.size-lim} more</div>`:""}</div>
        <div><h3>Not selling (on shelf, no sales)</h3>${tbl(["Product","On Hand","Cost Value"], dead.slice(0,lim).map(r=>`<tr><td>${vEsc(r.name)} <span class="rep-dim">${vEsc(r.unit)}</span></td><td>${r.closing}</td><td>${fmtUSD(r.closingValue)}</td></tr>`), m.error?"Pick a starting count":"Everything sold at least one")}${dead.length>lim?`<div class="rep-dim">+${dead.length-lim} more (${fmtUSD0(dead.slice(lim).reduce((t,r)=>t+r.closingValue,0))})</div>`:""}</div>
        <div><h3>Below target margin</h3>${tbl(["Product","Cost","Retail","Now","Target"], below.slice(0,lim).map(x=>`<tr><td>${vEsc(x.p.name)} <span class="rep-dim">${vEsc(x.p.unit||"")}</span></td><td>${fmtUSD(condCost(x.p,num(x.p.cost)))}</td><td>${fmtUSD(num(x.p.retail))}</td><td class="price-up">${((x.s.value||0)*100).toFixed(1)}%</td><td>${condTargetText(x.s.cond)}</td></tr>`), (DATA.marginConditions||[]).length?"Everything is at or above target":"No Margin Conditions set up yet")}${below.length>lim?`<div class="rep-dim">+${below.length-lim} more</div>`:""}</div>
        <div><h3>Best sellers (units, period)</h3>${tbl(["Product","Sold","Sales"], best.map(r=>`<tr><td>${vEsc(r.name)} <span class="rep-dim">${vEsc(r.unit)}</span></td><td>${r.sold}</td><td>${fmtUSD0(r.sold*r.retail)}</td></tr>`), m.error?"Pick a starting count":"No sales recorded")}</div>
      </div>
      <div class="rep-notes"><h3>Talking points / notes</h3>${v.notes?`<div style="margin-bottom:6px;">${vEsc(v.notes)}</div>`:""}<div class="rep-line"></div><div class="rep-line"></div><div class="rep-line"></div><div class="rep-line"></div></div>
    </div>`;
  document.getElementById('repPrint').onclick = ()=>{
    document.body.classList.add('print-rep');
    const done = ()=>{ document.body.classList.remove('print-rep'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    window.print();
    setTimeout(done, 1500);
  };
}

/* ===================== SITE SWEEP (sidebar -> Site Sweep) =====================
   Like spell-check for the product list: looks over every product and lists anything that looks out of
   place -- typos and naming slips (CLEANUP_SEED, hand-reviewed Oct 2026, plus live checks), pricing that
   doesn't add up, and missing info. Each item can be Fixed (name/size changes are carried into invoice
   history and saved counts so nothing loses its history; price changes are logged) or marked On Purpose
   (hidden for good). Decisions live in DATA.cleanupDecisions so everyone sees the same list. */
const CLEANUP_SEED = (function(){
  try{ const el = document.getElementById('cleanup-seed'); return el ? JSON.parse(el.textContent) : []; }
  catch(e){ return []; }
})();
const SWEEP_GROUPS = [
  {id:"names", label:"Spelling & Names", icon:"\u270f\ufe0f"},
  {id:"prices", label:"Prices", icon:"\ud83d\udcb2"},
  {id:"missing", label:"Missing Info", icon:"\u2753"},
];
const CLEANUP_KINDS = {
  spelling:{label:"Spelling", group:"names"}, size:{label:"Sizes", group:"names"}, spacing:{label:"Extra spaces", group:"names"},
  mismatch:{label:"Name vs size", group:"names"}, duplicate:{label:"Duplicate listings", group:"names"},
  rename:{label:"Unclear names", group:"names"}, blank:{label:"Missing names", group:"names"},
  belowcost:{label:"Below cost", group:"prices"}, retail0:{label:"$0 retail", group:"prices"}, cost0:{label:"$0 cost", group:"prices"},
  family:{label:"Off from its flavor family", group:"prices"}, margin:{label:"Unusual margin", group:"prices"}, costjump:{label:"Big invoice cost jump", group:"prices"},
  novendor:{label:"No vendor", group:"missing"}, nosize:{label:"No size", group:"missing"}, buydown:{label:"Missing buydown", group:"missing"},
};
const SWEEP_MONEY = {retail:1, cost:1, buydown:1};
let cleanupState = {group:"ALL", kind:"ALL", showHandled:false, selected:new Set(), open:new Set()};
/* Site Sweep: click a product to see its invoice history -- the newest invoice it appeared on and that
   invoice's cost -- next to the current cost/retail, so a retail fix can be judged against what you
   actually paid last time. */
function sweepInvoiceLines(p){
  if(!p) return {lines:[], byNameOnly:false};
  const n = normName(p.name), u = normUnit(p.unit);
  const sortNew = (a,b)=>String(b.date||"").localeCompare(String(a.date||""));
  let lines = DATA.invoiceEntries.filter(e=>normName(e.name)===n && normUnit(e.unit)===u);
  let byNameOnly = false;
  if(!lines.length){ lines = DATA.invoiceEntries.filter(e=>normName(e.name)===n); byNameOnly = lines.length>0; }
  return {lines:lines.slice().sort(sortNew), byNameOnly};
}
function sweepDetailHtml(o){
  const p = o.p;
  if(!p) return `<div class="sub" style="margin:0;">This product is no longer on file.</div>`;
  const {lines, byNameOnly} = sweepInvoiceLines(p);
  const last = lines[0];
  const bd = isBuydownCategory(p.category) ? num(p.buydown) : 0;
  const retail = num(p.retail), costNow = num(p.cost);
  const mg = (cost, r)=> r>0 ? (r-(cost-bd))/r : null;
  const pct = v=> v==null ? "\u2014" : `<span style="color:${v<0?'var(--red)':'inherit'};font-weight:600;">${fmtPct(v)}</span>`;
  const cond = conditionFor(p);
  let sug = null;
  if(last && num(last.cost)>0){ sug = smartSuggestedRetail(p, num(last.cost)); if(sug!=null && !(sug>0)) sug = null; }
  const sameAsNow = sug!=null && Math.abs(sug-retail)<0.005;
  const canUse = o.field==="retail" && !o.decision && sug!=null && !sameAsNow;
  const changes = (DATA.priceChangeLog||[]).filter(c=>c.productUid===p.uid).slice(0,3);
  const lastBox = last ? `
      <div class="sd-box">
        <div class="sd-lbl">Most recent invoice</div>
        <div class="sd-big">${fmtUSD(num(last.cost))} <span class="sd-small">cost${last.shipper?" (shipper deal)":""}</span></div>
        <div class="sd-small">${vEsc(last.date?String(last.date).slice(0,10):"no date")} \u00b7 ${vEsc(last.distributor||"\u2014")} \u00b7 invoice #${vEsc(last.invoice||"\u2014")}</div>
        <div class="sd-small">qty ${num(last.qty)}${num(last.discount)?` \u00b7 one-time discount ${fmtUSD(num(last.discount))}`:""}${byNameOnly?` \u00b7 <span title="No invoice line matched this size exactly">matched by name (size ${vEsc(last.unit||"blank")})</span>`:""}</div>
      </div>` : `
      <div class="sd-box"><div class="sd-lbl">Most recent invoice</div><div class="sd-small" style="margin-top:4px;">This product hasn't shown up on any invoice yet.</div></div>`;
  return `
    <div class="sd-grid">
      ${lastBox}
      <div class="sd-box">

function cleanupKey(o){ return o.kind+"|"+o.uid+"|"+o.field+"|"+o.from; }
function cleanupCurrent(p, field){
  if(SWEEP_MONEY[field]) return num(p[field]).toFixed(2);
  if(field==="vendor") return String(p.vendor||"");
  return field==="unit" ? (p.unit==null ? "" : String(p.unit)) : String(p.name==null ? "" : p.name);
}
function lev1(a, b){ // true when a and b are exactly one edit apart
  if(a===b || Math.abs(a.length-b.length)>1) return false;
  let i=0, j=0, edits=0;
  while(i<a.length && j<b.length){
    if(a[i]===b[j]){ i++; j++; continue; }
    if(++edits>1) return false;
    if(a.length>b.length) i++; else if(b.length>a.length) j++; else { i++; j++; }
  }
  return edits + (a.length-i) + (b.length-j) === 1;
}
/* simple live checks, so slips made after this list was built still get caught */
function cleanupLiveItems(){
  const out = [];
  const unitCounts = new Map();
  DATA.inventory.forEach(p=>{ const u = cleanupCurrent(p,"unit").trim(); if(u) unitCounts.set(u, (unitCounts.get(u)||0)+1); });
  const common = [...unitCounts.entries()].filter(([u,n])=>n>=10 && !/\d/.test(u)).map(([u])=>u);
  const seen = new Map();
  DATA.inventory.forEach(p=>{
    const name = cleanupCurrent(p,"name"), unit = cleanupCurrent(p,"unit");
    if(!name.trim()) out.push({kind:"blank", uid:p.uid, field:"name", from:name, to:"", why:`Product has no name (${p.category}, ${unit||"no size"}, cost ${fmtUSD(num(p.cost))}, retail ${fmtUSD(num(p.retail))})`});
    else if(/\s{2,}/.test(name) || name!==name.trim()) out.push({kind:"spacing", uid:p.uid, field:"name", from:name, to:name.replace(/\s+/g," ").trim(), why:"extra spaces"});
    // only word sizes ("sigle" vs "single") -- numeric sizes one digit apart (10oz/12oz, 15pk/12pk) are real
    if(unit && !/\d/.test(unit) && (unitCounts.get(unit)||0)<=2){
      const near = common.find(c=>lev1(unit.toLowerCase(), c.toLowerCase()));
      if(near) out.push({kind:"size", uid:p.uid, field:"unit", from:unit, to:near, why:`only ${unitCounts.get(unit)} product${unitCounts.get(unit)===1?"":"s"} use “${unit}” — ${unitCounts.get(near)} use “${near}”`});
    }
    if(name.trim()){
      const k = normName(name)+"|"+normUnit(unit)+"|"+p.category;
      if(seen.has(k)) out.push({kind:"duplicate", uid:p.uid, field:"product", from:`${name} (${unit||"no size"})`, dupOf:seen.get(k), why:"Same name, size and category as another listing"});
      else seen.set(k, p.uid);
    }
  });
  return out;
}
/* pricing / missing-info / name-vs-size checks -- these run on every product, including ones on the
   hand-reviewed spelling list */
function sweepChecks(){
  const out = [];
  const inv = DATA.inventory;
  // category median margin (after buydown) for the "unusual margin" and below-cost suggestions
  const marg = new Map();
  inv.forEach(p=>{ const r = num(p.retail), c = effectiveCost(p); if(r>0 && c>0){ if(!marg.has(p.category)) marg.set(p.category, []); marg.get(p.category).push((r-c)/r); } });
  const med = new Map();
  marg.forEach((arr, cat)=>{ if(arr.length>=4){ const s2 = arr.slice().sort((a,b)=>a-b); med.set(cat, s2[Math.floor(s2.length/2)]); } });
  // flavor families: same category + size + first two words of the name
  const fam = new Map();
  inv.forEach(p=>{ const w = String(p.name||"").trim().split(/\s+/); if(w.length<2) return; const k = p.category+"|"+normUnit(p.unit)+"|"+w.slice(0,2).join(" ").toLowerCase(); if(!fam.has(k)) fam.set(k, []); fam.get(k).push(p); });
  const famPrice = new Map();
  fam.forEach(ps=>{
    if(ps.length<4) return;
    const cnt = new Map(); ps.forEach(p=>{ const r = num(p.retail).toFixed(2); cnt.set(r, (cnt.get(r)||0)+1); });
    const [top, n] = [...cnt.entries()].sort((a,b)=>b[1]-a[1])[0];
    if(n >= ps.length*0.75 && +top>0) ps.forEach(p=>{ if(num(p.retail).toFixed(2)!==top) famPrice.set(p.uid, {price:+top, n, label:String(p.name).trim().split(/\s+/).slice(0,2).join(" ")}); });
  });
  // last two invoice costs per product
  const hist = new Map();
  DATA.invoiceEntries.forEach(e=>{ if(e.shipper || !(num(e.cost)>0) || !e.date) return; const k = normName(e.name)+"|"+normUnit(e.unit); if(!hist.has(k)) hist.set(k, []); hist.get(k).push({d:String(e.date).slice(0,10), c:num(e.cost)}); });
  hist.forEach(l=>l.sort((a,b)=>a.d.localeCompare(b.d)));
  // cigarette brands that do have buydowns
  const bdByBrand = new Map();
  inv.forEach(p=>{ if(p.category==="CIGARETTES" && num(p.buydown)>0){ const b = String(p.name||"").trim().split(/\s+/)[0].toLowerCase(); if(!bdByBrand.has(b)) bdByBrand.set(b, new Set()); bdByBrand.get(b).add(num(p.buydown).toFixed(2)); } });
  const roundUp = x=>roundUp9(x);
  inv.forEach(p=>{
    const name = String(p.name||"").trim(); if(!name) return;
    const unit = cleanupCurrent(p,"unit").trim(), retail = num(p.retail), cost = num(p.cost), ec = effectiveCost(p);
    const h = hist.get(normName(p.name)+"|"+normUnit(p.unit)) || [];
    // ---- names: name says a size the Size field doesn't
    const pk = name.match(/(\d+)\s*-?\s*(pk|pack)\b/i);
    if(pk && /^\d+pk$/i.test(unit) && (pk[1]+"pk").toLowerCase()!==unit.toLowerCase())
      out.push({kind:"mismatch", uid:p.uid, field:"unit", from:unit, to:pk[1]+"pk", why:`Name says ${pk[1]}-pack but the size is ${unit}`});
    else if(p.category==="CANDY" && /\bking\b/i.test(name) && unit && unit.toLowerCase()!=="king")
      out.push({kind:"mismatch", uid:p.uid, field:"unit", from:unit, to:"king", why:`Name says King size but the size is \u201c${unit}\u201d`});
    // ---- prices
    if(retail===0) out.push({kind:"retail0", uid:p.uid, field:"retail", from:cleanupCurrent(p,"retail"), to:famPrice.get(p.uid) ? famPrice.get(p.uid).price.toFixed(2) : "", why:"Retail price is $0 \u2014 it would ring up free"});
    if(cost===0){
      const last = h.length ? h[h.length-1].c : 0;
      out.push({kind:"cost0", uid:p.uid, field:"cost", from:cleanupCurrent(p,"cost"), to:last ? last.toFixed(2) : "", why:last ? `Cost is $0 \u2014 its last invoice cost was ${fmtUSD(last)}` : "Cost is $0 \u2014 margins and stock value will be wrong"});
    }
    if(retail>0 && ec>0 && retail < ec - 0.005){
      const brandBd = p.category==="CIGARETTES" && !(num(p.buydown)>0) ? bdByBrand.get(name.split(/\s+/)[0].toLowerCase()) : null;
      if(brandBd){
        // most likely just missing its buydown, not mispriced -- don't suggest a new shelf price
        out.push({kind:"belowcost", uid:p.uid, field:"retail", from:cleanupCurrent(p,"retail"), to:"", why:`Rings up ${fmtUSD(retail)} on a ${fmtUSD(ec)} cost \u2014 but it has no buydown entered while other ${name.split(/\s+/)[0]} packs have ${[...brandBd].map(x=>"$"+x).join(" / ")}. Check Missing Info \u2192 Missing buydown first; this may clear up on its own`});
      } else {
        const st = conditionFor(p) ? conditionSuggestedRetail(p, cost, retail) : null;
        const m = med.get(p.category);
        const sug = st!=null ? st : (m!=null && m<0.95 ? roundUp(ec/(1-m)) : null);
        out.push({kind:"belowcost", uid:p.uid, field:"retail", from:cleanupCurrent(p,"retail"), to:sug!=null ? sug.toFixed(2) : "", why:`Selling below cost: costs ${fmtUSD(ec)}${isBuydownCategory(p.category)&&num(p.buydown)?" after buydown":""}, rings up ${fmtUSD(retail)}`});
      }
    }
    const f = famPrice.get(p.uid);
    if(f && retail>0) out.push({kind:"family", uid:p.uid, field:"retail", from:cleanupCurrent(p,"retail"), to:f.price.toFixed(2), why:`${fmtUSD(retail)}, but ${f.n} other \u201c${f.label}\u201d ${unit||""} items are ${fmtUSD(f.price)}`});
    if(retail>0 && ec>0 && !conditionFor(p) && med.has(p.category)){
      const mm = (retail-ec)/retail, cm = med.get(p.category);
      if(Math.abs(mm-cm) > 0.20){
        const low = mm < cm;
        // only suggest RAISING a price; a high margin is flagged but the price is left to you
        const sug = low && cm<0.95 ? roundUp(ec/(1-cm)) : null;
        out.push({kind:"margin", uid:p.uid, field:"retail", from:cleanupCurrent(p,"retail"), to:sug!=null ? sug.toFixed(2) : "",
          why: low ? `Only ${(mm*100).toFixed(0)}% margin \u2014 most ${p.category} runs about ${(cm*100).toFixed(0)}%. Suggested price brings it to the typical margin`
                   : `${(mm*100).toFixed(0)}% margin \u2014 most ${p.category} runs about ${(cm*100).toFixed(0)}%. Could be fine (or the cost is off) \u2014 type a new price, or mark it on purpose`});
      }
    }
    if(h.length>=2){
      const a = h[h.length-2], b = h[h.length-1];
      if(a.c>0 && Math.abs(b.c-a.c)/a.c > 0.4 && Math.abs(cost-b.c)<0.005)
        out.push({kind:"costjump", uid:p.uid, field:"cost", from:cleanupCurrent(p,"cost"), to:a.c.toFixed(2), why:`Last invoice (${vDate(b.d)}) changed the cost ${fmtUSD(a.c)} \u2192 ${fmtUSD(b.c)} (${b.c>a.c?"+":""}${((b.c-a.c)/a.c*100).toFixed(0)}%) \u2014 might be a case cost typed as a unit cost. Suggested fix puts back the previous cost`});
    }
    // ---- missing info
    if(!p.vendor) out.push({kind:"novendor", uid:p.uid, field:"vendor", from:"", to:"", why:"No vendor \u2014 won't show up in vendor filters, price changes or rep sheets"});
    if(!unit || unit==="0") out.push({kind:"nosize", uid:p.uid, field:"unit", from:cleanupCurrent(p,"unit"), to:"", why:"No size \u2014 Margin Conditions and invoice matching use the size"});
    if(p.category==="CIGARETTES" && !(num(p.buydown)>0)){
      const sib = bdByBrand.get(name.split(/\s+/)[0].toLowerCase());
      if(sib) out.push({kind:"buydown", uid:p.uid, field:"buydown", from:cleanupCurrent(p,"buydown"), to:sib.size===1 ? [...sib][0] : "", why:`No buydown entered, but other ${name.split(/\s+/)[0]} packs have ${[...sib].map(x=>"$"+x).join(" / ")}`});
    }
  });
  return out;
}
/* every open item, plus (optionally) ones already handled */
function cleanupItems(includeHandled){
  const dec = DATA.cleanupDecisions || {};
  const byUid = new Map(DATA.inventory.map(p=>[p.uid, p]));
  const items = [], taken = new Set(), seedUids = new Set();
  const consider = (o, live)=>{
    if(live && seedUids.has(o.uid)) return;                  // the hand-reviewed list already covers this product
    const p = byUid.get(o.uid);
    const key = cleanupKey(o), d = dec[key];
    if(d){ if(includeHandled) items.push(Object.assign({}, o, {key, p, decision:d})); taken.add(o.uid+"|"+o.field); return; }
    if(!p) return;                                          // product gone
    if(o.field!=="product" && cleanupCurrent(p, o.field)!==o.from) return; // already changed by someone
    if(o.kind==="duplicate" && !byUid.get(o.dupOf)) return; // the one it duplicates is gone
    const tk = o.uid+"|"+(o.field==="product"?"product":o.field);
    if(taken.has(tk)) return;
    taken.add(tk);
    items.push(Object.assign({}, o, {key, p}));
  };
  CLEANUP_SEED.forEach(o=>{ seedUids.add(o.uid); consider(o, false); });
  cleanupLiveItems().forEach(o=>consider(o, true));
  sweepChecks().forEach(o=>consider(o, false));
  return items;
}

/* Rename a product's name and/or size everywhere it's referenced, so received quantities, saved counts,
   price alerts and price history still line up with it afterwards. */
function renameProductEverywhere(p, newName, newUnit){
  newName = String(newName).replace(/\s+/g," ").trim();
  newUnit = String(newUnit==null?"":newUnit).trim();
  if(!newName) return "Name can't be blank";
  const clash = DATA.inventory.find(x=>x!==p && normName(x.name)===normName(newName) && normUnit(x.unit)===normUnit(newUnit) && x.category===p.category);
  if(clash) return `"${clash.name}"${clash.unit?" ("+clash.unit+")":""} already exists in ${clash.category} — that would make a duplicate`;
  const oldN = normName(p.name), oldU = normUnit(p.unit), hadName = !!String(p.name||"").trim();
  if(hadName){
    DATA.invoiceEntries.forEach(e=>{ if(normName(e.name)===oldN && normUnit(e.unit)===oldU && (!e.category || normName(e.category)===normName(p.category))){ e.name = newName; e.unit = newUnit; } });
    Object.keys(DATA.inventoryReports||{}).forEach(k=>{
      ((DATA.inventoryReports[k]||{}).products||[]).forEach(x=>{
        if((x.uid && x.uid===p.uid) || (!x.uid && normName(x.name)===oldN && normUnit(x.unit)===oldU && x.category===p.category)){ x.name = newName; x.unit = newUnit; }
      });
    });
  }
  (DATA.priceAlerts||[]).forEach(a=>{ if(a.productUid===p.uid){ a.name = newName; a.unit = newUnit; } });
  (DATA.priceChangeLog||[]).forEach(c=>{ if(c.productUid===p.uid){ c.name = newName; c.unit = newUnit; } });
  p.name = newName; p.unit = newUnit;
  return null;
}

function removeDuplicateListing(extra, keep){
  if(keep && (normName(extra.name)!==normName(keep.name) || normUnit(extra.unit)!==normUnit(keep.unit))){

  }
  if(keep && !keep.vendor && extra.vendor){ keep.vendor = extra.vendor; keep.vendorSource = extra.vendorSource; }

}

          let nowTxt;
          if(o.field==="unit") nowTxt = `${vEsc(p?p.name:"")}<br><span class="sub" style="margin:0;">size:</span> <b>${o.from===""?"(blank)":(o.to?cleanupDiffHtml(o.from, o.to):vEsc(o.from))}</b>`;
          else if(o.kind==="duplicate") nowTxt = `<b>${vEsc(o.from)}</b>`;
          else if(o.field==="name") nowTxt = o.from==="" ? '<span style="color:var(--red);font-weight:600;">(no name)</span>' : `<b>${o.to?cleanupDiffHtml(o.from, o.to):vEsc(o.from)}</b>`;
          else nowTxt = `<b>${vEsc(p?p.name:o.from)}</b>${SWEEP_MONEY[o.field]?`<br><span class="sub" style="margin:0;">${o.field}: ${fmtUSD(+o.from)}</span>`:""}`;
          let fix, act;
          if(o.decision){
            const d = o.decision;
            fix = d.status==="kept" ? '<span class="pill">On purpose</span>' : d.status==="removed" ? '<span class="pill ok">Removed</span>' : `<span class="pill ok">Fixed</span> ${vEsc(SWEEP_MONEY[o.field] && d.to!=null && d.to!=="" ? fmtUSD(+d.to) : (d.to||""))}`;
            act = d.status==="kept" ? `<button class="btn small" data-undo="${vEsc(o.key)}">Undo</button>` : `<span class="sub" style="margin:0;">${vDate(d.at)}</span>`;
          } else if(o.kind==="duplicate"){
            fix = dupKeep ? `Remove this listing, keep <b>${vEsc(dupKeep.name)}${dupKeep.unit?" ("+vEsc(dupKeep.unit)+")":""}</b><div class="sub" style="margin:0;">on hand: this ${num(p.closing)}, other ${num(dupKeep.closing)}</div>` : "";
            act = `<button class="btn small danger" data-cfix="${vEsc(o.key)}">Remove Extra</button> <button class="btn small" data-ckeep="${vEsc(o.key)}">On purpose</button>`;
          } else if(o.kind==="blank"){
            fix = `<input class="cl-to" data-key="${vEsc(o.key)}" placeholder="Type the product's name">`;
            act = `<button class="btn small primary" data-cfix="${vEsc(o.key)}">Save Name</button> <button class="btn small danger" data-cdelete="${vEsc(o.key)}">Delete</button>`;
          } else {
            if(o.field==="vendor") fix = `<select class="cl-to" data-key="${vEsc(o.key)}">${vendorOpts("")}</select>`;
            else if(SWEEP_MONEY[o.field]) fix = `<div class="dollar-wrap"><input class="cl-to" type="number" step="0.01" min="0" data-key="${vEsc(o.key)}" value="${vEsc(o.to||"")}" placeholder="new ${o.field}"></div>`;
            else fix = `<input class="cl-to" data-key="${vEsc(o.key)}" value="${vEsc(o.to||"")}" placeholder="${o.kind==="rename"?"Type a clearer name":o.field==="unit"?"Type the size":""}">`;
            act = `<button class="btn small primary" data-cfix="${vEsc(o.key)}">Fix</button> <button class="btn small" data-ckeep="${vEsc(o.key)}">On purpose</button>`;
          }
          const isOpen = st.open && st.open.has(o.key);
          const detail = isOpen ? `<tr class="sd-row" data-sdfor="${vEsc(o.key)}"><td colspan="6">${sweepDetailHtml(o)}</td></tr>` : "";
          return `<tr ${o.decision?'style="opacity:.65;"':""}><td class="no-print">${o.decision?"":`<input type="checkbox" class="cl-check" data-key="${vEsc(o.key)}" style="width:auto;" ${st.selected.has(o.key)?"checked":""}>`}</td>
            <td${p?` class="sd-toggle" data-sdkey="${vEsc(o.key)}" title="Click for invoice history and cost details"`:""}>${p?`<span class="sd-caret">${isOpen?"\u25bc":"\u25b6"}</span>`:""}${nowTxt}</td><td><span class="sub" style="margin:0;">${where}</span></td>
            <td><span class="sweep-kind sk-${k.group}">${vEsc(k.label)}</span><br>${vEsc(o.why)}</td><td>${fix}</td><td class="no-print" style="white-space:nowrap;">${act}</td></tr>${detail}`;
        }).join("") || `<tr><td colspan="6" style="text-align:center;padding:26px;color:var(--green);font-weight:600;">🎉 Nothing out of place${st.group!=="ALL"||st.kind!=="ALL"?" here":""}</td></tr>`}</tbody>
      </table></div>${list.length>shown.length?`<div class="sub" style="margin-top:6px;">Showing the first ${shown.length} of ${list.length} — pick a group above to narrow it down.</div>`:""}
    </div>`;
  const rer = ()=>{ renderSweepBody(el); renderNav(); };
  const findItem = key=>all.find(o=>o.key===key);
  const toFor = key=>{ const i = el.querySelector(`.cl-to[data-key="${CSS.escape(key)}"]`); return i ? i.value : null; };
  function applyFix(o, to){
    const p = o.p; if(!p) return "Product no longer on file";
    if(o.kind==="duplicate"){
      const keep = DATA.inventory.find(x=>x.uid===o.dupOf);
      removeDuplicateListing(p, keep); cleanupDecide(o, "removed", keep ? keep.name : null); return null;
    }
    to = String(to==null ? (o.to||"") : to).replace(/\s+/g," ").trim();
    if(o.field==="vendor"){
      if(!to) return "Choose the vendor first";
      p.vendor = to; p.vendorSource = "manual";
    } else if(SWEEP_MONEY[o.field]){
      const v = parseFloat(to);
      if(isNaN(v) || v<0) return `Type the new ${o.field} first`;
      if(o.field==="retail" && v===0) return "Retail can't be $0";
      const oldC = num(p.cost), oldR = num(p.retail);
      p[o.field] = +v.toFixed(2);
      refreshProductValues(p);
      if(o.field!=="buydown") logPriceChange(p, oldC, num(p.cost), oldR, num(p.retail), "site sweep");
      to = v.toFixed(2);
    } else if(o.field==="unit"){ if(!to) return "Type the size first"; const err = renameProductEverywhere(p, p.name, to); if(err) return err; }
    else { if(!to) return "Type the name first"; const err = renameProductEverywhere(p, to, p.unit); if(err) return err; }
    cleanupDecide(o, "fixed", to); return null;
  }
  if(!st.open) st.open = new Set();
  const wireUse = scope=>scope.querySelectorAll('[data-sduse]').forEach(b=>b.onclick = ()=>{
    const inp = el.querySelector(`.cl-to[data-key="${CSS.escape(b.dataset.sduse)}"]`);
    if(!inp) return;
    inp.value = b.dataset.val; inp.focus();
    inp.style.outline = "2px solid var(--green)"; setTimeout(()=>{ inp.style.outline = ""; }, 1200);
    toast(`Fix to set to ${fmtUSD(+b.dataset.val)} \u2014 click Fix to save it`);
  });
  wireUse(el);
  el.querySelectorAll('[data-sdkey]').forEach(td=>td.onclick = e=>{
    if(e.target.closest('input,button,select,a')) return;
    const key = td.dataset.sdkey, tr = td.parentElement, next = tr.nextElementSibling, caret = td.querySelector('.sd-caret');
    if(next && next.classList.contains('sd-row') && next.dataset.sdfor===key){
      next.remove(); st.open.delete(key); if(caret) caret.textContent = "\u25b6"; return;
    }
    const o = findItem(key); if(!o) return;
    const row = document.createElement('tr');
    row.className = "sd-row"; row.dataset.sdfor = key;
    row.innerHTML = `<td colspan="6">${sweepDetailHtml(o)}</td>`;
    tr.after(row); st.open.add(key); if(caret) caret.textContent = "\u25bc";
    wireUse(row);
  });
  el.querySelectorAll('[data-sg]').forEach(b=>b.onclick = ()=>{ st.group = b.dataset.sg; st.kind = "ALL"; st.selected = new Set(); rer(); });
  el.querySelectorAll('[data-ck]').forEach(b=>b.onclick = ()=>{ st.kind = b.dataset.ck; st.selected = new Set(); rer(); });
  el.querySelector('#clHandled').onchange = e=>{ st.showHandled = e.target.checked; rer(); };
  const selCount = ()=>{ el.querySelector('#clSel').textContent = `${[...st.selected].filter(k=>shown.some(o=>o.key===k && !o.decision)).length} selected`; };
  el.querySelectorAll('.cl-check').forEach(cb=>cb.onchange = ()=>{ cb.checked ? st.selected.add(cb.dataset.key) : st.selected.delete(cb.dataset.key); selCount(); });
  el.querySelector('#clAll').onchange = e=>{ shown.filter(o=>!o.decision).forEach(o=>e.target.checked ? st.selected.add(o.key) : st.selected.delete(o.key)); rer(); };
  el.querySelectorAll('[data-cfix]').forEach(b=>b.onclick = ()=>{
    const o = findItem(b.dataset.cfix); if(!o) return;
    if(o.kind==="duplicate"){
      const keep = DATA.inventory.find(x=>x.uid===o.dupOf);
      if(!confirm(`Remove the extra listing "${o.from}"?\n\nIts on-hand count (${num(o.p.closing)}) goes with it; "${keep?keep.name:""}" keeps its own count (${keep?num(keep.closing):0}). Any invoice lines for it move to the listing you keep.`)) return;
    }
    const err = applyFix(o, toFor(o.key));
    if(err){ toast(err, true); return; }
    persist(); toast(o.kind==="duplicate" ? "Extra listing removed" : "Fixed"); st.selected.delete(o.key); rer();
  });
  el.querySelectorAll('[data-ckeep]').forEach(b=>b.onclick = ()=>{ const o = findItem(b.dataset.ckeep); if(!o) return; cleanupDecide(o, "kept"); persist(); st.selected.delete(o.key); rer(); });
  el.querySelectorAll('[data-undo]').forEach(b=>b.onclick = ()=>{ delete DATA.cleanupDecisions[b.dataset.undo]; persist(); rer(); });
  el.querySelectorAll('[data-cdelete]').forEach(b=>b.onclick = ()=>{
    const o = findItem(b.dataset.cdelete); if(!o || !o.p) return;
    if(!confirm(`Delete this unnamed product (${o.p.category}, ${cleanupCurrent(o.p,"unit")||"no size"}, retail ${fmtUSD(num(o.p.retail))}, ${num(o.p.closing)} on hand)? It moves to the Trash until midnight.`)) return;
    trashPut("product", `Unnamed ${o.p.category} product (retail ${fmtUSD(num(o.p.retail))})`, o.p);
    DATA.inventory = DATA.inventory.filter(x=>x!==o.p); cleanupDecide(o, "removed"); persist(); toast("Product deleted"); rer();
  });
  el.querySelector('#clFixSel').onclick = ()=>{
    const pick = shown.filter(o=>!o.decision && st.selected.has(o.key));
    if(!pick.length){ toast("Tick the items to fix first", true); return; }
    const dups = pick.filter(o=>o.kind==="duplicate").length, prices = pick.filter(o=>o.field==="retail"||o.field==="cost").length;
    if(!confirm(`Fix ${pick.length} item${pick.length===1?"":"s"} using the "Fix to" values shown?${prices?`\n\n${prices} of them change a price.`:""}${dups?`\n${dups} of them remove an extra duplicate listing.`:""}`)) return;
    let ok = 0; const errs = [];
    pick.forEach(o=>{ const err = applyFix(o, toFor(o.key)); if(err) errs.push(`${o.p?o.p.name:o.from||"(no name)"}: ${err}`); else { ok++; st.selected.delete(o.key); } });
    persist(); toast(`Fixed ${ok}${errs.length?` — ${errs.length} skipped`:""}`, errs.length>0);
    if(errs.length) alert("These were skipped (nothing in the Fix to box, or it would clash):\n\n" + errs.slice(0,15).join("\n") + (errs.length>15?`\n…and ${errs.length-15} more`:""));
    rer();
  };
  el.querySelector('#clKeepSel').onclick = ()=>{
    const pick = shown.filter(o=>!o.decision && st.selected.has(o.key));
    if(!pick.length){ toast("Tick the items first", true); return; }
    pick.forEach(o=>{ cleanupDecide(o, "kept"); st.selected.delete(o.key); });
    persist(); toast(`Marked ${pick.length} on purpose`); rer();
  };
  selCount();
}

/* ===================== INIT ===================== */
/* ---------- sign-in ----------
   Firebase Authentication: only accounts created in the Firebase console can sign in, and the database
   rules only answer to those accounts. Devices stay signed in until someone presses Sign out. */
let authUser = null;
function showAuthGate(state, msg){
  const gate = document.getElementById('authGate');
  gate.style.display = state==="hidden" ? "none" : "flex";
  document.getElementById('authMsg').textContent = msg || "";
  document.getElementById('authFields').style.display = state==="form" ? "block" : "none";
}
function authErrorText(e){
  const c = (e && e.code) || "";
  if(/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c)) return "Wrong email or password.";
  if(/too-many-requests/.test(c)) return "Too many tries. Wait a few minutes, or use Forgot password.";
  if(/network-request-failed/.test(c)) return "No internet connection.";
  if(/user-disabled/.test(c)) return "This account has been turned off.";
  if(/operation-not-allowed|configuration-not-found/.test(c)) return "Sign-in isn't turned on in Firebase yet (Authentication → Sign-in method → Email/Password).";
  return "Couldn't sign in" + (c ? ` (${c})` : "") + ".";
}
function wireAuthForm(){
  const email = document.getElementById('authEmail'), pw = document.getElementById('authPassword');
  const err = document.getElementById('authError'), btn = document.getElementById('authBtn');
  document.getElementById('authForm').onsubmit = async ev=>{
    ev.preventDefault(); err.textContent = "";
    if(!email.value.trim() || !pw.value){ err.textContent = "Enter your email and password."; return false; }
    btn.disabled = true; btn.textContent = "Signing in…";
    try{ await fbAuth.signInWithEmailAndPassword(email.value.trim(), pw.value); }
    catch(e){ err.textContent = authErrorText(e); pw.value = ""; pw.focus(); }
    btn.disabled = false; btn.textContent = "Sign in";
    return false;
  };
  document.getElementById('authForgot').onclick = async ()=>{
    err.textContent = "";
    if(!email.value.trim()){ err.textContent = "Type your email above first."; email.focus(); return; }
    try{ await fbAuth.sendPasswordResetEmail(email.value.trim()); err.style.color = "#86efac"; err.textContent = "If that email has an account, a reset link is on its way."; }
    catch(e){ err.style.color = ""; err.textContent = authErrorText(e); }
  };
}
async function signOutEverywhere(){
  if(syncReady && hasUnsyncedChanges() && !confirm("Some changes on this device haven't reached the shared data yet. Sign out anyway? They'll be lost.")) return;
  try{ await IDB.set("state", null); }catch(e){}
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  try{ await fbAuth.signOut(); }catch(e){}
  location.reload();
}
function renderAccountFoot(){
  if(!authUser || document.getElementById('accountFoot')) return;
  const foot = document.getElementById('sidebarFoot');
  const box = document.createElement('div');
  box.id = "accountFoot";
  box.style.cssText = "padding:8px 18px 14px;font-size:12px;opacity:.85;";
  box.innerHTML = `<div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Signed in: ${String(authUser.email||"").replace(/[<>&"]/g,"")}</div><button type="button" id="signOutBtn" style="margin-top:6px;background:none;border:1px solid rgba(255,255,255,.5);color:inherit;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;">Sign out</button>`;
  foot.parentNode.insertBefore(box, foot.nextSibling);
  document.getElementById('signOutBtn').onclick = signOutEverywhere;
}
async function hasLocalCopy(){
  try{ const st = await IDB.get("state"); if(st && st.data) return true; }catch(e){}
  try{ return !!localStorage.getItem(STORAGE_KEY); }catch(e){ return false; }
}
(function startWithSignIn(){
  if(!window.fbAuth){
    // Sign-in service didn't load (offline when the page opened, or blocked). A device that was already
    // set up can still work from its own copy; a new device has nothing to show.
    hasLocalCopy().then(has=>{
      if(has){ showAuthGate("hidden"); initApp(); }
      else showAuthGate("msg", "Can't reach the sign-in service. Check the internet connection and reload the page.");
    });
    return;
  }
  wireAuthForm();
  let started = false;
  fbAuth.onAuthStateChanged(user=>{
    authUser = user;
    if(user){
      showAuthGate("hidden"); renderAccountFoot();
      if(!started){ started = true; initApp(); }
    } else if(started){
      location.reload(); // signed out in another tab
    } else {
      showAuthGate("form", "Sign in to continue");
      setTimeout(()=>{ const e = document.getElementById('authEmail'); if(e) e.focus(); }, 50);
    }
  });
})();
async function initApp(){
  // 1) show this device's copy right away
  try{
    const st = await IDB.get("state");
    if(st && st.data){
      DATA = st.data; LOCAL_IS_FRESH = false;
      if(st.base && st.base.hashes) syncBase = st.base;
    }
  }catch(e){ console.warn("IndexedDB read failed -- using browser storage copy", e); }
  migrate(DATA);
  DATA_VERSION++;
  updateSyncBadge();
  // A new device has no copy of its own yet -- keep the loading screen up until the shared copy arrives.
  if(LOCAL_IS_FRESH && window.db) showAuthGate("msg", "Loading your store data…");
  else render();
  // 2) then reconcile with the shared cloud copy (pull teammates' changes, push anything not yet uploaded)
  await connectCloud();
}

<script>
(function(){
  var btn = document.getElementById('mobileMenuBtn');
  var sidebar = document.querySelector('.sidebar');
  var backdrop = document.getElementById('sidebarBackdrop');
  function closeMenu(){ sidebar.classList.remove('open'); backdrop.classList.remove('show'); }
  function openMenu(){ sidebar.classList.add('open'); backdrop.classList.add('show'); }
  if (btn) btn.addEventListener('click', function(){
    sidebar.classList.contains('open') ? closeMenu() : openMenu();
  });
  if (backdrop) backdrop.addEventListener('click', closeMenu);
  document.addEventListener('click', function(e){
    if (e.target.closest && e.target.closest('#nav button')) closeMenu();
  }, true);
})();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
