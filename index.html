      <div class="card">
        <h2>Recent Price Changes</h2>
        <div class="tablewrap" style="max-height:340px;"><table>
          <thead><tr><th>Date</th><th>Product</th><th>Cost</th><th>Retail</th></tr></thead>
          <tbody>${changes.map(c=>`<tr><td>${vDate(c.at)}</td><td>${vEsc(c.name)} ${vEsc(c.unit)}</td>
            <td>${Math.abs(c.oldCost-c.newCost)>=0.005?`${fmtUSD(c.oldCost)} → <b>${fmtUSD(c.newCost)}</b>`:fmtUSD(c.newCost)}</td>
            <td>${Math.abs(c.oldRetail-c.newRetail)>=0.005?`${fmtUSD(c.oldRetail)} → <b>${fmtUSD(c.newRetail)}</b>`:fmtUSD(c.newRetail)}</td></tr>`).join("") || `<tr><td colspan="4" style="color:var(--text-dim);text-align:center;">None yet — they'll show here after price changes or invoice cost changes</td></tr>`}</tbody>
        </table></div>
      </div>
    </div>
    ${prods.length===0?`<div class="btnrow no-print"><button class="btn danger" id="vdDelete">Remove ${vEsc(v.name)} from the vendor list</button></div>`:""}
  `;
  const rerender = rerenderVendors;
  document.getElementById('vdBack').onclick = ()=>{ vendorState.vendorUid = null; rerender(); };
  document.getElementById('vdPriceBtn').onclick = ()=>{ vendorState.priceEditUid = v.uid; rerender(); window.scrollTo(0,0); };
  document.getElementById('vdPLBtn').onclick = ()=>{
    invState.vendor = v.name; invState.category = "ALL"; invState.search = ""; invState.statusFilter = "ALL";
    currentRoute = "inventory"; invSubTab = "productList"; render();
  };
  const al = document.getElementById('vdAlertsLink');
  if(al) al.onclick = e=>{ e.preventDefault(); invSubTab = "priceAlerts"; vendorState.alertsVendor = v.name; vendorState.vendorUid = null; rerender(); };
  const del = document.getElementById('vdDelete');
  if(del) del.onclick = ()=>{
    if(!confirm(`Remove ${v.name} from the vendor list? It moves to the Trash until midnight. Past invoices aren't affected.`)) return;
    trashPut("vendor", v.name, v);
    DATA.vendors = DATA.vendors.filter(x=>x!==v);
    vendorState.vendorUid = null; persist(); rerender();
  };
  el.querySelectorAll('[data-vfield]').forEach(inp=>{
    inp.onchange = ()=>{
      const f = inp.dataset.vfield;
      if(f==="name"){
        const newName = inp.value.replace(/\s+/g,' ').trim();
        const clash = findVendor(newName);
        if(!newName || (clash && clash!==v)){ toast(newName ? `"${clash.name}" is already a vendor — pick a different name` : "Vendor name can't be blank", true); inp.value = v.name; return; }
        const old = v.name;
        if(old===newName) return;
        DATA.inventory.forEach(p=>{ if(p.vendor===old) p.vendor = newName; });
        DATA.priceAlerts.forEach(a=>{ if(a.vendor===old) a.vendor = newName; });
        DATA.priceChangeLog.forEach(c=>{ if(c.vendor===old) c.vendor = newName; });
        v.aliases = v.aliases || [];
        if(vendorKey(old)!==vendorKey(newName) && !v.aliases.some(a=>vendorKey(a)===vendorKey(old))) v.aliases.push(old);
        v.name = newName;
        persist(); rerender(); return;
      }
      if(f==="aliases"){
        v.aliases = inp.value.split(",").map(x=>x.replace(/\s+/g,' ').trim()).filter(x=>x && vendorKey(x)!==vendorKey(v.name));
        const taken = v.aliases.map(a=>findVendor(a)).find(o=>o && o!==v);
        if(taken){ toast(`Heads up: "${taken.name}" is its own vendor, so that spelling still counts as ${taken.name}`, true); }
      } else v[f] = inp.value.trim();
      persist();
    };
  });
  el.querySelectorAll('.daypicker').forEach(dp=>{
    dp.querySelectorAll('button').forEach(b=>{
      b.onclick = ()=>{
        const f = dp.dataset.days, d = b.dataset.day;
        const set = new Set(v[f]||[]);
        set.has(d) ? set.delete(d) : set.add(d);
        v[f] = WEEKDAYS.filter(x=>set.has(x));
        b.classList.toggle('on', set.has(d));
        persist();
      };
    });
  });
  function draw(){
    const q = vendorState.detailSearch.toLowerCase();
    const list = DATA.inventory.filter(p=>p.vendor===v.name && (!q || p.name.toLowerCase().includes(q)) && (vendorState.detailCat==="ALL" || p.category===vendorState.detailCat));
    const body = document.getElementById('vdBody');
    const opts = vendorOptionsHtml(v.name, {none:true, addNew:true});
    body.innerHTML = list.map(p=>{
      const r = num(p.retail), m = r ? (r-effectiveCost(p))/r : 0;
      return `<tr><td>${vEsc(p.name)}${newBadge(p)}</td><td>${vEsc(p.category)}</td><td>${vEsc(p.unit||"")}</td>
        <td>${fmtUSD(num(p.cost))}</td><td>${fmtUSD(r)}</td><td style="color:${m<0?'var(--red)':'inherit'}">${fmtPct(m)}</td>
        <td>${vendorSourcePill(p)}${p.vendorSource==="guess"?` <button class="btn small no-print" data-confirm="${vEsc(p.uid)}" title="Yes, ${vEsc(v.name)} brings this in">✓</button>`:""}</td>
        <td class="no-print"><select data-pv="${vEsc(p.uid)}">${opts}</select></td></tr>`;
    }).join("") || `<tr><td colspan="8" style="color:var(--text-dim);text-align:center;">No products ${q||vendorState.detailCat!=="ALL"?"match":"assigned yet — assign them from Needs Vendor, or they'll fill in from invoices"}</td></tr>`;
    body.querySelectorAll('select[data-pv]').forEach(sel=>{
      sel.value = v.name;
      sel.onchange = ()=>{
        const p = DATA.inventory.find(x=>x.uid===sel.dataset.pv); if(!p) return;
        let val = sel.value;
        if(val==="__new__"){ val = askNewVendorName(); if(!val){ sel.value = v.name; return; } }
        p.vendor = val; p.vendorSource = val ? "manual" : "";
        persist(); toast(val ? `${p.name} moved to ${val}` : `${p.name} now has no vendor`); draw();
      };
    });
    body.querySelectorAll('[data-confirm]').forEach(b=>{
      b.onclick = ()=>{ const p = DATA.inventory.find(x=>x.uid===b.dataset.confirm); if(!p) return; p.vendorSource = "manual"; persist(); draw(); };
    });
  }
  document.getElementById('vdSearch').oninput = e=>{ vendorState.detailSearch = e.target.value; draw(); };
  document.getElementById('vdCat').onchange = e=>{ vendorState.detailCat = e.target.value; draw(); };
  draw();
}

/* ---------- Price Changes (type in a vendor's new price sheet) ---------- */
function renderVendorPriceChanges(el, v){
  if(priceEditDraft.vendorUid!==v.uid) priceEditDraft = {vendorUid:v.uid, rows:{}, search:"", category:"ALL"};
  const d = priceEditDraft;
  const prods = DATA.inventory.filter(p=>p.vendor===v.name);
  const catNames = [...new Set(prods.map(p=>p.category))].sort();
  el.innerHTML = `
    <div class="btnrow no-print" style="margin-bottom:12px;"><button class="btn" id="pcBack">← Back to ${vEsc(v.name)}</button></div>
    <div class="card">
      <h2>💲 Price Changes — ${vEsc(v.name)}</h2>
      <div class="note" style="margin-top:0;">Got a new price sheet from ${vEsc(v.name)}? Type each new <b>cost</b> below and leave the box empty if it didn't change. <b>New Retail</b> fills in with a price that keeps that product's current margin (rounded up to the next .x9) — type over it, or clear it to leave the shelf price alone. Nothing is saved until you click <b>Save Price Changes</b>.</div>
      <div class="form-grid" style="grid-template-columns:2fr 1fr 1fr auto;align-items:end;">
        <div><label>Search product name</label><input id="pcSearch" value="${vEsc(d.search)}"></div>
        <div><label>Category</label><select id="pcCat"><option value="ALL">All Categories</option>${catNames.map(c=>`<option value="${vEsc(c)}" ${d.category===c?"selected":""}>${vEsc(c)}</option>`).join("")}</select></div>
        <div><label>Raise every cost shown by</label><div class="flex" style="gap:6px;"><input id="pcPct" type="number" step="0.1" placeholder="%" style="width:80px;"><select id="pcPctType" style="width:auto;"><option value="pct">%</option><option value="amt">$</option></select></div></div>
        <div><button class="btn" id="pcPctBtn">Apply to Shown</button></div>
      </div>
      <div class="tablewrap" style="max-height:560px;"><table>
        <thead><tr><th>Product</th><th>Unit</th><th>Category</th><th>Current Cost</th><th>New Cost</th><th>Change</th><th>Current Retail</th><th>Margin Now</th><th>New Retail</th><th>New Margin</th></tr></thead>
        <tbody id="pcBody"></tbody>
      </table></div>
      <div class="flex" style="justify-content:space-between;margin-top:12px;flex-wrap:wrap;gap:10px;">
        <div style="font-weight:700;" id="pcSummary"></div>
        <div class="btnrow"><button class="btn danger" id="pcClear">Clear All</button><button class="btn primary" id="pcSave">Save Price Changes</button></div>
      </div>
    </div>
  `;
  const rerender = rerenderVendors;
  const rowOf = uid=>(d.rows[uid] = d.rows[uid] || {cost:"", retail:"", retailTouched:false});
  const parsed = x=>{ const n = parseFloat(x); return isNaN(n) ? null : n; };
  function pending(){
    return prods.map(p=>{
      const r = d.rows[p.uid]; if(!r) return null;
      const nc = parsed(r.cost), nr = parsed(r.retail);
      const costCh = nc!=null && nc>=0 && Math.abs(nc-num(p.cost))>=0.005;
      const retCh = nr!=null && nr>=0 && Math.abs(nr-num(p.retail))>=0.005;
      return (costCh||retCh) ? {p, nc: costCh?nc:num(p.cost), nr: retCh?nr:num(p.retail), costCh, retCh} : null;
    }).filter(Boolean);
  }
  function summary(){
    const ch = pending();
    document.getElementById('pcSummary').textContent = ch.length
      ? `${ch.length} product${ch.length===1?"":"s"} ready to update (${ch.filter(c=>c.costCh).length} cost, ${ch.filter(c=>c.retCh).length} retail)`
      : "No changes yet";
  }
  function rowCells(p, tr){
    const r = rowOf(p.uid), nc = parsed(r.cost), nr = parsed(r.retail);
    const cost = num(p.cost), retail = num(p.retail);
    const diff = nc!=null ? nc-cost : 0;
    tr.querySelector('.pc-change').innerHTML = nc!=null && Math.abs(diff)>=0.005
      ? `<span class="${diff>0?"price-up":"price-down"}">${diff>0?"+":"−"}${fmtUSD(Math.abs(diff))} (${cost?(diff>0?"+":"−")+Math.abs(diff/cost*100).toFixed(1)+"%":"new"})</span>` : "";
    const effC = nc!=null ? nc : cost, effR = nr!=null ? nr : retail;
    const m = marginPctAt(p, effC, effR);
    tr.querySelector('.pc-newm').innerHTML = (nc!=null||nr!=null) && effR ? `<span style="color:${m<0?'var(--red)':'inherit'}">${fmtPct(m)}</span>` : "";
  }
  function draw(){
    const q = d.search.toLowerCase();
    const list = prods.filter(p=>(!q || p.name.toLowerCase().includes(q)) && (d.category==="ALL" || p.category===d.category));
    const body = document.getElementById('pcBody');
    body.innerHTML = "";
    list.forEach(p=>{
      const r = d.rows[p.uid] || {cost:"", retail:""};
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${vEsc(p.name)}</td><td>${vEsc(p.unit||"")}</td><td>${vEsc(p.category)}</td><td>${fmtUSD(num(p.cost))}</td>
        <td><div class="dollar-wrap"><input class="editable-cell pc-cost" type="number" step="0.01" min="0" value="${vEsc(r.cost)}" placeholder="${num(p.cost).toFixed(2)}"></div></td>
        <td class="pc-change"></td><td>${fmtUSD(num(p.retail))}</td><td>${num(p.retail)?fmtPct(marginPctAt(p, num(p.cost), num(p.retail))):"—"}</td>
        <td><div class="dollar-wrap"><input class="editable-cell pc-retail" type="number" step="0.01" min="0" value="${vEsc(r.retail)}" placeholder="${num(p.retail).toFixed(2)}"></div></td>
        <td class="pc-newm"></td>`;
      const costIn = tr.querySelector('.pc-cost'), retIn = tr.querySelector('.pc-retail');
      costIn.oninput = ()=>{
        const row = rowOf(p.uid); row.cost = costIn.value;
        if(!row.retailTouched){
          const nc = parsed(costIn.value);
          const sug = nc!=null && Math.abs(nc-num(p.cost))>=0.005 ? smartSuggestedRetail(p, nc) : null;
          row.retail = sug!=null && Math.abs(sug-num(p.retail))>=0.005 ? sug.toFixed(2) : "";
          retIn.value = row.retail;
        }
        rowCells(p, tr); summary();
      };
      retIn.oninput = ()=>{ const row = rowOf(p.uid); row.retail = retIn.value; row.retailTouched = true; rowCells(p, tr); summary(); };
      body.appendChild(tr);
      rowCells(p, tr);
    });
    if(!list.length) body.innerHTML = `<tr><td colspan="10" style="color:var(--text-dim);text-align:center;">No ${vEsc(v.name)} products match</td></tr>`;
    summary();
  }
  document.getElementById('pcBack').onclick = ()=>{ vendorState.priceEditUid = null; rerender(); };
  document.getElementById('pcSearch').oninput = e=>{ d.search = e.target.value; draw(); };
  document.getElementById('pcCat').onchange = e=>{ d.category = e.target.value; draw(); };
  document.getElementById('pcPctBtn').onclick = ()=>{
    const amt = parseFloat(document.getElementById('pcPct').value);
    if(isNaN(amt)){ toast("Enter how much to raise costs by", true); return; }
    const type = document.getElementById('pcPctType').value;
    const q = d.search.toLowerCase();
    prods.filter(p=>(!q || p.name.toLowerCase().includes(q)) && (d.category==="ALL" || p.category===d.category)).forEach(p=>{
      const cost = num(p.cost); if(!cost) return;
      const nc = Math.max(0, +(type==="pct" ? cost*(1+amt/100) : cost+amt).toFixed(2));
      const row = rowOf(p.uid); row.cost = nc.toFixed(2);
      if(!row.retailTouched){ const sug = smartSuggestedRetail(p, nc); row.retail = sug!=null && Math.abs(sug-num(p.retail))>=0.005 ? sug.toFixed(2) : ""; }
    });
    draw();
  };
  document.getElementById('pcClear').onclick = ()=>{ d.rows = {}; draw(); };
  document.getElementById('pcSave').onclick = ()=>{
    const ch = pending();
    if(!ch.length){ toast("Type a new cost or retail first", true); return; }
    const sample = ch.slice(0,6).map(c=>`• ${c.p.name}${c.p.unit?" ("+c.p.unit+")":""}: ${c.costCh?`cost ${fmtUSD(num(c.p.cost))}→${fmtUSD(c.nc)}`:""}${c.costCh&&c.retCh?", ":""}${c.retCh?`retail ${fmtUSD(num(c.p.retail))}→${fmtUSD(c.nr)}`:""}`).join("\n");
    if(!confirm(`Save price changes for ${ch.length} ${v.name} product${ch.length===1?"":"s"}?\n\n${sample}${ch.length>6?`\n…and ${ch.length-6} more`:""}`)) return;
    ch.forEach(c=>{
      const oldC = num(c.p.cost), oldR = num(c.p.retail);
      c.p.cost = c.nc; c.p.retail = c.nr; refreshProductValues(c.p);
      logPriceChange(c.p, oldC, c.nc, oldR, c.nr, "price sheet");
      if(c.retCh) DATA.priceAlerts.forEach(a=>{ if(a.status==="open" && a.productUid===c.p.uid){ a.status = "updated"; a.newRetail = c.nr; a.resolvedAt = new Date().toISOString(); } });
    });
    persist();
    toast(`Saved price changes for ${ch.length} product${ch.length===1?"":"s"}`);
    priceEditDraft = {vendorUid:null, rows:{}, search:"", category:"ALL"};
    vendorState.priceEditUid = null; rerender();
  };
  draw();
}

/* ---------- Needs Vendor / Confirm Guesses ---------- */
function renderVendorReview(el, mode){
  const isNeeds = mode==="needs";
  const inPool = p=>isNeeds ? !p.vendor : (p.vendor && p.vendorSource==="guess");
  const catNames = [...new Set(DATA.inventory.filter(inPool).map(p=>p.category))].sort();
  if(vendorState.reviewCat!=="ALL" && !catNames.includes(vendorState.reviewCat)) vendorState.reviewCat = "ALL";
  el.innerHTML = `
    <div class="note">${isNeeds
      ? "These products have never come in on an invoice that's been entered here, so there's nothing that says who delivers them. Click the vendor that brings each one in — every click saves right away for everyone. The buttons offered first are the vendors that already bring in the most products in that category. Use the checkboxes to assign a bunch at once."
      : "These were filled in from the product's category or brand (for example, every candy bar on file comes from St. Joe) rather than from an actual invoice. Click ✓ if it's right, or pick the correct vendor. They also confirm themselves the next time the product comes in on an invoice."}</div>
    <div class="card">
      <div class="form-grid" style="grid-template-columns:2fr 1fr;">
        <div><label>Search product name</label><input id="rvSearch" value="${vEsc(vendorState.reviewSearch)}"></div>
        <div><label>Category</label><select id="rvCat"><option value="ALL">All Categories</option>${catNames.map(c=>`<option value="${vEsc(c)}" ${vendorState.reviewCat===c?"selected":""}>${vEsc(c)}</option>`).join("")}</select></div>
      </div>
      <div class="bulkbar no-print">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin:0;"><input type="checkbox" id="rvAll" style="width:auto;"> Select all shown</label>
        <span class="sub" style="margin:0;" id="rvSelCount">0 selected</span>
        <select id="rvBulkVendor" style="width:auto;min-width:180px;">${vendorOptionsHtml("", {placeholder:"Choose vendor…", addNew:true})}</select>
        <button class="btn primary" id="rvBulkBtn">Assign Selected</button>
        ${isNeeds?"":`<button class="btn" id="rvConfirmAll">✓ Confirm All Shown</button>`}
      </div>
      <div class="tablewrap" style="max-height:620px;"><table>
        <thead><tr><th class="no-print"></th><th>Product</th><th>Category</th><th>Unit</th>${isNeeds?"":"<th>Guessed Vendor</th>"}<th class="no-print">${isNeeds?"Who brings it in?":"Or pick another"}</th></tr></thead>
        <tbody id="rvBody"></tbody>
      </table></div>
      <div class="sub" id="rvCount" style="margin-top:8px;"></div>
    </div>
  `;
  const sel = vendorState.reviewSelected;
  function shown(){
    const q = vendorState.reviewSearch.toLowerCase();
    return DATA.inventory.filter(p=>inPool(p) && (!q || p.name.toLowerCase().includes(q)) && (vendorState.reviewCat==="ALL" || p.category===vendorState.reviewCat));
  }
  function assign(list, name, source){
    list.forEach(p=>{ p.vendor = name; p.vendorSource = source || "manual"; sel.delete(p.uid); });
    persist();
    drawVendorTabs();
    draw();
  }
  function draw(){
    const list = shown();
    const tops = topVendorsByCategory();
    const allOpts = vendorOptionsHtml("", {placeholder: isNeeds ? "Other…" : "Change to…", addNew:true});
    const body = document.getElementById('rvBody');
    body.innerHTML = list.map(p=>{
      const chips = (tops[p.category]||[]).filter(n=>n!==p.vendor).slice(0, isNeeds?3:2);
      return `<tr data-uid="${vEsc(p.uid)}">
        <td class="no-print"><input type="checkbox" class="rv-check" style="width:auto;" ${sel.has(p.uid)?"checked":""}></td>
        <td>${vEsc(p.name)}${newBadge(p)}</td><td>${vEsc(p.category)}</td><td>${vEsc(p.unit||"")}</td>
        ${isNeeds?"":`<td><b>${vEsc(p.vendor)}</b> <button class="btn small no-print rv-ok" title="Yes, that's right">✓ Right</button></td>`}
        <td class="no-print"><div class="flex" style="gap:0;flex-wrap:wrap;align-items:center;">
          ${chips.map(n=>`<button type="button" class="vchip" data-v="${vEsc(n)}">${vEsc(n)}</button>`).join("")}
          <select class="rv-other" style="width:auto;min-width:120px;margin-left:2px;">${allOpts}</select></div></td></tr>`;
    }).join("") || `<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--green);font-weight:600;">${isNeeds?"🎉 Every product has a vendor":"🎉 No guesses left to confirm"}${vendorState.reviewSearch||vendorState.reviewCat!=="ALL"?" in this filter":""}</td></tr>`;
    const total = DATA.inventory.filter(inPool).length;
    document.getElementById('rvCount').textContent = `Showing ${list.length.toLocaleString()} of ${total.toLocaleString()} ${isNeeds?"products without a vendor":"guesses"}`;
    document.getElementById('rvSelCount').textContent = `${[...sel].filter(u=>list.some(p=>p.uid===u)).length} selected`;
    document.getElementById('rvAll').checked = list.length>0 && list.every(p=>sel.has(p.uid));
    body.querySelectorAll('tr[data-uid]').forEach(tr=>{
      const p = DATA.inventory.find(x=>x.uid===tr.dataset.uid); if(!p) return;
      tr.querySelector('.rv-check').onchange = e=>{ e.target.checked ? sel.add(p.uid) : sel.delete(p.uid); document.getElementById('rvSelCount').textContent = `${[...sel].filter(u=>list.some(x=>x.uid===u)).length} selected`; };
      tr.querySelectorAll('.vchip').forEach(b=>b.onclick = ()=>{ assign([p], b.dataset.v); toast(`${p.name} → ${b.dataset.v}`); });
      const ok = tr.querySelector('.rv-ok'); if(ok) ok.onclick = ()=>assign([p], p.vendor);
      const other = tr.querySelector('.rv-other');
      other.onchange = ()=>{
        let val = other.value;
        if(val==="__new__") val = askNewVendorName();
        if(!val){ other.value = ""; return; }
        assign([p], val); toast(`${p.name} → ${val}`);
      };
    });
  }
  document.getElementById('rvSearch').oninput = e=>{ vendorState.reviewSearch = e.target.value; draw(); };
  document.getElementById('rvCat').onchange = e=>{ vendorState.reviewCat = e.target.value; draw(); };
  document.getElementById('rvAll').onchange = e=>{ shown().forEach(p=>e.target.checked ? sel.add(p.uid) : sel.delete(p.uid)); draw(); };
  document.getElementById('rvBulkBtn').onclick = ()=>{
    const bulkSel = document.getElementById('rvBulkVendor');
    let val = bulkSel.value;
    const list = shown().filter(p=>sel.has(p.uid));
    if(!list.length){ toast("Check the products to assign first", true); return; }
    if(val==="__new__") val = askNewVendorName();
    if(!val){ bulkSel.value = ""; toast("Choose a vendor first", true); return; }
    assign(list, val);
    bulkSel.innerHTML = vendorOptionsHtml("", {placeholder:"Choose vendor…", addNew:true});
    toast(`${list.length} product${list.length===1?"":"s"} assigned to ${val}`);
  };
  const ca = document.getElementById('rvConfirmAll');
  if(ca) ca.onclick = ()=>{
    const list = shown();
    if(!list.length) return;
    if(!confirm(`Confirm the guessed vendor for all ${list.length} product${list.length===1?"":"s"} shown?`)) return;
    list.forEach(p=>{ p.vendorSource = "manual"; sel.delete(p.uid); });
    persist(); drawVendorTabs(); draw();
    toast(`Confirmed ${list.length} vendor${list.length===1?"":"s"}`);
  };
  draw();
}

/* ---------- Price Alerts (cost changes spotted on invoices) ---------- */
function renderVendorAlerts(el){
  const vendorsWithAlerts = [...new Set((DATA.priceAlerts||[]).map(a=>a.vendor).filter(Boolean))].sort();
  el.innerHTML = `
    <div class="note">When an invoice comes in with a different unit cost than what's on file, the new cost is saved automatically (same as always) and the product lands here so you can decide whether the shelf price should move too. <b>Suggested</b> keeps the margin the product had before the cost changed, rounded up to the next .x9.</div>
    <div class="form-grid" style="grid-template-columns:1fr auto;align-items:end;">
      <div><label>Vendor</label><select id="paVendor"><option value="ALL">All Vendors</option>${vendorsWithAlerts.map(n=>`<option value="${vEsc(n)}" ${vendorState.alertsVendor===n?"selected":""}>${vEsc(n)}</option>`).join("")}</select></div>
      <div><label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" id="paResolved" style="width:auto;" ${vendorState.alertsShowResolved?"checked":""}> Show handled alerts</label></div>
    </div>
    <div id="paBody"></div>
  `;
  function resolve(a, p, retail){
    if(retail!=null){
      const oldR = num(p.retail);
      p.retail = retail; refreshProductValues(p);
      logPriceChange(p, num(p.cost), num(p.cost), oldR, retail, "price alert", {invoice:a.invoice});
      a.status = "updated"; a.newRetail = retail;
    } else a.status = "kept";
    a.resolvedAt = new Date().toISOString();
  }
  function draw(){
    const list = (DATA.priceAlerts||[]).filter(a=>(vendorState.alertsShowResolved || a.status==="open") && (vendorState.alertsVendor==="ALL" || a.vendor===vendorState.alertsVendor));
    const box = document.getElementById('paBody');
    if(!list.length){
      box.innerHTML = `<div class="card" style="text-align:center;padding:30px;"><div style="font-size:30px;">✅</div><div style="font-weight:700;margin-top:6px;">No open price alerts</div><div class="sub">Cost changes will show up here as invoices are entered.</div></div>`;
      return;
    }
    const groups = new Map();
    list.forEach(a=>{ const k = a.vendor||"Unknown vendor"; if(!groups.has(k)) groups.set(k, []); groups.get(k).push(a); });
    box.innerHTML = [...groups.entries()].map(([vn, alerts])=>{
      const openCount = alerts.filter(a=>a.status==="open").length;
      return `<div class="card"><div class="flex" style="justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <h2 style="margin:0;">${vEsc(vn)} <span class="pill ${openCount?"bad":"ok"}">${openCount} open</span></h2>
        ${openCount?`<button class="btn small primary no-print" data-acceptall="${vEsc(vn)}">Accept All Suggested</button>`:""}</div>
        <div class="tablewrap" style="margin-top:10px;"><table>
          <thead><tr><th>Product</th><th>Invoice</th><th>Cost</th><th>Change</th><th>Retail Now</th><th>Margin Was → Now</th><th>Suggested</th><th class="no-print">Action</th></tr></thead>
          <tbody>${alerts.map(a=>{
            const p = DATA.inventory.find(x=>x.uid===a.productUid);
            const diff = a.newCost - a.oldCost;
            const retail = p ? num(p.retail) : num(a.retailAtAlert);
            const was = p ? marginPctAt(p, a.oldCost, retail) : 0, now = p ? marginPctAt(p, a.newCost, retail) : 0;
            const sug = p ? smartSuggestedRetail(Object.assign({}, p, {cost:a.oldCost, retail}), a.newCost) : null;
            const cst = p ? conditionStatus(p, a.newCost, retail) : {cond:null};
            const action = a.status!=="open"
              ? (a.status==="updated" ? `<span class="pill ok">Retail set to ${fmtUSD(a.newRetail)}</span>` : `<span class="pill">Kept retail</span>`) + ` <span class="sub" style="margin:0;">${vDate(a.resolvedAt)}</span>`
              : !p ? `<span class="sub" style="margin:0;">Product no longer on file</span> <button class="btn small" data-keep="${a.uid}">Dismiss</button>`
              : `<div class="flex" style="gap:6px;flex-wrap:wrap;">
                  ${sug!=null && Math.abs(sug-retail)>=0.005?`<button class="btn small primary" data-sug="${a.uid}" data-val="${sug}">Set ${fmtUSD(sug)}</button>`:""}
                  <div class="dollar-wrap" style="width:90px;"><input class="editable-cell" type="number" step="0.01" min="0" placeholder="other" data-custom="${a.uid}"></div>
                  <button class="btn small" data-setcustom="${a.uid}">Set</button>
                  <button class="btn small" data-keep="${a.uid}">Keep ${fmtUSD(retail)}</button></div>`;
            return `<tr><td><b>${vEsc(a.name)}</b> ${vEsc(a.unit)}<div class="sub" style="margin:0;">${vEsc(a.category||"")}</div></td>
              <td>${vEsc(a.invoice||"")}<div class="sub" style="margin:0;">${vDate(a.date||a.createdAt)}</div></td>
              <td>${fmtUSD(a.oldCost)} → <b>${fmtUSD(a.newCost)}</b></td>
              <td><span class="${diff>0?"price-up":"price-down"}">${diff>0?"+":"−"}${fmtUSD(Math.abs(diff))} (${a.oldCost?(diff>0?"+":"−")+Math.abs(diff/a.oldCost*100).toFixed(1)+"%":""})</span></td>
              <td>${fmtUSD(retail)}</td>
              <td>${p&&retail?`${fmtPct(was)} → <span style="color:${now<was?'var(--red)':'var(--green)'};font-weight:600;">${fmtPct(now)}</span>`:"—"}</td>
              <td>${sug!=null?fmtUSD(sug):"—"}${cst.cond?`<div class="sub" style="margin:0;">target ${condTargetText(cst.cond)}</div>`:""}</td>
              <td class="no-print">${action}</td></tr>`;
          }).join("")}</tbody></table></div></div>`;
    }).join("");
    const find = uid=>{ const a = DATA.priceAlerts.find(x=>x.uid===uid); return [a, a ? DATA.inventory.find(x=>x.uid===a.productUid) : null]; };
    const done = msg=>{ persist(); toast(msg); drawVendorTabs(); draw(); };
    box.querySelectorAll('[data-sug]').forEach(b=>b.onclick = ()=>{ const [a,p] = find(b.dataset.sug); if(!a||!p) return; resolve(a, p, parseFloat(b.dataset.val)); done(`${p.name} retail set to ${fmtUSD(p.retail)}`); });
    box.querySelectorAll('[data-setcustom]').forEach(b=>b.onclick = ()=>{
      const [a,p] = find(b.dataset.setcustom); if(!a||!p) return;
      const val = parseFloat((box.querySelector(`[data-custom="${b.dataset.setcustom}"]`)||{}).value);
      if(isNaN(val) || val<0){ toast("Type the retail price first", true); return; }
      resolve(a, p, +val.toFixed(2)); done(`${p.name} retail set to ${fmtUSD(p.retail)}`);
    });
    box.querySelectorAll('[data-keep]').forEach(b=>b.onclick = ()=>{ const [a,p] = find(b.dataset.keep); if(!a) return; resolve(a, p, null); done(p ? `Kept ${p.name} at ${fmtUSD(p.retail)}` : "Alert dismissed"); });
    box.querySelectorAll('[data-acceptall]').forEach(b=>b.onclick = ()=>{
      const open = list.filter(a=>a.status==="open" && (a.vendor||"Unknown vendor")===b.dataset.acceptall);
      let n = 0;
      if(!confirm(`Set every open ${b.dataset.acceptall} alert to its suggested retail? Alerts without a suggestion are left open.`)) return;
      open.forEach(a=>{
        const p = DATA.inventory.find(x=>x.uid===a.productUid); if(!p) return;
        const sug = smartSuggestedRetail(Object.assign({}, p, {cost:a.oldCost}), a.newCost);
        if(sug==null) return;
        if(Math.abs(sug-num(p.retail))<0.005) resolve(a, p, null); else resolve(a, p, sug);
        n++;
      });
      done(`Updated ${n} product${n===1?"":"s"}`);
    });
  }
  document.getElementById('paVendor').onchange = e=>{ vendorState.alertsVendor = e.target.value; draw(); };
  document.getElementById('paResolved').onchange = e=>{ vendorState.alertsShowResolved = e.target.checked; draw(); };
  draw();
}


/* ===================== VIEW: MARGIN CONDITIONS (Inventory -> Pricing) ===================== */
let condFormState = {editUid:null, vendors:[], cats:[], units:[], basis:"margin", min:"", max:"", note:"", sizeSearch:""};
function condStatusPill(s){
  if(s==="below") return '<span class="pill bad">Below target</span>';
  if(s==="above") return '<span class="pill warn">Above target</span>';
  if(s==="ok") return '<span class="pill ok">In range</span>';
  if(s==="unknown") return '<span class="pill">No price</span>';
  return '<span class="pill" style="opacity:.7;">No condition</span>';
}
function condSetKey(list, norm){ return list.map(norm).sort().join("\u0001"); }
function renderMarginConditions(el){
  const catNames = [...new Set(DATA.inventory.map(p=>p.category))].sort();
  const f = condFormState;
  const editing = f.editUid ? DATA.marginConditions.find(c=>c.uid===f.editUid) : null;
  if(f.editUid && !editing) f.editUid = null;
  const stats = new Map();
  let noCond = 0;
  DATA.inventory.forEach(p=>{
    const st = conditionStatus(p);
    if(!st.cond){ noCond++; return; }
    const x = stats.get(st.cond.uid) || {n:0, below:0, above:0, ok:0};
    x.n++; if(st.status==="below") x.below++; else if(st.status==="above") x.above++; else if(st.status==="ok") x.ok++;
    stats.set(st.cond.uid, x);
  });
  const conds = (DATA.marginConditions||[]).slice().sort((a,b)=>
    (condCats(a)[0]||"~").localeCompare(condCats(b)[0]||"~") || condSpecificity(b)-condSpecificity(a) || (condUnits(a)[0]||"").localeCompare(condUnits(b)[0]||"") || (condVendors(a)[0]||"").localeCompare(condVendors(b)[0]||""));
  const listCell = (arr, any)=>arr.length ? arr.map(x=>`<span class="cond-tag">${vEsc(x)}</span>`).join("") : `<span style="color:var(--text-dim);">${any}</span>`;
  el.innerHTML = `
    <div class="note">Set the margin or markup you're aiming for. A condition can cover one or more vendors, categories and/or sizes — any mix (e.g. <i>BEER + 12pk, 18pk, 24pk</i>). When more than one fits a product, <b>the most specific one wins</b>: sizes beat categories, categories beat vendors, and a condition listing fewer picks beats a broader one. Use a range so small week-to-week cost swings that stay inside it don't call for a new price; price alerts from invoices only fire when a cost change pushes a product <i>outside</i> its range.<br>
      <b>Margin</b> = profit ÷ retail. <b>Markup</b> = profit ÷ cost. Example: cost $1.00, retail $1.25 → 25% markup, 20% margin. Cigarettes &amp; tobacco use cost after buydown.</div>
    <div class="card" id="mcFormCard">
      <h2>${editing ? "Edit Condition" : "Add a Condition"}</h2>
      <div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end;">
        <div><label>Measure</label><select id="mcBasis"><option value="margin" ${f.basis==="margin"?"selected":""}>Margin %</option><option value="markup" ${f.basis==="markup"?"selected":""}>Markup %</option></select></div>
        <div><label>From %</label><input id="mcMin" type="number" step="0.1" min="0" value="${vEsc(f.min)}" placeholder="e.g. 37"></div>
        <div><label>To % (optional)</label><input id="mcMax" type="number" step="0.1" min="0" value="${vEsc(f.max)}" placeholder="e.g. 40"></div>
        <div><label>Note (optional)</label><input id="mcNote" value="${vEsc(f.note)}"></div>
      </div>
      <div class="cond-pick">
        <div class="cond-pick-head"><b>Vendors</b> <span class="sub" style="margin:0;" id="mcVendCount"></span>
          <a href="#" id="mcVendNone">clear</a></div>
        <div class="cond-boxes" id="mcVends">${vendorNames().map(n=>`<label class="cond-check"><input type="checkbox" value="${vEsc(n)}" ${f.vendors.includes(n)?"checked":""}> ${vEsc(n)}</label>`).join("")}</div>
      </div>
      <div class="cond-pick">
        <div class="cond-pick-head"><b>Categories</b> <span class="sub" style="margin:0;" id="mcCatCount"></span>
          <a href="#" id="mcCatAll">select all</a> · <a href="#" id="mcCatNone">clear</a></div>
        <div class="cond-boxes" id="mcCats">${catNames.map(c=>`<label class="cond-check"><input type="checkbox" value="${vEsc(c)}" ${f.cats.some(x=>normName(x)===normName(c))?"checked":""}> ${vEsc(c)}</label>`).join("")}</div>
      </div>
      <div class="cond-pick">
        <div class="cond-pick-head"><b>Unit / Sizes</b> <span class="sub" style="margin:0;" id="mcSizeCount"></span>
          <input id="mcSizeSearch" placeholder="Find a size…" value="${vEsc(f.sizeSearch)}" style="width:150px;padding:5px 8px;">
          <a href="#" id="mcSizeAll">select all shown</a> · <a href="#" id="mcSizeNone">clear</a></div>
        <div class="cond-boxes" id="mcSizes"></div>
        <div class="flex" style="gap:6px;margin-top:6px;align-items:center;"><input id="mcSizeAdd" placeholder="Size not listed? type it" style="width:200px;padding:5px 8px;"><button class="btn small" id="mcSizeAddBtn">Add Size</button></div>
      </div>
      <div class="flex" style="gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center;">
        <button class="btn primary" id="mcAdd">${editing ? "Save Changes" : "Add Condition"}</button>
        ${editing ? `<button class="btn" id="mcCancel">Cancel</button>` : ""}
        <div class="sub" id="mcPreview" style="margin:0;flex:1;min-width:240px;"></div>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="lbl">Conditions</div><div class="val">${conds.length}</div></div>
      <div class="kpi"><div class="lbl">Products Covered</div><div class="val">${(DATA.inventory.length-noCond).toLocaleString()}</div><div class="sub">${noCond.toLocaleString()} have no condition yet</div></div>
      <div class="kpi"><div class="lbl">Below Target</div><div class="val" style="color:var(--red);">${[...stats.values()].reduce((t,x)=>t+x.below,0)}</div><div class="sub"><a href="#" id="mcGoCheck">see Margin Check report</a></div></div>
      <div class="kpi"><div class="lbl">Above Target</div><div class="val">${[...stats.values()].reduce((t,x)=>t+x.above,0)}</div></div>
    </div>
    <div class="card">
      <h2>Your Conditions</h2>
      <div class="tablewrap"><table>
        <thead><tr><th>Vendors</th><th>Categories</th><th>Sizes</th><th>Measure</th><th>From %</th><th>To %</th><th>Products</th><th>Below</th><th>In Range</th><th>Above</th><th>Note</th><th class="no-print"></th></tr></thead>
        <tbody>${conds.map(c=>{ const x = stats.get(c.uid) || {n:0,below:0,above:0,ok:0}; return `<tr ${editing===c?'style="background:var(--gold-bg);"':""}>
          <td style="max-width:200px;">${listCell(condVendors(c), "Any")}</td>
          <td style="max-width:220px;">${listCell(condCats(c), "Any")}</td><td style="max-width:260px;">${listCell(condUnits(c), "Any")}</td>
          <td><select data-cf="basis" data-uid="${c.uid}" style="width:auto;"><option value="margin" ${c.basis!=="markup"?"selected":""}>Margin</option><option value="markup" ${c.basis==="markup"?"selected":""}>Markup</option></select></td>
          <td><input class="editable-cell" style="width:70px;" type="number" step="0.1" data-cf="min" data-uid="${c.uid}" value="${vEsc(c.min)}"></td>
          <td><input class="editable-cell" style="width:70px;" type="number" step="0.1" data-cf="max" data-uid="${c.uid}" value="${condHasMax(c)?vEsc(c.max):""}" placeholder="—"></td>
          <td>${x.n}${x.n===0?' <span class="sub" style="margin:0;" title="Every product it matches is covered by a more specific condition, or nothing matches">(none)</span>':""}</td>
          <td style="color:${x.below?'var(--red)':'inherit'};font-weight:${x.below?700:400};">${x.below}</td><td>${x.ok}</td><td>${x.above}</td>
          <td><input class="editable-cell" data-cf="note" data-uid="${c.uid}" value="${vEsc(c.note||"")}"></td>
          <td class="no-print" style="white-space:nowrap;"><button class="btn small" data-cedit="${c.uid}">Edit</button> <button class="btn small danger" data-cdel="${c.uid}">Delete</button></td></tr>`; }).join("")
          || `<tr><td colspan="12" style="text-align:center;color:var(--text-dim);padding:20px;">No conditions yet — add your first one above (e.g. tick BEER, tick 12pk, Markup, From 15).</td></tr>`}</tbody>
      </table></div>
    </div>
  `;
  const $ = id=>document.getElementById(id);
  const readTop = ()=>{ f.basis = $('mcBasis').value; f.min = $('mcMin').value; f.max = $('mcMax').value; f.note = $('mcNote').value; };
  // sizes offered = sizes used in the ticked categories (all categories if none ticked), plus any already picked
  function sizeOptions(){
    const inCats = DATA.inventory.filter(p=>!f.cats.length || f.cats.some(c=>normName(c)===normName(p.category)));
    const counts = new Map();
    inCats.forEach(p=>{ const u = (p.unit||"").trim(); if(!u) return; const k = normUnit(u); const e = counts.get(k) || {label:u, n:0}; e.n++; counts.set(k, e); });
    f.units.forEach(u=>{ if(!counts.has(normUnit(u))) counts.set(normUnit(u), {label:u, n:0}); });
    return [...counts.values()].sort((a,b)=>b.n-a.n || a.label.localeCompare(b.label));
  }
  function drawSizes(){
    const q = f.sizeSearch.toLowerCase();
    const opts = sizeOptions().filter(o=>!q || o.label.toLowerCase().includes(q) || f.units.some(u=>normUnit(u)===normUnit(o.label)));
    $('mcSizes').innerHTML = opts.length ? opts.map(o=>`<label class="cond-check"><input type="checkbox" value="${vEsc(o.label)}" ${f.units.some(u=>normUnit(u)===normUnit(o.label))?"checked":""}> ${vEsc(o.label)}${o.n?` <span class="cond-n">${o.n}</span>`:""}</label>`).join("")
      : `<span class="sub" style="margin:0;">No sizes match</span>`;
    $('mcSizes').querySelectorAll('input').forEach(cb=>cb.onchange = ()=>{
      f.units = f.units.filter(u=>normUnit(u)!==normUnit(cb.value));
      if(cb.checked) f.units.push(cb.value);
      counts(); preview();
    });
    counts();
  }
  function counts(){
    $('mcVendCount').textContent = f.vendors.length ? `(${f.vendors.length} picked)` : "(none = any vendor)";
    $('mcCatCount').textContent = f.cats.length ? `(${f.cats.length} picked)` : "(none = any category)";
    $('mcSizeCount').textContent = f.units.length ? `(${f.units.length} picked: ${f.units.slice(0,6).join(", ")}${f.units.length>6?"…":""})` : "(none = any size)";
  }
  function probe(){ return {uid:"__probe", vendors:f.vendors.slice(), categories:f.cats.slice(), units:f.units.slice(), basis:f.basis, min:f.min||0, max:f.max}; }
  function preview(){
    readTop();
    const box = $('mcPreview');
    const pr = probe();
    if(!(pr.vendors.length || pr.categories.length || pr.units.length)){ box.textContent = "Tick at least one vendor, category or size."; return; }
    const matching = DATA.inventory.filter(p=>condMatches(pr, p));
    const wouldGovern = matching.filter(p=>{ const c = conditionFor(p); return !c || c.uid===f.editUid || condSpecificity(c) < condSpecificity(pr); });
    box.innerHTML = `Matches <b>${matching.length}</b> product${matching.length===1?"":"s"}${matching.length!==wouldGovern.length?` — <b>${wouldGovern.length}</b> would use it (the rest have a more specific condition)`:""}.${matching.length?` e.g. ${matching.slice(0,4).map(p=>vEsc(p.name)+(p.unit?" ("+vEsc(p.unit)+")":"")).join(", ")}${matching.length>4?"…":""}`:""}`;
  }
  $('mcVends').querySelectorAll('input').forEach(cb=>cb.onchange = ()=>{
    f.vendors = f.vendors.filter(v=>v!==cb.value);
    if(cb.checked) f.vendors.push(cb.value);
    counts(); preview();
  });
  $('mcVendNone').onclick = e=>{ e.preventDefault(); f.vendors = []; $('mcVends').querySelectorAll('input').forEach(cb=>cb.checked = false); counts(); preview(); };
  $('mcCats').querySelectorAll('input').forEach(cb=>cb.onchange = ()=>{
    f.cats = f.cats.filter(c=>normName(c)!==normName(cb.value));
    if(cb.checked) f.cats.push(cb.value);
    drawSizes(); preview();
  });
  $('mcCatAll').onclick = e=>{ e.preventDefault(); f.cats = catNames.slice(); $('mcCats').querySelectorAll('input').forEach(cb=>cb.checked = true); drawSizes(); preview(); };
  $('mcCatNone').onclick = e=>{ e.preventDefault(); f.cats = []; $('mcCats').querySelectorAll('input').forEach(cb=>cb.checked = false); drawSizes(); preview(); };
  $('mcSizeSearch').oninput = e=>{ f.sizeSearch = e.target.value; drawSizes(); };
  $('mcSizeAll').onclick = e=>{ e.preventDefault(); $('mcSizes').querySelectorAll('input').forEach(cb=>{ if(!cb.checked && !f.units.some(u=>normUnit(u)===normUnit(cb.value))) f.units.push(cb.value); }); drawSizes(); preview(); };
  $('mcSizeNone').onclick = e=>{ e.preventDefault(); f.units = []; drawSizes(); preview(); };
  $('mcSizeAddBtn').onclick = ()=>{
    const v = $('mcSizeAdd').value.trim(); if(!v) return;
    if(!f.units.some(u=>normUnit(u)===normUnit(v))) f.units.push(v);
    $('mcSizeAdd').value = ""; drawSizes(); preview();
  };
  ['mcBasis','mcMin','mcMax','mcNote'].forEach(id=>{ $(id).oninput = preview; $(id).onchange = preview; });
  $('mcGoCheck').onclick = e=>{ e.preventDefault(); invSubTab = "vendorReports"; vendorReportState.report = "margin"; renderInventory(document.getElementById('main')); };
  if(editing) $('mcCancel').onclick = ()=>{ condFormState = {editUid:null, vendors:[], cats:[], units:[], basis:"margin", min:"", max:"", note:"", sizeSearch:""}; renderMarginConditions(el); };
  $('mcAdd').onclick = ()=>{
    readTop();
    const min = parseFloat(f.min), max = f.max==="" ? null : parseFloat(f.max);
    if(!(f.vendors.length || f.cats.length || f.units.length)){ toast("Tick at least one vendor, category or size", true); return; }
    if(isNaN(min) || min<0){ toast("Enter the From % (the lowest acceptable)", true); return; }
    if(max!=null && (isNaN(max) || max<min)){ toast("To % has to be the same or higher than From %", true); return; }
    if(f.basis==="margin" && (min>=100 || (max!=null && max>=100))){ toast("Margin has to be under 100%", true); return; }
    const ck = condSetKey(f.cats, normName), uk = condSetKey(f.units, normUnit), vk = condSetKey(f.vendors, x=>x);
    const dup = DATA.marginConditions.find(c=>c.uid!==f.editUid && condSetKey(condVendors(c), x=>x)===vk && condSetKey(condCats(c), normName)===ck && condSetKey(condUnits(c), normUnit)===uk);
    if(dup){ toast("There's already a condition for exactly those picks — edit that one instead", true); return; }
    const fields = {vendors:f.vendors.slice(), categories:f.cats.slice(), units:f.units.slice(), basis:f.basis, min, max, note:f.note.trim()};
    if(editing){
      Object.assign(editing, fields, {updatedAt:new Date().toISOString()});
      delete editing.category; delete editing.unit; delete editing.vendor;
      toast("Condition saved");
    } else {
      DATA.marginConditions.push(Object.assign({uid:"mc"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), createdAt:new Date().toISOString()}, fields));
      toast("Condition added");
    }
    persist();
    condFormState = {editUid:null, vendors:[], cats:[], units:[], basis:f.basis, min:"", max:"", note:"", sizeSearch:""};
    renderMarginConditions(el);
  };
  el.querySelectorAll('[data-cedit]').forEach(b=>b.onclick = ()=>{
    const c = DATA.marginConditions.find(x=>x.uid===b.dataset.cedit); if(!c) return;
    condFormState = {editUid:c.uid, vendors:condVendors(c).slice(), cats:condCats(c).slice(), units:condUnits(c).slice(), basis:c.basis==="markup"?"markup":"margin",
      min:String(c.min), max:condHasMax(c)?String(c.max):"", note:c.note||"", sizeSearch:""};
    renderMarginConditions(el);
    const card = document.getElementById('mcFormCard'); if(card) card.scrollIntoView({behavior:"smooth", block:"start"});
  });
  el.querySelectorAll('[data-cf]').forEach(inp=>{
    inp.onchange = ()=>{
      const c = DATA.marginConditions.find(x=>x.uid===inp.dataset.uid); if(!c) return;
      const k = inp.dataset.cf;
      if(k==="min"){ const v = parseFloat(inp.value); if(isNaN(v)||v<0){ toast("From % can't be blank", true); inp.value = c.min; return; } c.min = v; }
      else if(k==="max"){ const v = inp.value==="" ? null : parseFloat(inp.value); if(v!=null && (isNaN(v)||v<num(+c.min))){ toast("To % has to be the same or higher than From %", true); inp.value = condHasMax(c)?c.max:""; return; } c.max = v; }
      else c[k] = inp.value;
      persist(); renderMarginConditions(el);
    };
  });
  el.querySelectorAll('[data-cdel]').forEach(b=>b.onclick = ()=>{
    const c = DATA.marginConditions.find(x=>x.uid===b.dataset.cdel); if(!c) return;
    if(!confirm(`Delete the condition for ${condScopeText(c)} (${condTargetText(c)})? It moves to the Trash until midnight.`)) return;
    trashPut("condition", `${condScopeText(c)} \u2014 ${condTargetText(c)}`, c);
    DATA.marginConditions = DATA.marginConditions.filter(x=>x!==c);
    if(condFormState.editUid===c.uid) condFormState.editUid = null;
    persist(); renderMarginConditions(el);
  });
  drawSizes();
  preview();
}

/* ===================== VIEW: VENDOR REPORTS (Inventory -> Vendors -> Vendor Reports) ===================== */
let vendorReportState = {report:"scorecard", fromKey:"", toKey:"live", vendor:"ALL", category:"ALL", status:"OUT",
  maxSold:0, spendVendor:"", pcFrom:"", pcTo:"", pcVendor:"ALL", repVendor:"", repSince:""};
const VENDOR_REPORTS = [
  {id:"scorecard", label:"🏆 Vendor Scorecard"},
  {id:"spend", label:"📈 Spend Trend"},
  {id:"increases", label:"💲 Price Increases"},
  {id:"dead", label:"📦 Dead Stock by Vendor"},
  {id:"margin", label:"🎯 Margin Check"},
  {id:"rep", label:"🖨 Rep Meeting Sheet"},
];
function vrDaysAgo(n){ const d = new Date(Date.now()-n*864e5); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0'); }
function vrInitPeriod(){
  const keys = inventoryReportKeysSorted();
  // default to the last two saved counts -- "live" counts aren't updated until the next count, so a
  // last-count -> today window makes nearly everything look unsold
  if(!vendorReportState.fromKey && keys.length){
    if(keys.length>=2){ vendorReportState.fromKey = keys[keys.length-2]; vendorReportState.toKey = keys[keys.length-1]; }
    else vendorReportState.fromKey = keys[0];
  }
  if(!vendorReportState.pcFrom) vendorReportState.pcFrom = vrDaysAgo(90);
  if(!vendorReportState.pcTo) vendorReportState.pcTo = localTodayStr();
  if(!vendorReportState.repSince) vendorReportState.repSince = vrDaysAgo(90);
  return keys;
}
function vrPeriodPickerHtml(keys){
  const st = vendorReportState;
  return `<div><label>From (starting count)</label><select data-vr="fromKey"><option value="">— pick a saved count —</option>${keys.map(k=>`<option value="${k}" ${st.fromKey===k?"selected":""}>${vEsc(inventoryReportLabel(k))}</option>`).join("")}</select></div>
    <div><label>To (ending count)</label><select data-vr="toKey"><option value="live" ${st.toKey==="live"?"selected":""}>Live — Current Counts (today)</option>${keys.map(k=>`<option value="${k}" ${st.toKey===k?"selected":""}>${vEsc(inventoryReportLabel(k))}</option>`).join("")}</select></div>`;
}
/* period movement rows (Dead Stock math) with each row's vendor and live product attached */
function vrMovement(){
  const m = inventoryPeriodMovement(vendorReportState.fromKey, vendorReportState.toKey);
  const live = new Map(DATA.inventory.map(p=>[normName(p.name)+"||"+normUnit(p.unit), p]));
  m.rows.forEach(r=>{ const p = live.get(normName(r.name)+"||"+normUnit(r.unit)); r.product = p || null; r.vendor = p ? (p.vendor||"") : ""; });
  return m;
}
/* every cost change we can see: consecutive invoice lines for the same product, plus price-sheet / bulk edits */
function vrCostChanges(){
  const hist = new Map();
  DATA.invoiceEntries.forEach(e=>{
    if(e.shipper || !(num(e.cost)>0) || !e.date) return;
    const k = normName(e.name)+"||"+normUnit(e.unit);
    if(!hist.has(k)) hist.set(k, []);
    hist.get(k).push({date:String(e.date).slice(0,10), cost:num(e.cost), vendor:vendorCanon(e.distributor||""), invoice:e.invoice, name:e.name, unit:e.unit||"", category:e.category});
  });
  const out = [];
  hist.forEach(list=>{
    list.sort((a,b)=>a.date.localeCompare(b.date));
    for(let i=1; i<list.length; i++){
      const a = list[i-1], b = list[i];
      if(Math.abs(b.cost-a.cost) < 0.01) continue;
      const pct = (b.cost-a.cost)/a.cost;
      out.push({date:b.date, vendor:b.vendor, name:b.name, unit:b.unit, category:b.category, oldCost:a.cost, newCost:b.cost, pct,
        source:"Invoice "+(b.invoice||""), suspicious:Math.abs(pct)>0.4});
    }
  });
  (DATA.priceChangeLog||[]).forEach(c=>{
    if(c.source==="invoice" || Math.abs(c.newCost-c.oldCost)<0.01 || !(c.oldCost>0)) return;
    const pct = (c.newCost-c.oldCost)/c.oldCost;
    out.push({date:String(c.at).slice(0,10), vendor:c.vendor||"", name:c.name, unit:c.unit, category:c.category, oldCost:c.oldCost, newCost:c.newCost, pct,
      source:c.source==="price sheet"?"Price sheet":c.source==="bulk price update"?"Bulk price update":(c.source||"Edit"), suspicious:Math.abs(pct)>0.4});
  });
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}
function vrBar(frac, color){
  const w = Math.max(0, Math.min(1, frac||0))*100;
  return `<div class="vr-bar"><span style="width:${w.toFixed(1)}%;background:${color||"var(--navy)"};"></span></div>`;
}
/* Dead stock = was on the shelf at the starting count, sold no more than maxSold, still on the shelf.
   Rows whose count went UP with nothing invoiced (negative "sold" -- usually a missing invoice) and
   products that weren't in the starting count are left out, since their "sold" isn't trustworthy. */
function vrIsDead(r, maxSold){ return r.opening>0 && r.sold>=0 && r.sold<=(maxSold||0) && r.closing>0; }
function vrIsCountUp(r){ return r.sold<0; }
function vrNoCounts(){ return `<div class="note">No saved counts yet — this report compares two inventory counts. Generate one in Inventory → Reports → Monthly Reports first.</div>`; }

function renderVendorReports(el){
  const st = vendorReportState;
  el.innerHTML = `
    <div class="vr-chips no-print">${VENDOR_REPORTS.map(r=>`<button type="button" class="${st.report===r.id?"on":""}" data-rep="${r.id}">${r.label}</button>`).join("")}</div>
    <div id="vrBody"></div>`;
  el.querySelectorAll('[data-rep]').forEach(b=>b.onclick = ()=>{ st.report = b.dataset.rep; renderVendorReports(el); });
  const body = document.getElementById('vrBody');
  const redraw = ()=>renderVendorReports(el);
  if(st.report==="spend") vrSpend(body, redraw);
  else if(st.report==="increases") vrIncreases(body, redraw);
  else if(st.report==="dead") vrDead(body, redraw);
  else if(st.report==="margin") vrMargin(body, redraw);
  else if(st.report==="rep") vrRepSheet(body, redraw);
  else vrScorecard(body, redraw);
  body.querySelectorAll('[data-vr]').forEach(inp=>{
    inp.onchange = ()=>{ const k = inp.dataset.vr; st[k] = inp.dataset.num ? (parseInt(inp.value)||0) : inp.value; redraw(); };
  });
}

/* ---------- 1. Vendor Scorecard ---------- */
function vrScorecard(el){
  const keys = vrInitPeriod();
  const m = vrMovement();
  const byV = new Map();
  const get = v=>{ if(!byV.has(v)) byV.set(v, {vendor:v, products:0, onHand:0, units:0, sales:0, gp:0, dead:0, deadVal:0, below:0, alerts:0}); return byV.get(v); };
  DATA.inventory.forEach(p=>{ const r = get(p.vendor||""); r.products++; if(conditionStatus(p).status==="below") r.below++; });
  openPriceAlerts().forEach(a=>{ get(a.vendor||"").alerts++; });
  if(!m.error) m.rows.forEach(r=>{
    const x = get(r.vendor);
    const sold = Math.max(0, r.sold);
    x.onHand += r.closingValue; x.units += sold; x.sales += sold*r.retail; x.gp += sold*(r.retail-r.cost);
    if(vrIsDead(r, 0)){ x.dead++; x.deadVal += r.closingValue; }
  });
  const rows = [...byV.values()].filter(r=>r.products || r.sales).sort((a,b)=>b.sales-a.sales || b.products-a.products);
  const tot = rows.reduce((t,r)=>{ ["products","onHand","units","sales","gp","dead","deadVal","below","alerts"].forEach(k=>t[k]+=r[k]); return t; }, {products:0,onHand:0,units:0,sales:0,gp:0,dead:0,deadVal:0,below:0,alerts:0});
  const maxSales = Math.max(1, ...rows.map(r=>r.sales));
  el.innerHTML = `
    <div class="note">What each vendor's products earned between two counts. Sales = units sold × current retail; gross profit uses cost after buydowns for cigarettes &amp; tobacco. Units sold come from the counts (opening + received − closing), so a short count can make a product look like it sold less. "Below target" uses your Margin Conditions.</div>
    <div class="card no-print"><div class="form-grid" style="grid-template-columns:1fr 1fr;">${vrPeriodPickerHtml(keys)}</div></div>
    ${!keys.length ? vrNoCounts() : m.error ? `<div class="note">${m.error}</div>` : `
    <div class="kpis">
      <div class="kpi"><div class="lbl">Period</div><div class="val" style="font-size:14px;">${vEsc(m.fromLabel)} → ${vEsc(m.toLabel)}</div></div>
      <div class="kpi"><div class="lbl">Sales</div><div class="val">${fmtUSD0(tot.sales)}</div></div>
      <div class="kpi"><div class="lbl">Gross Profit</div><div class="val">${fmtUSD0(tot.gp)}</div><div class="sub">${fmtPct(tot.sales?tot.gp/tot.sales:0)} margin</div></div>
      <div class="kpi"><div class="lbl">On Hand (cost)</div><div class="val">${fmtUSD0(tot.onHand)}</div></div>
    </div>
    <div class="card"><h2>Vendor Scorecard</h2>
      <div class="tablewrap"><table>
        <thead><tr><th>Vendor</th><th>Products</th><th style="min-width:170px;">Sales</th><th>Share</th><th>Gross Profit</th><th>Margin</th><th>On Hand</th><th>No-Sale Items</th><th>Below Target</th><th>Open Alerts</th></tr></thead>
        <tbody>${rows.map(r=>{ const mg = r.sales ? r.gp/r.sales : 0; return `<tr>
          <td>${r.vendor ? `<a href="#" data-openv="${vEsc(r.vendor)}"><b>${vEsc(r.vendor)}</b></a>` : '<span style="color:var(--text-dim);">No vendor yet</span>'}</td>
          <td>${r.products}</td>
          <td><div style="display:flex;align-items:center;gap:8px;"><span style="min-width:70px;">${fmtUSD0(r.sales)}</span>${vrBar(r.sales/maxSales)}</div></td>
          <td>${fmtPct(tot.sales?r.sales/tot.sales:0)}</td>
          <td>${fmtUSD0(r.gp)}</td>
          <td style="font-weight:600;color:${mg<0.15?'var(--red)':mg>=0.35?'var(--green)':'inherit'};">${fmtPct(mg)}</td>
          <td>${fmtUSD0(r.onHand)}</td>
          <td>${r.dead ? `${r.dead} <span class="sub" style="margin:0;">(${fmtUSD0(r.deadVal)})</span>` : "0"}</td>
          <td style="color:${r.below?'var(--red)':'inherit'};">${r.below}</td>
          <td>${r.alerts||""}</td></tr>`; }).join("")}
          <tr style="font-weight:700;border-top:2px solid var(--border);"><td>Total</td><td>${tot.products}</td><td>${fmtUSD0(tot.sales)}</td><td>100%</td><td>${fmtUSD0(tot.gp)}</td><td>${fmtPct(tot.sales?tot.gp/tot.sales:0)}</td><td>${fmtUSD0(tot.onHand)}</td><td>${tot.dead} (${fmtUSD0(tot.deadVal)})</td><td>${tot.below}</td><td>${tot.alerts||""}</td></tr>
        </tbody></table></div></div>`}`;
  el.querySelectorAll('[data-openv]').forEach(a=>a.onclick = e=>{ e.preventDefault(); const v = findVendor(a.dataset.openv); if(v) openVendor(v.uid); });
}

/* ---------- 2. Spend Trend ---------- */
function vrSpend(el, redraw){
  const st = vendorReportState;
  const hist = vendorInvoiceHistory();
  const today = localTodayStr(), thisYear = +today.slice(0,4), md = today.slice(5);
  const years = []; for(let y=thisYear-4; y<=thisYear; y++) years.push(y);
  const rows = [...hist.entries()].map(([vendor, list])=>{
    const byYear = {}; years.forEach(y=>byYear[y]=0);
    let ytd = 0, lytd = 0, ytdN = 0;
    list.forEach(h=>{
      const y = +h.date.slice(0,4);
      if(y in byYear) byYear[y] += h.amount;
      if(h.date.slice(5) <= md){ if(y===thisYear){ ytd += h.amount; ytdN++; } else if(y===thisYear-1) lytd += h.amount; }
    });
    return {vendor, byYear, ytd, lytd, ytdN, change: lytd ? (ytd-lytd)/lytd : null};
  }).filter(r=>years.some(y=>r.byYear[y]) ).sort((a,b)=>b.ytd-a.ytd || b.byYear[thisYear-1]-a.byYear[thisYear-1]);
  if(!st.spendVendor || !hist.has(st.spendVendor)) st.spendVendor = rows[0] ? rows[0].vendor : "";
  const mdLabel = new Date(today+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});
  const totYtd = rows.reduce((s,r)=>s+r.ytd,0), totL = rows.reduce((s,r)=>s+r.lytd,0);
  el.innerHTML = `
    <div class="note">What you've paid each vendor, from the invoices in Sales &amp; Margins (back to ${years[0]}). "This Year to Date" compares Jan 1–${mdLabel} of ${thisYear} with the same dates in ${thisYear-1}. Misspelled vendor names on old invoices are counted under the right vendor using each vendor's "other spellings".</div>
    <div class="kpis">
      <div class="kpi"><div class="lbl">${thisYear} to date</div><div class="val">${fmtUSD0(totYtd)}</div></div>
      <div class="kpi"><div class="lbl">Same dates ${thisYear-1}</div><div class="val">${fmtUSD0(totL)}</div></div>
      <div class="kpi"><div class="lbl">Change</div><div class="val" style="color:${totYtd<totL?'var(--red)':'var(--green)'};">${totL?((totYtd-totL)/totL*100).toFixed(1)+"%":"—"}</div></div>
    </div>
    <div class="card"><div class="flex" style="justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:flex-end;">
      <h2 style="margin:0;">Monthly Spend — ${vEsc(st.spendVendor)}</h2>
      <div class="no-print"><select data-vr="spendVendor" style="width:auto;min-width:200px;">${rows.map(r=>`<option value="${vEsc(r.vendor)}" ${r.vendor===st.spendVendor?"selected":""}>${vEsc(r.vendor)}</option>`).join("")}</select></div></div>
      <div id="vrSpendChart" style="margin-top:10px;"></div></div>
    <div class="card"><h2>Spend by Vendor</h2>
      <div class="tablewrap"><table>
        <thead><tr><th>Vendor</th>${years.map(y=>`<th>${y}${y===thisYear?" (so far)":""}</th>`).join("")}<th>${thisYear} to Date</th><th>Same Dates ${thisYear-1}</th><th>Change</th><th>Invoices YTD</th><th>Avg Invoice</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td><a href="#" data-spv="${vEsc(r.vendor)}"><b>${vEsc(r.vendor)}</b></a></td>
          ${years.map(y=>`<td>${r.byYear[y]?fmtUSD0(r.byYear[y]):"—"}</td>`).join("")}
          <td><b>${fmtUSD0(r.ytd)}</b></td><td>${fmtUSD0(r.lytd)}</td>
          <td>${r.change==null?"—":`<span class="${r.change<0?"price-down":"price-up"}" style="color:${r.change<0?'var(--red)':'var(--green)'};">${r.change>0?"+":""}${(r.change*100).toFixed(0)}%</span>`}</td>
          <td>${r.ytdN}</td><td>${r.ytdN?fmtUSD0(r.ytd/r.ytdN):"—"}</td></tr>`).join("")}</tbody>
      </table></div></div>`;
  el.querySelectorAll('[data-spv]').forEach(a=>a.onclick = e=>{ e.preventDefault(); st.spendVendor = a.dataset.spv; redraw(); });
  const list = hist.get(st.spendVendor) || [];
  const series = [thisYear-1, thisYear].map(y=>({label:String(y), values:MONTHS.map((mo,i)=>{
    if(y===thisYear && i > new Date().getMonth()) return null;
    return list.filter(h=>+h.date.slice(0,4)===y && +h.date.slice(5,7)===i+1).reduce((s,h)=>s+h.amount,0);
  })}));
  series[0].dash = "5,4"; series[0].color = "#9DB7CF";
  drawLineChartMulti(document.getElementById('vrSpendChart'), {categories:MONTHS.map(x=>x.slice(0,3)), series, height:240, yFmt:v=>fmtUSD0(v)});

  const byV = new Map();
  inRange.forEach(c=>{
    const v = c.vendor || "(unknown)";
    if(!byV.has(v)) byV.set(v, {vendor:v, up:0, down:0, pcts:[], biggest:null, last:"", check:0});
    const r = byV.get(v);
    if(c.suspicious){ r.check++; return; }
    c.pct>0 ? r.up++ : r.down++;

    </div></div>
    <div class="card"><h2>By Vendor — ${vDate(st.pcFrom)} to ${vDate(st.pcTo)}</h2>
      <div class="tablewrap"><table>
        <thead><tr><th>Vendor</th><th>Increases</th><th>Decreases</th><th>Avg Change</th><th>Biggest Increase</th><th>Last Increase</th><th>Check Entry</th></tr></thead>
        <tbody>${sum.map(r=>{ const avg = r.pcts.length ? r.pcts.reduce((s,x)=>s+x,0)/r.pcts.length : 0; return `<tr>
          <td><a href="#" data-pcv="${vEsc(r.vendor)}"><b>${vEsc(r.vendor)}</b></a></td><td class="${r.up?"price-up":""}">${r.up}</td><td class="${r.down?"price-down":""}">${r.down}</td>
          <td><span class="${avg>0?"price-up":avg<0?"price-down":""}">${r.pcts.length?(avg>0?"+":"")+(avg*100).toFixed(1)+"%":"—"}</span></td>
          <td>${r.biggest?`${vEsc(r.biggest.name)} <span class="price-up">+${(r.biggest.pct*100).toFixed(1)}%</span>`:"—"}</td>
          <td>${r.last?vDate(r.last):"—"}</td><td>${r.check?`<span class="pill warn">${r.check}</span>`:""}</td></tr>`; }).join("")
          || `<tr><td colspan="7" style="text-align:center;color:var(--text-dim);">No cost changes in these dates</td></tr>`}</tbody>
      </table></div></div>
    <div class="card"><h2>Every Change (${shown.length})</h2>
      <div class="tablewrap" style="max-height:560px;"><table>
        <thead><tr><th>Date</th><th>Vendor</th><th>Product</th><th>Old Cost</th><th>New Cost</th><th>Change</th><th>Where</th></tr></thead>
        <tbody>${shown.slice(0,500).map(c=>`<tr><td>${vDate(c.date)}</td><td>${vEsc(c.vendor)}</td><td>${vEsc(c.name)} <span class="sub" style="margin:0;">${vEsc(c.unit)}</span></td>
          <td>${fmtUSD(c.oldCost)}</td><td><b>${fmtUSD(c.newCost)}</b></td>

/* ---------- 4. Dead Stock by Vendor ---------- */
function vrDead(el){
  const st = vendorReportState;
  const keys = vrInitPeriod();
  const m = vrMovement();
  const vMatch = r=>st.vendor==="ALL" || (st.vendor==="__NONE__" ? !r.vendor : r.vendor===st.vendor);
  const rows = m.error ? [] : m.rows.filter(r=>vrIsDead(r, st.maxSold) && vMatch(r));
  const countUp = m.error ? [] : m.rows.filter(r=>vrIsCountUp(r) && vMatch(r));
  const groups = new Map();
  rows.forEach(r=>{ const v = r.vendor || "No vendor yet"; if(!groups.has(v)) groups.set(v, []); groups.get(v).push(r); });

    <div class="kpis">

    </div>
    ${countUp.length?`<div class="note"><b>${countUp.length} product${countUp.length===1?"":"s"}</b> counted <i>higher</i> at the ending count than the starting count plus everything invoiced — usually a delivery that never got entered in Invoice Entry. They're left out of this list; the Distributor Variance and Office reports can help track those down.</div>`:""}
    <div class="card"><h2>By Vendor</h2><div class="tablewrap"><table><thead><tr><th>Vendor</th><th>Products</th><th style="min-width:200px;">Cash Tied Up</th></tr></thead>
      <tbody>${g.map(x=>`<tr><td><b>${vEsc(x.v)}</b></td><td>${x.list.length}</td><td><div style="display:flex;align-items:center;gap:8px;"><span style="min-width:70px;">${fmtUSD0(x.val)}</span>${vrBar(total?x.val/g[0].val:0, "var(--red)")}</div></td></tr>`).join("") || `<tr><td colspan="3" style="text-align:center;color:var(--text-dim);">No dead stock in this window</td></tr>`}</tbody></table></div></div>
    ${g.map(x=>`<div class="card"><h2>${vEsc(x.v)} — ${x.list.length} product${x.list.length===1?"":"s"}, ${fmtUSD0(x.val)}</h2><div class="tablewrap"><table>
      <thead><tr><th>Product</th><th>Category</th><th>Opening</th><th>Received</th><th>Sold</th><th>On Hand</th><th>Cost</th><th>On-Hand Value</th></tr></thead>
      <tbody>${x.list.map(r=>`<tr><td>${vEsc(r.name)}${r.unit?` <span style="color:var(--text-dim);">(${vEsc(r.unit)})</span>`:""}</td><td>${vEsc(r.category)}</td><td>${r.opening}</td><td>${r.received}</td>
        <td style="color:${r.sold<0?'var(--red)':'inherit'}">${r.sold}</td><td>${r.closing}</td><td>${fmtUSD(r.cost)}</td><td>${fmtUSD(r.closingValue)}</td></tr>`).join("")}</tbody></table></div></div>`).join("")}`}`;
}

/* ---------- 5. Margin Check (against Margin Conditions) ---------- */
function vrMargin(el){
  const st = vendorReportState;
  const catNames = [...new Set(DATA.inventory.map(p=>p.category))].sort();
  const all = DATA.inventory.map(p=>{
    const s = conditionStatus(p);
    const ec = condCost(p, num(p.cost)), retail = num(p.retail);
    return {p, s, ec, retail, sug: s.cond ? conditionSuggestedRetail(p, num(p.cost), retail) : null};
  });
  const counts = {below:0, above:0, ok:0, none:0, unknown:0};
  all.forEach(r=>counts[r.s.status]++);
  const rows = all.filter(r=>{
    if(st.vendor!=="ALL" && !vendorFilterMatch(r.p, st.vendor)) return false;
    if(st.category!=="ALL" && r.p.category!==st.category) return false;
    if(st.status==="OUT") return r.s.status==="below" || r.s.status==="above";
    if(st.status!=="ALL") return r.s.status===st.status;
    return true;
  }).sort((a,b)=>(a.s.status==="below"?0:a.s.status==="above"?1:2)-(b.s.status==="below"?0:b.s.status==="above"?1:2) || (a.p.vendor||"").localeCompare(b.p.vendor||"") || a.p.name.localeCompare(b.p.name));
  // the bulk button only RAISES below-target prices; lowering an above-target price is a one-at-a-time call
  const fixable = rows.filter(r=>r.s.status==="below" && r.sug!=null && r.sug-r.retail>=0.005);
  el.innerHTML = `
    <div class="note">Every product checked against its Margin Condition (set them up in Inventory → Pricing → Margin Conditions). Suggested retail is the nearest .x9 price that puts the product back inside its range. <b>Set</b> changes the shelf price right away and records it in that vendor's price-change history. <b>Raise All Below-Target</b> only raises prices that are too low — products above their range are left for you to decide one at a time.</div>
    <div class="kpis">
      <div class="kpi"><div class="lbl">Below Target</div><div class="val" style="color:var(--red);">${counts.below}</div></div>
      <div class="kpi"><div class="lbl">Above Target</div><div class="val">${counts.above}</div></div>
      <div class="kpi"><div class="lbl">In Range</div><div class="val" style="color:var(--green);">${counts.ok}</div></div>
      <div class="kpi"><div class="lbl">No Condition</div><div class="val">${counts.none}</div><div class="sub"><a href="#" id="vrGoConds">set up conditions</a></div></div>
    </div>
    <div class="card no-print"><div class="form-grid" style="grid-template-columns:1fr 1fr 1fr auto;align-items:end;">
      <div><label>Vendor</label><select data-vr="vendor">${vendorFilterOptionsHtml(st.vendor)}</select></div>
      <div><label>Category</label><select data-vr="category"><option value="ALL">All Categories</option>${catNames.map(c=>`<option value="${vEsc(c)}" ${st.category===c?"selected":""}>${vEsc(c)}</option>`).join("")}</select></div>
      <div><label>Show</label><select data-vr="status">${[["OUT","Outside target (below + above)"],["below","Below target"],["above","Above target"],["ok","In range"],["none","No condition"],["ALL","Everything"]].map(([v,l])=>`<option value="${v}" ${st.status===v?"selected":""}>${l}</option>`).join("")}</select></div>
      <div><button class="btn primary" id="vrSetAll" ${fixable.length?"":"disabled"}>Raise All Below-Target (${fixable.length})</button></div>
    </div></div>
    <div class="card"><h2>${rows.length.toLocaleString()} product${rows.length===1?"":"s"}</h2>
      <div class="tablewrap" style="max-height:620px;"><table>
        <thead><tr><th>Product</th><th>Vendor</th><th>Category</th><th>Unit</th><th>Cost</th><th>Retail</th><th>Now</th><th>Target</th><th>Status</th><th>Suggested</th><th class="no-print"></th></tr></thead>
        <tbody>${rows.slice(0,600).map(r=>{ const c = r.s.cond; const basis = c ? c.basis : "margin"; const now = pctFor(basis, r.ec, r.retail);
          return `<tr><td>${vEsc(r.p.name)}</td><td>${vEsc(r.p.vendor||"—")}</td><td>${vEsc(r.p.category)}</td><td>${vEsc(r.p.unit||"")}</td>
          <td>${fmtUSD(r.ec)}${isBuydownCategory(r.p.category)&&num(r.p.buydown)?' <span class="sub" style="margin:0;" title="after buydown">bd</span>':""}</td><td>${fmtUSD(r.retail)}</td>
          <td>${now==null?"—":(now*100).toFixed(1)+"% "+(basis==="markup"?"mu":"mg")}</td>
          <td>${c?`${condTargetText(c)}<div class="sub" style="margin:0;">${vEsc(condScopeText(c))}</div>`:'<span class="sub" style="margin:0;">—</span>'}</td>
          <td>${condStatusPill(r.s.status)}</td>
          <td>${r.sug!=null?`<b>${fmtUSD(r.sug)}</b>`:""}</td>
          <td class="no-print">${r.sug!=null && Math.abs(r.sug-r.retail)>=0.005?`<button class="btn small primary" data-mset="${vEsc(r.p.uid)}" data-val="${r.sug}">Set</button>`:""}</td></tr>`; }).join("")
          || `<tr><td colspan="11" style="text-align:center;color:var(--text-dim);padding:20px;">${(DATA.marginConditions||[]).length?"Nothing matches these filters 🎉":"No Margin Conditions yet — add some in Inventory → Pricing → Margin Conditions."}</td></tr>`}</tbody>
      </table></div>${rows.length>600?'<div class="sub">Showing the first 600 — narrow the filters to see the rest.</div>':""}</div>`;
  const setPrice = (p, val)=>{ const oldR = num(p.retail); p.retail = val; refreshProductValues(p); logPriceChange(p, num(p.cost), num(p.cost), oldR, val, "margin check"); };
  el.querySelectorAll('[data-mset]').forEach(b=>b.onclick = ()=>{
    const p = DATA.inventory.find(x=>x.uid===b.dataset.mset); if(!p) return;
    setPrice(p, parseFloat(b.dataset.val)); persist(); toast(`${p.name} retail set to ${fmtUSD(p.retail)}`); renderVendorReports(el.parentElement);
  });
  document.getElementById('vrSetAll').onclick = ()=>{
    if(!fixable.length) return;
    if(!confirm(`Change the shelf price of ${fixable.length} product${fixable.length===1?"":"s"} to the suggested retail?\n\n${fixable.slice(0,6).map(r=>`• ${r.p.name}: ${fmtUSD(r.retail)} → ${fmtUSD(r.sug)}`).join("\n")}${fixable.length>6?`\n…and ${fixable.length-6} more`:""}`)) return;
    fixable.forEach(r=>setPrice(r.p, r.sug)); persist(); toast(`Updated ${fixable.length} price${fixable.length===1?"":"s"}`); renderVendorReports(el.parentElement);
  };
  document.getElementById('vrGoConds').onclick = e=>{ e.preventDefault(); invSubTab = "marginConditions"; renderInventory(document.getElementById('main')); };
}

/* ---------- 6. Rep Meeting Sheet (prints on 1-2 pages) ---------- */
function vrRepSheet(el){
  const st = vendorReportState;
  const keys = vrInitPeriod();
  const names = vendorNames().filter(n=>DATA.inventory.some(p=>p.vendor===n));
  if(!st.repVendor || !names.includes(st.repVendor)) st.repVendor = names[0] || "";
  const v = findVendor(st.repVendor);

  const s = vendorSummary(v);
  const m = vrMovement();
  const mine = m.error ? [] : m.rows.filter(r=>r.vendor===v.name);
  const sales = mine.reduce((t,r)=>t+Math.max(0,r.sold)*r.retail,0), gp = mine.reduce((t,r)=>t+Math.max(0,r.sold)*(r.retail-r.cost),0);
  const onHand = mine.reduce((t,r)=>t+r.closingValue,0);
  const today = localTodayStr(), md = today.slice(5), y = +today.slice(0,4);
  const ytd = s.invoices.filter(h=>+h.date.slice(0,4)===y && h.date.slice(5)<=md).reduce((t,h)=>t+h.amount,0);
  const lytd = s.invoices.filter(h=>+h.date.slice(0,4)===y-1 && h.date.slice(5)<=md).reduce((t,h)=>t+h.amount,0);
  const changes = vrCostChanges().filter(c=>c.vendor===v.name && c.date>=st.repSince && !c.suspicious);
  const ups = changes.filter(c=>c.pct>0), downs = changes.filter(c=>c.pct<0);
  const avgUp = ups.length ? ups.reduce((t,c)=>t+c.pct,0)/ups.length : 0;
  const latestChange = new Map(); changes.forEach(c=>{ const k = c.name+"|"+c.unit; if(!latestChange.has(k)) latestChange.set(k, c); });
  const changeRows = [...latestChange.values()].sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct)).slice(0,12);
  const dead = mine.filter(r=>vrIsDead(r, 0)).sort((a,b)=>b.closingValue-a.closingValue);

  const below = DATA.inventory.filter(p=>p.vendor===v.name).map(p=>({p, s:conditionStatus(p)})).filter(x=>x.s.status==="below")
    .sort((a,b)=>(a.s.value||0)-(b.s.value||0));
  const lim = 12;
  const tbl = (head, rows, empty)=>`<table class="rep-table"><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.join(""):`<tr><td colspan="${head.length}" style="color:var(--text-dim);text-align:center;">${empty}</td></tr>`}</tbody></table>`;
  el.innerHTML = `
    <div class="card no-print"><div class="form-grid" style="grid-template-columns:1.2fr 1fr 1fr 1fr auto;align-items:end;">
      <div><label>Vendor</label><select data-vr="repVendor">${names.map(n=>`<option value="${vEsc(n)}" ${n===st.repVendor?"selected":""}>${vEsc(n)}</option>`).join("")}</select></div>
      ${vrPeriodPickerHtml(keys)}
      <div><label>Cost changes since</label><input type="date" data-vr="repSince" value="${st.repSince}"></div>
      <div><button class="btn primary" id="repPrint">🖨 Print Rep Sheet</button></div>
    </div><div class="sub" style="margin-top:6px;">Prints on 1–2 pages: the lists show the top ${lim} of each so it stays short. Sales figures use the count period picked here.</div></div>
    <div class="card rep-sheet">
      <div class="rep-head">
        <div><div class="rep-title">${vEsc(v.name)} — Vendor Review</div>
          <div class="rep-sub">DJ's Mini Mart · ${new Date().toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"})}${!m.error?` · Sales period: ${vEsc(m.fromLabel.replace(/ —.*$/,""))} → ${vEsc(m.toLabel.replace(/ —.*$/,""))}`:""}</div></div>
        <div class="rep-contact">${[v.repName?`<b>Rep:</b> ${vEsc(v.repName)}`:"", v.repPhone?vEsc(v.repPhone):"", v.repEmail?vEsc(v.repEmail):"", v.number?`Vendor #${vEsc(v.number)}`:"", v.accountNum?`Acct #${vEsc(v.accountNum)}`:"", (v.deliveryDays||[]).length?`Delivers ${v.deliveryDays.join(", ")}`:"", v.orderCutoff?`Order by ${vEsc(v.orderCutoff)}`:""].filter(Boolean).join("<br>")||'<span style="color:var(--text-dim);">Add rep info on the vendor page</span>'}</div>
      </div>
      <div class="rep-kpis">
        <div><span>Purchases ${y} YTD</span><b>${fmtUSD0(ytd)}</b><em style="color:${lytd&&ytd<lytd?'var(--red)':'var(--green)'};">${lytd?((ytd-lytd)/lytd*100>0?"+":"")+((ytd-lytd)/lytd*100).toFixed(0)+"% vs "+(y-1):"no "+(y-1)+" data"}</em></div>
        <div><span>Products carried</span><b>${s.products.length}</b><em>${dead.length} with no sales</em></div>
