  document.getElementById('icCat').onchange = e=>{ icCat=e.target.value; drawCatCountBar(); draw(); };
  function drawCatCountBar(){
    const bar = document.getElementById('icCatCountBar');
    if(!bar) return;
    const sched = categoryScheduleRows();
    if(icCat==="ALL"){
      const dueRows = sched.filter(r=>r.status==="overdue" || r.status==="due" || r.status==="never");
      const tag = r=> r.status==="overdue" ? `<span class="pill bad">Overdue</span>` : r.status==="due" ? `<span class="pill warn">Due this month</span>` : `<span class="pill warn">Not counted yet</span>`;
      bar.innerHTML = `<div class="card">
        <b>Categories to count</b>
        ${dueRows.length ? `<div class="flex" style="flex-wrap:wrap;gap:8px;margin-top:8px;">${dueRows.map(r=>`<button class="btn small" data-icgo="${r.cat}">${r.cat} ${tag(r)}</button>`).join("")}</div>`
          : `<div class="sub">Nothing is due this month.</div>`}
        <div class="sub" style="margin-top:8px;">Pick a category to count it and set how often it's counted. All categories: Monthly Reports → Category Counts.</div>
      </div>`;
      bar.querySelectorAll('[data-icgo]').forEach(b=>b.onclick=()=>{ icCat=b.dataset.icgo; document.getElementById('icCat').value=icCat; drawCatCountBar(); draw(); });
      return;
    }
    const last = categoryCountsFor(icCat).slice(-1)[0];
    const srow = sched.find(r=>r.cat===icCat);
    const every = countEvery(icCat);
    bar.innerHTML = `<div class="card" style="display:flex;flex-wrap:wrap;gap:10px;align-items:end;">
      <div style="flex:1;min-width:220px;"><b>Save the ${icCat} count</b><div class="sub">Freezes every ${icCat} Closing count as of the date you pick, for Monthly Reports → Category Counts. ${last ? `Last saved count: ${fmtCountDate(last.date)}.` : `No ${icCat} count saved yet.`}</div></div>
      <div><label>Count every</label><select id="icCountEvery">${countEveryOptionsHtml(every)}</select><div class="sub">${!every ? "Not scheduled" : srow && srow.due ? `Next due ${fmtCountDate(srow.due)}` : "Due now"}</div></div>
      <div><label>Count date</label><input type="date" id="icCountDate" value="${localDay(Date.now())}"></div>
      <div><button class="btn primary" id="icSaveCatCountBtn">✓ Save ${icCat} Count</button></div>
    </div>`;
    document.getElementById('icCountEvery').onchange = e=>{ setCountEvery(icCat, e.target.value); drawCatCountBar(); };
    document.getElementById('icSaveCatCountBtn').onclick = ()=>{
      const date = document.getElementById('icCountDate').value;
      if(!date){ toast("Pick the date you counted", true); return; }
      const existing = categoryCountsFor(icCat).find(c=>c.date===date);
      if(existing && !confirm(`A ${icCat} count for ${fmtCountDate(date)} is already saved. Replace it with the counts shown now?`)) return;
      const rec = saveCategoryCount(icCat, date);
      toast(`${icCat} count saved for ${fmtCountDate(rec.date)} (${rec.products.length} products)`);
      const isLatest = !categoryCountsFor(icCat).some(c=>c.date > date);
      if(isLatest){
        const pend = pendingCategoryLines(icCat, date);
        const pendTotal = pend.reduce((t,e)=>t+num(e.total),0);
        if(confirm(`Count saved. Start the next ${icCat} period now?\n\n• Roll ${icCat} Closing → Opening (${rec.products.length} products)\n• Mark ${pend.length} ${icCat} invoice line(s) dated on or before ${fmtCountDate(date)} as reconciled (${fmtUSD(pendTotal)}). Lines for other categories stay pending, even on the same invoice.\n\nPress Cancel to keep just the saved count and do this later.`)){
          const r = startNextCategoryPeriod(icCat, rec.id, date);
          toast(`${icCat}: rolled ${r.products} products, reconciled ${r.lines} invoice line(s)`);
        }
      }
      drawCatCountBar(); draw();
    };
  }
  drawCatCountBar();
  document.getElementById('icClearClosingBtn').onclick = ()=>{
    const list = currentList();
    if(!list.length) return;
    if(!confirm(`Clear the Closing Count for all ${list.length} product(s) currently shown? This can't be undone automatically.`)) return;
    list.forEach(p=>{
      p.closing = "";
      p.sold = productTotalAvailable(p) - num(p.closing);
      p.closing_value = 0;
      p.sales_value = 0;
      p.status = inventoryStatus(p.par, p.closing);
    });
    persist(); draw();
    toast(`Cleared Closing Count for ${list.length} product(s)`);
  };
  document.getElementById('icRollAllBtn').onclick = ()=>{
    const list = currentList();
    if(!list.length) return;
    if(!confirm(`Set Opening = Closing for all ${list.length} product(s) currently shown? This can't be undone automatically.`)) return;
    list.forEach(p=>{ p.opening = num(p.closing); });
    persist(); draw();
    toast(`Rolled ${list.length} product(s): Closing \u2192 Opening`);
  };
  function currentList(){
    return DATA.inventory.filter(p=>{
      if(icSearch && !p.name.toLowerCase().includes(icSearch)) return false;
      if(icCat!=="ALL" && p.category!==icCat) return false;
      return true;
    });
  }
  function draw(){
    const body = document.getElementById('icBody');
    let list = currentList();
    body.innerHTML = "";
    list.forEach(p=>{
      const received = productReceived(p);
      const totalAvail = num(p.opening)+received;
      const sold = totalAvail - num(p.closing);
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${p.name}${newBadge(p)}</td><td>${p.unit||""}</td><td>${p.par}</td>
        <td><input class="editable-cell" type="number" value="${p.opening??0}" data-field="opening" data-num="${p.num}" data-cat="${p.category}" style="width:60px"></td>
        <td><button class="btn small icRollOne" type="button" data-num="${p.num}" data-cat="${p.category}" title="Copy this row's Closing into Opening">\u21bb</button></td>
        <td>${received}</td><td>${totalAvail}</td>
        <td><input class="editable-cell" type="number" value="${p.closing}" data-field="closing" data-num="${p.num}" data-cat="${p.category}" style="width:60px"></td>
        <td>${sold}</td>
        <td><input class="editable-cell" value="${p.notes||""}" data-field="notes" data-num="${p.num}" data-cat="${p.category}"></td>`;
      body.appendChild(tr);
    });
    body.querySelectorAll('input.editable-cell').forEach(inp=>{
      inp.onchange = ()=>{
        const p = DATA.inventory.find(x=>x.num===parseInt(inp.dataset.num) && x.category===inp.dataset.cat);
        if(!p) return;
        const field = inp.dataset.field;
        p[field] = field==="notes" ? inp.value : (parseFloat(inp.value)||0);
        if(field==="closing"){
          p.sold = productTotalAvailable(p) - num(p.closing);
          p.closing_value = +(num(p.closing)*num(p.cost)).toFixed(2);
          p.sales_value = +(num(p.closing)*num(p.retail)).toFixed(2);
          p.status = inventoryStatus(p.par, p.closing);
        }
        persist(); draw();
      };
    });
    // Enter on a Closing field jumps to the next row's Closing field.
    // blur() may trigger onchange -> persist() -> draw(), which rebuilds the table and makes any
    // captured DOM reference to "the next input" stale -- so we re-look-up the next input by its
    // product identity (data-num/data-cat) *after* blur has settled, rather than holding a direct reference.
    const closingInputs = Array.from(body.querySelectorAll('input.editable-cell[data-field="closing"]'));
    closingInputs.forEach((inp, i)=>{
      inp.onkeydown = (e)=>{
        if(e.key==="Enter"){
          e.preventDefault();
          const next = closingInputs[i+1];
          const nextId = next ? {num: next.dataset.num, cat: next.dataset.cat} : null;
          inp.blur(); // commits the change via onchange (may rebuild the table)
          if(nextId){
            const freshBody = document.getElementById('icBody');
            const fresh = freshBody && Array.from(freshBody.querySelectorAll('input.editable-cell[data-field="closing"]'))
              .find(x=>x.dataset.num===nextId.num && x.dataset.cat===nextId.cat);
            if(fresh){ fresh.focus(); fresh.select(); }
          }
        }
      };
    });
    // per-row roll button: copy that row's own Closing into Opening
    body.querySelectorAll('button.icRollOne').forEach(btn=>{
      btn.onclick = ()=>{
        const p = DATA.inventory.find(x=>x.num===parseInt(btn.dataset.num) && x.category===btn.dataset.cat);
        if(!p) return;
        p.opening = num(p.closing);
        persist(); draw();
      };
    });
  }
  draw();
}

/* ---------- Category Counts (cycle counting) ----------
   Counting only some categories each month. Each saved count freezes ONE category's Closing counts on
   the actual date counted, in DATA.categoryCounts. A category is reconciled between its own two most
   recent counts -- so Cigarettes can run Oct 31 -> Nov 30 while Grocery runs Aug 31 -> Nov 30:
     Beginning (earlier count) + Received (invoiced after the earlier count, through the later count)
     - Ending (later count) = Units that left the shelf.
   Invoices dated ON a count date belong to the window ending on that date (assumes you count after the
   day's deliveries are on the shelf). Values use invoice cost, the same basis as the other office reports.
   DATA.countSchedule holds how often each category should be counted, in months. */
const DEFAULT_COUNT_EVERY = {CIGARETTES:1, TOBACCO:1};
const DEFAULT_COUNT_EVERY_OTHER = 3;
const COUNT_EVERY_OPTIONS = [[1,"Month"],[2,"2 months"],[3,"3 months"],[6,"6 months"],[12,"Year"],[0,"Not scheduled"]];
function countEveryOptionsHtml(sel){ return COUNT_EVERY_OPTIONS.map(([v,l])=>`<option value="${v}" ${sel===v?"selected":""}>${l}</option>`).join(""); }
function setCountEvery(cat, months){ if(!isObjPlain(DATA.countSchedule)) DATA.countSchedule = {}; DATA.countSchedule[cat] = parseInt(months)||0; persist(); }
let categoryCountsState = {category:"", fromId:"", toId:"", onlyMoved:false};
function fmtCountDate(d){ return d ? new Date(d+"T00:00:00").toLocaleDateString() : ""; }
function addMonthsStr(d, months){
  const x = new Date(d+"T00:00:00"); const day = x.getDate();
  x.setDate(1); x.setMonth(x.getMonth()+months);
  const last = new Date(x.getFullYear(), x.getMonth()+1, 0).getDate();
  x.setDate(Math.min(day, last));
  return localDay(x);
}
function countEvery(cat){
  const v = DATA.countSchedule && DATA.countSchedule[cat];
  if(v!==undefined && v!==null) return num(v); // 0 = not scheduled
  return DEFAULT_COUNT_EVERY[cat] || DEFAULT_COUNT_EVERY_OTHER;
}
function categoryCountsFor(cat){
  return Object.values(DATA.categoryCounts||{}).filter(c=>c.category===cat)
    .sort((a,b)=>a.date.localeCompare(b.date) || String(a.savedAt).localeCompare(String(b.savedAt)));
}
function saveCategoryCount(cat, date){
  if(!isObjPlain(DATA.categoryCounts)) DATA.categoryCounts = {};
  Object.values(DATA.categoryCounts).forEach(c=>{ if(c.category===cat && c.date===date) delete DATA.categoryCounts[c.id]; });
  const id = "cc_" + date + "_" + vendorKey(cat) + "_" + Date.now().toString(36);
  DATA.categoryCounts[id] = {
    id, category:cat, date, savedAt:new Date().toISOString(),
    products: DATA.inventory.filter(p=>p.category===cat).map(p=>({uid:p.uid||"", name:p.name, unit:p.unit||"",
      closing:num(p.closing), cost:num(p.cost), retail:num(p.retail), buydown:num(p.buydown)}))
  };
  persist();
  return DATA.categoryCounts[id];
}
/* Which category an invoice line belongs to: the Product List's category for that exact product (name +
   size) when it's on the list, otherwise the category typed on the invoice. */
function invoiceLineCategoryResolver(){
  const keyCat = new Map();
  DATA.inventory.forEach(p=>keyCat.set(normName(p.name)+"||"+normUnit(p.unit), p.category));
  return e=> keyCat.get(normName(e.name)+"||"+normUnit(e.unit)) || String(categoryForInvoiceEntry(e)||"").toUpperCase();
}
function pendingCategoryLines(cat, throughDate){
  const catOf = invoiceLineCategoryResolver();
  return DATA.invoiceEntries.filter(e=>!e.reconciled && e.date && (!throughDate || e.date.slice(0,10) <= throughDate) && (cat==="ALL" || catOf(e)===cat));
}
/* Starts a category's next count period: Opening = Closing for its products, and only that category's
   invoice lines (through the count date) are marked reconciled -- other categories' lines, even on the
   same invoice, stay pending until their own count. Lines remember which count reconciled them so
   deleting that count can put them back. */
function startNextCategoryPeriod(cat, countId, throughDate){
  const lines = pendingCategoryLines(cat, throughDate);
  lines.forEach(e=>{ e.reconciled = true; e.reconciledByCount = countId; });
  const prods = DATA.inventory.filter(p=>p.category===cat);
  prods.forEach(p=>{
    p.opening = num(p.closing);
    p.received_qty = 0; // new period: nothing received yet (Received otherwise falls back to this old figure)
    p.sold = productUnitsSold(p);
  });
  const rec = DATA.categoryCounts[countId];
  if(rec){ rec.rolled = true; rec.reconciledLines = lines.length; }
  persist();
  return {lines: lines.length, total: lines.reduce((t,e)=>t+num(e.total),0), invoices: new Set(lines.map(e=>e.invoice)).size, products: prods.length};
}
function categoryReconcile(cat, fromRec, toRec){
  const keyOf = p=>normName(p.name)+"||"+normUnit(p.unit);
  const fromMap = new Map(fromRec.products.map(p=>[keyOf(p), p]));
  const toMap = new Map(toRec.products.map(p=>[keyOf(p), p]));
  const received = new Map(), lines = [];
  let purchases = 0, unmatched = 0, unmatchedLines = [];
  DATA.invoiceEntries.forEach(e=>{
    const d = (e.date||"").slice(0,10);
    if(!d || d <= fromRec.date || d > toRec.date) return;
    const k = keyOf(e);
    const inCat = fromMap.has(k) || toMap.has(k) || String(categoryForInvoiceEntry(e)).toUpperCase()===cat;
    if(!inCat) return;
    if(fromMap.has(k) || toMap.has(k)){
      received.set(k, (received.get(k)||0) + num(e.qty));
      purchases += num(e.total);
    } else {
      unmatched += num(e.total);
      unmatchedLines.push(e);
    }
  });
  const rows = [];
  const keys = new Set([...toMap.keys(), ...fromMap.keys()]);
  keys.forEach(k=>{
    const fp = fromMap.get(k), tp = toMap.get(k), base = tp || fp;
    const begin = fp ? num(fp.closing) : 0, end = tp ? num(tp.closing) : 0, rec = received.get(k)||0;
    const left = begin + rec - end;
    const cost = num(base.cost), retail = num(base.retail);
    const netCost = isBuydownCategory(cat) ? cost - num(base.buydown) : cost;
    rows.push({name:base.name, unit:base.unit, begin, received:rec, end, left, leftNet:left*netCost,
      beginValue: begin*(fp?num(fp.cost):cost), endValue: end*cost, leftCost:left*cost, leftRetail:left*retail,
      flag: !fp ? "new" : (!tp ? "gone" : (left<0 ? "check" : ""))});
  });
  rows.sort((a,b)=>a.name.localeCompare(b.name));
  const t = rows.reduce((t,r)=>{ ["begin","received","end","left","beginValue","endValue","leftCost","leftNet","leftRetail"].forEach(f=>t[f]+=r[f]); return t; },
    {begin:0, received:0, end:0, left:0, beginValue:0, endValue:0, leftCost:0, leftNet:0, leftRetail:0});
  t.purchases = purchases;
  t.leftBook = t.beginValue + purchases - t.endValue; // dollars by the books (invoice totals)
  t.margin = t.leftRetail>0 ? 1 - t.leftNet/t.leftRetail : null; // after buydowns for Cigarettes/Tobacco
  t.unmatched = unmatched;
  t.days = Math.max(0, Math.round((new Date(toRec.date+"T00:00:00") - new Date(fromRec.date+"T00:00:00"))/86400000));
  t.checks = rows.filter(r=>r.flag==="check").length;
  return {rows, totals:t, unmatchedLines, from:fromRec, to:toRec};
}
function categoryScheduleRows(){
  const cats = [...new Set(DATA.inventory.map(p=>p.category).filter(Boolean))].sort();
  const today = localDay(Date.now());
  return cats.map(cat=>{
    const counts = categoryCountsFor(cat);
    const last = counts[counts.length-1], prev = counts[counts.length-2];
    const every = countEvery(cat);
    const due = last && every ? addMonthsStr(last.date, every) : "";
    let status = "ok";
    if(!every) status = "off";
    else if(!last) status = "never";
    else if(due < today) status = "overdue";
    else if(due.slice(0,7)===today.slice(0,7)) status = "due";
    return {cat, counts, last, prev, every, due, status};
  });
}
function renderCategoryCounts(el){

  const sched = categoryScheduleRows();

    : s==="never" ? '<span class="pill warn">Not counted yet</span>' : s==="off" ? '<span style="color:var(--text-dim);">Not scheduled</span>' : '<span class="pill ok">OK</span>';
  if(!st.category || !sched.some(r=>r.cat===st.category)){
    const withTwo = sched.find(r=>r.counts.length>=2) || sched.find(r=>r.counts.length) || sched[0];

  const opt = (c, sel)=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${fmtCountDate(c.date)}</option>`;

        <tbody>${shown.map(r=>`<tr>

        <tr class="total"><td colspan="2">TOTAL</td><td>${a.totals.begin}</td><td>${a.totals.received}</td><td>${a.totals.end}</td><td>${a.totals.left}</td><td>${fmtUSD(a.totals.leftCost)}</td><td>${fmtUSD(a.totals.leftRetail)}</td><td></td></tr>
        </tbody>
      </table></div>

    <div class="card no-print">
      <h2>Saved ${st.category||""} Counts (${counts.length})</h2>
      ${counts.length ? `<div class="tablewrap"><table><thead><tr><th>Count date</th><th>Saved</th><th>Products</th><th>Units</th><th>Value</th><th>Next period started</th><th></th></tr></thead><tbody>
        ${counts.slice().reverse().map(c=>`<tr><td>${fmtCountDate(c.date)}</td><td>${new Date(c.savedAt).toLocaleString()}</td><td>${c.products.length}</td>
          <td>${c.products.reduce((s,p)=>s+num(p.closing),0).toLocaleString()}</td><td>${fmtUSD(c.products.reduce((s,p)=>s+num(p.closing)*num(p.cost),0))}</td>
          <td>${c.rolled ? `✓ ${c.reconciledLines||0} invoice line(s) reconciled` : (c.id===counts[counts.length-1].id ? `<button class="btn small" data-ccroll="${c.id}">Roll &amp; Reconcile</button>` : "—")}</td>
          <td class="rowbtns"><button class="btn small danger" data-ccdel="${c.id}">Delete</button></td></tr>`).join("")}
      </tbody></table></div>` : `<div class="sub">None yet.</div>`}
    </div>
  `;
  wireReportTypeTabs();
  el.querySelectorAll('[data-every]').forEach(sel=>sel.onchange=()=>{
    setCountEvery(sel.dataset.every, sel.value); renderCategoryCounts(el);
  });
  el.querySelectorAll('[data-ccview]').forEach(b=>b.onclick=()=>{ st.category = b.dataset.ccview; st.fromId = st.toId = ""; renderCategoryCounts(el); });
  document.getElementById('ccCat').onchange = e=>{ st.category = e.target.value; st.fromId = st.toId = ""; renderCategoryCounts(el); };
  document.getElementById('ccFrom').onchange = e=>{ st.fromId = e.target.value; renderCategoryCounts(el); };
  document.getElementById('ccTo').onchange = e=>{ st.toId = e.target.value; st.fromId = ""; renderCategoryCounts(el); };
  const om = document.getElementById('ccOnlyMoved'); if(om) om.onchange = e=>{ st.onlyMoved = e.target.checked; renderCategoryCounts(el); };
  el.querySelectorAll('[data-ccdel]').forEach(b=>b.onclick=()=>{
    const c = DATA.categoryCounts[b.dataset.ccdel];
    if(!c || !confirm(`Delete the ${c.category} count from ${fmtCountDate(c.date)}? It moves to the Trash until midnight.`)) return;
    const marked = DATA.invoiceEntries.filter(e=>e.reconciledByCount===c.id);
    if(marked.length && confirm(`${marked.length} invoice line(s) were marked reconciled when this count was saved. Put them back to Pending too?\n\n(Opening counts that were rolled aren't changed — fix those in Inventory Count if needed.)`)){
      marked.forEach(e=>{ e.reconciled = false; delete e.reconciledByCount; });
    }
    trashPut("categoryCount", `${c.category} count ${fmtCountDate(c.date)}`, c, {id:c.id});
    delete DATA.categoryCounts[c.id];
    persist(); toast("Count deleted"); renderCategoryCounts(el);
  });
  el.querySelectorAll('[data-ccroll]').forEach(b=>b.onclick=()=>{
    const c = DATA.categoryCounts[b.dataset.ccroll]; if(!c) return;
    const pend = pendingCategoryLines(c.category, c.date);
    if(!confirm(`Start the next ${c.category} period?\n\n• Roll ${c.category} Closing → Opening (uses the counts in Inventory Count right now — make sure they're still the ${fmtCountDate(c.date)} counts)\n• Mark ${pend.length} ${c.category} invoice line(s) dated on or before ${fmtCountDate(c.date)} as reconciled. Other categories stay pending.`)) return;
    const r = startNextCategoryPeriod(c.category, c.id, c.date);
    toast(`${c.category}: rolled ${r.products} products, reconciled ${r.lines} invoice line(s)`);
    renderCategoryCounts(el);
  });
  if(a){
    document.getElementById('ccCsvBtn').onclick = ()=>{
      const out = [[`${st.category} reconciliation - ${fmtCountDate(a.from.date)} to ${fmtCountDate(a.to.date)}`],[]];
      out.push(["Beginning value", a.totals.beginValue.toFixed(2)],["Purchases (invoiced)", a.totals.purchases.toFixed(2)],["Ending value", a.totals.endValue.toFixed(2)],
        ["Left the shelf (cost)", a.totals.leftCost.toFixed(2)],["Left the shelf (retail)", a.totals.leftRetail.toFixed(2)],["Margin", a.totals.margin===null?"":(a.totals.margin*100).toFixed(1)+"%"],[]);
      out.push(["Product","Unit","Beginning","Received","Ending","Left the Shelf","Cost of What Left","Retail of What Left","Note"]);
      a.rows.forEach(r=>out.push([r.name, r.unit, r.begin, r.received, r.end, r.left, r.leftCost.toFixed(2), r.leftRetail.toFixed(2),
        r.flag==="check"?"check count / missing invoice":r.flag==="new"?"new since earlier count":r.flag==="gone"?"not in later count":""]));
      if(a.unmatchedLines.length){ out.push([]); out.push(["Invoice lines not matched to a product"]); a.unmatchedLines.forEach(e=>out.push([e.name, e.unit||"", e.date.slice(0,10), e.qty, num(e.total).toFixed(2)])); }
      downloadTextFile(`DJs_Mini_Mart_${st.category}_${a.from.date}_to_${a.to.date}.csv`.replace(/[^\w.\-]+/g,"_"), out.map(r=>r.map(csvEscape).join(",")).join("\n"), "text/csv");
      toast("Reconciliation downloaded");
    };
    document.getElementById('ccPrintBtn').onclick = ()=>window.print();
  }
}

function isLastDayOfMonth(d){

}

function printMonthlyReports(keys, options){
  const opts = Object.assign({includeSummary:true, includeProducts:true}, options||{});

    const report = getInventoryReport(key);

    return `

        <div class="printhead"><h1>\ud83d\udce6 ${report.month} ${report.year} Inventory Report${typeLabel}</h1>

        <table style="margin-bottom:14px;">

          <tbody>${catNames.map(c=>`<tr><td>${c}</td><td>${cats[c].count}</td><td>${fmtUSD(cats[c].closingValue)}</td>

            <td>${fmtUSD(cats[c].profit)}</td><td>${fmtPct(cats[c].margin)}</td><td>${fmtPct(cats[c].sellThrough)}</td></tr>`).join("")}
            <tr class="total"><td>GRAND TOTAL</td><td>${report.products.length}</td><td>${fmtUSD(totals.closingValue)}</td>
            <td>${fmtUSD(totals.salesValue)}</td><td>${totals.units.toLocaleString()}</td><td>${fmtUSD(totals.revenue)}</td>

          </tbody>

        ${opts.includeProducts ? `
        <table>

          <tbody>${report.products.map(p=>`<tr><td>${p.name}</td><td>${p.category}</td><td>${p.unit||""}</td><td>${p.par}</td>
            <td>${p.opening??0}</td><td>${num(p.opening)+num(p.received_qty)}</td><td>${p.closing}</td><td>${p.sold}</td>
            <td>${fmtUSD(p.closing_value)}</td><td>${p.status||""}</td></tr>`).join("")}</tbody>
        </table>` : ``}
      </div>
    `;
  }).join("");

  const restore = ()=>{ window.removeEventListener('afterprint', restore); render(); };
  window.addEventListener('afterprint', restore);
  setTimeout(()=>window.print(), 50);
}

/* ---- Report file (CSV) generation, so a generated report can be attached to any email ---- */
function csvEscape(val){
  const s = String(val==null ? "" : val);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function downloadTextFile(filename, content, mime){
  const blob = new Blob([content], {type: mime || "text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function monthlyReportsFileName(keys){
  const sorted = keys.slice().sort();
  const label = sorted.length===1
    ? (()=>{ const r=getInventoryReport(sorted[0]); return r ? `${r.month}_${r.year}` : "Report"; })()
    : `${sorted.length}_Reports`;
  return `DJs_Mini_Mart_${label}.csv`.replace(/\s+/g,"_");
}
/* Builds the exact same data as printMonthlyReports/emailMonthlyReports, as CSV rows. */
function monthlyReportsToCSV(keys, options){
  const opts = Object.assign({includeSummary:true, includeProducts:true}, options||{});
  const sorted = keys.slice().sort();
  const rows = [];
  sorted.forEach(key=>{
    const report = getInventoryReport(key);
    const cats = inventoryByCategoryCompute(report.products, p=>num(p.received_qty));
    const catNames = Object.keys(cats).sort();
    const totals = inventoryTotalsCompute(cats);
    const low = report.products.filter(p=>inventoryStatus(p.par,p.closing)==="LOW").length;
    const out = report.products.filter(p=>inventoryStatus(p.par,p.closing)==="OUT").length;
    const type = report.periodType || "monthly";
    const typeLabel = type==="year-end" ? " - YEAR-END REPORT" : type==="quarterly" ? " - QUARTERLY REPORT" : "";
    rows.push([`${report.month} ${report.year} Inventory Report${typeLabel}`]);
    rows.push([`Generated ${report.generatedAt ? new Date(report.generatedAt).toLocaleString() : ""}`, `${report.products.length} products`]);
    rows.push([]);
    if(opts.includeSummary){
      rows.push(["Inventory Value", fmtUSD(totals.closingValue), "Retail Value on Hand", fmtUSD(totals.salesValue)]);
      rows.push(["Profit Margin", fmtPct(totals.margin), "Sell-Through", fmtPct(totals.sellThrough)]);
      rows.push(["Low Stock Items", low, "Out of Stock Items", out]);
      rows.push([]);
      rows.push(["Category","#","Cost Value","Sales Value","Units","Revenue","Profit","Margin","Sell-Thru"]);
      catNames.forEach(c=>{
        rows.push([c, cats[c].count, fmtUSD(cats[c].closingValue), fmtUSD(cats[c].salesValue), cats[c].units, fmtUSD(cats[c].revenue), fmtUSD(cats[c].profit), fmtPct(cats[c].margin), fmtPct(cats[c].sellThrough)]);
      });
      rows.push(["GRAND TOTAL", report.products.length, fmtUSD(totals.closingValue), fmtUSD(totals.salesValue), totals.units, fmtUSD(totals.revenue), fmtUSD(totals.profit), fmtPct(totals.margin), fmtPct(totals.sellThrough)]);
      rows.push([]);
    }
    if(opts.includeProducts){
      rows.push(["Product","Category","Unit","Par","Opening","Total Avail.","Closing","Units Sold","Cost Value","Status"]);
      report.products.forEach(p=>{
        rows.push([p.name, p.category, p.unit||"", p.par, p.opening??0, num(p.opening)+num(p.received_qty), p.closing, p.sold, fmtUSD(p.closing_value), p.status||""]);
      });
    }
    rows.push([]); rows.push([]);
  });
  return rows.map(r=>r.map(csvEscape).join(",")).join("\n");
}
/* Downloads the report(s) as a CSV file the person can attach to any email. */
function downloadMonthlyReportsFile(keys, options){
  const csv = monthlyReportsToCSV(keys, options);
  downloadTextFile(monthlyReportsFileName(keys), csv, "text/csv");
  toast("Report file downloaded \u2014 attach it to your email");
}
/* Downloads the report file AND opens the person's default email app with a short summary
   in the body, so the workflow is one click: file lands in Downloads, draft opens ready to
   attach it to and send. */
function emailMonthlyReports(keys, options){
  const opts = Object.assign({includeSummary:true, includeProducts:true}, options||{});
  const sorted = keys.slice().sort();
  downloadMonthlyReportsFile(sorted, opts);
  const subjectLabel = sorted.length===1
    ? (()=>{ const r=getInventoryReport(sorted[0]); return r ? `${r.month} ${r.year} Inventory Report` : "Inventory Report"; })()
    : `${sorted.length} Inventory Reports`;
  const lines = [];
  lines.push(`The full ${subjectLabel} is attached as a CSV file \u2014 it was just downloaded to your computer (check your Downloads folder) and needs to be attached to this email before sending.`);
  lines.push("");
  sorted.forEach(key=>{
    const report = getInventoryReport(key);
    if(opts.includeSummary){
      const cats = inventoryByCategoryCompute(report.products, p=>num(p.received_qty));
      const totals = inventoryTotalsCompute(cats);
      lines.push(`${report.month} ${report.year}: Inventory Value ${fmtUSD(totals.closingValue)}, Profit Margin ${fmtPct(totals.margin)}, Sell-Through ${fmtPct(totals.sellThrough)}`);
    }
  });
  const body = lines.join("\n");
  const subject = `DJ's Mini Mart \u2014 ${subjectLabel}`;
  setTimeout(()=>{
    window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  }, 250);
}

/* Lets the person choose which sections (Summary vs. full Product/Count list) to include before printing. */
function openPrintOptionsModal(keys){
  if(!keys.length) return;
  const label = keys.length===1
    ? (()=>{ const r = getInventoryReport(keys[0]); return r ? `${r.month} ${r.year}` : "this report"; })()
    : `${keys.length} reports`;
  const backdrop = document.createElement('div');
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = `
    <div class="modal-card">
      <h2>Print / Email \u2014 ${label}</h2>
      <div class="sub">Choose what to include, then print it or email it.</div>
      <div class="modal-check-row">
        <input type="checkbox" id="poSummary" checked>
        <label for="poSummary">Inventory Summary<span class="modal-check-sub">Totals, category breakdown, low/out-of-stock counts</span></label>
      </div>
      <div class="modal-check-row">
        <input type="checkbox" id="poProducts" checked>
        <label for="poProducts">Full Product &amp; Count List<span class="modal-check-sub">Every product with opening, closing, units sold, and value</span></label>
      </div>
      <div class="modal-actions">
        <button class="btn small" id="poCancel">Cancel</button>
        <button class="btn small" id="poDownload">\u2b07 Download File</button>
        <button class="btn small" id="poEmail">\u2709 Email</button>
        <button class="btn small primary" id="poPrint">\ud83d\uddb6 Print</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  const close = ()=>backdrop.remove();
  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) close(); });
  document.getElementById('poCancel').onclick = close;
  document.getElementById('poDownload').onclick = ()=>{
    const includeSummary = document.getElementById('poSummary').checked;
    const includeProducts = document.getElementById('poProducts').checked;
    if(!includeSummary && !includeProducts){ toast("Pick at least one section to download", true); return; }
    downloadMonthlyReportsFile(keys, {includeSummary, includeProducts});
  };
  document.getElementById('poPrint').onclick = ()=>{
    const includeSummary = document.getElementById('poSummary').checked;
    const includeProducts = document.getElementById('poProducts').checked;
    if(!includeSummary && !includeProducts){ toast("Pick at least one section to print", true); return; }
    close();
    printMonthlyReports(keys, {includeSummary, includeProducts});
  };
  document.getElementById('poEmail').onclick = ()=>{
    const includeSummary = document.getElementById('poSummary').checked;
    const includeProducts = document.getElementById('poProducts').checked;
    if(!includeSummary && !includeProducts){ toast("Pick at least one section to email", true); return; }
    close();
    emailMonthlyReports(keys, {includeSummary, includeProducts});
  };
}
function renderMonthlyReportDetail(el, key){

  `;

  document.getElementById('backToReports').onclick = ()=>{ monthlyReportsState.selectedKey = null; render(); };
  const body = document.getElementById('mrBody');
  const summaryEl = document.getElementById('mrSummary');
  function drawSummary(){
    const cats = inventoryByCategoryCompute(report.products, p=>num(p.received_qty));
    const catNames = Object.keys(cats).sort();
    const totals = inventoryTotalsCompute(cats);
    const low = report.products.filter(p=>inventoryStatus(p.par,p.closing)==="LOW").length;
    const out = report.products.filter(p=>inventoryStatus(p.par,p.closing)==="OUT").length;
    summaryEl.innerHTML = `
      <div class="card">
        <h2>Inventory Summary \u2014 ${report.month} ${report.year}</h2>
        <div class="sub">Reflects any adjustments made to counts below. Stays in sync automatically.</div>
        <div class="kpis">
          <div class="kpi"><div class="lbl">Inventory Value</div><div class="val">${fmtUSD0(totals.closingValue)}</div></div>
          <div class="kpi"><div class="lbl">Retail Value on Hand</div><div class="val">${fmtUSD0(totals.salesValue)}</div></div>
          <div class="kpi"><div class="lbl">Profit Margin</div><div class="val">${fmtPct(totals.margin)}</div></div>
          <div class="kpi"><div class="lbl">Sell-Through</div><div class="val">${fmtPct(totals.sellThrough)}</div></div>
          <div class="kpi"><div class="lbl">Low Stock</div><div class="val" style="color:#8a6d00">${low}</div></div>
          <div class="kpi"><div class="lbl">Out of Stock</div><div class="val" style="color:var(--red)">${out}</div></div>
        </div>
        <div class="tablewrap"><table>
          <thead><tr><th>Category</th><th># Products</th><th>Cost Value</th><th>Sales Value</th><th>Units on Hand</th>
            <th>Revenue</th><th>Profit</th><th>Profit Margin</th><th>Sell-Through</th></tr></thead>
          <tbody>${catNames.map(c=>`<tr><td>${c}</td><td>${cats[c].count}</td><td>${fmtUSD(cats[c].closingValue)}</td>
            <td>${fmtUSD(cats[c].salesValue)}</td><td>${cats[c].units.toLocaleString()}</td>
            <td>${fmtUSD(cats[c].revenue)}</td><td>${fmtUSD(cats[c].profit)}</td>
            <td>${fmtPct(cats[c].margin)}</td><td>${fmtPct(cats[c].sellThrough)}</td></tr>`).join("")}
            <tr class="total"><td>GRAND TOTAL</td><td>${report.products.length}</td><td>${fmtUSD(totals.closingValue)}</td>
            <td>${fmtUSD(totals.salesValue)}</td><td>${totals.units.toLocaleString()}</td>
            <td>${fmtUSD(totals.revenue)}</td><td>${fmtUSD(totals.profit)}</td>
            <td>${fmtPct(totals.margin)}</td><td>${fmtPct(totals.sellThrough)}</td></tr>
          </tbody>
        </table></div>
      </div>
    `;
  }
  function draw(){
    body.innerHTML = "";
    const s = search.toLowerCase();
    report.products
      .map((p, idx)=>({p, idx}))
      .filter(({p})=> !s || p.name.toLowerCase().includes(s))
      
      .forEach(({p, idx})=>{
        const st = inventoryStatus(p.par, p.closing);
        const pill = st==="OK" ? '<span class="pill ok">OK</span>' : st==="LOW" ? '<span class="pill warn">Low</span>' : '<span class="pill bad">Out</span>';
        const totalAvail = num(p.opening) + num(p.received_qty);
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${p.name}</td><td>${p.category}</td><td>${p.unit||""}</td><td>${p.par}</td>

        p.closing = parseFloat(inp.value)||0;
        p.sold = (num(p.opening) + num(p.received_qty)) - num(p.closing);
        p.closing_value = +(num(p.closing)*num(p.cost)).toFixed(2);
        p.sales_value = +(num(p.closing)*num(p.retail)).toFixed(2);
        p.status = inventoryStatus(p.par, p.closing);
        persist();
        draw();
        drawSummary();
      };
    });
  }
  document.getElementById('mrSearch').oninput = e=>{ search = e.target.value; draw(); };
  drawSummary();
  draw();
}

/* Builds a clean, non-editable printable view of one or more distributor reports and prints it. */

          <thead><tr><th>Distributor</th><th>Invoiced $</th><th># Inv.</th><th>Total Sales</th><th>Cost of Units Sold</th><th>Gross Profit</th><th>Excess $</th><th>Excess %</th><th>Verdict</th></tr></thead>

            <div style="margin-bottom:4px;font-size:12px;">${r.trend.label}</div>

            ${opts.includeMovers ? `
            <table style="margin-bottom:6px;"><thead><tr><th colspan="7">Fastest Moving (${r.fastest.length})</th></tr><tr><th>Product</th><th>Received</th><th>Units Sold</th><th>On Hand</th><th>Revenue</th><th>COGS</th><th>Margin</th></tr></thead>
              <tbody>${r.fastest.length?r.fastest.map(p=>`<tr><td>${p.name}${p.flag?' ⚠':''}</td><td>${p.received}</td><td>${p.sold}</td><td>${p.onHand}</td><td>${fmtUSD(p.soldRetail)}</td><td>${fmtUSD(p.soldCost)}</td><td>${fmtPct(p.margin)}</td></tr>`).join(""):`<tr><td colspan="7">None</td></tr>`}</tbody></table>
            <table style="margin-bottom:10px;"><thead><tr><th colspan="7">Not Moving (${r.notMoving.length})</th></tr><tr><th>Product</th><th>Received</th><th>Units Sold</th><th>On Hand</th><th>Revenue</th><th>COGS</th><th>Margin</th></tr></thead>
              <tbody>${r.notMoving.length?r.notMoving.map(p=>`<tr><td>${p.name}${p.flag?' ⚠':''}</td><td>${p.received}</td><td>${p.sold}</td><td>${p.onHand}</td><td>${fmtUSD(p.soldRetail)}</td><td>${fmtUSD(p.soldCost)}</td><td>${fmtPct(p.margin)}</td></tr>`).join(""):`<tr><td colspan="7">Everything moved</td></tr>`}</tbody></table>` : ``}
            ${opts.includeFlags && r.flaggedProducts.length ? `

        `).join("")}
      </div>
    `;
  }).join("");
  const restore = ()=>{ window.removeEventListener('afterprint', restore); render(); };
  window.addEventListener('afterprint', restore);
  setTimeout(()=>window.print(), 50);
}
function distributorReportsToCSV(ids, options){
  const opts = Object.assign({includeMovers:true, includeInvoices:true, includeFlags:true}, options||{});
  const sorted = ids.slice().sort();

    const report = DATA.distributorReports[id];
    const totalInvoiced = report.rows.reduce((s,r)=>s+r.invoiced,0);
    const totalCogs = report.rows.reduce((s,r)=>s+r.cogsSold,0);
    const totalRevenue = report.rows.reduce((s,r)=>s+r.revenue,0);
    rows.push([`Distributor Report - ${report.fromLabel||"?"} to ${report.toLabel}`]);
    rows.push([`Generated ${report.generatedAt ? new Date(report.generatedAt).toLocaleString() : ""}`, report.distributorFilter==="ALL"?"All distributors":report.distributorFilter]);

    rows.push(["Total Invoiced", fmtUSD(totalInvoiced), "Total Sales (Retail)", fmtUSD(totalRevenue), "Cost of Units Sold", fmtUSD(totalCogs), "Gross Profit", fmtUSD(totalRevenue-totalCogs)]);
    rows.push([]);
    rows.push(["Distributor","Invoiced $","# Invoices","Total Sales (Retail)","Cost of Units Sold","Gross Profit","Margin","Excess $","Excess %","Verdict"]);
    report.rows.forEach(r=>{
      rows.push([r.distributor, fmtUSD(r.invoiced), r.invoiceCount, fmtUSD(r.revenue), fmtUSD(r.cogsSold), fmtUSD(r.profit), fmtPct(r.marginPct), fmtUSD(r.excess), r.excessPct.toFixed(1)+"%", r.flagged?"Not Justified":"Justified"]);
    });
    rows.push([]);
    report.rows.forEach(r=>{
      rows.push([`${r.distributor}`]);
      if(opts.includeInvoices){
        rows.push([r.trend.label]);
        rows.push(["Invoice #","Date","Amount"]);
        r.invoices.forEach(inv=>rows.push([inv.invoice, inv.date?inv.date.slice(0,10):"", fmtUSD(inv.total)]));
        rows.push([]);
      }
      if(opts.includeMovers){
        rows.push([`${r.distributor} — Fastest Moving`]);
        rows.push(["Product","Unit","Received","Units Sold","On Hand","Revenue","COGS","Margin","Pricing Flag"]);
        r.fastest.forEach(p=>rows.push([p.name, p.unit, p.received, p.sold, p.onHand, fmtUSD(p.soldRetail), fmtUSD(p.soldCost), fmtPct(p.margin), p.flag?"Yes":""]));
        rows.push([]);
        rows.push([`${r.distributor} — Not Moving`]);
        rows.push(["Product","Unit","Received","Units Sold","On Hand","Revenue","COGS","Margin","Pricing Flag"]);
        r.notMoving.forEach(p=>rows.push([p.name, p.unit, p.received, p.sold, p.onHand, fmtUSD(p.soldRetail), fmtUSD(p.soldCost), fmtPct(p.margin), p.flag?"Yes":""]));
        rows.push([]);
      }
      if(opts.includeFlags && r.flaggedProducts.length){
        rows.push([`${r.distributor} — Pricing Flags`]);
        rows.push(["Product","Category","Retail","Why it's flagged"]);
        r.flaggedProducts.forEach(p=>rows.push([p.name, p.category, fmtUSD(p.retail), p.flag.detail]));
        rows.push([]);
      }
    });
    rows.push([]); rows.push([]);
  });
  return rows.map(r=>r.map(csvEscape).join(",")).join("\n");
}
function distributorReportsFileName(ids){
  const sorted = ids.slice().sort();
  const label = sorted.length===1
    ? (()=>{ const r=DATA.distributorReports[sorted[0]]; return r ? `${(r.fromLabel||"Report").replace(/[^\w]+/g,"_")}_to_${(r.toLabel||"").replace(/[^\w]+/g,"_")}` : "Distributor_Report"; })()
    : `${sorted.length}_Distributor_Reports`;
  return `DJs_Mini_Mart_${label}.csv`.replace(/\s+/g,"_");
}
function downloadDistributorReportsFile(ids, options){
  const csv = distributorReportsToCSV(ids, options);
  downloadTextFile(distributorReportsFileName(ids), csv, "text/csv");
  toast("Report file downloaded — attach it to your email");
}
function emailDistributorReports(ids, options){
  const opts = Object.assign({includeMovers:true, includeInvoices:true, includeFlags:true}, options||{});
  const sorted = ids.slice().sort();
  downloadDistributorReportsFile(sorted, opts);
  const subjectLabel = sorted.length===1
    ? (()=>{ const r=DATA.distributorReports[sorted[0]]; return r ? `Distributor Report: ${r.fromLabel} → ${r.toLabel}` : "Distributor Report"; })()
    : `${sorted.length} Distributor Reports`;
  const lines = [];
  lines.push(`The full ${subjectLabel} is attached as a CSV file — it was just downloaded to your computer (check your Downloads folder) and needs to be attached to this email before sending.`);
  lines.push("");
  sorted.forEach(id=>{
    const report = DATA.distributorReports[id];
    const totalInvoiced = report.rows.reduce((s,r)=>s+r.invoiced,0);
    const totalCogs = report.rows.reduce((s,r)=>s+r.cogsSold,0);
    const totalRevenue = report.rows.reduce((s,r)=>s+r.revenue,0);
    const flagCount = report.rows.reduce((s,r)=>s+r.flaggedProducts.length,0);
    lines.push(`${report.fromLabel} → ${report.toLabel}: Invoiced ${fmtUSD(totalInvoiced)}, Total Sales ${fmtUSD(totalRevenue)}, Gross Profit ${fmtUSD(totalRevenue-totalCogs)}, ${report.rows.filter(r=>r.flagged).length} of ${report.rows.length} distributors not justified, ${flagCount} pricing flag(s)`);
  });
  const body = lines.join("\n");
  const subject = `DJ's Mini Mart — ${subjectLabel}`;
  setTimeout(()=>{
    window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  }, 250);
}

/* ---------- Cigarette & Tobacco Buydowns ---------- */
/* Two side-by-side windows (Cigarettes | Tobacco), each with its own scroll, search box,
   brand filter, and checkboxes to change the buydown on all or just some products at once -- so when one
   manufacturer (e.g. Marlboro) changes its buydown, you filter to that brand and update
   it in one place without scrolling the whole list. Filters are remembered while you work. */
const bdFilters = { CIGARETTES:{q:"", brand:""}, TOBACCO:{q:"", brand:""} };
const bdSelected = { CIGARETTES:new Set(), TOBACCO:new Set() }; // keys from bulkProductKey(); kept while you change filters, like Bulk Price Update
function bdBrandOf(p){ return String(p.name||"").trim().split(/\s+/)[0].toUpperCase(); }
function bdEsc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function renderBuydowns(el){
  const panels = [
    {cat:"CIGARETTES", title:"Cigarettes", key:"cig"},
    {cat:"TOBACCO", title:"Tobacco", key:"tob"},
  ];
  el.innerHTML = `
    <style>
      .bd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(560px,1fr));gap:16px;align-items:start;}
      @media(max-width:768px){.bd-grid{grid-template-columns:1fr;}}
      .bd-grid .card{margin-bottom:0;}
      .bd-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;}
      .bd-head h2{margin:0;}
      .bd-count{font-size:12px;color:var(--text-dim);}
      .bd-filters{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin-bottom:8px;}
      .bd-bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--text-dim);margin-bottom:10px;}
      .bd-bulk input{width:90px;}
      .bd-bulk select{width:auto;}
      .bd-grid td:first-child, .bd-grid th:first-child{width:28px;padding-right:0;}
      .bd-grid input[type=checkbox]{width:auto;cursor:pointer;}
      .bd-grid tr.bd-sel td{background:var(--gold-bg);}
      .bd-grid th{z-index:2;}
      .bd-grid .tablewrap{max-height:62vh;}
      .bd-grid td, .bd-grid th{white-space:nowrap;}
      .bd-grid td:nth-child(2){white-space:normal;min-width:160px;}
    </style>
    <div class="note">Enter Buydown $/Pack (from your distributor contract) and, if applicable, Multipack Qty + Deal Price. Margins recalculate live. Use the search box or brand filter to jump to one brand, check the products you want (or the header box for all shown), and change their buydown together.</div>
    <div class="bd-grid">
      ${panels.map(pn=>`
      <div class="card" id="bdPanel_${pn.key}">
        <div class="bd-head"><h2>${pn.title}</h2><span class="bd-count" id="bdCount_${pn.key}"></span></div>
        <div class="bd-filters">
          <input type="search" id="bdQ_${pn.key}" placeholder="Search ${pn.title.toLowerCase()} (e.g. Marlboro 100)...">
          <select id="bdBrand_${pn.key}"></select>
          <button class="btn small" id="bdClear_${pn.key}">Clear</button>
        </div>
        <div class="bd-bulk">
          <select id="bdBulkMethod_${pn.key}">
            <option value="set">Set buydown to</option>
            <option value="increaseAmt">Increase buydown by</option>
            <option value="decreaseAmt">Decrease buydown by</option>
          </select>
          <div class="dollar-wrap"><input type="number" step="0.01" min="0" id="bdBulkVal_${pn.key}" placeholder="0.00"></div>
          <button class="btn small primary" id="bdBulkGo_${pn.key}">Apply to <span id="bdSelN_${pn.key}">0</span> selected</button>
          <button class="btn small" id="bdSelClear_${pn.key}">Clear selection</button>
        </div>
        <div class="tablewrap"><table>
          <thead><tr><th><input type="checkbox" id="bdSelAll_${pn.key}" title="Select / unselect every product shown"></th><th>Product</th><th>Cost/Pack</th><th>Retail</th><th>Buydown $/Pack</th><th>Cost After BD</th>
            <th>Margin Before</th><th>Margin After</th><th>Multipack Qty</th><th>Deal Price</th><th>Margin at Deal</th></tr></thead>
          <tbody id="bdBody_${pn.key}"></tbody>
        </table></div>
      </div>`).join("")}
    </div>
  `;

  panels.forEach(pn=>{
    const f = bdFilters[pn.cat];
    const qEl = document.getElementById('bdQ_'+pn.key);
    const brandEl = document.getElementById('bdBrand_'+pn.key);
    const body = document.getElementById('bdBody_'+pn.key);
    const countEl = document.getElementById('bdCount_'+pn.key);
    const sel = bdSelected[pn.cat];
    const selAllEl = document.getElementById('bdSelAll_'+pn.key);
    const selNEl = document.getElementById('bdSelN_'+pn.key);
    function syncSel(){
      const list = visible();
      selNEl.textContent = sel.size;
      const n = list.filter(p=>sel.has(bulkProductKey(p))).length;
      selAllEl.checked = list.length>0 && n===list.length;
      selAllEl.indeterminate = n>0 && n<list.length;
    }
    const all = ()=>DATA.inventory.filter(p=>(p.category||"").toUpperCase()===pn.cat);

    function fillBrands(){
      const brands = [...new Set(all().map(bdBrandOf).filter(Boolean))].sort();
      if(f.brand && !brands.includes(f.brand)) f.brand = "";
      brandEl.innerHTML = `<option value="">All brands</option>` + brands.map(b=>`<option value="${bdEsc(b)}"${b===f.brand?" selected":""}>${bdEsc(b)}</option>`).join("");
    }
    function visible(){
      const terms = f.q.toLowerCase().split(/\s+/).filter(Boolean);
      return all().filter(p=>{
        if(f.brand && bdBrandOf(p)!==f.brand) return false;
        const hay = String(p.name||"").toLowerCase() + " " + (p.num??"");
        return terms.every(t=>hay.includes(t));
      });
    }
    function draw(){
      const list = visible(), total = all().length;
      countEl.textContent = list.length===total ? `${total} products` : `${list.length} of ${total} shown`;
      body.innerHTML = list.length ? "" : `<tr><td colspan="11" style="text-align:center;color:var(--text-dim);padding:18px;">No ${pn.title.toLowerCase()} match this filter.</td></tr>`;
      list.forEach(p=>{
        const cost = num(p.cost), retail = num(p.retail), buydown = num(p.buydown);
        const costAfter = cost - buydown;
        const marginBefore = retail ? (retail-cost)/retail : 0;
        const marginAfter = retail ? (retail-costAfter)/retail : 0;
        const mpQty = p.multipack_qty, dealPrice = p.multipack_deal_price;
        let marginAtDeal = "";
        if(mpQty && dealPrice){
          const dealCost = costAfter*mpQty;
          marginAtDeal = dealPrice ? fmtPct((dealPrice-dealCost)/dealPrice) : "";
        }
        const key = bulkProductKey(p);
        const tr = document.createElement('tr');
        if(sel.has(key)) tr.className = "bd-sel";
        tr.innerHTML = `<td><input type="checkbox" class="bd-check" data-key="${bdEsc(key)}"${sel.has(key)?" checked":""}></td><td>${bdEsc(p.name)}</td><td>${fmtUSD(cost)}</td><td>${fmtUSD(retail)}</td>
          <td><div class="dollar-wrap"><input class="editable-cell" type="number" step="0.01" value="${buydown}" data-num="${p.num}" data-cat="${bdEsc(p.category)}" data-field="buydown" style="width:70px"></div></td>
          <td>${fmtUSD(costAfter)}</td><td>${fmtPct(marginBefore)}</td><td style="font-weight:700;color:${marginAfter>marginBefore?'var(--green)':'inherit'}">${fmtPct(marginAfter)}</td>
          <td><input class="editable-cell" type="number" value="${mpQty??""}" data-num="${p.num}" data-cat="${bdEsc(p.category)}" data-field="multipack_qty" style="width:60px"></td>
          <td><div class="dollar-wrap"><input class="editable-cell" type="number" step="0.01" value="${dealPrice??""}" data-num="${p.num}" data-cat="${bdEsc(p.category)}" data-field="multipack_deal_price" style="width:70px"></div></td>
          <td>${marginAtDeal}</td>`;
        body.appendChild(tr);
      });
      body.querySelectorAll('input.editable-cell').forEach(inp=>{
        inp.onchange = ()=>{
          const p = DATA.inventory.find(x=>x.num===parseInt(inp.dataset.num) && x.category===inp.dataset.cat);
          if(!p) return;
          const field = inp.dataset.field;
          const v = inp.value==="" ? null : parseFloat(inp.value);
          p[field] = v;
          persist(); draw();
        };
      });
      body.querySelectorAll('.bd-check').forEach(cb=>{
        cb.onchange = ()=>{
          if(cb.checked) sel.add(cb.dataset.key); else sel.delete(cb.dataset.key);
          cb.closest('tr').classList.toggle('bd-sel', cb.checked);
          syncSel();
        };
      });
      syncSel();
    }

    qEl.value = f.q;
    fillBrands();
    qEl.oninput = ()=>{ f.q = qEl.value; draw(); };
    brandEl.onchange = ()=>{ f.brand = brandEl.value; draw(); };
    document.getElementById('bdClear_'+pn.key).onclick = ()=>{ f.q = ""; f.brand = ""; qEl.value = ""; brandEl.value = ""; draw(); };
    selAllEl.onchange = ()=>{
      const list = visible();
      list.forEach(p=>{ const k = bulkProductKey(p); if(selAllEl.checked) sel.add(k); else sel.delete(k); });
      draw();
    };
    document.getElementById('bdSelClear_'+pn.key).onclick = ()=>{ sel.clear(); draw(); };
    document.getElementById('bdBulkGo_'+pn.key).onclick = ()=>{
      const chosen = all().filter(p=>sel.has(bulkProductKey(p)));
      if(!chosen.length){ toast("Check at least one product first (or the header box for all shown)", true); return; }
      const valEl = document.getElementById('bdBulkVal_'+pn.key);
      const amount = parseFloat(valEl.value);
      if(isNaN(amount)){ toast("Enter a buydown amount", true); valEl.focus(); return; }
      const method = document.getElementById('bdBulkMethod_'+pn.key).value;
      const verb = method==="set" ? `Set buydown to ${fmtUSD(amount)}/pack` : method==="increaseAmt" ? `Increase buydown by ${fmtUSD(amount)}/pack` : `Decrease buydown by ${fmtUSD(amount)}/pack`;
      const sample = chosen.slice(0,5).map(p=>p.name).join(", ") + (chosen.length>5 ? ` and ${chosen.length-5} more` : "");
      if(!confirm(`${verb} on ${chosen.length} ${pn.cat==="CIGARETTES"?"cigarette":"tobacco"} product${chosen.length===1?"":"s"}?\n\n${sample}`)) return;
      chosen.forEach(p=>{
        const cur = num(p.buydown);
        const next = method==="set" ? amount : method==="increaseAmt" ? cur + amount : cur - amount;
        p.buydown = Math.max(0, +next.toFixed(2));
      });
      valEl.value = "";
      persist(); toast(`Updated buydown on ${chosen.length} product${chosen.length===1?"":"s"}`); draw();
    };
    draw();
  });
}

let loginsEditUid = null, loginsShown = new Set();
function renderLogins(content){
  const rows = Array.isArray(DATA.logins) ? DATA.logins : [];
  const cell = (r, f, ph)=> loginsEditUid===r.uid ? `<input data-lgf="${f}" value="${vEsc(r[f])}" placeholder="${ph}" style="width:100%;min-width:110px;">` : null;
  content.innerHTML = `
<div class="card">
  <div class="flex" style="justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center;">
    <div><h2 style="margin:0;">Important Websites &amp; Logins</h2><div class="sub">Vendor and account portals used to run the station. Only signed-in users can see these.</div></div>
    <button class="btn primary no-print" id="lgAdd">+ Add login</button>
  </div>
  <div class="tablewrap" style="margin-top:10px;"><table>
    <thead><tr><th>Company</th><th>Site</th><th>What It's Used For</th><th>Login</th><th>Password</th><th class="no-print"></th></tr></thead>
    <tbody>
      ${rows.map(r=>`<tr data-lgrow="${vEsc(r.uid)}">
        <td>${cell(r,"company","Company") || `<b>${vEsc(r.company)}</b>`}</td>
        <td>${cell(r,"site","https://…") || (r.site ? `<a class="linklike" href="${vEsc(r.site)}" target="_blank" rel="noopener">Open site</a>` : "—")}</td>
        <td>${cell(r,"usedFor","What it's for") || vEsc(r.usedFor)}</td>
        <td>${cell(r,"login","Username") || (r.login ? vEsc(r.login) : `<span style="color:var(--text-dim);">not entered</span>`)}</td>
        <td style="font-family:monospace;">${cell(r,"password","Password") || (!r.password ? `<span style="color:var(--text-dim);font-family:inherit;">not entered</span>`
          : loginsShown.has(r.uid) ? `${vEsc(r.password)} <button class="btn small no-print" data-lghide="${vEsc(r.uid)}">Hide</button>`
          : `•••••••• <button class="btn small no-print" data-lgshow="${vEsc(r.uid)}">Show</button> <button class="btn small no-print" data-lgcopy="${vEsc(r.uid)}">Copy</button>`)}</td>
        <td class="rowbtns no-print">${loginsEditUid===r.uid
          ? `<button class="btn small primary" data-lgsave="${vEsc(r.uid)}">Save</button><button class="btn small" data-lgcancel="1">Cancel</button>`
          : `<button class="btn small" data-lgedit="${vEsc(r.uid)}">Edit</button><button class="btn small danger" data-lgdel="${vEsc(r.uid)}">Delete</button>`}</td>
      </tr>`).join("") || `<tr><td colspan="6" class="sub">No logins saved yet.</td></tr>`}
    </tbody>
  </table></div>
</div>`;
  const find = uid=>rows.find(r=>r.uid===uid);
  const rer = ()=>renderLogins(content);
  content.querySelector('#lgAdd').onclick = ()=>{
    if(!Array.isArray(DATA.logins)) DATA.logins = [];
    const uid = "lg" + Date.now().toString(36);
    DATA.logins.push({uid, company:"", site:"", usedFor:"", login:"", password:""});
    loginsEditUid = uid; rer();
  };
  content.querySelectorAll('[data-lgshow]').forEach(b=>b.onclick=()=>{ loginsShown.add(b.dataset.lgshow); rer(); });
  content.querySelectorAll('[data-lghide]').forEach(b=>b.onclick=()=>{ loginsShown.delete(b.dataset.lghide); rer(); });
  content.querySelectorAll('[data-lgcopy]').forEach(b=>b.onclick=async()=>{
    try{ await navigator.clipboard.writeText(find(b.dataset.lgcopy).password); toast("Password copied"); }catch(e){ toast("Couldn't copy — use Show instead", true); }
  });
  content.querySelectorAll('[data-lgedit]').forEach(b=>b.onclick=()=>{ loginsEditUid = b.dataset.lgedit; rer(); });
  content.querySelectorAll('[data-lgcancel]').forEach(b=>b.onclick=()=>{
    const r = find(loginsEditUid);
    if(r && !r.company && !r.site && !r.login && !r.password && !r.usedFor) DATA.logins = DATA.logins.filter(x=>x.uid!==r.uid);
    loginsEditUid = null; rer();
  });
  content.querySelectorAll('[data-lgsave]').forEach(b=>b.onclick=()=>{
    const r = find(b.dataset.lgsave); if(!r) return;
    content.querySelectorAll(`[data-lgrow="${CSS.escape(r.uid)}"] [data-lgf]`).forEach(inp=>{ r[inp.dataset.lgf] = inp.value.trim(); });
    if(r.site && !/^https?:\/\//i.test(r.site)) r.site = "https://" + r.site;
    loginsEditUid = null; persist(); rer();
  });
  content.querySelectorAll('[data-lgdel]').forEach(b=>b.onclick=()=>{
    const r = find(b.dataset.lgdel);
    if(!r || !confirm(`Delete the ${r.company||"this"} login?`)) return;
    DATA.logins = DATA.logins.filter(x=>x.uid!==r.uid); persist(); rer();
  });
}

  <h2>Closing Drawer <span class="pill ok">Final</span></h2>
  <div class="sub">Counting down a drawer, closing out the register, and (for the evening shift) closing the day and filling out the Daily Sheet &mdash; 10 phases, start to finish.</div>

  <div class="jumplist">
    <a href="#cd1">1. Make the Bag Whole</a>
    <a href="#cd2">2. Count &amp; Divide the Change</a>
    <a href="#cd3">3. Count &amp; Secure the Cash</a>
    <a href="#cd4">4. Print Evening Paperwork</a>
    <a href="#cd5">5. Close Cashier Report</a>
    <a href="#cd6">6. Close Day Report</a>
    <a href="#cd7">7. Open the Next Drawer</a>
    <a href="#cd8">8. Daily Sheet &mdash; Bottom Table</a>
    <a href="#cd9">9. Daily Sheet &mdash; Top Section</a>
    <a href="#cd10">10. Finish Up</a>
  </div>

  <div class="phase" id="cd1">
    <div class="phase-head"><span class="phase-num">1</span><span class="phase-title">Make the &ldquo;Bag&rdquo; Whole</span></div>
    <ol>
      <li>Each drawer will start with an even <b>$250</b>.</li>
    </ol>
    <div class="tablewrap"><table>
      <thead><tr><th>Denomination</th><th>Count</th><th>Total</th></tr></thead>
      <tbody>
        <tr><td>$20 bills</td><td>5</td><td>$100</td></tr>
        <tr><td>$10 bills</td><td>5</td><td>$50</td></tr>
        <tr><td>$5 bills</td><td>10</td><td>$50</td></tr>
        <tr><td>$1 bills</td><td>50</td><td>$50</td></tr>
      </tbody>
    </table></div>
  </div>

  <div class="phase" id="cd2">
    <div class="phase-head"><span class="phase-num">2</span><span class="phase-title">Count &amp; Divide the Change</span></div>
    <ol>
      <li>Take all the change from the register and count it. Look to make the highest full-dollar amount.</li>
    </ol>
    <div class="subblock">
      <div class="subblock-title">EXAMPLE — $9.35 in change</div>
      <ol>
        <li>Take away the &ldquo;odd&rdquo; $.35 and put it in your &ldquo;drop bag&rdquo; (a beer sleeve that holds receipts and paperwork).</li>
        <li>From the &ldquo;Bag&rdquo; that has the $250, take out the full-dollar amount of the change &mdash; here, $9 (1&ndash;$5 and 4&ndash;$1) &mdash; and put it in the shift drawer/the drawer being counted.</li>
        <li>The &ldquo;Bag&rdquo; now has $241 in cash. Combined with the $9 in change, that makes an even $250 starting point for the next shift&rsquo;s drawer.</li>
        <li>Morning shift puts the $9 in change into the drawer. Evening shift puts the $9 in a clear plastic tray with a note stating the amount.</li>
      </ol>
    </div>
  </div>

  <div class="phase" id="cd3">
    <div class="phase-head"><span class="phase-num">3</span><span class="phase-title">Count &amp; Secure the Cash</span></div>
    <ol>
      <li>Count the cash in the drawer, making sure all the bills are facing the same way.</li>
      <li>Write the total on the Daily Sheet and on a strip of paper.</li>
      <li>Rubber band the cash and place it in the safe with any money from safe drops.</li>
    </ol>
  </div>

  <div class="phase" id="cd4">
    <div class="phase-head"><span class="phase-num">4</span><span class="phase-title">Print Evening Paperwork</span></div>
    <div class="note" style="margin-bottom:10px;">Closing the evening drawer needs paperwork printed out.</div>
    <ol>
      <li>CSR Func &rarr; <b>#2 Network Menu</b>.</li>
      <li><b>#9 Loyalty Reports</b>: print #1 &mdash; the batch number is always 0. (If the screen says &ldquo;can&rsquo;t not open,&rdquo; press the print report anyway.) At times the report won&rsquo;t display but will still print. Once printed, press &ldquo;Previous Screen.&rdquo; You may have to press #9 Loyalty Reports again to get report #2 &mdash; follow the same steps as for report #1.</li>
      <li>Under the #2 Network Menu, go to <b>EPS Network Reports</b> &rarr; <b>#1 Terminal Summary Report</b> and print it. This report is the CC Electronic figure on the Daily Sheet.</li>
      <li>Press &ldquo;Previous Menu&rdquo; until back at the main CSR Func screen.</li>
      <li>From the main CSR Func screen, go to <b>#2 Network Mail</b> &rarr; <b>#3 EPS Network Functions</b>.</li>
      <li>From there, <b>#18 Network Mail</b> &rarr; <b>#7 Settlement New</b> and print out #1 &mdash; this should be today&rsquo;s date.</li>
    </ol>
  </div>

  <div class="phase" id="cd5">
    <div class="phase-head"><span class="phase-num">5</span><span class="phase-title">Close Cashier Report</span></div>
    <ol>
      <li>From the CSR Func main screen, press &ldquo;Reporting Menu&rdquo; &rarr; <b>#1 Close Cashier Report</b>. Enter #1 for morning shift and #2 for evening shift (might have to press enter a few times).</li>
      <li>After closing the Cashier Report, go to <b>#2 Print Cashier Report</b>.</li>
      <li>Enter 1 if closing the morning shift drawer, or 2 if closing the evening shift drawer.</li>
      <li>Enter the total cash for the shift being closed. This should include the money counted from the drawer, the loose change (from the example above, $.35), and the $250 for the bag.</li>
      <li>Once entered, press &ldquo;Enter&rdquo; until returned to the Reporting Menu&rsquo;s home screen.</li>
    </ol>
    <div class="warn-box">⚠️ The morning shift is now finished and needs to open the evening shift&rsquo;s drawer &mdash; see <a href="#cd7">Phase 7</a>.</div>
  </div>

  <div class="phase" id="cd6">
    <div class="phase-head"><span class="phase-num">6</span><span class="phase-title">Close Day Report</span></div>
    <ol>
      <li>Still under &ldquo;Reporting Menu,&rdquo; press <b>#7 Close Day Report</b>. This prints a very long receipt that two numbers need to be taken from:</li>
    </ol>
    <div class="subblock">
      <ol>
        <li>First number &mdash; under <b>Department Report</b>.</li>
        <li>Second number &mdash; under <b>Total Sales Tax</b>.</li>
      </ol>
    </div>
    <div class="note">Closing <b>Drawer #1</b> stops here &mdash; don&rsquo;t continue to Phase 7.</div>
  </div>

  <div class="phase" id="cd7">
    <div class="phase-head"><span class="phase-num">7</span><span class="phase-title">Open the Next Drawer</span></div>
    <ol>
      <li>To open the next drawer, press &ldquo;Return to Sales&rdquo; in the bottom right.</li>
      <li>The screen will ask to log in &mdash; tap the screen and a new window will appear.</li>
      <li>Type in the shift the drawer will be for:</li>
    </ol>
    <div class="subblock">
      <ol>
        <li>Evening types <b>1</b> (for Morning shift).</li>
        <li>Morning types <b>2</b> (for Evening shift).</li>
      </ol>
    </div>
    <ol start="4">
      <li>Password is <b>123</b>.</li>
      <li>Drawer amount is <b>$250</b> &mdash; it comes from the &ldquo;Bag&rdquo; plus the change.</li>
    </ol>
  </div>

  <div class="phase" id="cd8">
    <div class="phase-head"><span class="phase-num">8</span><span class="phase-title">Filling Out the Daily Sheet &mdash; Bottom Table</span></div>
    <div class="sub" style="margin-bottom:8px;">The table at the bottom of the sheet gets filled out as follows:</div>
    <div class="tablewrap"><table>
      <thead><tr><th>Field</th><th>What to Enter</th></tr></thead>
      <tbody>
        <tr><td><b>Time</b></td><td>Time the drawer was closed (Morning 10:00&ndash;11:00, Evening 10:00).</td></tr>
        <tr><td><b>Cashier</b></td><td>Put initials.</td></tr>
        <tr><td><b>Drop Amount</b></td><td>Total amount of cash counted from the drawer, after paying back the $250 bag.</td></tr>
        <tr><td><b>Change</b></td><td>The extra change (from the example above, this would be $.35).</td></tr>
        <tr><td><b>Checks</b></td><td>If any checks were taken in, write the total amount. There&rsquo;s an approved check list by the register &mdash; if unsure, call the manager and make sure driver&rsquo;s license, date of birth, and phone number are on the check.</td></tr>

      </tbody>
    </table></div>
    <div class="note">Add up all the numbers to get the total for the shift.</div>
  </div>

  <div class="phase" id="cd9">
    <div class="phase-head"><span class="phase-num">9</span><span class="phase-title">Filling Out the Daily Sheet &mdash; Top Section</span></div>

      </tbody>
    </table></div>
  </div>

  <div class="phase" id="cd10">
    <div class="phase-head"><span class="phase-num">10</span><span class="phase-title">Finish Up</span></div>
    <ol>
      <li>Once the sheet has been fully filled out, tri-fold it and paperclip it with all the other reports.</li>
    </ol>
  </div>
</div>
`;

      <li><b>Download a backup</b> in <b>Backup &amp; Restore &rarr; Download Backup</b>. Data lives in the browser, so always back up before big changes.</li>
      <li><b>Print the count sheets</b> in <b>Inventory &rarr; Counts &rarr; Count Sheet (Print) &rarr; Print This View</b>. Each category prints on its own page(s) &mdash; staple each category together.</li>
    </ol>
  </div>

  <div class="phase" id="ipp2">
    <div class="phase-head"><span class="phase-num">2</span><span class="phase-title">Conducting the Count</span></div>
    <ol>
      <li><b>Assign categories</b> &mdash; one person per category. Each counter writes their name and the date on the sheet header.</li>
      <li><b>Count in the unit shown on the sheet.</b> If it says <b>12pk</b>, count 12-packs, not cans. Note loose singles from broken packs in the margin.</li>
      <li><b>Count everywhere</b> &mdash; shelf, cooler, backroom, and overstock. Work in a fixed pattern (left&rarr;right, top&rarr;bottom) so nothing is counted twice.</li>
      <li><b>Write 0 for items you don&rsquo;t have.</b> Never leave a line blank &mdash; blank means &ldquo;not counted,&rdquo; not zero.</li>
      <li><b>New items</b> go on the blank pages at the back (name, unit, count).</li>
      <li><b>High-value items get a second count</b> &mdash; cigarettes, tobacco, and liquor should be recounted by a second person who initials &ldquo;Verified by.&rdquo;</li>
    </ol>
    <div class="warn-box">⚠️ Cigarettes, tobacco, and liquor are where most shrink shows up &mdash; never skip the second count.</div>

    <div class="phase-head"><span class="phase-num">3</span><span class="phase-title">Entering Counts into the Site</span></div>

      <li><b>Add any new products first</b> (from the blank pages) in <b>Inventory &rarr; Overview &rarr; Product List</b> so they have a row to enter into.</li>
      <li>Go to <b>Inventory &rarr; Counts &rarr; Inventory Count</b>. Set Category to <b>All Categories</b>, leave search empty, and click <b>Clear Closing (all shown)</b> so no old numbers carry over. <i>Only do this if last period was rolled (Phase 4, step 2).</i></li>

      <li><b>Sanity-check Units Sold</b> as you go (Units Sold = Opening + Received &minus; Closing):
        <ul>
          <li><b>Negative</b> &rarr; usually a missing invoice or a miscount. Recheck the shelf or the invoice.</li>
          <li><b>Way higher than normal</b> &rarr; possible shrink, theft, or a miscount. Recount it.</li>
        </ul>
      </li>
      <li>Use the <b>Notes</b> column for anything odd (damaged, expired, recounted, etc.).</li>
    </ol>
  </div>

  <div class="phase" id="ipp4">
    <div class="phase-head"><span class="phase-num">4</span><span class="phase-title">Closing Out the Period</span></div>
    <ol>
      <li><b>Save a snapshot</b> &mdash; <b>Inventory &rarr; Reports &rarr; Monthly Reports &rarr; Generate Report</b> for this month. This freezes counts, values, and sales for your records.</li>
      <li><b>Roll the count forward</b> &mdash; back in <b>Inventory Count</b>, set Category to <b>All Categories</b>, then click <b>Roll Closing &rarr; Opening (all shown)</b>. This count becomes next period&rsquo;s starting point.</li>
      <li><b>Reconcile invoices</b> &mdash; <b>Inventory &rarr; Invoices &rarr; Invoice Log &rarr; Reconcile a Count Period</b>. Pick the count date and click <b>Mark Reconciled Through This Date</b> so those deliveries don&rsquo;t count again next time. If a delivery arrived <i>after</i> the count on the same day, reconcile through the day before and handle that invoice separately.</li>
      <li><b>Download another backup</b> now that the count is final.</li>
    </ol>
    <div class="warn-box">⚠️ The <b>Clear</b> and <b>Roll</b> buttons only affect the products currently shown. Always confirm Category is <b>All Categories</b> and the search box is empty first &mdash; otherwise you&rsquo;ll only roll one category.</div>
  </div>
</div>
`;

  document.getElementById('exportBtn').onclick = ()=>{

    const a = document.createElement('a');
    a.href = url; a.download = `station-manager-backup-${new Date().toISOString().slice(0,10)}.json`;

  };
  document.getElementById('importFile').onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{

      }catch(err){ toast("That file doesn't look like a valid backup", true); }
    };
    reader.readAsText(file);
  };

function vDate(s){

/* Invoice totals by vendor (Sales & Margins invoice list goes back to 2021 and covers every vendor). */
let _vendorInvCache = null, _vendorInvSig = null;
function vendorInvoiceHistory(){
  const sig = DATA_VERSION + "|" + DATA.vendors.length;
  if(_vendorInvCache && _vendorInvSig===sig) return _vendorInvCache;
  const byVendor = new Map();
  Object.keys(DATA.overlooks||{}).forEach(y=>{
    const yr = DATA.overlooks[y] || {};
    Object.keys(yr).forEach(m=>{
      ((yr[m]||{}).invoices||[]).forEach(inv=>{
        if(!inv || !inv.company) return;
        const name = vendorCanon(inv.company);
        if(!byVendor.has(name)) byVendor.set(name, []);
        byVendor.get(name).push({invoice:inv.invoice, amount:num(inv.amount), date:String(inv.date||"").slice(0,10)});
      });
    });
  });
  byVendor.forEach(list=>list.sort((a,b)=>b.date.localeCompare(a.date)));
  _vendorInvCache = byVendor; _vendorInvSig = sig;
  return byVendor;
}
function vendorSummary(v){
  const hist = vendorInvoiceHistory().get(v.name) || [];
  const cutoff = new Date(Date.now()-90*24*3600*1000).toISOString().slice(0,10);
  return {
    products: DATA.inventory.filter(p=>p.vendor===v.name),
    last: hist[0] || null,
    spend90: hist.filter(h=>h.date>=cutoff).reduce((s,h)=>s+h.amount,0),
    invoices: hist,
    alerts: openPriceAlerts().filter(a=>a.vendor===v.name)
  };
}
function topVendorsByCategory(){
  const m = new Map();
  DATA.inventory.forEach(p=>{
    if(!p.vendor) return;
    if(!m.has(p.category)) m.set(p.category, new Map());
    const c = m.get(p.category); c.set(p.vendor, (c.get(p.vendor)||0)+1);
  });
  const out = {};
  m.forEach((c,cat)=>{ out[cat] = [...c.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0]); });
  return out;
}
function askNewVendorName(){
  const name = (prompt("New vendor's name (as it appears on their invoices):")||"").replace(/\s+/g,' ').trim();
  if(!name) return null;
  const existing = findVendor(name);
  if(existing){ toast(`"${existing.name}" is already on the vendor list`); return existing.name; }
  const v = ensureVendor(name);
  return v.name;
}
