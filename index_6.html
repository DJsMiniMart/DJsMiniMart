    <div id="pwGateError" style="color:#f87171;font-size:13px;min-height:18px;margin-bottom:8px;"></div>

<script>
(function(){
  var CORRECT_PW = "DJII";
  var input = document.getElementById('pwGateInput');
  var btn = document.getElementById('pwGateBtn');
  var err = document.getElementById('pwGateError');
  var overlay = document.getElementById('pwGateOverlay');
  function tryUnlock(){
    if(input.value === CORRECT_PW){
      overlay.style.display = 'none';
    } else {
      err.textContent = "Incorrect password";
      input.value = "";
      input.focus();
    }
  }
  btn.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') tryUnlock(); });
  setTimeout(function(){ input.focus(); }, 50);
})();

<script>
/* ===================== DATA LAYER ===================== */
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const STORAGE_KEY = "stationManagerData_v2";
let SEED = null;
async function loadSeed(){
  const res = await fetch('data-seed.json');
  SEED = await res.json();
}

function migrate(stored){
  let changed = false;
  Object.keys(SEED).forEach(k=>{
    if(!(k in stored)){ stored[k] = JSON.parse(JSON.stringify(SEED[k])); changed = true; }
  });
  if(Array.isArray(stored.inventory)){
    const seedIndex = {};
    SEED.inventory.forEach(p=>{ seedIndex[p.num+"|"+p.category] = p; });
    const newFields = ["opening","received_qty","notes","buydown","multipack_qty","multipack_deal_price"];
    stored.inventory.forEach(p=>{
      const s = seedIndex[p.num+"|"+p.category];
      newFields.forEach(f=>{
        if(!(f in p)){
          p[f] = s ? s[f] : (f==="notes" ? "" : (f==="opening"||f==="received_qty"||f==="buydown" ? 0 : null));
          changed = true;
        }
      });
    });
  }
  return changed;
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const stored = JSON.parse(raw);
      const changed = migrate(stored);
      if(changed) saveData(stored);
      return stored;
    }
  }catch(e){ console.warn("localStorage read failed", e); }
  const fresh = JSON.parse(JSON.stringify(SEED));
  saveData(fresh);
  return fresh;
}
function saveData(d){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
  catch(e){ console.warn("localStorage write failed", e); toast("Could not save — storage may be full or blocked", true); }
}
let DATA = null;

function persist(){ saveData(DATA); scheduleCloudSave(); toast("Saved"); }

/* ===================== CLOUD SYNC (Firestore) ===================== */
// Firestore documents cap out at ~1MB, but our data is bigger, so we split it into
// numbered "chunk" documents and reassemble them on load. A separate "meta" document
// tracks how many chunks exist and who wrote them last, so every open copy of this
// file can tell when someone else has made a change and pull the update automatically.
const CLIENT_ID_KEY = "stationManagerClientId";
function getClientId(){
  try{
    let id = localStorage.getItem(CLIENT_ID_KEY);
    if(!id){ id = "c" + Date.now() + "_" + Math.random().toString(36).slice(2); localStorage.setItem(CLIENT_ID_KEY, id); }
    return id;
  }catch(e){ return "c" + Date.now() + "_" + Math.random().toString(36).slice(2); }
}
const CLIENT_ID = getClientId();
const CHUNK_SIZE = 500000; // characters per Firestore document, safely under the 1MB field limit
let syncState = { status: "connecting", rev: 0, lastChunkCount: 0 };

function updateSyncBadge(){
  const el = document.getElementById('sidebarFoot');
  if(!el) return;
  const labels = {
    connecting: "Connecting...",
    syncing: "\u21bb Syncing...",
    synced: "\u25cf Synced \u2014 everyone sees your changes",
    error: "\u26a0 Offline \u2014 saved to this browser only",
    nocloud: "Local data \u00b7 saved in this browser"
  };
  el.textContent = labels[syncState.status] || labels.nocloud;
}

function chunkString(str, size){
  const out = [];
  for(let i=0; i<str.length; i+=size) out.push(str.slice(i, i+size));
  return out.length ? out : [""];
}

async function cloudSaveNow(){
  if(!window.db){ syncState.status = "nocloud"; updateSyncBadge(); return; }
  try{
    syncState.status = "syncing"; updateSyncBadge();
    const json = JSON.stringify(DATA);
    const chunks = chunkString(json, CHUNK_SIZE);
    const rev = (syncState.rev||0) + 1;
    const batch = db.batch();
    chunks.forEach((c,i)=>{ batch.set(db.collection('stationManagerSync').doc('chunk_'+i), {data:c}); });
    const prevCount = syncState.lastChunkCount || 0;
    for(let i=chunks.length; i<prevCount; i++){ batch.delete(db.collection('stationManagerSync').doc('chunk_'+i)); }
    batch.set(db.collection('stationManagerSync').doc('meta'), {
      rev, updatedBy: CLIENT_ID, updatedAt: firebase.firestore.FieldValue.serverTimestamp(), chunkCount: chunks.length
    });
    await batch.commit();
    syncState.rev = rev;
    syncState.lastChunkCount = chunks.length;
    syncState.status = "synced";
    updateSyncBadge();
  }catch(e){
    console.warn("Cloud save failed", e);
    syncState.status = "error";
    updateSyncBadge();
  }
}

let cloudSaveTimer = null;
function scheduleCloudSave(){
  if(!window.db) return;
  syncState.status = "syncing"; updateSyncBadge();
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(cloudSaveNow, 1200);
}

async function fetchCloudChunks(meta){
  const gets = [];
  for(let i=0; i<meta.chunkCount; i++) gets.push(db.collection('stationManagerSync').doc('chunk_'+i).get());
  const snaps = await Promise.all(gets);
  return snaps.map(s=>{
    const d = s.data();
    return d ? d.data : "";
  }).join('');
}

async function cloudLoadInitial(){
  if(!window.db){ syncState.status = "nocloud"; updateSyncBadge(); return false; }
  try{
    const metaSnap = await db.collection('stationManagerSync').doc('meta').get();
    if(!metaSnap.exists){
      // Nothing in the cloud yet -- this copy becomes the shared starting point.
      syncState.rev = 0;
      await cloudSaveNow();
      return true;
    }
    const meta = metaSnap.data();
    const json = await fetchCloudChunks(meta);
    const parsed = JSON.parse(json);
    migrate(parsed);
    DATA = parsed;
    saveData(DATA);
    syncState.rev = meta.rev;
    syncState.lastChunkCount = meta.chunkCount;
    syncState.status = "synced";
    updateSyncBadge();
    return true;
  }catch(e){
    console.warn("Cloud load failed", e);
    syncState.status = "error";
    updateSyncBadge();
    return false;
  }
}

function startCloudListener(){
  if(!window.db) return;
  db.collection('stationManagerSync').doc('meta').onSnapshot(async (snap)=>{
    if(!snap.exists) return;
    if(snap.metadata.hasPendingWrites) return; // our own write, not yet confirmed -- ignore the echo
    const meta = snap.data();
    if(meta.updatedBy === CLIENT_ID) return; // our own confirmed write -- already applied locally
    if(meta.rev === syncState.rev) return; // nothing new
    try{
      const json = await fetchCloudChunks(meta);
      const parsed = JSON.parse(json);
      migrate(parsed);
      DATA = parsed;
      saveData(DATA);
      syncState.rev = meta.rev;
      syncState.lastChunkCount = meta.chunkCount;
      syncState.status = "synced";
      updateSyncBadge();
      render();
      toast("Updated with a teammate's changes");
    }catch(e){ console.warn("Cloud listener refresh failed", e); }
  }, err=>{ console.warn("Cloud listener error", err); syncState.status = "error"; updateSyncBadge(); });
}

function toast(msg, bad){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = bad ? "var(--red)" : "var(--navy)";
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ===================== FORMAT HELPERS ===================== */
const fmtUSD = n => (n<0?"-$":"$") + Math.abs(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtUSD0 = n => (n<0?"-$":"$") + Math.abs(n||0).toLocaleString(undefined,{maximumFractionDigits:0});
const fmtPct = n => ((n||0)*100).toFixed(1) + "%";
const num = v => (typeof v === "number" && !isNaN(v)) ? v : 0;

/* ===================== COMPUTE: SALES ===================== */
function monthTotals(year, month){
  const md = DATA.overlooks[year][month];
  let store=0, gas=0, profit=0, daysWithData=0;
  md.daily.forEach(d=>{
    if(typeof d.store === "number"){ store += d.store; daysWithData++; }
    if(typeof d.gas === "number"){ gas += d.gas; }
  });
  // profit per day only when store present
  profit = 0;
  md.daily.forEach(d=>{ if(typeof d.store === "number") profit += d.store - num(d.gas); });
  const invoices = md.invoices.reduce((s,i)=>s+num(i.amount),0);
  const rebates = md.rebates.reduce((s,r)=>s+num(r.amount),0);
  const netProfit = profit + rebates - invoices;
  const goal = 0.30;
  const grossMargin = (profit+rebates) !== 0 ? netProfit/(profit+rebates) : 0;
  const markup = invoices !== 0 ? netProfit/invoices : 0;
  const maxPurchases = (profit+rebates)/(1+goal);
  const remaining = maxPurchases - invoices;
  const status = markup >= goal ? "On Track" : "Below Goal";
  const avgDaily = daysWithData ? store/daysWithData : 0;
  let avgProfit = 0;
  if(daysWithData){
    let sum=0; md.daily.forEach(d=>{ if(typeof d.store==="number") sum += d.store-num(d.gas); });
    avgProfit = sum/daysWithData;
  }
  return {store,gas,combined:store+gas,profit,invoices,rebates,netProfit,grossMargin,markup,goal,
          maxPurchases,remaining,status,daysWithData,avgDaily,avgProfit,
          priorYearProfit: md.prior_year_profit};
}

function yearTotals(year){
  let acc = {store:0,gas:0,combined:0,profit:0,invoices:0,rebates:0,netProfit:0};
  let monthsWithData = 0;
  MONTHS.forEach(m=>{
    const t = monthTotals(year, m);
    if(t.daysWithData>0){ monthsWithData++; }
    acc.store+=t.store; acc.gas+=t.gas; acc.combined+=t.combined; acc.profit+=t.profit;
    acc.invoices+=t.invoices; acc.rebates+=t.rebates; acc.netProfit+=t.netProfit;
  });
  const goal=0.30;
  acc.grossMargin = (acc.profit+acc.rebates)!==0 ? acc.netProfit/(acc.profit+acc.rebates) : 0;
  acc.markup = acc.invoices!==0 ? acc.netProfit/acc.invoices : 0;
  acc.monthsWithData = monthsWithData;
  return acc;
}

/* ===================== COMPUTE: FORECASTER ===================== */
function avgDailyProfitTable(){
  // returns {year: {month: avgProfit-or-null}}
  const out = {};
  Object.keys(DATA.overlooks).forEach(y=>{
    out[y] = {};
    MONTHS.forEach(m=>{
      const t = monthTotals(y,m);
      out[y][m] = t.daysWithData ? t.avgProfit : null;
    });
  });
  return out;
}

function getForecastYears(){
  const allYears = Object.keys(DATA.overlooks).sort();
  // treat a year as "complete" if it has data in most months
  const complete = allYears.filter(y=>MONTHS.filter(m=>monthTotals(y,m).daysWithData>0).length>=10);
  const chosen = complete.slice(-5);
  return chosen.length ? chosen : allYears.slice(-5);
}

function recommendedAction(month, alert){
  if(!alert) return "";
  return `Start reducing standing orders 2\u20133 weeks before ${month} to avoid excess overhead.`;
}

function getTrackerYear(years5){
  const allYears = Object.keys(DATA.overlooks).sort();
  const partial = allYears.filter(y=>{
    const mo = MONTHS.filter(m=>monthTotals(y,m).daysWithData>0).length;
    return mo>0 && mo<12 && !years5.includes(y);
  });
  return partial.length ? partial[partial.length-1] : null;
}

function forecastAnalysis(){
  const table = avgDailyProfitTable();
  const years5 = getForecastYears();
  const rows = MONTHS.map((m,i)=>{
    const vals = years5.map(y=>table[y][m]).filter(v=>v!==null && v!==undefined);
    const avg5 = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
    return {month:m, idx:i, avg5};
  });
  rows.forEach((r,i)=>{
    const prev = i===0 ? rows[11].avg5 : rows[i-1].avg5;
    r.momDollar = (r.avg5!==null && prev!==null) ? r.avg5-prev : null;
    r.momPct = (r.momDollar!==null && prev) ? r.momDollar/prev : null;
  });
  // decline consistency per month across years5 (Jan compares to prior *year's* Dec)
  rows.forEach((r,i)=>{
    let declines=0, valid=0;
    years5.forEach(y=>{
      let cur = table[y][r.month];
      let prior;
      if(i===0){
        const py = String(parseInt(y)-1);
        prior = table[py] ? table[py]["December"] : null;
      } else {
        prior = table[y][MONTHS[i-1]];
      }
      if(cur!==null && cur!==undefined && prior!==null && prior!==undefined){
        valid++; if(cur<prior) declines++;
      }
    });
    r.consistency = valid ? declines/valid : null;
    r.declines = declines;
    r.validYears = valid;
    r.alert = r.consistency!==null && r.consistency>=0.6;
    r.action = recommendedAction(r.month, r.alert);
  });
  return rows;
}

/* ===================== COMPUTE: INVENTORY ===================== */
function inventoryStatus(par, closing){
  if(closing<=0) return "OUT";
  if(closing<par) return "LOW";
  return "OK";
}
function inventoryByCategoryCompute(products, receivedFn){
  const cats = {};
  products.forEach(p=>{
    const c = p.category || "Uncategorized";
    if(!cats[c]) cats[c] = {closingValue:0,salesValue:0,units:0,revenue:0,cogs:0,profit:0,count:0,sold:0,totalAvailable:0};
    cats[c].closingValue += num(p.closing_value);
    cats[c].salesValue += num(p.sales_value);
    cats[c].units += num(p.closing);
    cats[c].revenue += num(p.retail)*num(p.sold);
    cats[c].cogs += num(p.cost)*num(p.sold);
    cats[c].profit += (num(p.retail)-num(p.cost))*num(p.sold);
    cats[c].sold += num(p.sold);
    cats[c].totalAvailable += num(p.opening) + receivedFn(p);
    cats[c].count += 1;
  });
  Object.values(cats).forEach(c=>{
    c.margin = c.revenue!==0 ? c.profit/c.revenue : 0;
    c.sellThrough = c.totalAvailable!==0 ? c.sold/c.totalAvailable : 0;
  });
  return cats;
}
function inventoryTotalsCompute(cats){
  const t = {closingValue:0,salesValue:0,units:0,revenue:0,cogs:0,profit:0,sold:0,totalAvailable:0};
  Object.values(cats).forEach(c=>{
    t.closingValue+=c.closingValue; t.salesValue+=c.salesValue; t.units+=c.units;
    t.revenue+=c.revenue; t.cogs+=c.cogs; t.profit+=c.profit; t.sold+=c.sold; t.totalAvailable+=c.totalAvailable;
  });
  t.margin = t.revenue!==0 ? t.profit/t.revenue : 0;
  t.sellThrough = t.totalAvailable!==0 ? t.sold/t.totalAvailable : 0;
  return t;
}
function inventoryByCategory(){
  return inventoryByCategoryCompute(DATA.inventory, productReceived);
}
function inventoryTotals(){
  return inventoryTotalsCompute(inventoryByCategory());
}

function drawDashForecastChart(container, rows){
  const vals = rows.map(r=>r.avg5||0);
  const maxV = Math.max(1,...vals);
  const w=380,h=140,pad=20;
  const stepX = (w-pad*2)/(rows.length-1);
  let pts = rows.map((r,i)=>`${pad+i*stepX},${h-pad-((r.avg5||0)/maxV)*(h-pad*2)}`).join(" ");
  container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" class="chart" style="height:140px">
    <polyline points="${pts}" fill="none" stroke="var(--navy)" stroke-width="2"></polyline>
    ${rows.map((r,i)=>`<circle cx="${pad+i*stepX}" cy="${h-pad-((r.avg5||0)/maxV)*(h-pad*2)}" r="2.5" fill="${r.alert?'var(--red)':'var(--navy-light)'}"></circle>`).join("")}
  </svg>`;
}

function drawDashYoyChart(container, years){
  const totals = years.map(y=>({year:y, combined:yearTotals(y).combined}));
  const maxV = Math.max(1, ...totals.map(t=>t.combined));
  const w=380,h=140,pad=20,bw=(w-pad*2)/totals.length;
  let bars="";
  totals.forEach((t,i)=>{
    const x = pad+i*bw;
    const hgt = (t.combined/maxV)*(h-pad*2);
    bars += `<rect x="${x+2}" y="${h-pad-hgt}" width="${bw*0.7}" height="${hgt}" fill="${t.year===dashState.year?'var(--navy)':'var(--navy-lighter)'}"></rect>`;
  });
  container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" class="chart" style="height:140px">${bars}</svg>`;
}

function drawMonthlyBarChart(container, year){
  const data = MONTHS.map(m=>monthTotals(year,m));
  const maxV = Math.max(1, ...data.map(d=>Math.max(d.combined, d.netProfit)));
  const w=560,h=220,pad=28, bw = (w-pad*2)/12;
  let bars = "";
  data.forEach((d,i)=>{
    const x = pad + i*bw;
    const hCombined = (d.combined/maxV)*(h-pad*2);
    const hProfit = (d.netProfit/maxV)*(h-pad*2);
    bars += `<rect x="${x+2}" y="${h-pad-hCombined}" width="${bw*0.4}" height="${hCombined}" fill="#7BAFD4"></rect>`;
    bars += `<rect x="${x+2+bw*0.42}" y="${h-pad-Math.max(hProfit,0)}" width="${bw*0.4}" height="${Math.max(hProfit,0)}" fill="#4B9CD3"></rect>`;
    bars += `<text x="${x+bw/2}" y="${h-8}" font-size="9" text-anchor="middle" fill="#767676">${MONTHS[i].slice(0,3)}</text>`;
  });
  container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" class="chart">${bars}
    <text x="${pad}" y="14" font-size="10" fill="#7BAFD4">\u25a0 Combined Sales</text>
    <text x="${pad+120}" y="14" font-size="10" fill="#4B9CD3">\u25a0 Net Profit</text>
  </svg>`;
}

function yearlyMetricValue(year, key){
  if(key==="avgProfit"){
    const vals = MONTHS.map(m=>monthTotals(year,m)).filter(t=>t.daysWithData>0).map(t=>t.avgProfit);
    return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  }
  const t = yearTotals(year);
  if(t.monthsWithData===0 && key!=="invoices" && key!=="rebates") return null;
  return t[key];
}

function metricInsight(metric, years){
  const entries = years.map(y=>[y, yearlyMetricValue(y, metric.key)]).filter(([y,v])=>v!==null && v!==undefined);
  if(entries.length<2){
    return `Not enough complete years on file yet to compare ${metric.label.toLowerCase()} year over year.`;
  }
  const best = entries.reduce((a,b)=> b[1]>a[1]?b:a);
  const worst = entries.reduce((a,b)=> b[1]<a[1]?b:a);
  const first = entries[0], last = entries[entries.length-1];
  const trendPct = first[1] ? (last[1]-first[1])/Math.abs(first[1]) : null;
  const trendDir = trendPct===null ? "holding flat" : trendPct>0.03 ? "trending up" : trendPct<-0.03 ? "trending down" : "holding roughly steady";
  const diffPct = worst[1] ? Math.abs((best[1]-worst[1])/worst[1]) : null;
  const swing = diffPct!==null ? ` \u2014 a ${fmtPct(diffPct)} swing` : "";
  const partialNote = year=>{ const mo = yearTotals(year).monthsWithData; return mo<12 ? ` (only ${mo} of 12 months on file \u2014 not a full year, so treat this comparison with caution)` : ""; };
  return `What this shows: ${metric.label} for every complete year on file. Your strongest year was ${best[0]} at ${metric.fmt(best[1])}${partialNote(best[0])}, versus ${worst[0]} at ${metric.fmt(worst[1])}${partialNote(worst[0])}${swing}. Across the full history, the trend is ${trendDir}. ${METRIC_ACTIONS[metric.key]||""}`;
}

function multiMetricInsight(keys, years, intro){
  const parts = keys.map(k=>{
    const metric = YOY_METRICS.find(m=>m.key===k);
    const entries = years.map(y=>[y, yearlyMetricValue(y, k)]).filter(([y,v])=>v!==null && v!==undefined);
    if(entries.length<2) return `${metric.label} doesn't have enough complete years yet to compare`;
    const best = entries.reduce((a,b)=> b[1]>a[1]?b:a);
    const worst = entries.reduce((a,b)=> b[1]<a[1]?b:a);
    return `${metric.label} peaked in ${best[0]} at ${metric.fmt(best[1])} and was lowest in ${worst[0]} at ${metric.fmt(worst[1])}`;
  });
  return `${intro} ${parts.join("; ")}. Highlighted cells in the table mark each metric's own best year (Carolina blue) and worst year (navy).`;
}

/* ---------- Key Insights & Action Plan: phase classification ---------- */
function classifyPhase(r, bottomMonth){
  if(r.month===bottomMonth.month) return "Bottom of the cycle";
  if(r.idx===0 && r.alert) return "Post-holiday dip";
  if(!r.alert) return "Building season";
  return r.consistency>=0.75 ? "Confirmed slowdown" : "Continued decline";
}
const PHASE_TEXT = {
  "Post-holiday dip": r=>`Consistently down from December (${fmtPct(r.consistency)} of years). A short, sharp drop \u2014 not part of the main seasonal slowdown.`,
  "Building season": ()=>`Steady climb in most years. Grow orders in step with rising daily averages.`,
  "Confirmed slowdown": r=>`Averages ${fmtPct(r.consistency)} of years declining. This is where the seasonal pullback becomes unambiguous.`,
  "Continued decline": r=>`Averages ${fmtPct(r.consistency)} of years declining. Keep orders conservative through this stretch.`,
  "Bottom of the cycle": r=>`${fmtPct(r.consistency)} of years declining \u2014 the most predictable month in the whole dataset. Order light.`,
};
function seasonalCycleRows(rows){
  const validConsist = rows.filter(r=>r.consistency!==null && r.idx!==0); // exclude January from "bottom" candidacy — it's its own post-holiday dip, not the cycle's true bottom
  if(!validConsist.length) return [];
  const bottomMonth = validConsist.reduce((a,b)=> b.consistency>a.consistency ? b : a);
  const turnIdx = rows.findIndex((r,i)=> i>0 && r.alert);
  const withPhase = rows.map(r=>({...r, phase: classifyPhase(r, bottomMonth)}));
  // group consecutive months (calendar order, no year-wrap) sharing the same phase label
  const groups = [];
  withPhase.forEach(r=>{
    const last = groups[groups.length-1];
    if(last && last.phase===r.phase){ last.months.push(r); }
    else groups.push({phase:r.phase, months:[r]});
  });
  return groups.map(g=>{
    const period = g.months.length===1 ? g.months[0].month : `${g.months[0].month} \u2013 ${g.months[g.months.length-1].month}`;
    const repRow = g.months.reduce((a,b)=> (b.consistency||0)>(a.consistency||0) ? b : a, g.months[0]);
    return {period, phase:g.phase, text: PHASE_TEXT[g.phase] ? PHASE_TEXT[g.phase](repRow) : ""};
  });
}
function bottomLineText(rows, years5, peak, firstDecline){
  if(!peak || !firstDecline) return "Not enough complete years on file yet to identify a reliable seasonal pattern.";
  return `Plan to start scaling back orders by ${firstDecline.month} \u2014 in ${fmtPct(firstDecline.consistency)} of the last ${years5.length} years, daily sales were already trending down by then. Reorder more conservatively from that point through the winter low, then ramp back up heading into spring.`;
}

/* ---------- reusable multi-line chart with per-series high/low markers ---------- */
function drawLineChartMulti(container, {categories, series, height=260, yFmt}){
  const w = 800, h = height, padL=50, padR=16, padT=22, padB=28;
  const allVals = series.flatMap(s=>s.values.filter(v=>v!==null && v!==undefined));
  const fmt = yFmt || (v => Math.round(v).toLocaleString());
  // Auto-scale to the data's own range (instead of always forcing 0 into view) so
  // lines that live in a narrow band still use the full height of the chart, with
  // a little headroom top and bottom so points near the edge aren't clipped.
  let rawMax = allVals.length ? Math.max(...allVals) : 1;
  let rawMin = allVals.length ? Math.min(...allVals) : 0;
  if(rawMax===rawMin){ rawMax += 1; rawMin -= 1; }
  const rawRange = rawMax-rawMin;
  const cushion = rawRange*0.12;
  const maxV = rawMax+cushion;
  // Don't let the padding push the axis below 0 when every value in the chart
  // is already non-negative (dollar figures, percentages) - a negative gridline
  // there would be confusing, not helpful.
  const minV = (rawMin>=0 && rawMin-cushion<0) ? 0 : rawMin-cushion;
  const range = (maxV-minV)||1;
  const stepX = categories.length>1 ? (w-padL-padR)/(categories.length-1) : 0;
  const xFor = i => padL + i*stepX;
  const yFor = v => h-padB - ((v-minV)/range)*(h-padT-padB);

  // Gridlines + y-axis labels so the scale is readable, not just relative line position.
  let svg = "";
  const GRID_LINES = 4;
  for(let g=0; g<=GRID_LINES; g++){
    const v = minV + (range*g/GRID_LINES);
    const y = yFor(v);
    svg += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#E1E1E1" stroke-width="1"></line>`;
    svg += `<text x="${padL-6}" y="${y+3}" font-size="9" text-anchor="end" fill="#767676">${fmt(v)}</text>`;
  }

  series.forEach((s,si)=>{
    const color = s.color || BLUE_PALETTE[si % BLUE_PALETTE.length];
    const strokeWidth = s.width || 2.6;
    const dashAttr = s.dash ? ` stroke-dasharray="${s.dash}"` : "";
    const ptsArr = s.values.map((v,i)=> (v===null||v===undefined) ? null : [xFor(i), yFor(v)]);
    const pts = ptsArr.filter(Boolean).map(p=>p.join(",")).join(" ");
    svg += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="${strokeWidth}"${dashAttr}></polyline>`;
    ptsArr.forEach(p=>{ if(p) svg += `<circle cx="${p[0]}" cy="${p[1]}" r="2.8" fill="${color}"></circle>`; });
    let maxI=-1,minI=-1,maxVal=-Infinity,minVal=Infinity;
    s.values.forEach((v,i)=>{ if(v===null||v===undefined) return; if(v>maxVal){maxVal=v;maxI=i;} if(v<minVal){minVal=v;minI=i;} });
    if(maxI>=0) svg += `<circle cx="${xFor(maxI)}" cy="${yFor(maxVal)}" r="6" fill="none" stroke="var(--green)" stroke-width="2"></circle>`;
    if(minI>=0 && minI!==maxI) svg += `<circle cx="${xFor(minI)}" cy="${yFor(minVal)}" r="6" fill="none" stroke="var(--red)" stroke-width="2"></circle>`;
  });
  categories.forEach((c,i)=>{
    svg += `<text x="${xFor(i)}" y="${h-8}" font-size="9" text-anchor="middle" fill="#767676">${c}</text>`;
  });
  const legend = series.map((s,si)=>`<span style="display:inline-flex;align-items:center;gap:4px;margin-right:14px;font-size:11.5px;color:#767676;">
    <span style="width:10px;height:10px;background:${s.color||BLUE_PALETTE[si%BLUE_PALETTE.length]};display:inline-block;border-radius:2px;"></span>${s.label}</span>`).join("")
    + `<span style="font-size:11.5px;color:#767676;"><span style="color:var(--green);font-weight:700;">\u25cb</span> year high &nbsp; <span style="color:var(--red);font-weight:700;">\u25cb</span> year low</span>`;
  container.innerHTML = `<div style="margin-bottom:8px;">${legend}</div><svg viewBox="0 0 ${w} ${h}" class="chart" style="height:${h}px">${svg}</svg>`;
}

/* ---------- UNC-color high/low cell highlighting ---------- */
function hiLoClass(v, arr){
  if(v===null || v===undefined) return "";
  const nums = arr.filter(x=>x!==null && x!==undefined);
  if(nums.length<2) return "";
  const max = Math.max(...nums), min = Math.min(...nums);
  if(max===min) return "";
  if(v===max) return "hl-hi";
  if(v===min) return "hl-lo";
  return "";
}

/* ---------- Annual Summary: table + two overview charts + insight ---------- */
function renderYoyAnnualSummary(el){
  const years = Object.keys(DATA.overlooks).sort().filter(y=>yearTotals(y).monthsWithData>0);
  const yearData = years.map(y=>({year:y, ...yearTotals(y)}));
  const yearlyAvgProfit = y=>{
    const vals = MONTHS.map(m=>monthTotals(y,m)).filter(t=>t.daysWithData>0).map(t=>t.avgProfit);
    return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  };
  const lastTwo = yearData.slice(-2);
  const chgLabel = lastTwo.length===2 ? `'${lastTwo[0].year.slice(2)}\u2192'${lastTwo[1].year.slice(2)} Chg %` : "Chg %";
  const rowFor = {
    combined:"combined", gas:"gas", profit:"profit", invoices:"invoices", rebates:"rebates",
    netProfit:"netProfit", grossMargin:"grossMargin", markup:"markup", avgProfit:null
  };
  el.innerHTML = `
    <div class="note">Yearly totals for every metric, with year-over-year change on the most recent two years.</div>
    <div class="card">
      ${HL_LEGEND}
      <div class="tablewrap"><table>
        <thead><tr><th>Metric</th>${years.map(y=>`<th>${y}</th>`).join("")}<th>${chgLabel}</th></tr></thead>
        <tbody>${YOY_METRICS.map(metric=>{
          const vals = metric.key==="avgProfit" ? years.map(y=>yearlyAvgProfit(y)) : yearData.map(yd=>yd[rowFor[metric.key]]);
          let chg = "\u2014";
          if(lastTwo.length===2){
            const a = metric.key==="avgProfit" ? yearlyAvgProfit(lastTwo[0].year) : lastTwo[0][rowFor[metric.key]];
            const b = metric.key==="avgProfit" ? yearlyAvgProfit(lastTwo[1].year) : lastTwo[1][rowFor[metric.key]];
            if(a){ chg = fmtPct((b-a)/a); }
          }
          return `<tr><td>${metric.label}</td>${vals.map(v=>{
            const cls = hiLoClass(v, vals);
            return `<td class="${cls}">${v===null||v===undefined?"\u2014":metric.fmt(v)}</td>`;
          }).join("")}<td style="font-weight:700">${chg}</td></tr>`;
        }).join("")}
        </tbody>
      </table></div>
    </div>
    <div class="card">
      <h2>Dollar Metrics by Year</h2>
      <div id="as-chart-dollar"></div>
    </div>
    ${insightCard(multiMetricInsight(["combined","profit","netProfit"], years, "What this chart shows: Total Sales, Net Store Revenue, and Net Profit together, so you can see whether profit is keeping pace with sales."))}
    <div class="card">
      <h2>Margin Metrics by Year</h2>
      <div id="as-chart-pct"></div>
    </div>
    ${insightCard(multiMetricInsight(["grossMargin","markup"], years, "What this chart shows: Gross Margin % and Purchase Markup % by year \u2014 the two ratios that reveal whether pricing and ordering discipline are holding up, independent of sales volume."))}
  `;
  const dollarMetrics = ["combined","profit","netProfit"];
  drawLineChartMulti(document.getElementById('as-chart-dollar'), {
    categories: years,
    series: dollarMetrics.map((k,i)=>({
      label: YOY_METRICS.find(m=>m.key===k).label,
      color: [ "#1C6EA4","#E67E22","#27AE60" ][i],
      values: years.map(y=>yearlyMetricValue(y,k))
    })),
    yFmt: fmtUSD0
  });
  const pctMetrics = ["grossMargin","markup"];
  drawLineChartMulti(document.getElementById('as-chart-pct'), {
    categories: years,
    series: pctMetrics.map((k,i)=>({
      label: YOY_METRICS.find(m=>m.key===k).label,
      color: [ "#1C6EA4","#E67E22" ][i],
      values: years.map(y=>yearlyMetricValue(y,k))

  });
}

/* ---------- Records & Insights: best/worst value + which year/month + charts ---------- */
function renderYoyRecords(el){
  const {years, grid} = yoyGrid();
  const rows = YOY_METRICS.map(metric=>{
    let best=null, bestLoc=null, worst=null, worstLoc=null;
    MONTHS.forEach(m=>years.forEach(y=>{
      const t = grid[m][y];
      if(t.daysWithData<=0) return;
      const v = t[metric.key];
      if(best===null || v>best){ best=v; bestLoc=`${m} ${y}`; }
      if(worst===null || v<worst){ worst=v; worstLoc=`${m} ${y}`; }
    }));
    return {metric, best, bestLoc, worst, worstLoc};
  });
  el.innerHTML = `
    <div class="note">Best and worst single month on file for every metric, with exactly which month and year \u2014 and how each year stacks up.</div>
    <div class="card">
      ${HL_LEGEND}
      <div class="tablewrap"><table>
        <thead><tr><th>Metric</th><th>Best</th><th>When</th><th>Worst</th><th>When</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td>${r.metric.label}</td>
          <td class="hl-hi">${r.best!==null?r.metric.fmt(r.best):"\u2014"}</td><td>${r.bestLoc||""}</td>
          <td class="hl-lo">${r.worst!==null?r.metric.fmt(r.worst):"\u2014"}</td><td>${r.worstLoc||""}</td></tr>`).join("")}
        </tbody>
      </table></div>
    </div>
    <div class="card">
      <h2>Total Sales by Year \u2014 Best &amp; Worst Highlighted</h2>
      <div id="rec-chart"></div>
    </div>
    ${insightCard(metricInsight(YOY_METRICS.find(m=>m.key==="combined"), years))}
  `;

    categories: years,
    series: [{label:"Total Sales", color:"#1C6EA4", values: years.map(y=>yearlyMetricValue(y,"combined"))}],
    yFmt: fmtUSD0

}

/* ---------- Monthly Seasonality: avg Net Store Revenue by calendar month, across all years ---------- */
function renderYoySeasonality(el){
  const {years, grid} = yoyGrid();
  const rows = MONTHS.map(m=>{
    const vals = years.map(y=>grid[m][y]).filter(t=>t.daysWithData>0).map(t=>t.profit);
    const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
    return {month:m, avg};
  });
  const peak = rows.reduce((a,b)=> (b.avg!==null && (a===null||b.avg>a.avg)) ? b : a, null);
  const trough = rows.reduce((a,b)=> (b.avg!==null && (a===null||b.avg<a.avg)) ? b : a, null);
  el.innerHTML = `
    <div class="note">Average Net Store Revenue for each calendar month, across every year on file.</div>
    <div class="card">
      <h2>Average Net Store Revenue by Month</h2>
      <div id="seasonChart"></div>
      <div id="seasonLineChart" style="margin-top:14px;"></div>
    </div>
    ${insightCard(`What this shows: the typical shape of your year, averaged across every year on file. ${peak?`${peak.month} is your strongest month on average (${fmtUSD(peak.avg)}/mo)`:""}${trough?`, and ${trough.month} is your weakest (${fmtUSD(trough.avg)}/mo)`:""}. Use this as your seasonal baseline \u2014 staff up and order more ahead of ${peak?peak.month:"your peak"}, and plan leaner ordering and labor going into ${trough?trough.month:"your slow season"}. See the Forecaster tab for exactly which months show a reliable month-over-month decline.`)}
    <div class="card">
      ${HL_LEGEND}
      <div class="tablewrap"><table>
        <thead><tr><th>Month</th><th>Average Net Store Revenue</th></tr></thead>
        <tbody>${rows.map(r=>{
          const cls = hiLoClass(r.avg, rows.map(x=>x.avg));
          return `<tr><td>${r.month}</td><td class="${cls}">${r.avg!==null?fmtUSD(r.avg):"\u2014"}</td></tr>`;
        }).join("")}</tbody>
      </table></div>
    </div>
  `;
  const container = document.getElementById('seasonChart');
  const maxV = Math.max(1, ...rows.map(r=>r.avg||0));
  const w=760,h=220,pad=30,bw=(w-pad*2)/12;
  let bars="";
  rows.forEach((r,i)=>{
    const x = pad+i*bw;
    const hgt = ((r.avg||0)/maxV)*(h-pad*2);
    const isPeak = peak && r.month===peak.month, isTrough = trough && r.month===trough.month;
    bars += `<rect x="${x+3}" y="${h-pad-hgt}" width="${bw*0.7}" height="${hgt}" fill="${isPeak?'var(--green)':isTrough?'var(--red)':'var(--gold)'}"></rect>`;
    bars += `<text x="${x+bw/2}" y="${h-8}" font-size="9" text-anchor="middle" fill="#767676">${r.month.slice(0,3)}</text>`;
  });
  container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" class="chart">${bars}</svg>`;
  drawLineChartMulti(document.getElementById('seasonLineChart'), {
    categories: MONTHS.map(m=>m.slice(0,3)),
    series: [{label:"Avg Net Store Revenue", color:"#1C6EA4", values: rows.map(r=>r.avg)}],
    height: 200,
    yFmt: fmtUSD0
  });
}

/* ---------- Decline Consistency: bar chart of % years declining, by month ---------- */

  const container = document.getElementById('declineConsistencyChart');
  const w=760,h=240,pad=34,bw=(w-pad*2)/12;

    bars += `<text x="${x+bw/2}" y="${h-10}" font-size="9" text-anchor="middle" fill="#767676">${r.month.slice(0,3)}</text>`;
  });

function monthEndKey(year, month){ return year + "-" + month; }
function generateMonthlyReport(year, month, periodType){
  const key = monthEndKey(year, month);
  DATA.inventoryReports[key] = {
    year, month,
    periodType: periodType || "monthly",
    generatedAt: new Date().toISOString(),
    products: JSON.parse(JSON.stringify(DATA.inventory))
  };
  persist();
  return DATA.inventoryReports[key];

/* Fiscal year runs November 1 - October 31 (FY label = calendar year it ends in). */
const FISCAL_QUARTERS = [
  {q:1, endMonth:"January", months:["November","December","January"]},
  {q:2, endMonth:"April", months:["February","March","April"]},
  {q:3, endMonth:"July", months:["May","June","July"]},
  {q:4, endMonth:"October", months:["August","September","October"], yearEnd:true}
];
function currentFiscalYear(d){
  const m = d.getMonth(); // 0=Jan ... 10=Nov, 11=Dec
  return (m>=10) ? d.getFullYear()+1 : d.getFullYear();
}
function currentFiscalQuarter(d){
  const m = d.getMonth();
  if(m===10||m===11||m===0) return 1;
  if(m>=1&&m<=3) return 2;
  if(m>=4&&m<=6) return 3;
  return 4;
}

function ensureProduct(name, category, unit, cost, retail){
  // Match on name + category + unit so products that share a name but come in different
  // sizes (e.g. Milwaukee's Best Light 4pk / 15pk / 24pk) stay as separate records.
  let p = DATA.inventory.find(x=>x.name===name && (!category || x.category===category) && (unit===undefined || (x.unit||"")===(unit||"")));
  if(p) return p;
  const nextNum = Math.max(0, ...DATA.inventory.map(pp=>pp.num||0)) + 1;
  p = {num:nextNum, name, category: category||"Uncategorized", unit: unit||"", par:0, closing:0, sold:0,
    cost: cost||0, retail: retail||0, closing_value:0, sales_value:0, status:"\ud83d\udd34 OUT OF STOCK",
    opening:0, received_qty:0, notes:"", buydown:0, multipack_qty:null, multipack_deal_price:null};
  DATA.inventory.push(p);
  return p;
}

function productReceived(p){
  const live = DATA.invoiceEntries.filter(e=>!e.reconciled && e.name===p.name && (e.category===p.category || !e.category) && ((e.unit||"")===(p.unit||"") || !e.unit))
    .reduce((s,e)=>s+num(e.qty),0);
  return live > 0 ? live : num(p.received_qty);
}
function productTotalAvailable(p){ return num(p.opening) + productReceived(p); }
function productUnitsSold(p){ return productTotalAvailable(p) - num(p.closing); }

/* ---------- Distributor Variance (Invoiced $ vs Sold $, by distributor) ---------- */
let distVarState = {threshold:10, dateFrom:"", dateTo:""};
function distributorVarianceRows(threshold, dateFrom, dateTo){
  const inRange = e=>{
    if(!dateFrom && !dateTo) return true;
    const d = (e.date||"").slice(0,10);
    if(!d) return false;
    if(dateFrom && d < dateFrom) return false;
    if(dateTo && d > dateTo) return false;
    return true;
  };
  const byDist = {};
  DATA.invoiceEntries.filter(e=>!e.reconciled).filter(inRange).forEach(e=>{
    const d = (e.distributor||"").trim() || "(No distributor listed)";
    if(!byDist[d]) byDist[d] = {distributor:d, invoiced:0, products:new Map()};
    byDist[d].invoiced += num(e.total);
    const key = e.name+"\u0001"+(e.category||"")+"\u0001"+(e.unit||"");
    if(!byDist[d].products.has(key)) byDist[d].products.set(key, {name:e.name, category:e.category||"", unit:e.unit||""});
  });
  const rows = Object.values(byDist).map(g=>{
    let sold = 0, units = 0, matched = 0;
    g.products.forEach(ref=>{
      const p = DATA.inventory.find(x=>x.name===ref.name && (x.category||"")===ref.category && (x.unit||"")===ref.unit);
      if(p){
        const u = productUnitsSold(p);
        sold += u*num(p.retail);
        units += u;
        matched++;
      }
    });
    const gap = g.invoiced - sold;
    const gapPct = sold>0 ? (gap/sold)*100 : (g.invoiced>0 ? 100 : 0);
    return {distributor:g.distributor, invoiced:g.invoiced, sold, gap, gapPct,
      productCount:g.products.size, matched, units, flagged: gapPct > threshold};
  }).sort((a,b)=> b.gapPct - a.gapPct);
  return rows;
}
function renderDistributorVariance(el){
  const rows = distributorVarianceRows(num(distVarState.threshold), distVarState.dateFrom, distVarState.dateTo);
  const flaggedCount = rows.filter(r=>r.flagged).length;
  const totalInvoiced = rows.reduce((s,r)=>s+r.invoiced,0);
  const totalSold = rows.reduce((s,r)=>s+r.sold,0);
  el.innerHTML = `
    <div class="note">Compares your <b>pending</b> (not-yet-reconciled) invoices against what Inventory Count shows sold since your last roll, grouped by distributor. A distributor is flagged when invoiced $ exceeds sold $ by more than the threshold below \u2014 that's a signal to cut back the next order. This will look skewed right after you roll a count, since Sold $ starts back near $0 until your next count \u2014 it becomes meaningful again once you've counted at the end of the current period.</div>
    <div class="note" style="margin-top:-6px;">Reconciled invoices are excluded automatically. Use the date filters below only if you want to look at a specific window instead of the current pending period.</div>
    <div class="card">
      <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr;">
        <div><label>Flag threshold (invoiced $ exceeds sold $ by...)</label>
          <div style="display:flex;align-items:center;gap:10px;">
            <input id="dvThreshold" type="range" min="0" max="100" step="1" value="${num(distVarState.threshold)}" style="flex:1;">
            <span id="dvThresholdVal" style="font-weight:700;min-width:44px;">${num(distVarState.threshold)}%</span>
          </div>
        </div>
        <div><label>From date (optional)</label><input id="dvFrom" type="date" value="${distVarState.dateFrom||""}"></div>
        <div><label>To date (optional)</label><input id="dvTo" type="date" value="${distVarState.dateTo||""}"></div>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="lbl">Total Invoiced</div><div class="val">${fmtUSD0(totalInvoiced)}</div></div>
      <div class="kpi"><div class="lbl">Total Sold (matched products)</div><div class="val">${fmtUSD0(totalSold)}</div></div>
      <div class="kpi"><div class="lbl">Distributors Flagged</div><div class="val" style="color:${flaggedCount?'var(--red)':'inherit'}">${flaggedCount}</div><div class="sub">of ${rows.length} distributors</div></div>
    </div>
    <div class="card">
      <h2>By Distributor</h2>
      <div class="tablewrap"><table>
        <thead><tr><th>Distributor</th><th>Invoiced $</th><th>Sold $</th><th>Gap $</th><th>Gap %</th><th># Products</th><th>Status</th></tr></thead>
        <tbody id="dvBody">${rows.length ? rows.map(r=>`<tr>
          <td>${r.distributor}</td>
          <td>${fmtUSD(r.invoiced)}</td>
          <td>${fmtUSD(r.sold)}</td>
          <td style="color:${r.gap>0?'var(--red)':'inherit'}">${fmtUSD(r.gap)}</td>
          <td style="color:${r.gap>0?'var(--red)':'inherit'}">${r.gapPct.toFixed(1)}%</td>
          <td>${r.matched} / ${r.productCount}</td>
          <td>${r.flagged ? '<span class="pill bad">Cut back ordering</span>' : '<span class="pill ok">In line</span>'}</td>
        </tr>`).join("") : `<tr><td colspan="7" style="color:var(--text-dim);text-align:center;">No invoice entries logged yet \u2014 add some in Invoice Entry first.</td></tr>`}
        </tbody>
      </table></div>
    </div>
  `;
  const thumb = document.getElementById('dvThreshold');
  const thumbVal = document.getElementById('dvThresholdVal');
  thumb.oninput = ()=>{ thumbVal.textContent = thumb.value+"%"; };
  thumb.onchange = ()=>{ distVarState.threshold = parseFloat(thumb.value)||0; renderDistributorVariance(el); };
  document.getElementById('dvFrom').onchange = e=>{ distVarState.dateFrom = e.target.value; renderDistributorVariance(el); };
  document.getElementById('dvTo').onchange = e=>{ distVarState.dateTo = e.target.value; renderDistributorVariance(el); };
}

        else p[field] = parseFloat(inp.value)||0;
        if(field==="cost" || field==="retail"){
          p.closing_value = +(num(p.closing)*num(p.cost)).toFixed(2);
          p.sales_value = +(num(p.closing)*num(p.retail)).toFixed(2);
        }
        persist(); draw();
      };
    });
  }
  document.getElementById('rlSearch').oninput = e=>{ rlSearch = e.target.value.toLowerCase(); draw(); };
  document.getElementById('rlCatFilter').onchange = e=>{ rlCat = e.target.value; draw(); };
  draw();
}

/* ---------- Invoice Entry (log deliveries, line by line) ---------- */
let invoiceDraft = null; // {distributor, invoice, date, lines:[{name,category,unit,cost,qty,total}]}
function renderInvoiceEntry(el){
  const catNames = [...new Set(DATA.inventory.map(p=>p.category))].sort();
  if(!invoiceDraft) invoiceDraft = {distributor:"", invoice:"", date:"", lines:[]};
  const draftTotal = invoiceDraft.lines.reduce((s,l)=>s+num(l.total),0);

  el.innerHTML = `
    <div class="note">Enter the invoice header once, add every line item on it, then submit the whole invoice in one go. Unit Cost auto-fills from Received Log when you pick a known product. Qty Received flows into Inventory Count and Received Log automatically. If this delivery got a one-time discount on a product, enter it in Discount — it's subtracted from that line's total only and never changes the product's normal cost in Inventory. Typing an Invoice # that's already on file will offer to reopen it for editing.</div>
    <div class="card">
      <h2>${invoiceDraft.reopenedInvoice ? `Editing Invoice ${invoiceDraft.reopenedInvoice}` : "New Invoice"}</h2>
      ${invoiceDraft.reopenedInvoice ? `<div class="note" style="margin-top:0;">Reopened for editing — fix, add, or remove line items below, then Submit to save your changes over the original invoice.</div>` : ""}
      <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr;">
        <div><label>Distributor</label><input id="ieDist" value="${invoiceDraft.distributor}"></div>
        <div><label>Invoice #</label><input id="ieInvoice" value="${invoiceDraft.invoice}"></div>
        <div><label>Date</label><input id="ieDate" type="date" value="${invoiceDraft.date}"></div>
      </div>
      <h2 style="margin-top:6px;">Add Line Item</h2>
      <div class="form-grid" style="grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr auto;">
        <div><label>Product Name</label><input id="ieName" list="ieProductList"></div>
        <div><label>Category</label><input id="ieCategory" list="ieCatList"></div>
        <div><label>Unit / Size</label><input id="ieUnit" list="ieUnitList" placeholder="12pk, 24oz..."></div>
        <div><label>Unit Cost</label><div class="dollar-wrap"><input id="ieCost" type="number" step="0.01"></div></div>
        <div><label>Qty Received</label><input id="ieQty" type="number"></div>
        <div><label>One-Time Discount</label><div class="dollar-wrap"><input id="ieDiscount" type="number" step="0.01" placeholder="0.00"></div></div>
        <div><button class="btn" id="ieAddLineBtn">+ Add Line</button></div>
      </div>
      <datalist id="ieCatList">${catNames.map(c=>`<option value="${c}">`).join("")}</datalist>
      <datalist id="ieProductList">${[...new Set(DATA.inventory.map(p=>p.name))].map(n=>`<option value="${n}">`).join("")}</datalist>
      <datalist id="ieUnitList"></datalist>

      <div class="tablewrap" style="max-height:280px;margin-top:10px;"><table>
        <thead><tr><th>Product</th><th>Category</th><th>Unit</th><th>Cost</th><th>Qty</th><th>Discount</th><th>Line Total</th><th></th></tr></thead>
        <tbody id="ieDraftBody">${invoiceDraft.lines.length ? invoiceDraft.lines.map((l,i)=>({l,i})).reverse().map(({l,i})=>`<tr>
          <td>${l.name}${l.reconciled ? ' <span class="pill ok" style="font-size:10px;">Reconciled</span>' : ''}</td><td>${l.category}</td><td>${l.unit||""}</td><td>${fmtUSD(l.cost)}</td><td>${l.qty}</td>
          <td>${num(l.discount) ? `<span style="color:var(--green);font-weight:700;">-${fmtUSD(l.discount)}</span>` : "—"}</td>
          <td><div class="dollar-wrap"><input class="editable-cell" type="number" step="0.01" value="${num(l.total).toFixed(2)}" data-total-line="${i}"></div></td>
          <td><button class="btn small" data-line="${i}">Remove</button></td></tr>`).join("") :
          `<tr><td colspan="8" style="color:var(--text-dim);text-align:center;">No lines added yet</td></tr>`}
        </tbody>
      </table></div>
      <div class="flex" style="justify-content:space-between;margin-top:12px;">
        <div style="font-weight:700;font-size:14px;">Invoice Total: ${fmtUSD(draftTotal)} \u2014 ${invoiceDraft.lines.length} line item${invoiceDraft.lines.length===1?"":"s"}</div>
        <div class="btnrow">
          <button class="btn danger" id="ieClearBtn">${invoiceDraft.reopenedInvoice ? "Cancel Edit" : "Clear"}</button>
          <button class="btn primary" id="ieSubmitBtn">${invoiceDraft.reopenedInvoice ? "Save Changes" : "Submit Invoice"}</button>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>Delivery Log (${DATA.invoiceEntries.length.toLocaleString()} lines)</h2>
      <div class="form-grid" style="grid-template-columns:2fr auto;align-items:end;">
        <div class="searchbox"><input id="ieSearch" placeholder="Search product, distributor, or invoice #..."></div>
        <div><label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" id="ieShowReconciled" style="width:auto;"> Show reconciled invoices</label></div>
      </div>
      <div class="tablewrap"><table>
        <thead><tr><th>Product</th><th>Category</th><th>Unit Cost</th><th>Qty</th><th>Discount</th><th>Line Total</th><th>Distributor</th><th>Invoice #</th><th>Date</th><th>Status</th><th></th></tr></thead>
        <tbody id="ieBody"></tbody>
      </table></div>
    </div>
  `;

  function fillFromNameAndUnit(){
    const name = document.getElementById('ieName').value.trim();
    const unit = document.getElementById('ieUnit').value.trim();
    const matches = DATA.inventory.filter(x=>x.name===name);
    if(!matches.length) return;
    document.getElementById('ieUnitList').innerHTML = matches.map(m=>`<option value="${m.unit||""}">`).join("");
    if(matches.length===1){
      const p = matches[0];
      document.getElementById('ieCategory').value = p.category || "";
      document.getElementById('ieUnit').value = p.unit || "";
      document.getElementById('ieCost').value = num(p.cost).toFixed(2);
      return;
    }
    // Multiple sizes exist for this product name -- try to match the chosen unit exactly.
    const exact = matches.find(m=>(m.unit||"")===unit);
    if(exact){
      document.getElementById('ieCategory').value = exact.category || "";
      document.getElementById('ieCost').value = num(exact.cost).toFixed(2);
    } else {
      document.getElementById('ieCategory').value = matches[0].category || "";
      toast(`${matches.length} sizes found for "${name}" \u2014 pick the size from the Unit / Size list`, true);
    }
  }
  document.getElementById('ieName').onchange = fillFromNameAndUnit;
  document.getElementById('ieUnit').onchange = fillFromNameAndUnit;

  document.getElementById('ieInvoice').onchange = ()=>{
    const val = document.getElementById('ieInvoice').value.trim();
    if(!val) return;
    if(invoiceDraft.reopenedInvoice === val) return; // already reopened this one
    const matches = DATA.invoiceEntries.filter(e=>e.invoice===val);
    if(!matches.length) return;
    const matchTotal = matches.reduce((s,e)=>s+num(e.total),0);
    const reconciledCount = matches.filter(e=>e.reconciled).length;
    let msg = `Invoice ${val} is already on file — ${matches.length} line item${matches.length===1?"":"s"} from ${matches[0].distributor||"unknown distributor"}, totaling ${fmtUSD(matchTotal)}.\n\nReopen it for editing? Its line items will load into the form below so you can fix or finish it, then Submit to save your changes.`;
    if(invoiceDraft.lines.length) msg += `\n\nNote: this will replace the unsaved line item(s) currently in the form.`;
    if(reconciledCount) msg += `\n\nNote: ${reconciledCount} of its line item(s) are already marked Reconciled (counted in a prior inventory count) — their reconciled status will be kept as-is.`;
    if(!confirm(msg)){ return; }
    invoiceDraft = {
      distributor: matches[0].distributor || "",
      invoice: val,
      date: matches[0].date ? matches[0].date.slice(0,10) : "",
      lines: matches.map(m=>({name:m.name, category:m.category, unit:m.unit||"", cost:num(m.cost), qty:num(m.qty),
        discount:num(m.discount), total:num(m.total), reconciled:!!m.reconciled})),
      reopenedInvoice: val
    };
    toast(`Invoice ${val} reopened — ${matches.length} line item${matches.length===1?"":"s"} loaded for editing`);
    renderInvoiceEntry(el);
  };

  document.getElementById('ieAddLineBtn').onclick = ()=>{
    invoiceDraft.distributor = document.getElementById('ieDist').value.trim();
    invoiceDraft.invoice = document.getElementById('ieInvoice').value.trim();
    invoiceDraft.date = document.getElementById('ieDate').value;
    const name = document.getElementById('ieName').value.trim();
    const category = document.getElementById('ieCategory').value.trim();
    const unit = document.getElementById('ieUnit').value.trim();
    const cost = parseFloat(document.getElementById('ieCost').value)||0;
    const qty = parseFloat(document.getElementById('ieQty').value)||0;
    const discount = Math.abs(parseFloat(document.getElementById('ieDiscount').value)||0);
    if(!name || !qty){ toast("Enter a product name and quantity", true); return; }
    invoiceDraft.lines.push({name, category, unit, cost, qty, discount, total:+(cost*qty-discount).toFixed(2)});
    renderInvoiceEntry(el);
  };
  document.getElementById('ieDraftBody').querySelectorAll('[data-line]').forEach(b=>{
    b.onclick = ()=>{
      invoiceDraft.distributor = document.getElementById('ieDist').value.trim();
      invoiceDraft.invoice = document.getElementById('ieInvoice').value.trim();
      invoiceDraft.date = document.getElementById('ieDate').value;
      invoiceDraft.lines.splice(parseInt(b.dataset.line),1);
      renderInvoiceEntry(el);
    };
  });
  document.getElementById('ieDraftBody').querySelectorAll('[data-total-line]').forEach(inp=>{
    inp.onchange = ()=>{
      const idx = parseInt(inp.dataset.totalLine);
      invoiceDraft.lines[idx].total = parseFloat(inp.value)||0;
      renderInvoiceEntry(el);
    };
  });
  document.getElementById('ieClearBtn').onclick = ()=>{
    const wasReopened = invoiceDraft.reopenedInvoice;
    invoiceDraft = {distributor:"", invoice:"", date:"", lines:[]};
    if(wasReopened) toast(`Edit cancelled — invoice ${wasReopened} is unchanged on file`);
    renderInvoiceEntry(el);
  };
  document.getElementById('ieSubmitBtn').onclick = ()=>{
    const distributor = document.getElementById('ieDist').value.trim();
    const invoice = document.getElementById('ieInvoice').value.trim();
    const date = document.getElementById('ieDate').value || null;
    if(!invoiceDraft.lines.length){ toast("Add at least one line item first", true); return; }
    if(!distributor || !invoice){ toast("Enter a distributor and invoice #", true); return; }
    const reopenedFrom = invoiceDraft.reopenedInvoice;
    if(reopenedFrom){
      // Replacing a reopened invoice -- drop its original lines first so edits don't duplicate them.
      DATA.invoiceEntries = DATA.invoiceEntries.filter(e=>e.invoice!==reopenedFrom);
    }
    invoiceDraft.lines.forEach(l=>{
      DATA.invoiceEntries.unshift({name:l.name, category:l.category, unit:l.unit||"", cost:l.cost, qty:l.qty,
        discount:num(l.discount), total:num(l.total), distributor, invoice, date, notes:"", reconciled:!!l.reconciled});
      const p = ensureProduct(l.name, l.category, l.unit, l.cost, 0);
      if(l.cost) p.cost = l.cost;
      // Discount is a one-time reduction for this delivery only -- product's normal cost is never touched by it.
    });
    persist();
    toast(reopenedFrom ? `Invoice ${invoice} updated \u2014 ${invoiceDraft.lines.length} line items saved` : `Invoice ${invoice} submitted \u2014 ${invoiceDraft.lines.length} line items logged`);
    invoiceDraft = {distributor:"", invoice:"", date:"", lines:[]};
    renderInvoiceEntry(el);
  };

  let ieSearch = "", ieShowReconciled = false;
  const body = document.getElementById('ieBody');
  function draw(){
    body.innerHTML = "";
    DATA.invoiceEntries.filter(e=>{
      if(!ieShowReconciled && e.reconciled) return false;
      if(!ieSearch) return true;
      return e.name.toLowerCase().includes(ieSearch) || (e.distributor||"").toLowerCase().includes(ieSearch) || (e.invoice||"").toLowerCase().includes(ieSearch);
    }).forEach((e,idx)=>{
      const realIdx = DATA.invoiceEntries.indexOf(e);
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${e.name}</td><td>${e.category}</td><td>${fmtUSD(e.cost)}</td><td>${e.qty}</td>
        <td>${num(e.discount) ? `<span style="color:var(--green);font-weight:700;">-${fmtUSD(e.discount)}</span>` : "—"}</td>
        <td><div class="dollar-wrap"><input class="editable-cell" type="number" step="0.01" value="${num(e.total).toFixed(2)}" data-total-idx="${realIdx}"></div></td>
        <td>${e.distributor}</td><td>${e.invoice}</td><td>${e.date?e.date.slice(0,10):""}</td>
        <td>${e.reconciled ? '<span class="pill ok">Reconciled</span>' : '<span class="pill warn">Pending</span>'}</td>
        <td><button class="btn small" data-idx="${realIdx}">Remove</button></td>`;
      body.appendChild(tr);
    });
    body.querySelectorAll('[data-idx]').forEach(b=>b.onclick=()=>{
      const idx = parseInt(b.dataset.idx);
      const line = DATA.invoiceEntries[idx];
      if(!confirm(`Permanently remove this delivery log line for ${line?line.name:""} (${fmtUSD(line?line.total:0)})? This can't be undone. If you just want it to stop counting toward Received Qty, use "Mark Reconciled" in Invoice Log instead \u2014 it keeps the record.`)) return;
      DATA.invoiceEntries.splice(idx,1); persist(); draw();
    });
    body.querySelectorAll('[data-total-idx]').forEach(inp=>{
      inp.onchange = ()=>{
        const idx = parseInt(inp.dataset.totalIdx);
        DATA.invoiceEntries[idx].total = parseFloat(inp.value)||0;
        persist(); draw();
      };
    });
  }
  document.getElementById('ieSearch').oninput = e=>{ ieSearch=e.target.value.toLowerCase(); draw(); };
  document.getElementById('ieShowReconciled').onchange = e=>{ ieShowReconciled = e.target.checked; draw(); };
  draw();
}

/* ---------- Invoice Log (grouped from Invoice Entry, by invoice #) ---------- */
let ilExpanded = null; // invoice # currently expanded for editing
let ilShowReconciled = false;
function renderInvoiceLog(el){
  const groups = {};
  DATA.invoiceEntries.forEach(e=>{
    if(!e.invoice) return;
    if(!groups[e.invoice]) groups[e.invoice] = {invoice:e.invoice, distributor:e.distributor, date:e.date, lines:0, total:0, discount:0, reconciledLines:0};
    groups[e.invoice].lines++;
    groups[e.invoice].total += num(e.total);
    groups[e.invoice].discount += num(e.discount);
    if(e.reconciled) groups[e.invoice].reconciledLines++;
  });
  const allRows = Object.values(groups).map(g=>({...g, fullyReconciled: g.reconciledLines===g.lines})).sort((a,b)=> (b.date||"").localeCompare(a.date||""));
  const rows = ilShowReconciled ? allRows : allRows.filter(r=>!r.fullyReconciled);
  const hiddenCount = allRows.length - rows.length;
  const catNames = [...new Set(DATA.inventory.map(p=>p.category))].sort();
  const nameList = [...new Set(DATA.inventory.map(p=>p.name))];
  el.innerHTML = `
    <div class="note">Automatically grouped from Invoice Entry lines by Invoice #. ${allRows.length.toLocaleString()} invoices on file, totaling ${fmtUSD(allRows.reduce((s,r)=>s+r.total,0))}. Click Edit to change the distributor, invoice #, date, or individual line items.</div>
    <div class="card">
      <h2>Reconcile a Count Period</h2>
      <div class="note" style="margin-top:0;">After you roll a count (Closing \u2192 Opening), mark the invoices that were part of that count as reconciled so they stop counting toward Received Qty next period. This keeps the invoices on file for reference \u2014 nothing is deleted. Pick your count date below and everything dated on or before it gets marked.</div>
      <div class="form-grid" style="grid-template-columns:1fr auto;align-items:end;">
        <div><label>Mark all invoices reconciled dated on or before</label><input id="ilBulkDate" type="date"></div>
        <div><button class="btn primary" id="ilBulkReconcileBtn">Mark Reconciled Through This Date</button></div>
      </div>
    </div>
    <div class="card">
      <div class="form-grid" style="grid-template-columns:1fr;">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" id="ilShowReconciledCk" ${ilShowReconciled?"checked":""} style="width:auto;"> Show reconciled invoices ${hiddenCount?`(${hiddenCount} hidden)`:""}</label>
      </div>
      <div class="tablewrap"><table>
        <thead><tr><th>Invoice #</th><th>Distributor</th><th>Date</th><th># Line Items</th><th>Discount</th><th>Invoice Total</th><th>Status</th><th></th></tr></thead>
        <tbody id="ilBody">
        ${rows.length ? rows.map(r=>{
          const expanded = ilExpanded === r.invoice;
          const statusPill = r.fullyReconciled ? '<span class="pill ok">Reconciled</span>' : (r.reconciledLines>0 ? '<span class="pill warn">Partial</span>' : '<span class="pill warn">Pending</span>');
          const rowHtml = `<tr><td>${r.invoice}</td><td>${r.distributor}</td><td>${r.date?r.date.slice(0,10):""}</td>
            <td>${r.lines}</td><td>${r.discount ? `<span style="color:var(--green);font-weight:700;">-${fmtUSD(r.discount)}</span>` : "\u2014"}</td><td>${fmtUSD(r.total)}</td><td>${statusPill}</td>
            <td class="btnrow"><button class="btn small" data-edit="${r.invoice.replace(/"/g,'&quot;')}">${expanded?"Close":"Edit"}</button><button class="btn small" data-toggle-reconciled="${r.invoice.replace(/"/g,'&quot;')}">${r.fullyReconciled?"Un-reconcile":"Mark Reconciled"}</button><button class="btn small danger" data-invoice="${r.invoice.replace(/"/g,'&quot;')}">Delete</button></td></tr>`;
          if(!expanded) return rowHtml;
          const lines = DATA.invoiceEntries.map((e,idx)=>({e,idx})).filter(({e})=>e.invoice===r.invoice);
          const editHtml = `<tr><td colspan="8" style="padding:0;">
            <div class="card" style="margin:8px 0;background:#F8FAFD;">
              <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr;">
                <div><label>Distributor</label><input class="editable-cell" id="ilEditDist" value="${r.distributor||""}"></div>
                <div><label>Invoice #</label><input class="editable-cell" id="ilEditInvoice" value="${r.invoice||""}"></div>
                <div><label>Date</label><input class="editable-cell" type="date" id="ilEditDate" value="${r.date?r.date.slice(0,10):""}"></div>
              </div>
              <div class="tablewrap" style="margin-top:10px;"><table>
                <thead><tr><th>Product</th><th>Category</th><th>Unit</th><th>Cost</th><th>Qty</th><th>Discount</th><th>Line Total</th><th>Reconciled</th><th></th></tr></thead>
                <tbody>
                ${lines.map(({e,idx})=>`<tr>
                  <td><input class="editable-cell" value="${e.name||""}" data-line-idx="${idx}" data-line-field="name" list="ilNameList_${idx}"><datalist id="ilNameList_${idx}">${nameList.map(n=>`<option value="${n}">`).join("")}</datalist></td>
                  <td><input class="editable-cell" value="${e.category||""}" data-line-idx="${idx}" data-line-field="category" list="ilCatList"></td>
                  <td><input class="editable-cell" value="${e.unit||""}" data-line-idx="${idx}" data-line-field="unit"></td>
                  <td><div class="dollar-wrap"><input class="editable-cell" type="number" step="0.01" value="${num(e.cost).toFixed(2)}" data-line-idx="${idx}" data-line-field="cost"></div></td>
                  <td><input class="editable-cell" type="number" step="1" value="${num(e.qty)}" data-line-idx="${idx}" data-line-field="qty"></td>
                  <td><div class="dollar-wrap"><input class="editable-cell" type="number" step="0.01" value="${num(e.discount).toFixed(2)}" data-line-idx="${idx}" data-line-field="discount"></div></td>
                  <td><div class="dollar-wrap"><input class="editable-cell" type="number" step="0.01" value="${num(e.total).toFixed(2)}" data-line-idx="${idx}" data-line-field="total"></div></td>
                  <td style="text-align:center;"><input type="checkbox" data-line-reconciled="${idx}" ${e.reconciled?"checked":""}></td>
                  <td><button class="btn small danger" data-remove-line="${idx}">Remove</button></td>
                </tr>`).join("")}
                </tbody>
              </table></div>
              <div class="btnrow" style="margin-top:10px;"><button class="btn" id="ilAddLine" data-add-for="${r.invoice.replace(/"/g,'&quot;')}">+ Add Line Item</button></div>
            </div>
          </td></tr>`;
          return rowHtml + editHtml;
        }).join("") : `<tr><td colspan="8" style="color:var(--text-dim);text-align:center;">${ilShowReconciled ? "No invoices yet." : "No pending invoices \u2014 check \u201cShow reconciled invoices\u201d to see everything."}</td></tr>`}
        </tbody>
      </table></div>
      <datalist id="ilCatList">${catNames.map(c=>`<option value="${c}">`).join("")}</datalist>
    </div>
  `;
  document.getElementById('ilShowReconciledCk').onchange = e=>{ ilShowReconciled = e.target.checked; renderInvoiceLog(el); };
  document.getElementById('ilBody').querySelectorAll('[data-edit]').forEach(btn=>{
    btn.onclick = ()=>{
      ilExpanded = ilExpanded===btn.dataset.edit ? null : btn.dataset.edit;
      renderInvoiceLog(el);
    };
  });
  document.getElementById('ilBody').querySelectorAll('[data-toggle-reconciled]').forEach(btn=>{
    btn.onclick = ()=>{
      const invoiceNum = btn.dataset.toggleReconciled;
      const g = allRows.find(r=>r.invoice===invoiceNum);
      const makeReconciled = !(g && g.fullyReconciled);
      DATA.invoiceEntries.forEach(e=>{ if(e.invoice===invoiceNum) e.reconciled = makeReconciled; });
      persist();
      toast(makeReconciled ? `Invoice ${invoiceNum} marked reconciled` : `Invoice ${invoiceNum} marked pending again`);
      renderInvoiceLog(el);
    };
  });
  document.getElementById('ilBody').querySelectorAll('[data-invoice]').forEach(btn=>{
    btn.onclick = ()=>{
      const invoiceNum = btn.dataset.invoice;
      const g = groups[invoiceNum];
      const lineWord = g && g.lines===1 ? "line item" : "line items";

      // Find products whose ENTIRE received-qty history lives on this invoice alone --
      // deleting it would drop their Received Qty to 0 in Inventory Count.
      const linesForInvoice = DATA.invoiceEntries.filter(e=>e.invoice===invoiceNum);
      const productKeys = [...new Set(linesForInvoice.map(e=>e.name+"|"+e.category))];
      const affectedProducts = [];
      productKeys.forEach(key=>{
        const sep = key.lastIndexOf("|");
        const name = key.slice(0, sep), category = key.slice(sep+1);
        const hasOtherInvoice = DATA.invoiceEntries.some(e=>e.invoice!==invoiceNum && e.name===name && e.category===category && !e.reconciled);
        if(!hasOtherInvoice) affectedProducts.push(name);
      });

      let msg = `Permanently delete invoice ${invoiceNum} (${g?g.lines:0} ${lineWord}, ${fmtUSD(g?g.total:0)})? This removes it from Invoice Entry's Delivery Log too and can't be undone. If you just want it to stop counting toward Received Qty, use "Mark Reconciled" instead \u2014 it keeps the record.`;
      if(affectedProducts.length){
        const shown = affectedProducts.slice(0, 15);
        msg += `\n\nThese ${affectedProducts.length} product(s) have no other pending delivery on file \u2014 their Received Qty in Inventory Count will drop to 0:\n\u2022 ` + shown.join("\n\u2022 ");
        if(affectedProducts.length > shown.length) msg += `\n\u2022 ...and ${affectedProducts.length - shown.length} more`;
      }
      if(!confirm(msg)) return;
      DATA.invoiceEntries = DATA.invoiceEntries.filter(e=>e.invoice!==invoiceNum);
      if(ilExpanded===invoiceNum) ilExpanded = null;
      persist();
      toast(`Invoice ${invoiceNum} deleted`);
      renderInvoiceLog(el);
    };
  });

  document.getElementById('ilBulkReconcileBtn').onclick = ()=>{
    const cutoff = document.getElementById('ilBulkDate').value;
    if(!cutoff){ toast("Pick a cutoff date first", true); return; }
    const toMark = DATA.invoiceEntries.filter(e=> !e.reconciled && e.date && e.date.slice(0,10) <= cutoff);
    if(!toMark.length){ toast("No pending invoices found on or before that date", true); return; }
    const invoiceNums = [...new Set(toMark.map(e=>e.invoice))];
    const total = toMark.reduce((s,e)=>s+num(e.total),0);
    if(!confirm(`Mark ${toMark.length} line item(s) across ${invoiceNums.length} invoice(s) dated on or before ${cutoff} (${fmtUSD(total)} total) as reconciled? They'll stop counting toward Received Qty but stay on file \u2014 you can undo this per invoice later.`)) return;
    toMark.forEach(e=>{ e.reconciled = true; });
    persist();
    toast(`Marked ${toMark.length} line item(s) across ${invoiceNums.length} invoice(s) as reconciled`);
    renderInvoiceLog(el);
  };

  if(!ilExpanded) return;

  // Header fields (distributor / invoice # / date) apply to every line in this invoice
  const distInp = document.getElementById('ilEditDist');
  const invInp = document.getElementById('ilEditInvoice');
  const dateInp = document.getElementById('ilEditDate');
  if(distInp) distInp.onchange = ()=>{
    const oldInvoice = ilExpanded;
    const val = distInp.value.trim();
    DATA.invoiceEntries.forEach(e=>{ if(e.invoice===oldInvoice) e.distributor = val; });
    persist(); toast("Distributor updated"); renderInvoiceLog(el);
  };
  if(invInp) invInp.onchange = ()=>{
    const oldInvoice = ilExpanded;
    const val = invInp.value.trim();
    if(!val){ toast("Invoice # can't be blank", true); renderInvoiceLog(el); return; }
    DATA.invoiceEntries.forEach(e=>{ if(e.invoice===oldInvoice) e.invoice = val; });
    ilExpanded = val;
    persist(); toast("Invoice # updated"); renderInvoiceLog(el);
  };
  if(dateInp) dateInp.onchange = ()=>{
    const oldInvoice = ilExpanded;
    const val = dateInp.value || null;
    DATA.invoiceEntries.forEach(e=>{ if(e.invoice===oldInvoice) e.date = val; });
    persist(); toast("Date updated"); renderInvoiceLog(el);
  };

  // Line item fields
  document.getElementById('ilBody').querySelectorAll('[data-line-idx]').forEach(inp=>{
    inp.onchange = ()=>{
      const idx = parseInt(inp.dataset.lineIdx);
      const field = inp.dataset.lineField;
      const line = DATA.invoiceEntries[idx];
      if(!line) return;
      if(field==="name" || field==="category" || field==="unit"){
        line[field] = inp.value;
        ensureProduct(line.name, line.category, line.unit, line.cost, 0);
      } else {
        line[field] = field==="discount" ? Math.abs(parseFloat(inp.value)||0) : (parseFloat(inp.value)||0);
        if(field==="cost" || field==="qty" || field==="discount") line.total = +(num(line.cost)*num(line.qty)-num(line.discount)).toFixed(2);
      }
      persist(); renderInvoiceLog(el);
    };
  });
  document.getElementById('ilBody').querySelectorAll('[data-line-reconciled]').forEach(ck=>{
    ck.onchange = ()=>{
      const idx = parseInt(ck.dataset.lineReconciled);
      const line = DATA.invoiceEntries[idx];
      if(!line) return;
      line.reconciled = ck.checked;
      persist();
      toast(ck.checked ? "Line marked reconciled" : "Line marked pending");
      renderInvoiceLog(el);
    };
  });
  document.getElementById('ilBody').querySelectorAll('[data-remove-line]').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = parseInt(btn.dataset.removeLine);
      const line = DATA.invoiceEntries[idx];
      if(!confirm(`Remove this line item (${line?line.name:""}, ${fmtUSD(line?line.total:0)}) from invoice ${ilExpanded}?`)) return;
      DATA.invoiceEntries.splice(idx,1);
      persist(); toast("Line item removed"); renderInvoiceLog(el);
    };
  });
  const addBtn = document.getElementById('ilAddLine');
  if(addBtn) addBtn.onclick = ()=>{
    const invoiceNum = addBtn.dataset.addFor;
    const g = groups[invoiceNum];
    DATA.invoiceEntries.unshift({name:"", category:"", unit:"", cost:0, qty:1, discount:0, total:0,
      distributor: g?g.distributor:"", invoice: invoiceNum, date: g?g.date:null, notes:""});
    persist(); toast("Line item added \u2014 fill in the product details"); renderInvoiceLog(el);
  };
}

        <thead><tr><th>#</th><th>Product</th><th>Category</th><th>Unit</th><th>Par</th><th>Closing</th><th>Cost</th><th>Retail</th><th>Margin $</th><th>Margin %</th><th>Value</th><th>Status</th></tr></thead>

      if(invState.category!=="ALL" && p.category!==invState.category) return false;
      const st = inventoryStatus(p.par,p.closing);
      if(invState.statusFilter!=="ALL" && st!==invState.statusFilter) return false;
      return true;
    });
    body.innerHTML = "";
    list.forEach(p=>{
      const st = inventoryStatus(p.par,p.closing);
      const pill = st==="OK" ? '<span class="pill ok">OK</span>' : st==="LOW" ? '<span class="pill warn">Low</span>' : '<span class="pill bad">Out</span>';
      const cost = num(p.cost), retail = num(p.retail);
      const marginDollar = retail - cost;
      const marginPct = retail ? marginDollar/retail : 0;
      const tr = document.createElement('tr');
      if(st!=="OK") tr.classList.add('lowstock-row');
      tr.innerHTML = `<td>${p.num}</td><td>${p.name}</td><td>${p.category}</td><td>${p.unit||""}</td><td>${p.par}</td>
        <td>${p.closing}</td><td>${fmtUSD(cost)}</td><td>${fmtUSD(retail)}</td>
