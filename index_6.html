        <td style="color:${marginPct<0?'var(--red)':'inherit'}">${fmtPct(marginPct)}</td>
        <td>${fmtUSD(p.closing_value)}</td><td>${pill}</td>`;
      body.appendChild(tr);
    });
  }
  drawPL();
}

/* ---------- Bulk Price Update (change many products' cost/retail at once) ---------- */
function bulkProductKey(p){ return p.num + "|" + p.category; }

function renderBulkPriceUpdate(el){
  const catNames = [...new Set(DATA.inventory.map(p=>p.category))].sort();
  el.innerHTML = `
    <div class="note">Search for a brand or group of products (e.g. "Marlboro", "Camel", "candy"), select the ones you want, then apply a price change to all of them at once. Great for cigarette/tobacco price increases every couple of months.</div>
    <div class="card">
      <div class="form-grid" style="grid-template-columns:2fr 1fr;">
        <div><label>Search product name</label><input id="bpSearch" value="${bulkPriceState.search}" placeholder="e.g. Marlboro"></div>
        <div><label>Category</label><select id="bpCatFilter"><option value="ALL">All Categories</option>${catNames.map(c=>`<option value="${c}" ${bulkPriceState.category===c?"selected":""}>${c}</option>`).join("")}</select></div>
      </div>
      <div class="tablewrap" style="max-height:360px;"><table>
        <thead><tr><th><input type="checkbox" id="bpSelectAll"></th><th>Product</th><th>Category</th><th>Unit</th><th>Current Cost</th><th>Current Retail</th></tr></thead>
        <tbody id="bpBody"></tbody>
      </table></div>
      <div class="sub" id="bpMatchCount" style="margin-top:6px;"></div>
    </div>
    <div class="card">
      <h2>Apply Price Change</h2>
      <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr 1fr auto;">
        <div><label>Apply to</label><select id="bpTarget">
          <option value="retail">Retail Price</option>
          <option value="cost">Unit Cost</option>
          <option value="both">Both Cost &amp; Retail</option>
        </select></div>
        <div><label>Method</label><select id="bpMethod">
          <option value="set">Set to exact amount</option>
          <option value="increaseAmt">Increase by $</option>
          <option value="decreaseAmt">Decrease by $</option>
          <option value="increasePct">Increase by %</option>
          <option value="decreasePct">Decrease by %</option>
        </select></div>
        <div><label>Amount</label><input id="bpAmount" type="number" step="0.01" placeholder="0.00"></div>
        <div><label>&nbsp;</label><div class="sub" id="bpSelectedCount">0 selected</div></div>
        <div><label>&nbsp;</label><button class="btn primary" id="bpApplyBtn">Apply to Selected</button></div>
      </div>
    </div>
  `;

  function matches(){
    const search = bulkPriceState.search.toLowerCase();
    return DATA.inventory.filter(p=>{
      if(search && !p.name.toLowerCase().includes(search)) return false;
      if(bulkPriceState.category!=="ALL" && p.category!==bulkPriceState.category) return false;
      return true;
    });
  }

  function draw(){
    const list = matches();
    const body = document.getElementById('bpBody');
    body.innerHTML = "";
    list.forEach(p=>{
      const key = bulkProductKey(p);
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><input type="checkbox" class="bp-check" data-key="${key}" ${bulkPriceState.selected.has(key)?"checked":""}></td>
        <td>${p.name}</td><td>${p.category}</td><td>${p.unit||""}</td>
        <td>${fmtUSD(num(p.cost))}</td><td>${fmtUSD(num(p.retail))}</td>`;
      body.appendChild(tr);
    });
    document.getElementById('bpMatchCount').textContent = list.length > 300
      ? `Showing first 300 of ${list.length.toLocaleString()} matches \u2014 narrow your search to see the rest.`
      : `${list.length.toLocaleString()} product${list.length===1?"":"s"} match this search.`;
    document.getElementById('bpSelectedCount').textContent = `${bulkPriceState.selected.size} selected`;
    body.querySelectorAll('.bp-check').forEach(cb=>{
      cb.onchange = ()=>{
        if(cb.checked) bulkPriceState.selected.add(cb.dataset.key);
        else bulkPriceState.selected.delete(cb.dataset.key);
        document.getElementById('bpSelectedCount').textContent = `${bulkPriceState.selected.size} selected`;
      };
    });
    const allChecked = list.length>0 && list.every(p=>bulkPriceState.selected.has(bulkProductKey(p)));
    document.getElementById('bpSelectAll').checked = allChecked;
  }

  document.getElementById('bpSearch').oninput = e=>{ bulkPriceState.search = e.target.value; draw(); };
  document.getElementById('bpCatFilter').onchange = e=>{ bulkPriceState.category = e.target.value; draw(); };
  document.getElementById('bpSelectAll').onchange = e=>{
    const list = matches();
    if(e.target.checked) list.forEach(p=>bulkPriceState.selected.add(bulkProductKey(p)));
    else list.forEach(p=>bulkPriceState.selected.delete(bulkProductKey(p)));
    draw();
  };

  document.getElementById('bpApplyBtn').onclick = ()=>{
    if(bulkPriceState.selected.size===0){ toast("Select at least one product first", true); return; }
    const amount = parseFloat(document.getElementById('bpAmount').value);
    if(isNaN(amount)){ toast("Enter an amount", true); return; }
    const target = document.getElementById('bpTarget').value; // retail, cost, both
    const method = document.getElementById('bpMethod').value;
    const fields = target==="both" ? ["cost","retail"] : [target];
    const selectedProducts = DATA.inventory.filter(p=>bulkPriceState.selected.has(bulkProductKey(p)));
    const sampleNames = selectedProducts.slice(0,5).map(p=>p.name).join(", ");
    const more = selectedProducts.length>5 ? ` and ${selectedProducts.length-5} more` : "";
    if(!confirm(`Update ${fields.join(" & ")} for ${selectedProducts.length} product(s)?\n\n${sampleNames}${more}\n\nThis can't be undone automatically.`)) return;
    selectedProducts.forEach(p=>{
      fields.forEach(field=>{
        const current = num(p[field]);
        let next = current;
        if(method==="set") next = amount;
        else if(method==="increaseAmt") next = current + amount;
        else if(method==="decreaseAmt") next = current - amount;
        else if(method==="increasePct") next = current * (1 + amount/100);
        else if(method==="decreasePct") next = current * (1 - amount/100);
        p[field] = Math.max(0, +next.toFixed(2));
      });
      p.closing_value = +(num(p.closing)*num(p.cost)).toFixed(2);
      p.sales_value = +(num(p.closing)*num(p.retail)).toFixed(2);
    });
    persist();
    toast(`Updated ${selectedProducts.length} product(s)`);
    draw();
  };

  draw();
}

/* ---------- Inventory Count (opening/received/closing/sold) ---------- */
function renderInventoryCount(el){
  const catNames = [...new Set(DATA.inventory.map(p=>p.category))].sort();
  el.innerHTML = `
    <div class="note">Enter Opening Count and Closing Count. Received pulls live from Invoice Entry. Units Sold = Opening + Received \u2212 Closing. Press Enter in a Closing field to jump to the next product.</div>
    <div class="form-grid" style="grid-template-columns:2fr 1fr auto;">
      <div><label>Search product</label><input id="icSearch"></div>
      <div><label>Category</label><select id="icCat"><option value="ALL">All Categories</option>${catNames.map(c=>`<option value="${c}">${c}</option>`).join("")}</select></div>
      <div><label>&nbsp;</label><button class="btn" id="icRollAllBtn" title="Copy every Closing Count shown below into Opening \u2014 use this to start a new count period">\u21bb Roll Closing \u2192 Opening (all shown)</button></div>
    </div>
    <div class="card">
      <div class="tablewrap"><table>
        <thead><tr><th>Product</th><th>Unit</th><th>Par</th><th>Opening</th><th></th><th>Received</th><th>Total Avail.</th><th>Closing</th><th>Units Sold</th><th>Notes</th></tr></thead>
        <tbody id="icBody"></tbody>
      </table></div>
    </div>
  `;
  let icSearch="", icCat="ALL";
  document.getElementById('icSearch').oninput = e=>{ icSearch=e.target.value.toLowerCase(); draw(); };
  document.getElementById('icCat').onchange = e=>{ icCat=e.target.value; draw(); };
  document.getElementById('icRollAllBtn').onclick = ()=>{
    const list = currentList();
    if(!list.length) return;
    if(!confirm(`Set Opening = Closing for all ${list.length} product(s) currently shown? This can't be undone automatically.`)) return;
    list.forEach(p=>{ p.opening = num(p.closing); });
    persist(); draw();
    toast(`Rolled ${list.length} product(s): Closing \u2192 Opening`);
  };
  function currentList(){
    return DATA.inventory.filter(p=>{
      if(icSearch && !p.name.toLowerCase().includes(icSearch)) return false;
      if(icCat!=="ALL" && p.category!==icCat) return false;
      return true;
    });
  }
  function draw(){
    const body = document.getElementById('icBody');
    let list = currentList();
    body.innerHTML = "";
    list.forEach(p=>{
      const received = productReceived(p);
      const totalAvail = num(p.opening)+received;
      const sold = totalAvail - num(p.closing);
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${p.name}</td><td>${p.unit||""}</td><td>${p.par}</td>
        <td><input class="editable-cell" type="number" value="${p.opening??0}" data-field="opening" data-num="${p.num}" data-cat="${p.category}" style="width:60px"></td>
        <td><button class="btn small icRollOne" type="button" data-num="${p.num}" data-cat="${p.category}" title="Copy this row's Closing into Opening">\u21bb</button></td>
        <td>${received}</td><td>${totalAvail}</td>
        <td><input class="editable-cell" type="number" value="${p.closing}" data-field="closing" data-num="${p.num}" data-cat="${p.category}" style="width:60px"></td>
        <td>${sold}</td>
        <td><input class="editable-cell" value="${p.notes||""}" data-field="notes" data-num="${p.num}" data-cat="${p.category}"></td>`;
      body.appendChild(tr);
    });
    body.querySelectorAll('input.editable-cell').forEach(inp=>{
      inp.onchange = ()=>{
        const p = DATA.inventory.find(x=>x.num===parseInt(inp.dataset.num) && x.category===inp.dataset.cat);
        if(!p) return;
        const field = inp.dataset.field;
        p[field] = field==="notes" ? inp.value : (parseFloat(inp.value)||0);
        if(field==="closing"){
          p.sold = productTotalAvailable(p) - num(p.closing);
          p.closing_value = +(num(p.closing)*num(p.cost)).toFixed(2);
          p.sales_value = +(num(p.closing)*num(p.retail)).toFixed(2);
          p.status = inventoryStatus(p.par, p.closing);
        }
        persist(); draw();
      };
    });
    // Enter on a Closing field jumps to the next row's Closing field.
    // blur() may trigger onchange -> persist() -> draw(), which rebuilds the table and makes any
    // captured DOM reference to "the next input" stale -- so we re-look-up the next input by its
    // product identity (data-num/data-cat) *after* blur has settled, rather than holding a direct reference.
    const closingInputs = Array.from(body.querySelectorAll('input.editable-cell[data-field="closing"]'));
    closingInputs.forEach((inp, i)=>{
      inp.onkeydown = (e)=>{
        if(e.key==="Enter"){
          e.preventDefault();
          const next = closingInputs[i+1];
          const nextId = next ? {num: next.dataset.num, cat: next.dataset.cat} : null;
          inp.blur(); // commits the change via onchange (may rebuild the table)
          if(nextId){
            const freshBody = document.getElementById('icBody');
            const fresh = freshBody && Array.from(freshBody.querySelectorAll('input.editable-cell[data-field="closing"]'))
              .find(x=>x.dataset.num===nextId.num && x.dataset.cat===nextId.cat);
            if(fresh){ fresh.focus(); fresh.select(); }
          }
        }
      };
    });
    // per-row roll button: copy that row's own Closing into Opening
    body.querySelectorAll('button.icRollOne').forEach(btn=>{
      btn.onclick = ()=>{
        const p = DATA.inventory.find(x=>x.num===parseInt(btn.dataset.num) && x.category===btn.dataset.cat);
        if(!p) return;
        p.opening = num(p.closing);
        persist(); draw();
      };
    });
  }
  draw();
}

              <td><input type="checkbox" data-check="${k}" ${monthlyReportsState.checked[k]?"checked":""}></td>
              <td>${r.month} ${r.year}</td><td>${pill}</td><td>${dt}</td><td>${r.products.length.toLocaleString()}</td>
              <td class="rowbtns">
                <button class="btn small" data-view="${k}">View / Adjust</button>
                <button class="btn small" data-print="${k}">Print</button>
                <button class="btn small danger" data-del="${k}">Delete</button>
              </td></tr>`;
          }).join("")}
        </tbody>
      </table></div>` : `<div class="sub">No reports generated yet.</div>`}
    </div>
  `;

  const genBtnToday = document.getElementById('genTodayBtn');
  if(genBtnToday) genBtnToday.onclick = ()=>{
    if(DATA.inventoryReports[curKey] && !confirm(`A report for ${curMonth} ${curYear} already exists. Overwrite it with today's counts?`)) return;
    generateMonthlyReport(curYear, curMonth);
    toast(`${curMonth} ${curYear} report generated`);
    monthlyReportsState.selectedKey = curKey;
    render();
  };
  document.getElementById('genReportBtn').onclick = ()=>{
    const y = document.getElementById('genYear').value;
    const m = document.getElementById('genMonth').value;
    const key = monthEndKey(y,m);
    if(DATA.inventoryReports[key] && !confirm(`A report for ${m} ${y} already exists. Overwrite it with the current counts?`)) return;
    generateMonthlyReport(y, m);
    toast(`${m} ${y} report generated`);
    monthlyReportsState.selectedKey = key;
    render();
  };
  el.querySelectorAll('[data-genq]').forEach(b=>b.onclick=()=>{
    const q = FISCAL_QUARTERS.find(x=>x.q===parseInt(b.dataset.genq));
    const key = monthEndKey(String(fy), q.endMonth);
    const label = q.yearEnd ? `Year-End (Q4)` : `Q${q.q}`;
    if(DATA.inventoryReports[key] && !confirm(`A ${label} report for FY${fy} already exists. Overwrite it with the current counts?`)) return;
    generateMonthlyReport(String(fy), q.endMonth, q.yearEnd ? "year-end" : "quarterly");
    toast(`${label} FY${fy} report generated`);
    monthlyReportsState.selectedKey = key;
    render();
  });
  el.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{
    monthlyReportsState.selectedKey = b.dataset.view;
    render();
  });
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const k = b.dataset.del;
    const r = DATA.inventoryReports[k];
    if(!confirm(`Delete the ${r.month} ${r.year} report? This can't be undone.`)) return;
    delete DATA.inventoryReports[k];
    delete monthlyReportsState.checked[k];
    persist(); toast(`${r.month} ${r.year} report deleted`); render();
  });
  el.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>{
    openPrintOptionsModal([b.dataset.print]);
  });
  el.querySelectorAll('[data-check]').forEach(cb=>cb.onchange=()=>{
    monthlyReportsState.checked[cb.dataset.check] = cb.checked;
    render();
  });
  const checkAllBtn = document.getElementById('mrCheckAllBtn');
  if(checkAllBtn) checkAllBtn.onclick = ()=>{
    const allChecked = checkedKeys.length && checkedKeys.length===reportKeys.length;
    reportKeys.forEach(k=>{ monthlyReportsState.checked[k] = !allChecked; });
    render();
  };
  const printSelBtn = document.getElementById('mrPrintSelectedBtn');
  if(printSelBtn && checkedKeys.length) printSelBtn.onclick = ()=>{ openPrintOptionsModal(checkedKeys); };
}

/* Builds a clean, non-editable printable view of one or more monthly reports and prints it.
   Restores the normal app view automatically once printing is done (or cancelled). */
function printMonthlyReports(keys, options){
  const opts = Object.assign({includeSummary:true, includeProducts:true}, options||{});
  const main = document.getElementById('main');
  const sorted = keys.slice().sort(); // chronological order for multi-report printouts
  main.innerHTML = sorted.map((key, i)=>{
    const report = DATA.inventoryReports[key];
    const cats = inventoryByCategoryCompute(report.products, p=>num(p.received_qty));
    const catNames = Object.keys(cats).sort();
    const totals = inventoryTotalsCompute(cats);
    const low = report.products.filter(p=>inventoryStatus(p.par,p.closing)==="LOW").length;
    const out = report.products.filter(p=>inventoryStatus(p.par,p.closing)==="OUT").length;
    const type = report.periodType || "monthly";
    const typeLabel = type==="year-end" ? " \u2014 YEAR-END REPORT" : type==="quarterly" ? " \u2014 QUARTERLY REPORT" : "";
    return `
      <div class="${i>0?'blank-count-page':''}">
        <div class="printhead"><h1>\ud83d\udce6 ${report.month} ${report.year} Inventory Report${typeLabel}</h1>
          <p>Generated ${report.generatedAt ? new Date(report.generatedAt).toLocaleString() : ""} \u2014 ${report.products.length.toLocaleString()} products</p></div>
        ${opts.includeSummary ? `
        <table style="margin-bottom:14px;">
          <tr><td><b>Inventory Value:</b> ${fmtUSD(totals.closingValue)}</td><td><b>Retail Value on Hand:</b> ${fmtUSD(totals.salesValue)}</td></tr>
          <tr><td><b>Profit Margin:</b> ${fmtPct(totals.margin)}</td><td><b>Sell-Through:</b> ${fmtPct(totals.sellThrough)}</td></tr>
          <tr><td><b>Low Stock Items:</b> ${low}</td><td><b>Out of Stock Items:</b> ${out}</td></tr>
        </table>
        <table style="margin-bottom:18px;">
          <thead><tr><th>Category</th><th>#</th><th>Closing Value</th><th>Sales Value</th><th>Units</th><th>Revenue</th><th>Profit</th><th>Margin</th><th>Sell-Thru</th></tr></thead>
          <tbody>${catNames.map(c=>`<tr><td>${c}</td><td>${cats[c].count}</td><td>${fmtUSD(cats[c].closingValue)}</td>
            <td>${fmtUSD(cats[c].salesValue)}</td><td>${cats[c].units.toLocaleString()}</td><td>${fmtUSD(cats[c].revenue)}</td>
            <td>${fmtUSD(cats[c].profit)}</td><td>${fmtPct(cats[c].margin)}</td><td>${fmtPct(cats[c].sellThrough)}</td></tr>`).join("")}
            <tr class="total"><td>GRAND TOTAL</td><td>${report.products.length}</td><td>${fmtUSD(totals.closingValue)}</td>
            <td>${fmtUSD(totals.salesValue)}</td><td>${totals.units.toLocaleString()}</td><td>${fmtUSD(totals.revenue)}</td>
            <td>${fmtUSD(totals.profit)}</td><td>${fmtPct(totals.margin)}</td><td>${fmtPct(totals.sellThrough)}</td></tr>
          </tbody>
        </table>` : ``}
        ${opts.includeProducts ? `
        <table>
          <thead><tr><th>Product</th><th>Category</th><th>Unit</th><th>Par</th><th>Opening</th><th>Total Avail.</th><th>Closing Count</th><th>Units Sold</th><th>Closing Value</th><th>Status</th></tr></thead>
          <tbody>${report.products.map(p=>`<tr><td>${p.name}</td><td>${p.category}</td><td>${p.unit||""}</td><td>${p.par}</td>
            <td>${p.opening??0}</td><td>${num(p.opening)+num(p.received_qty)}</td><td>${p.closing}</td><td>${p.sold}</td>
            <td>${fmtUSD(p.closing_value)}</td><td>${p.status||""}</td></tr>`).join("")}</tbody>
        </table>` : ``}
      </div>
    `;
  }).join("");

  const restore = ()=>{ window.removeEventListener('afterprint', restore); render(); };
  window.addEventListener('afterprint', restore);
  setTimeout(()=>window.print(), 50);
}

/* Lets the person choose which sections (Summary vs. full Product/Count list) to include before printing. */
function openPrintOptionsModal(keys){
  if(!keys.length) return;
  const label = keys.length===1
    ? (()=>{ const r = DATA.inventoryReports[keys[0]]; return r ? `${r.month} ${r.year}` : "this report"; })()
    : `${keys.length} reports`;
  const backdrop = document.createElement('div');
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = `
    <div class="modal-card">
      <h2>Print \u2014 ${label}</h2>
      <div class="sub">Choose what to include in the printout.</div>
      <div class="modal-check-row">
        <input type="checkbox" id="poSummary" checked>
        <label for="poSummary">Inventory Summary<span class="modal-check-sub">Totals, category breakdown, low/out-of-stock counts</span></label>
      </div>
      <div class="modal-check-row">
        <input type="checkbox" id="poProducts" checked>
        <label for="poProducts">Full Product &amp; Count List<span class="modal-check-sub">Every product with opening, closing, units sold, and value</span></label>
      </div>
      <div class="modal-actions">
        <button class="btn small" id="poCancel">Cancel</button>
        <button class="btn small primary" id="poPrint">Print</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  const close = ()=>backdrop.remove();
  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) close(); });
  document.getElementById('poCancel').onclick = close;
  document.getElementById('poPrint').onclick = ()=>{
    const includeSummary = document.getElementById('poSummary').checked;
    const includeProducts = document.getElementById('poProducts').checked;
    if(!includeSummary && !includeProducts){ toast("Pick at least one section to print", true); return; }
    close();
    printMonthlyReports(keys, {includeSummary, includeProducts});
  };
}

/* ---------- Cigarette & Tobacco Buydowns ---------- */
function renderBuydowns(el){
  const products = DATA.inventory.filter(p=>{
    const c = (p.category||"").toUpperCase();
    return c==="TOBACCO" || c==="CIGARETTES";
  });
  el.innerHTML = `
    <div class="note">Enter Buydown $/Pack (from your distributor contract) and, if applicable, Multipack Qty + Deal Price. Margins recalculate live.</div>
    <div class="card">
      <div class="tablewrap"><table>
        <thead><tr><th>Product</th><th>Category</th><th>Cost/Pack</th><th>Retail</th><th>Buydown $/Pack</th><th>Cost After Buydown</th>
          <th>Margin Before</th><th>Margin After</th><th>Multipack Qty</th><th>Deal Price</th><th>Margin at Deal</th></tr></thead>
        <tbody id="bdBody"></tbody>
      </table></div>
    </div>
  `;
  const body = document.getElementById('bdBody');
  function draw(){
    body.innerHTML = "";
    products.forEach(p=>{
      const cost = num(p.cost), retail = num(p.retail), buydown = num(p.buydown);
      const costAfter = cost - buydown;
      const marginBefore = retail ? (retail-cost)/retail : 0;
      const marginAfter = retail ? (retail-costAfter)/retail : 0;
      const mpQty = p.multipack_qty, dealPrice = p.multipack_deal_price;
      let marginAtDeal = "";
      if(mpQty && dealPrice){
        const dealCost = costAfter*mpQty;
        marginAtDeal = dealPrice ? fmtPct((dealPrice-dealCost)/dealPrice) : "";
      }
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${p.name}</td><td>${p.category}</td><td>${fmtUSD(cost)}</td><td>${fmtUSD(retail)}</td>
        <td><div class="dollar-wrap"><input class="editable-cell" type="number" step="0.01" value="${buydown}" data-num="${p.num}" data-cat="${p.category}" data-field="buydown" style="width:70px"></div></td>
        <td>${fmtUSD(costAfter)}</td><td>${fmtPct(marginBefore)}</td><td style="font-weight:700;color:${marginAfter>marginBefore?'var(--green)':'inherit'}">${fmtPct(marginAfter)}</td>
        <td><input class="editable-cell" type="number" value="${mpQty??""}" data-num="${p.num}" data-cat="${p.category}" data-field="multipack_qty" style="width:60px"></td>
        <td><div class="dollar-wrap"><input class="editable-cell" type="number" step="0.01" value="${dealPrice??""}" data-num="${p.num}" data-cat="${p.category}" data-field="multipack_deal_price" style="width:70px"></div></td>
        <td>${marginAtDeal}</td>`;
      body.appendChild(tr);
    });
    body.querySelectorAll('input.editable-cell').forEach(inp=>{
      inp.onchange = ()=>{
        const p = DATA.inventory.find(x=>x.num===parseInt(inp.dataset.num) && x.category===inp.dataset.cat);
        if(!p) return;
        const field = inp.dataset.field;
        const v = inp.value==="" ? null : parseFloat(inp.value);
        p[field] = v;
        persist(); draw();
      };
    });
  }
  draw();
}

function renderDataMgmt(main){
  main.innerHTML = `
    <div class="topbar"><div><h1>Backup &amp; Restore</h1><p>Your data is saved automatically in this browser. Export a backup regularly.</p></div></div>
    <div class="card">
      <h2>Export Backup</h2>
      <div class="sub">Downloads everything \u2014 sales, invoices, rebates, and inventory \u2014 as a single JSON file.</div>
      <button class="btn primary" id="exportBtn">Download Backup (.json)</button>
    </div>
    <div class="card">
      <h2>Restore from Backup</h2>
      <div class="sub">Choose a previously exported .json file to replace all current data.</div>
      <input type="file" id="importFile" accept="application/json">
    </div>
    <div class="card">
      <h2>Reset to Original Data</h2>
      <div class="sub">Wipes any changes you've made and reloads the original data this program shipped with.</div>
      <button class="btn danger" id="resetBtn">Reset Everything</button>
    </div>
  `;
  document.getElementById('exportBtn').onclick = ()=>{
    const blob = new Blob([JSON.stringify(DATA,null,0)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `station-manager-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url);
    toast("Backup downloaded");
  };
  document.getElementById('importFile').onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed.overlooks || !parsed.inventory) throw new Error("bad format");
        DATA = parsed; persist(); toast("Restored from backup"); render();
      }catch(err){ toast("That file doesn't look like a valid backup", true); }
    };
    reader.readAsText(file);
  };
  document.getElementById('resetBtn').onclick = ()=>{
    if(!confirm("This will erase all changes and restore the original data. Continue?")) return;
    DATA = JSON.parse(JSON.stringify(SEED));
    persist(); toast("Reset complete"); render();
  };
}
